<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漢字マスター — Kanji Flashcards</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e63946">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="漢字マスター">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #08080f;
      --surface:      #10101c;
      --card:         #16162a;
      --card2:        #1e1e36;
      --border:       #2a2a48;
      --primary:      #e63946;
      --primary-dk:   #b5202c;
      --success:      #06d6a0;
      --error:        #ef233c;
      --text:         #edf2f4;
      --muted:        #8892b0;
      --dim:          #4a5070;
      --n5:  #06d6a0;
      --n4:  #4cc9f0;
      --n3:  #ffd166;
      --n2:  #ef476f;
      --n1:  #a78bfa;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background-image:
        radial-gradient(ellipse at 15% 85%, rgba(230,57,70,.06) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 15%, rgba(76,201,240,.06) 0%, transparent 55%);
    }

    /* ── SCREENS ── */
    .screen {
      display: none;
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      padding: 28px 20px 40px;
      flex-direction: column;
      align-items: center;
    }
    .screen.active { display: flex; }

    /* ── LOGO ── */
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-kanji {
      font-family: 'Noto Serif JP', serif;
      font-size: 3.4rem;
      color: var(--primary);
      line-height: 1;
      letter-spacing: .08em;
    }
    .logo-sub {
      font-size: .72rem;
      color: var(--muted);
      letter-spacing: .25em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* ── STATS BAR ── */
    a.dojo { position: fixed; top: 14px; left: 16px; z-index: 50; font: 600 13px 'Inter', sans-serif; color: var(--muted); text-decoration: none; padding: 6px 4px; }
    a.dojo:hover { color: var(--primary); }
    @media (max-width: 640px) { #screen-home .logo { padding-top: 30px; } }
    .sync-line { margin-top: 14px; font-size: .72rem; color: var(--dim); text-align: center; }
    .due-hint { margin: -6px 0 14px; font-size: .78rem; color: var(--muted); text-align: center; }
    .due-hint b { color: var(--n3); }

    /* ---------- kana ---------- */
    .kana-body { width: 100%; }
    .kana-stats { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; font-size: .76rem; color: var(--muted); margin: 4px 0 14px; }
    .kana-stats b { color: var(--text); }
    .kana-groups { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
    .kana-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-size: .78rem; cursor: pointer; user-select: none; }
    .kana-chip input { accent-color: var(--primary); margin: 0; }
    .kana-chip:has(input:checked) { color: var(--text); border-color: var(--primary); }
    .kana-sec { font-size: .66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .16em; margin: 18px 0 8px; }
    .kana-grid { display: grid; gap: 6px; }
    .kana-grid.c5 { grid-template-columns: repeat(5, 1fr); }
    .kana-grid.c3 { grid-template-columns: repeat(3, 1fr); }
    .kana-cell { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 4px 6px; text-align: center; }
    .kana-cell.empty { background: transparent; border-color: transparent; }
    .kana-cell .kc { font-family: 'Noto Serif JP', serif; font-size: 1.6rem; line-height: 1.2; color: var(--text); }
    .kana-cell .kr { font-size: .7rem; color: var(--muted); }
    .kana-cell.seen { border-color: rgba(255,209,102,.5); }
    .kana-cell.mastered { border-color: rgba(6,214,160,.6); }
    .kana-cell.mastered .kr { color: var(--success); }
    .kana-legend { display: flex; gap: 14px; justify-content: center; font-size: .7rem; color: var(--muted); margin-top: 14px; }
    .kana-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1px solid; margin-right: 5px; vertical-align: -1px; }
    .kana-big { font-family: 'Noto Serif JP', serif; font-size: 5.5rem; line-height: 1.1; color: var(--text); }
    .kana-roma-big { font-size: 2.6rem; font-weight: 700; letter-spacing: .04em; color: var(--text); }
    .choice-btn .choice-kana { font-family: 'Noto Serif JP', serif; font-size: 1.9rem; }
    .kana-result { text-align: center; margin: 6px 0 18px; }
    .kana-result .big { font-size: 2.4rem; font-weight: 700; }
    .kana-actions { display: flex; gap: 10px; margin-top: 8px; }
    .kana-actions .btn { flex: 1; }
    .stats-bar {
      display: flex;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 8px;
      margin-bottom: 20px;
      gap: 4px;
    }
    .stat { flex: 1; text-align: center; }
    .stat-v { font-size: 1.5rem; font-weight: 700; color: var(--text); }
    .stat-l { font-size: .62rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

    /* ── LEVEL CARDS ── */
    .levels-section-label {
      font-size: .72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .18em;
      width: 100%;
      margin-bottom: 10px;
    }
    .levels-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-bottom: 18px;
    }
    .lv-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px 14px;
      cursor: pointer;
      transition: transform .18s, border-color .18s, box-shadow .18s;
      position: relative;
      overflow: hidden;
      user-select: none;
    }
    .lv-card:hover:not(.locked) { transform: translateY(-2px); }
    .lv-card.sel { border-color: var(--primary); background: linear-gradient(135deg, var(--card), #2a1620); box-shadow: 0 4px 24px rgba(230,57,70,.18); }
    .lv-card.locked { opacity: .45; cursor: not-allowed; }
    .lv-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }
    .n5 .lv-badge  { background: rgba(6,214,160,.15);  color: var(--n5); }
    .n4 .lv-badge  { background: rgba(76,201,240,.15); color: var(--n4); }
    .n3 .lv-badge  { background: rgba(255,209,102,.15);color: var(--n3); }
    .n2 .lv-badge  { background: rgba(239,71,111,.15); color: var(--n2); }
    .n1 .lv-badge  { background: rgba(167,139,250,.15);color: var(--n1); }
    .lv-name { font-size: .92rem; font-weight: 600; margin-bottom: 2px; }
    .lv-desc { font-size: .7rem; color: var(--muted); margin-bottom: 10px; }
    .lv-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 5px; }
    .n5 .lv-bar-fill { background: var(--n5); }
    .n4 .lv-bar-fill { background: var(--n4); }
    .n3 .lv-bar-fill { background: var(--n3); }
    .n2 .lv-bar-fill { background: var(--n2); }
    .n1 .lv-bar-fill { background: var(--n1); }
    .lv-bar-fill { height: 100%; border-radius: 2px; transition: width .5s ease; }
    .lv-stats { font-size: .68rem; color: var(--muted); }
    .lv-lock { position: absolute; top: 12px; right: 12px; font-size: 1rem; }

    /* ── MODE TOGGLE ── */
    .mode-wrap { display: flex; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
    .mode-tab {
      flex: 1;
      padding: 9px 12px;
      border-radius: 9px;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--muted);
      transition: all .18s;
      font-family: inherit;
    }
    .mode-tab .mode-kanji { font-family: 'Noto Serif JP', serif; }
    .mode-tab.active { background: var(--primary); color: #fff; }

    /* ── BUTTONS ── */
    .btn {
      padding: 13px 28px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .18s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--primary-dk); transform: translateY(-1px); box-shadow: 0 4px 18px rgba(230,57,70,.3); }
    .btn-ghost { background: var(--card); color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--muted); color: var(--text); }
    .btn-sm { padding: 8px 16px; font-size: .78rem; }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    /* ── SESSION HEADER ── */
    .sess-header { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 18px; }
    .sess-info { font-size: .8rem; color: var(--muted); }
    .sess-score { font-size: .82rem; font-weight: 700; color: var(--text); background: var(--card); border: 1px solid var(--border); padding: 5px 12px; border-radius: 20px; }

    /* ── PROGRESS ── */
    .prog-wrap { width: 100%; height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 28px; overflow: hidden; }
    .prog-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width .4s ease; }

    /* ── FLASHCARD ── */
    .flash-card {
      width: 100%;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 44px 28px 36px;
      text-align: center;
      margin-bottom: 24px;
      transition: border-color .25s, box-shadow .25s;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .flash-card.correct { border-color: var(--success); box-shadow: 0 0 36px rgba(6,214,160,.18); }
    .flash-card.wrong   { border-color: var(--error);   box-shadow: 0 0 36px rgba(239,35,60,.18); }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }
    .flash-card.correct, .flash-card.wrong { animation: pulse .3s ease; }

    .card-mode-lbl { font-size: .68rem; color: var(--dim); text-transform: uppercase; letter-spacing: .2em; margin-bottom: 10px; }
    .kanji-big {
      font-family: 'Noto Serif JP', serif;
      font-size: 6.5rem;
      line-height: 1.05;
      color: var(--text);
      transition: opacity .2s;
    }
    .meaning-big {
      font-size: 1.7rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      max-width: 340px;
    }
    .card-reading { font-size: .82rem; color: var(--muted); margin-top: 12px; min-height: 20px; letter-spacing: .04em; }
    .rd-kana { display: block; font-family: 'Noto Serif JP', serif; font-size: 1.15rem; color: var(--text); letter-spacing: .06em; }
    .rd-romaji { display: block; font-size: .74rem; color: var(--muted); margin-top: 3px; }

    /* ── CHOICES ── */
    .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 20px; }
    .choice-btn {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px 10px;
      font-family: inherit;
      font-size: .88rem;
      color: var(--text);
      cursor: pointer;
      transition: all .18s;
      text-align: center;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
    }
    .choice-btn:hover:not(:disabled) { border-color: var(--primary); background: rgba(230,57,70,.07); }
    .choice-btn.correct-c { background: rgba(6,214,160,.12); border-color: var(--success); color: var(--success); font-weight: 700; }
    .choice-btn.wrong-c   { background: rgba(239,35,60,.12);  border-color: var(--error);   color: var(--error); }
    .choice-btn:disabled  { cursor: default; }
    .choice-kanji { font-family: 'Noto Serif JP', serif; font-size: 2.4rem; }

    /* ── NEXT BTN ── */
    .next-btn {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .18s;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .next-btn.visible { display: flex; }
    .next-btn:hover { background: var(--primary-dk); }

    /* ── RESULTS ── */
    .result-hero { text-align: center; width: 100%; margin-bottom: 8px; }
    .result-word {
      font-family: 'Noto Serif JP', serif;
      font-size: 2.8rem;
      color: var(--primary);
      letter-spacing: .1em;
    }
    .result-title { font-size: 1.15rem; font-weight: 700; margin-top: 4px; }

    .score-ring {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--card);
      border: 3px solid var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 24px auto;
      box-shadow: 0 0 48px rgba(230,57,70,.2);
    }
    .score-n { font-size: 3.2rem; font-weight: 800; color: var(--text); line-height: 1; }
    .score-d { font-size: .85rem; color: var(--muted); }

    .result-msg { font-size: 1rem; font-weight: 600; text-align: center; }
    .result-sub { font-size: .82rem; color: var(--muted); text-align: center; margin-top: 4px; margin-bottom: 24px; }

    .unlock-banner {
      background: linear-gradient(135deg, rgba(6,214,160,.1), rgba(76,201,240,.08));
      border: 1px solid rgba(6,214,160,.3);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: center;
      font-size: .88rem;
      color: var(--success);
      width: 100%;
      margin-bottom: 20px;
    }

    .mistakes-section { width: 100%; margin-bottom: 22px; }
    .mistakes-lbl { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .18em; margin-bottom: 10px; }
    .mistake-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 14px;
      background: var(--card);
      border-radius: 11px;
      margin-bottom: 7px;
      border: 1px solid var(--border);
    }
    .mistake-k { font-family: 'Noto Serif JP', serif; font-size: 1.9rem; color: var(--error); min-width: 42px; text-align: center; }
    .mistake-info { flex: 1; }
    .mistake-m { font-size: .88rem; font-weight: 600; }
    .mistake-r { font-size: .73rem; color: var(--muted); margin-top: 2px; }

    /* ── ACTIONS ── */
    .actions { display: flex; gap: 10px; width: 100%; }
    .actions .btn { flex: 1; }

    /* ── DIVIDER ── */
    .sep { width: 100%; height: 1px; background: var(--border); margin: 18px 0; }

    /* ── KEYBOARD HINT ── */
    .kbd-hint { font-size: .65rem; color: var(--dim); text-align: center; margin-top: 8px; }
    kbd { background: var(--card2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-family: inherit; font-size: .65rem; }

    /* ── NUMBERS SCREEN ── */
    .num-card {
      width: 100%;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 44px 28px 36px;
      text-align: center;
      margin-bottom: 20px;
      cursor: pointer;
      transition: border-color .25s, box-shadow .25s;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .num-card:hover { border-color: var(--primary); box-shadow: 0 0 32px rgba(230,57,70,.12); }
    .num-number { font-size: 5rem; font-weight: 800; color: var(--text); line-height: 1; }
    .num-reveal { margin-top: 22px; transition: opacity .3s; }
    .num-reveal.hidden { opacity: 0; pointer-events: none; }
    .num-kanji { font-family: 'Noto Serif JP', serif; font-size: 3.6rem; color: var(--primary); line-height: 1.1; }
    .num-reading { font-size: .88rem; color: var(--muted); margin-top: 10px; letter-spacing: .04em; }
    .num-hint { font-size: .65rem; color: var(--dim); margin-top: 18px; }
    .num-nav { display: flex; gap: 10px; width: 100%; }
    .num-nav .btn { flex: 1; }
    .num-counter-wrap { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 8px; }
    .num-entry-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--card), var(--card2));
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      text-align: left;
      cursor: pointer;
      transition: all .18s;
      font-family: inherit;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .num-entry-btn:hover { border-color: var(--primary); box-shadow: 0 4px 18px rgba(230,57,70,.15); transform: translateY(-1px); }
    .num-entry-kanji { font-family: 'Noto Serif JP', serif; font-size: 2.2rem; color: var(--primary); min-width: 48px; }
    .num-entry-text { flex: 1; }
    .num-entry-title { font-size: .92rem; font-weight: 700; margin-bottom: 2px; }
    .num-entry-desc { font-size: .72rem; color: var(--muted); }

    /* ── PASSWORD SCREEN ── */
    .pwd-card {
      width: 100%;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .pwd-icon { font-size: 2.4rem; margin-bottom: 4px; }
    .pwd-title { font-size: 1.1rem; font-weight: 700; }
    .pwd-sub { font-size: .8rem; color: var(--muted); text-align: center; }
    .pwd-input {
      width: 100%;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
      letter-spacing: .1em;
      text-align: center;
      margin-top: 4px;
    }
    .pwd-input:focus { border-color: var(--primary); }
    .pwd-input.shake {
      animation: shake .35s ease;
      border-color: var(--error);
    }
    .pwd-error { font-size: .8rem; color: var(--error); min-height: 18px; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-5px); }
      80%      { transform: translateX(5px); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 460px) {
      .kanji-big { font-size: 5rem; }
      .levels-grid { grid-template-columns: 1fr; }
      .logo-kanji { font-size: 2.8rem; }
      .meaning-big { font-size: 1.4rem; }
    }
  </style>
</head>

<!-- ═══════════════════════════════
     SCREEN: HOME
════════════════════════════════ -->
<div class="screen" id="screen-home">

  <div class="logo">
    <div class="logo-kanji">漢字マスター</div>
    <div class="logo-sub">Kanji Flashcards · Apprentissage</div>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-v" id="s-mastered">0</div>
      <div class="stat-l">Maîtrisés</div>
    </div>
    <div class="stat">
      <div class="stat-v" id="s-streak">0</div>
      <div class="stat-l">🔥 Série</div>
    </div>
    <div class="stat">
      <div class="stat-v" id="s-sessions">0</div>
      <div class="stat-l">Sessions</div>
    </div>
    <div class="stat">
      <div class="stat-v" id="s-total">0</div>
      <div class="stat-l">À revoir</div>
    </div>
  </div>

  <div class="levels-section-label">Choisir un niveau</div>
  <div class="levels-grid" id="levels-grid"></div>

  <div class="mode-wrap">
    <button class="mode-tab active" id="tab-km" onclick="setMode('km')">
      <span class="mode-kanji">漢字</span> → Sens
    </button>
    <button class="mode-tab" id="tab-mk" onclick="setMode('mk')">
      Sens → <span class="mode-kanji">漢字</span>
    </button>

/* Répétition espacée. Pour chaque kanji : [boîte 0 à 5, jour d'échéance, essais, réussites, horodatage de la dernière réponse].
   Une bonne réponse fait monter d'une boîte et repousse la prochaine révision (1, 3, 7, 14 puis 30 jours).
   Une erreur renvoie en boîte 0 : le kanji revient dès la session suivante. Il est « maîtrisé » à partir de la boîte 3. */
const GAP = [1, 3, 7, 14, 30];
const MASTER_BOX = 3;
const KEY = "kanji_v2";
const today = () => Math.floor(Date.now() / 864e5);

function blankState() { return { v: 3, srs: {}, kana: {}, unlocked: new Set([5]), streak: 0, sessions: 0, level: 5, ts: 0, rz: 0 }; }
function fromRaw(raw) {
  const st = blankState();
  if (!raw || typeof raw !== "object") return st;
  st.unlocked = new Set(raw.unlocked && raw.unlocked.length ? raw.unlocked : [5]);
  st.streak = raw.streak || 0; st.sessions = raw.sessions || 0; st.level = raw.level || 5;
  st.ts = raw.ts || 0; st.rz = raw.rz || 0;
  if (raw.kana && typeof raw.kana === "object") st.kana = raw.kana;
  if (raw.srs && typeof raw.srs === "object") st.srs = raw.srs;
  else if (Array.isArray(raw.mastered)) {
    /* ancienne version : les kanji « maîtrisés » entrent en boîte 3, avec des révisions étalées sur la semaine */
    raw.mastered.forEach((k, i) => { st.srs[k] = [MASTER_BOX, today() + (i % 7), 1, 1, 0]; });
  }
  return st;
}
function toRaw(st) { return { v: 3, srs: st.srs, kana: st.kana, unlocked: [...st.unlocked].sort(), streak: st.streak, sessions: st.sessions, level: st.level, ts: st.ts, rz: st.rz }; }
function loadState() { try { return fromRaw(JSON.parse(localStorage.getItem(KEY) || "null")); } catch (e) { return blankState(); } }

const isMastered = k => !!(ST.srs[k] && ST.srs[k][0] >= MASTER_BOX);
const isDue = k => !!(ST.srs[k] && ST.srs[k][1] <= today());
function record(k, ok) {
  const r = ST.srs[k] ? ST.srs[k].slice() : [0, 0, 0, 0, 0];
  r[2]++; if (ok) r[3]++;
  if (ok) { r[0] = Math.min(r[0] + 1, 5); r[1] = today() + GAP[r[0] - 1]; }
  else { r[0] = 0; r[1] = today(); }
  r[4] = Date.now();
  ST.srs[k] = r;
}


// ──────────────────────────────────────────────────────
//  KANA : hiragana et katakana
//  Trois groupes : les 46 de base, les 25 avec (han)dakuten, les 33 combinaisons (yōon).
//  Les katakana se déduisent des hiragana (même ordre dans Unicode).
// ──────────────────────────────────────────────────────
const KANA_ROWS = {
  base: [["あa","いi","うu","えe","おo"],["かka","きki","くku","けke","こko"],["さsa","しshi","すsu","せse","そso"],["たta","ちchi","つtsu","てte","とto"],
         ["なna","にni","ぬnu","ねne","のno"],["はha","ひhi","ふfu","へhe","ほho"],["まma","みmi","むmu","めme","もmo"],["やya","","ゆyu","","よyo"],
         ["らra","りri","るru","れre","ろro"],["わwa","","","","をwo"],["んn","","","",""]],
  daku: [["がga","ぎgi","ぐgu","げge","ごgo"],["ざza","じji","ずzu","ぜze","ぞzo"],["だda","ぢji","づzu","でde","どdo"],["ばba","びbi","ぶbu","べbe","ぼbo"],["ぱpa","ぴpi","ぷpu","ぺpe","ぽpo"]],
  yoon: [["きゃkya","きゅkyu","きょkyo"],["しゃsha","しゅshu","しょsho"],["ちゃcha","ちゅchu","ちょcho"],["にゃnya","にゅnyu","にょnyo"],["ひゃhya","ひゅhyu","ひょhyo"],
         ["みゃmya","みゅmyu","みょmyo"],["りゃrya","りゅryu","りょryo"],["ぎゃgya","ぎゅgyu","ぎょgyo"],["じゃja","じゅju","じょjo"],["びゃbya","びゅbyu","びょbyo"],["ぴゃpya","ぴゅpyu","ぴょpyo"]],
};
const KANA_GROUPS = { base: "De base", daku: "Avec (han)dakuten", yoon: "Combinaisons" };
const toKata = h => [...h].map(c => c >= "ぁ" && c <= "ゖ" ? String.fromCharCode(c.charCodeAt(0) + 0x60) : c).join("");
const splitKana = cell => { const m = cell.match(/^([^\x00-\x7f]+)([a-z]+)$/); return m ? { k: m[1], r: m[2] } : null; };
function kanaList(script, group) {
  return KANA_ROWS[group].flat().map(splitKana).filter(Boolean)
    .map(x => ({ id: script + ":" + (script === "k" ? toKata(x.k) : x.k), k: script === "k" ? toKata(x.k) : x.k, r: x.r, g: group, s: script }));
}
const KANA_ALL = ["h", "k"].flatMap(sc => Object.keys(KANA_ROWS).flatMap(g => kanaList(sc, g)));
const KANA_BY = Object.fromEntries(KANA_ALL.map(x => [x.id, x]));

const kanaRec = id => ST.kana[id];
const kanaMastered = id => !!(ST.kana[id] && ST.kana[id][0] >= MASTER_BOX);
const kanaDue = id => !!(ST.kana[id] && ST.kana[id][1] <= today());
function recordKana(id, ok) {
  const r = ST.kana[id] ? ST.kana[id].slice() : [0, 0, 0, 0, 0];
  r[2]++; if (ok) r[3]++;
  if (ok) { r[0] = Math.min(r[0] + 1, 5); r[1] = today() + GAP[r[0] - 1]; } else { r[0] = 0; r[1] = today(); }
  r[4] = Date.now(); ST.kana[id] = r;
}

/* résumé lu par l'accueil du Dojo */
function summary() {
  const levels = LV_ORDER.map(lv => ({ lv, m: DB[lv].filter(d => isMastered(d.k)).length, t: DB[lv].length, u: ST.unlocked.has(lv) }));
  const all = Object.values(DB).flat();
  return { total: all.length, mastered: all.filter(d => isMastered(d.k)).length, seen: all.filter(d => ST.srs[d.k]).length,
           due: all.filter(d => isDue(d.k)).length, day: today(), streak: ST.streak, sessions: ST.sessions, levels,
           kana: ["h", "k"].map(sc => { const l = KANA_ALL.filter(x => x.s === sc); return { s: sc, m: l.filter(x => kanaMastered(x.id)).length, t: l.length, v: l.filter(x => ST.kana[x.id]).length }; }),
           kanaDue: KANA_ALL.filter(x => kanaDue(x.id)).length };
}
let snap = "";
const content = () => JSON.stringify([ST.srs, ST.kana, [...ST.unlocked].sort(), ST.streak, ST.sessions, ST.level, ST.rz]);
function saveState() {
  const c = content(); if (c !== snap) { snap = c; ST.ts = Date.now(); }
  const raw = toRaw(ST); try { raw.sum = summary(); } catch (e) {}
  try { localStorage.setItem(KEY, JSON.stringify(raw)); } catch (e) {}
  Sync.touch();
}

function renderHome() {
  const sm = summary();
  document.getElementById("s-mastered").textContent = sm.mastered;
  document.getElementById("s-streak").textContent   = ST.streak;
  document.getElementById("s-sessions").textContent = ST.sessions;
  document.getElementById("s-total").textContent    = sm.due;
  const dueLv = DB[ST.level].filter(d => isDue(d.k)).length;
  document.getElementById("due-hint").innerHTML = dueLv ? `<b>${dueLv}</b> kanji de ce niveau à revoir aujourd'hui : ils passent en priorité.` : "";
  const ks = summary().kana;
  document.getElementById("kana-entry-desc").textContent = ks.some(x => x.v)
    ? `Hiragana ${ks[0].m}/${ks[0].t} · katakana ${ks[1].m}/${ks[1].t} maîtrisés` : "Tableau des kana, quiz et révisions espacées";
  Sync.line();

  const grid = document.getElementById("levels-grid");
  grid.innerHTML = "";

  for (const lv of LV_ORDER) {
    const cfg     = LV_CONFIG[lv];
    const kanji   = DB[lv];
    const total   = kanji.length;
    const done    = kanji.filter(d => isMastered(d.k)).length;
    const pct     = total > 0 ? Math.round((done / total) * 100) : 0;
    const locked  = !ST.unlocked.has(lv);
    const sel     = ST.level === lv;

    const div = document.createElement("div");
    div.className = `lv-card ${cfg.cls}${sel ? " sel" : ""}${locked ? " locked" : ""}`;
    div.dataset.lv = lv;
    div.innerHTML = `
      ${locked ? '<span class="lv-lock">🔒</span>' : ""}
      <div class="lv-badge">${cfg.label}</div>
      <div class="lv-name">${cfg.name}</div>
      <div class="lv-desc">${cfg.desc}</div>
      <div class="lv-bar"><div class="lv-bar-fill" style="width:${locked?0:pct}%"></div></div>
      <div class="lv-stats">${locked ? "Verrouillé" : `${done} / ${total} maîtrisés (${pct}%)`}</div>
    `;
    if (!locked) div.onclick = () => selectLevel(lv);
    grid.appendChild(div);
  }
}

function selectLevel(lv) {
  ST.level = lv;
  saveState();
  document.querySelectorAll(".lv-card").forEach(c => {
    c.classList.toggle("sel", parseInt(c.dataset.lv) === lv);
  });
}

  document.getElementById("tab-km").classList.toggle("active", m === "km");

// ──────────────────────────────────────────────────────
//  SESSION
// ──────────────────────────────────────────────────────
function readingHTML(d) { return `<span class="rd-kana">${d.kn}</span><span class="rd-romaji">${d.r}</span>`; }

function startSession() {
  const lv      = ST.level;
  const all     = DB[lv];
  const t       = today();
  const due     = shuffle(all.filter(d => ST.srs[d.k] && ST.srs[d.k][1] <= t)).sort((a, b) => ST.srs[a.k][0] - ST.srs[b.k][0]);
  const unseen  = shuffle(all.filter(d => !ST.srs[d.k]));
  const later   = all.filter(d => ST.srs[d.k] && ST.srs[d.k][1] > t).sort((a, b) => ST.srs[a.k][1] - ST.srs[b.k][1]);
  const pool    = shuffle([...due, ...unseen, ...later].slice(0, Math.min(10, all.length)));

  session = {
    lv,
    cards:   pool,
    idx:     0,
    score:   0,
    correct: [],   // kanji answered correctly
    wrong:   [],   // kanji answered incorrectly
    done:    false,
  };

  show("screen-session");
  renderCard();
}

function renderCard() {
  const card  = session.cards[session.idx];
  const total = session.cards.length;

  document.getElementById("sess-counter").textContent      = `Kanji ${session.idx + 1} / ${total}`;
  document.getElementById("sess-score").textContent        = `✓ ${session.score}`;
  document.getElementById("prog-fill").style.width         = `${(session.idx / total) * 100}%`;

  const fc = document.getElementById("flash-card");
  fc.className = "flash-card";

  const lbl  = document.getElementById("card-lbl");
  const main = document.getElementById("card-main");
  const rdg  = document.getElementById("card-reading");

  if (curMode === "km") {
    lbl.textContent  = "Quel est le sens de ce kanji ?";
    main.className   = "kanji-big";
    main.textContent = card.k;
    rdg.textContent  = "";
  } else {
    lbl.textContent  = "Quel est le kanji correspondant ?";
    main.className   = "meaning-big";
    main.textContent = card.m;
    rdg.innerHTML    = readingHTML(card);
  }

  // Build 4 choices
  const otherLevel = DB[session.lv].filter(d => d.k !== card.k);
  const wrongs     = shuffle(otherLevel).slice(0, 3);
  const choices    = shuffle([card, ...wrongs]);

  const grid = document.getElementById("choices-grid");
  grid.innerHTML = "";

  choices.forEach((ch, i) => {
    const btn = document.createElement("button");
    btn.className   = "choice-btn";
    btn.dataset.idx = i;
    btn.dataset.key = ch.k;

    if (curMode === "km") {
      btn.textContent = ch.m;
    } else {
      btn.innerHTML   = `<span class="choice-kanji">${ch.k}</span>`;
    }

    btn.onclick = () => handleAnswer(btn, ch, card);
    grid.appendChild(btn);
  });

  // Store choices for keyboard nav
  session._choices = choices;
  session._card    = card;
  session.answered = false;
  document.getElementById("next-btn").classList.remove("visible");
}

function handleAnswer(btn, chosen, correct) {
  if (session.answered) return;
  session.answered = true;

  const isOk = chosen.k === correct.k;
  const fc   = document.getElementById("flash-card");

  record(correct.k, isOk);
  saveState();

  if (isOk) {
    session.score++;
    session.correct.push(correct);
    fc.classList.add("correct");
    btn.classList.add("correct-c");
  } else {
    session.wrong.push(correct);
    fc.classList.add("wrong");
    btn.classList.add("wrong-c");
    // Highlight correct
    document.querySelectorAll(".choice-btn").forEach(b => {
      if (b.dataset.key === correct.k && b !== btn) b.classList.add("correct-c");
    });
  }

  // Always show reading after answer
  const rdg = document.getElementById("card-reading");
  rdg.innerHTML = readingHTML(correct);
  if (curMode === "mk") {
    document.getElementById("card-main").textContent = correct.m;
  }

  document.querySelectorAll(".choice-btn").forEach(b => b.disabled = true);

  const nb = document.getElementById("next-btn");
  nb.textContent = (session.idx + 1 < session.cards.length) ? "Suivant →" : "Voir les résultats →";
  nb.classList.add("visible");
}

function nextCard() {
  session.idx++;
  if (session.idx < session.cards.length) {
    renderCard();
  } else {
    endSession();
  }
}

function endSession() {
  const pct = session.score / session.cards.length;

  // Streak
  ST.streak = pct >= 0.7 ? ST.streak + 1 : 0;

  ST.sessions++;

  // Unlock next level
  let unlocked = null;
  const nextLv = { 5:4, 4:3, 3:2, 2:1 }[session.lv];
  if (nextLv && pct >= 0.7 && !ST.unlocked.has(nextLv)) {
    ST.unlocked.add(nextLv);
    unlocked = nextLv;
  }

  saveState();
  showResults(session.score, session.cards.length, session.wrong, unlocked);
}

// ──────────────────────────────────────────────────────
//  RESULTS
// ──────────────────────────────────────────────────────
function showResults(score, total, mistakes, unlocked) {
  const pct = score / total;

  const [word, msg, sub] =
    pct >= 0.9  ? ["完璧", "Parfait ! Maîtrise absolue !",           "Vous avez une mémoire exceptionnelle."] :
    pct >= 0.7  ? ["合格", "Excellent résultat !",                    `${score >= total ? "Score parfait !" : "Continuez ainsi pour maîtriser le niveau suivant."}`] :
    pct >= 0.5  ? ["半分", "Pas mal, mais peut mieux faire.",         "Revoyez les kanji manqués et réessayez."] :
                  ["要練習","Il faut s'entraîner davantage.",         "Ne vous découragez pas — la répétition est la clé !"];

  document.getElementById("res-word").textContent  = word;
  document.getElementById("res-title").textContent = `${score} bonne${score>1?"s":""} réponse${score>1?"s":""} sur ${total}`;
  document.getElementById("res-score").textContent = score;
  document.getElementById("res-denom").textContent = `/ ${total}`;
  document.getElementById("res-msg").textContent   = msg;
  document.getElementById("res-sub").textContent   = sub;

  const ub = document.getElementById("unlock-banner");
  if (unlocked) {
    ub.style.display = "block";
    ub.textContent   = `🎉 Niveau N${unlocked} (${LV_CONFIG[unlocked].name}) débloqué !`;
  } else {
    ub.style.display = "none";
  }

  const ms  = document.getElementById("mistakes-section");
  const ml  = document.getElementById("mistakes-list");
  if (mistakes.length > 0) {
    ms.style.display = "block";
    ml.innerHTML = mistakes.map(m => `
      <div class="mistake-row">
        <div class="mistake-k">${m.k}</div>
        <div class="mistake-info">
          <div class="mistake-m">${m.m}</div>
          <div class="mistake-r">${m.kn} · ${m.r}</div>
        </div>
      </div>
    `).join("");
  } else {
    ms.style.display = "none";
  }

  show("screen-results");
}

//  KEYBOARD SHORTCUTS
// ──────────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  const screen = document.querySelector(".screen.active")?.id;

  if (screen === "screen-kana" && kanaUI.quiz && !kanaUI.quiz.done) {
    const body = document.getElementById("kana-body");
    if (!kanaUI.quiz.answered) {
      const i = { "1": 0, "2": 1, "3": 2, "4": 3 }[e.key];
      const b = i !== undefined && body.querySelectorAll(".choice-btn")[i];
      if (b) b.click();
    } else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault(); const nb = document.getElementById("kana-next"); if (nb) nb.click();
    }
    return;
  }

  if (screen === "screen-session") {
    if (!session) return;

    if (!session.answered) {
      const map = { "1":0, "2":1, "3":2, "4":3 };
      if (map[e.key] !== undefined) {
        const btns = document.querySelectorAll(".choice-btn");
        if (btns[map[e.key]]) btns[map[e.key]].click();
      }
    } else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      const nb = document.getElementById("next-btn");
      if (nb.classList.contains("visible")) nb.click();
    }
  }
});

}

// ── Switchers ──
function setNumMode(m) {
  numState.mode = m;
  numState.idx = 0; numState.revealed = false; numState.answered = false;
  numState.deck = (numState.mode === "learn" && numState.order === "shuffle")
    ? shuffle([...NUMBERS]) : [...NUMBERS];
  document.getElementById("num-tab-learn").classList.toggle("active", m === "learn");
  document.getElementById("num-tab-quiz").classList.toggle("active",  m === "quiz");
  document.getElementById("num-order-wrap").style.display = m === "learn" ? "" : "none";
  document.getElementById("num-dir-wrap").style.display   = m === "quiz"  ? "" : "none";
  renderNum();
}

function setNumOrder(o) {
  numState.order = o;
  document.getElementById("num-tab-order").classList.toggle("active",   o === "order");
  document.getElementById("num-tab-shuffle").classList.toggle("active", o === "shuffle");
  numState.idx = 0; numState.revealed = false;
  numState.deck = o === "order" ? [...NUMBERS] : shuffle([...NUMBERS]);
  renderNum();
}

function setNumDir(d) {
  numState.dir = d;
  document.getElementById("num-tab-nk").classList.toggle("active", d === "nk");
  document.getElementById("num-tab-kn").classList.toggle("active", d === "kn");
  numState.idx = 0; numState.answered = false;
  numState.deck = shuffle([...NUMBERS]);
  renderNum();
}

// ── Dispatcher ──
function renderNum() {
  const total = numState.deck.length;
  const entry = numState.deck[numState.idx];
  document.getElementById("num-counter").textContent = `${numState.idx + 1} / ${total}`;
  document.getElementById("num-prog").style.width    = `${(numState.idx / (total - 1)) * 100}%`;

  if (numState.mode === "learn") renderNumLearn(entry, total);
  else                           renderNumQuiz(entry);
}

// ── APPRENTISSAGE ──
function renderNumLearn(entry, total) {
  document.getElementById("num-choices").style.display    = "none";
  document.getElementById("num-next-quiz").style.display  = "none";
  document.getElementById("num-nav-learn").style.display  = "";

  const card = document.getElementById("num-card");
  card.style.cursor = "pointer";
  card.onclick = revealNum;
  card.className = "num-card";

  document.getElementById("num-card-main").innerHTML =
    `<div class="num-number">${entry.n.toLocaleString("fr")}</div>`;
  document.getElementById("num-card-reveal").innerHTML =
    `<div class="num-kanji">${entry.k}</div><div class="num-reading">${entry.r}</div>`;

  const reveal = document.getElementById("num-reveal");
  const hint   = document.getElementById("num-hint");
  if (numState.revealed) {
    reveal.classList.remove("hidden");
    hint.style.display = "none";
  } else {
    reveal.classList.add("hidden");
    hint.style.display = "";
  }

  document.getElementById("num-prev").disabled = numState.idx === 0;
  document.getElementById("num-next-learn").textContent =
    numState.idx + 1 < total ? "Suivant →" : "Recommencer";
}

function revealNum() {
  if (numState.mode !== "learn" || numState.revealed) return;
  numState.revealed = true;
  renderNum();
}

function nextNum() {
  if (numState.idx + 1 < numState.deck.length) {
    numState.idx++;
  } else {
    numState.idx = 0;
    if (numState.order === "shuffle") numState.deck = shuffle([...NUMBERS]);
  }
  numState.revealed = false;
  renderNum();
}

function prevNum() {
  if (numState.idx > 0) {
    numState.idx--;
    numState.revealed = false;
    renderNum();
  }
}

// ── QUIZ ──
function renderNumQuiz(entry) {
  document.getElementById("num-nav-learn").style.display  = "none";
  document.getElementById("num-reveal").classList.add("hidden");
  document.getElementById("num-hint").style.display       = "none";

  const card = document.getElementById("num-card");
  card.style.cursor = "default";
  card.onclick = null;
  card.className = "num-card";

  // Contenu de la carte selon la direction
  if (numState.dir === "nk") {
    // Afficher le chiffre, choisir le kanji
    document.getElementById("num-card-main").innerHTML =
      `<div class="num-number">${entry.n.toLocaleString("fr")}</div>`;
  } else {
    // Afficher le kanji + lecture, choisir le chiffre
    document.getElementById("num-card-main").innerHTML =
      `<div class="num-kanji">${entry.k}</div><div class="num-reading">${entry.r}</div>`;
  }

  // Construire 4 choix
  const others  = NUMBERS.filter(e => e.n !== entry.n);
  const wrongs  = shuffle([...others]).slice(0, 3);
  const choices = shuffle([entry, ...wrongs]);

  const grid = document.getElementById("num-choices");
  grid.style.display = "";
  grid.innerHTML = "";
  choices.forEach(ch => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.dataset.n = ch.n;
    if (numState.dir === "nk") {
      btn.innerHTML = `<span class="choice-kanji">${ch.k}</span>`;
    } else {
      btn.textContent = ch.n.toLocaleString("fr");
    }
    btn.onclick = () => handleNumAnswer(btn, ch, entry);
    grid.appendChild(btn);
  });

  numState.answered = false;
  document.getElementById("num-next-quiz").classList.remove("visible");
  document.getElementById("num-next-quiz").style.display = "";
}

function handleNumAnswer(btn, chosen, correct) {
  if (numState.answered) return;
  numState.answered = true;

  const isOk = chosen.n === correct.n;
  const card  = document.getElementById("num-card");
  card.classList.add(isOk ? "correct" : "wrong");
  btn.classList.add(isOk ? "correct-c" : "wrong-c");

  if (!isOk) {
    document.querySelectorAll("#num-choices .choice-btn").forEach(b => {
      if (parseInt(b.dataset.n) === correct.n) b.classList.add("correct-c");
    });
  }

  // Révéler la réponse complète sur la carte
  document.getElementById("num-card-reveal").innerHTML =
    `<div class="num-kanji">${correct.k}</div><div class="num-reading">${correct.r}</div>`;
  document.getElementById("num-reveal").classList.remove("hidden");

  document.querySelectorAll("#num-choices .choice-btn").forEach(b => b.disabled = true);

  const nb = document.getElementById("num-next-quiz");
  nb.textContent = numState.idx + 1 < numState.deck.length ? "Suivant →" : "Recommencer";
  nb.classList.add("visible");
}

function nextNumQuiz() {
  if (numState.idx + 1 < numState.deck.length) {
    numState.idx++;
  } else {
    numState.idx = 0;
    numState.deck = shuffle([...NUMBERS]);
  }
  numState.answered = false;
  renderNum();
}

// ──────────────────────────────────────────────────────
//  UTILS
// ──────────────────────────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}



// ──────────────────────────────────────────────────────
//  ÉCRAN KANA : tableau de référence et quiz en répétition espacée
// ──────────────────────────────────────────────────────
const kanaUI = { script: "h", view: "table", groups: { base: true, daku: false, yoon: false }, dir: "kr", quiz: null };
const KQ_SIZE = 20;

function showKana() { kanaUI.quiz = null; show("screen-kana"); renderKana(); }
function setKanaScript(sc) { kanaUI.script = sc; kanaUI.quiz = null; renderKana(); }
function setKanaView(v) { kanaUI.view = v; kanaUI.quiz = null; renderKana(); }
function kanaSelected() { return KANA_ALL.filter(x => x.s === kanaUI.script && kanaUI.groups[x.g]); }

function renderKana() {
  document.getElementById("kana-tab-h").classList.toggle("active", kanaUI.script === "h");
  document.getElementById("kana-tab-k").classList.toggle("active", kanaUI.script === "k");
  document.getElementById("kana-tab-table").classList.toggle("active", kanaUI.view === "table");
  document.getElementById("kana-tab-quiz").classList.toggle("active", kanaUI.view === "quiz");
  const body = document.getElementById("kana-body");
  body.innerHTML = "";
  const all = KANA_ALL.filter(x => x.s === kanaUI.script);
  const m = all.filter(x => kanaMastered(x.id)).length, v = all.filter(x => ST.kana[x.id]).length, due = all.filter(x => kanaDue(x.id)).length;
  document.getElementById("kana-counter").textContent = kanaUI.quiz ? `${Math.min(kanaUI.quiz.i + 1, kanaUI.quiz.cards.length)} / ${kanaUI.quiz.cards.length}` : `${m} / ${all.length}`;
  if (kanaUI.view === "table") return renderKanaTable(body, m, v, due, all.length);
  if (kanaUI.quiz) return kanaUI.quiz.done ? renderKanaResult(body) : renderKanaCard(body);
  renderKanaSetup(body, m, v, due, all.length);
}

function renderKanaTable(body, m, v, due, total) {
  body.insertAdjacentHTML("beforeend", `<div class="kana-stats"><span><b>${m}</b> maîtrisés</span>·<span><b>${v}</b> vus sur ${total}</span>·<span><b>${due}</b> à revoir</span></div>`);
  for (const g of Object.keys(KANA_ROWS)) {
    body.insertAdjacentHTML("beforeend", `<div class="kana-sec">${KANA_GROUPS[g]}</div>`);
    const grid = document.createElement("div");
    grid.className = "kana-grid " + (g === "yoon" ? "c3" : "c5");
    KANA_ROWS[g].flat().forEach(cell => {
      const x = splitKana(cell);
      if (!x) { grid.insertAdjacentHTML("beforeend", '<div class="kana-cell empty"></div>'); return; }
      const id = kanaUI.script + ":" + (kanaUI.script === "k" ? toKata(x.k) : x.k);
      const st = kanaMastered(id) ? " mastered" : ST.kana[id] ? " seen" : "";
      grid.insertAdjacentHTML("beforeend", `<div class="kana-cell${st}"><div class="kc">${KANA_BY[id].k}</div><div class="kr">${x.r}</div></div>`);
    });
    body.appendChild(grid);
  }
  body.insertAdjacentHTML("beforeend", '<div class="kana-legend"><span><i style="border-color:rgba(255,209,102,.7)"></i>déjà vu</span><span><i style="border-color:var(--success)"></i>maîtrisé</span></div>');
}

function renderKanaSetup(body, m, v, due, total) {
  body.insertAdjacentHTML("beforeend", `<div class="kana-stats"><span><b>${m}</b> maîtrisés</span>·<span><b>${v}</b> vus sur ${total}</span>·<span><b>${due}</b> à revoir</span></div>`);
  const groups = document.createElement("div"); groups.className = "kana-groups";
  for (const g of Object.keys(KANA_ROWS)) {
    const n = kanaList(kanaUI.script, g).length;
    const lab = document.createElement("label"); lab.className = "kana-chip";
    lab.innerHTML = `<input type="checkbox" ${kanaUI.groups[g] ? "checked" : ""}> ${KANA_GROUPS[g]} (${n})`;
    lab.querySelector("input").onchange = e => { kanaUI.groups[g] = e.target.checked; renderKana(); };
    groups.appendChild(lab);
  }
  body.appendChild(groups);
  const dir = document.createElement("div"); dir.className = "mode-wrap";
  dir.innerHTML = `<button class="mode-tab ${kanaUI.dir === "kr" ? "active" : ""}" data-d="kr">${kanaUI.script === "h" ? "あ" : "ア"} → romaji</button><button class="mode-tab ${kanaUI.dir === "rk" ? "active" : ""}" data-d="rk">romaji → ${kanaUI.script === "h" ? "あ" : "ア"}</button>`;
  dir.querySelectorAll("button").forEach(b => b.onclick = () => { kanaUI.dir = b.dataset.d; renderKana(); });
  body.appendChild(dir);
  const sel = kanaSelected(), dueSel = sel.filter(x => kanaDue(x.id)).length;
  body.insertAdjacentHTML("beforeend", `<p class="due-hint">${sel.length ? (dueSel ? `<b>${dueSel}</b> kana à revoir dans cette sélection : ils passent en priorité.` : "Les kana jamais vus passent en premier, puis ceux qui reviennent le plus tôt.") : "Coche au moins un groupe."}</p>`);
  const go = document.createElement("button"); go.className = "btn btn-primary"; go.style.width = "100%";
  go.textContent = `▶ Commencer (${Math.min(KQ_SIZE, sel.length)} kana)`; go.disabled = !sel.length;
  go.onclick = startKanaQuiz; body.appendChild(go);
}

function startKanaQuiz() {
  const sel = kanaSelected(), t = today();
  const due = shuffle(sel.filter(x => ST.kana[x.id] && ST.kana[x.id][1] <= t)).sort((a, b) => ST.kana[a.id][0] - ST.kana[b.id][0]);
  const unseen = shuffle(sel.filter(x => !ST.kana[x.id]));
  const later = sel.filter(x => ST.kana[x.id] && ST.kana[x.id][1] > t).sort((a, b) => ST.kana[a.id][1] - ST.kana[b.id][1]);
  const cards = shuffle([...due, ...unseen, ...later].slice(0, Math.min(KQ_SIZE, sel.length)));
  kanaUI.quiz = { cards, i: 0, score: 0, wrong: [], answered: false, done: false };
  renderKana();
}

function renderKanaCard(body) {
  const q = kanaUI.quiz, card = q.cards[q.i], rk = kanaUI.dir === "rk";
  body.insertAdjacentHTML("beforeend", `<div class="prog-wrap"><div class="prog-fill" style="width:${q.i / q.cards.length * 100}%"></div></div>
    <div class="flash-card" id="kana-card"><div class="card-mode-lbl">${rk ? "Quel kana se lit ainsi ?" : "Comment se lit ce kana ?"}</div>
    <div class="${rk ? "kana-roma-big" : "kana-big"}">${rk ? card.r : card.k}</div><div class="card-reading" id="kana-reading"></div></div>`);
  /* les distracteurs viennent de la même écriture ; on écarte ceux qui se lisent pareil (じ/ぢ, ず/づ) */
  const pool = KANA_ALL.filter(x => x.s === card.s && x.r !== card.r && (kanaUI.groups[x.g] || x.g === card.g));
  const choices = shuffle([card, ...shuffle(pool).slice(0, 3)]);
  const grid = document.createElement("div"); grid.className = "choices-grid";
  choices.forEach(ch => {
    const b = document.createElement("button"); b.className = "choice-btn";
    if (rk) b.innerHTML = `<span class="choice-kana">${ch.k}</span>`; else b.textContent = ch.r;
    b.onclick = () => answerKana(b, ch, card, grid);
    grid.appendChild(b);
  });
  body.appendChild(grid);
  const nb = document.createElement("button"); nb.className = "next-btn"; nb.id = "kana-next";
  nb.textContent = q.i + 1 < q.cards.length ? "Suivant →" : "Voir les résultats →";
  nb.onclick = nextKana; body.appendChild(nb);
  body.insertAdjacentHTML("beforeend", '<div class="kbd-hint">Raccourcis : <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> pour choisir · <kbd>Entrée</kbd> pour suivant</div>');
  q.answered = false;
}

function answerKana(btn, chosen, card, grid) {
  const q = kanaUI.quiz; if (q.answered) return; q.answered = true;
  const ok = chosen.id === card.id;
  recordKana(card.id, ok); saveState();
  const fc = document.getElementById("kana-card");
  if (ok) { q.score++; fc.classList.add("correct"); btn.classList.add("correct-c"); }
  else {
    q.wrong.push(card); fc.classList.add("wrong"); btn.classList.add("wrong-c");
    grid.querySelectorAll(".choice-btn").forEach(b => { if ((kanaUI.dir === "rk" ? b.textContent : b.textContent) === (kanaUI.dir === "rk" ? card.k : card.r)) b.classList.add("correct-c"); });
  }
  document.getElementById("kana-reading").innerHTML = kanaUI.dir === "rk" ? `<span class="rd-romaji">${card.r}</span>` : `<span class="rd-kana">${card.k}</span>`;
  grid.querySelectorAll(".choice-btn").forEach(b => b.disabled = true);
  document.getElementById("kana-next").classList.add("visible");
}

function nextKana() {
  const q = kanaUI.quiz; q.i++;
  if (q.i >= q.cards.length) q.done = true;
  renderKana();
}

function renderKanaResult(body) {
  const q = kanaUI.quiz, n = q.cards.length, pct = q.score / n;
  body.insertAdjacentHTML("beforeend", `<div class="kana-result"><div class="big" style="color:${pct >= .9 ? "var(--success)" : pct >= .7 ? "var(--n3)" : "var(--error)"}">${q.score} / ${n}</div>
    <div class="res-sub" style="color:var(--muted);font-size:.85rem">${pct >= .9 ? "Excellent." : pct >= .7 ? "Bien : les erreurs reviendront dès la prochaine session." : "Les kana ratés reviendront dès la prochaine session."}</div></div>`);
  if (q.wrong.length) body.insertAdjacentHTML("beforeend", `<div class="mistakes-section"><div class="mistakes-lbl">À retravailler</div>${q.wrong.map(w => `<div class="mistake-row"><div class="mistake-k">${w.k}</div><div class="mistake-info"><div class="mistake-m">${w.r}</div></div></div>`).join("")}</div>`);
  const act = document.createElement("div"); act.className = "kana-actions";
  act.innerHTML = '<button class="btn btn-ghost">Tableau</button><button class="btn btn-primary">↺ Nouvelle session</button>';
  act.children[0].onclick = () => setKanaView("table");
  act.children[1].onclick = startKanaQuiz;
  body.appendChild(act);
}

// ──────────────────────────────────────────────────────
//  SYNCHRONISATION ENTRE APPAREILS (Supabase)
//  La connexion se fait sur l'accueil du Dojo ; cette page suit la session partagée.
//  Tant que url et key sont vides, la progression reste dans ce navigateur.
// ──────────────────────────────────────────────────────
const SYNC = { url: "https://cezasvhqmmjudlzhsjyu.supabase.co", key: "sb_publishable_123lbagpIPcVLDAQ7HKO3w_cgebhCvF" };
const SYNC_APP = "kanji";
const canon = v => v && typeof v === "object" ? (Array.isArray(v) ? "[" + v.map(canon).join(",") + "]" : "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}") : JSON.stringify(v === undefined ? null : v);
function mergeRaw(a, b) {
  const A = fromRaw(a), B = fromRaw(b);
  if ((A.rz || 0) !== (B.rz || 0)) return (A.rz || 0) > (B.rz || 0) ? A : B;   // une remise à zéro plus récente l'emporte
  const [n, o] = (A.ts || 0) >= (B.ts || 0) ? [A, B] : [B, A];
  const m = blankState();
  m.srs = Object.assign({}, o.srs);
  for (const k in n.srs) { const x = m.srs[k], y = n.srs[k]; if (!x || (y[4] || 0) >= (x[4] || 0)) m.srs[k] = y; }
  m.kana = Object.assign({}, o.kana);
  for (const k in n.kana) { const x = m.kana[k], y = n.kana[k]; if (!x || (y[4] || 0) >= (x[4] || 0)) m.kana[k] = y; }
  m.unlocked = new Set([...A.unlocked, ...B.unlocked]);
  m.sessions = Math.max(A.sessions, B.sessions);
  m.streak = n.streak; m.level = n.level; m.rz = n.rz;
  m.ts = Math.max(A.ts || 0, B.ts || 0);
  return m;
}
const Sync = {
  on: !!(SYNC.url && SYNC.key), client: null, user: null, state: "off", last: null, timer: null, busy: null, again: false,
  line() {
    const el = document.getElementById("sync-line"); if (!el) return;
    el.textContent = !this.on ? "" : this.state === "on" ? "Progression synchronisée avec ton compte" + (this.user && this.user.email ? " (" + this.user.email + ")" : "")
      : this.state === "err" ? "Synchronisation impossible pour l'instant : ta progression reste enregistrée ici."
      : this.state === "out" ? "Progression enregistrée sur cet appareil. Connecte-toi depuis l'accueil du Dojo pour la retrouver partout."
      : "";
  },
  set(s) { this.state = s; this.line(); },
  init() {
    if (!this.on) return;
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    sc.onload = () => this.start(); sc.onerror = () => this.set("err");
    document.head.append(sc);
  },
  async start() {
    try {
      this.client = window.supabase.createClient(SYNC.url, SYNC.key);
      this.client.auth.onAuthStateChange((ev, session) => setTimeout(() => this.session(session), 0));
      const { data } = await this.client.auth.getSession();
      this.session(data && data.session);
    } catch (e) { this.set("err"); }
    document.addEventListener("visibilitychange", () => {
      if (!this.user) return;
      if (document.visibilityState === "hidden") { if (this.timer) this.run(); }
      else if (!this.last || Date.now() - this.last > 30000) this.run();
    });
    window.addEventListener("online", () => { if (this.user) this.run(); });
  },
  session(session) {
    const u = session && session.user ? session.user : null;
    if (u && this.user && u.id === this.user.id) return;
    this.user = u;
    if (u) this.run(); else this.set("out");
  },
  touch() { if (!this.user) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 2500); },
  run() {
    clearTimeout(this.timer); this.timer = null;
    if (!this.user) return Promise.resolve();
    if (this.busy) { this.again = true; return this.busy; }
    this.busy = (async () => {
      try {
        const uid = this.user.id;
        const { data: row, error } = await this.client.from("progression").select("data").eq("user_id", uid).eq("app", SYNC_APP).maybeSingle();
        if (error) throw error;
        const remote = row && row.data && typeof row.data === "object" ? row.data : null;
        const before = content();
        if (remote) ST = mergeRaw(toRaw(ST), remote);
        const changed = content() !== before;
        snap = content();
        const raw = toRaw(ST); raw.sum = summary();
        try { localStorage.setItem(KEY, JSON.stringify(raw)); } catch (e) {}
        if (!remote || canon(remote) !== canon(raw)) {
          const { error: e2 } = await this.client.from("progression").upsert({ user_id: uid, app: SYNC_APP, data: raw, updated_at: new Date().toISOString() });
          if (e2) throw e2;
        }
        this.last = Date.now(); this.set("on");
        if (changed && !session && document.getElementById("screen-home").classList.contains("active")) renderHome();
        if (changed && document.getElementById("screen-kana").classList.contains("active") && !kanaUI.quiz) renderKana();
      } catch (e) { this.set("err"); }
      this.busy = null;
      if (this.again) { this.again = false; this.touch(); }
    })();
    return this.busy;
  },
};

// ──────────────────────────────────────────────────────
//  INIT
// ──────────────────────────────────────────────────────
ST = loadState();
snap = content();
saveState();
show("screen-home");
renderHome();
Sync.init();
