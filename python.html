x' OR '1'='1\") == [], \"La requête est vulnérable à l'injection SQL : avec la saisie x' OR '1'='1, elle renvoie toute la table. Utilise un paramètre ?.\"", "hint": "<p><code>page<\/code> : la page 1 commence à l'indice 0, donc <code>debut = (numero - 1) * taille<\/code>, après avoir refusé les numéros inférieurs à 1. <code>rechercher<\/code> : remplace la f-string par un <code>?<\/code> et passe <code>(nom,)<\/code> en second argument.<\/p>", "stdin": "", "skel": ""}, {"t": "quiz", "id": "relire-du-code-genere-3", "title": "Le bug caché du code généré", "h": "<p>Ce code a été généré avec la demande : « moyenne des notes, en ignorant les valeurs manquantes ». Prédis l'affichage, et repère au passage la ligne fautive.<\/p>", "code": "def moyenne_notes(notes):\n    valides = [n for n in notes if n]\n    return sum(valides) / len(valides)\n\n\nprint(moyenne_notes([10, None, 20]))\nprint(moyenne_notes([0, 20]))\nprint(moyenne_notes([0, 0, 15, None]))", "expected": "15.0\n20.0\n15.0"}]}, {"id": "garder-la-main", "title": "Garder la main", "blocks": [{"t": "html", "h": "<p>Un agent de programmation agit : il exécute des commandes sur ta machine, modifie des fichiers, installe des paquets. Quelques règles évitent les accidents.<\/p><h3>Les précautions<\/h3><ul><li><strong>Git d'abord<\/strong>. Travaille toujours dans un dépôt, sur une branche, avec un commit propre avant de lancer l'agent. Tout ce qu'il fait devient annulable d'une commande.<\/li><li><strong>Les permissions au plus juste<\/strong>. Autorise la lecture et les tests librement ; garde un œil sur ce qui écrit, supprime, installe ou parle au réseau. Lis une commande avant de l'approuver.<\/li><li><strong>Aucun secret à portée<\/strong>. Pas de clé de production, pas de base réelle. L'agent travaille sur des données de test.<\/li><li><strong>Rien d'irréversible sans toi<\/strong>. Suppression de données, mise en production, envoi de courriels : ces gestes restent manuels.<\/li><li><strong>Méfie-toi de ce qu'il lit<\/strong>. Une page web ou un fichier téléchargé peuvent contenir des instructions destinées à l'agent. C'est l'injection de prompt du module précédent, avec des outils réels au bout.<\/li><\/ul><h3>Quand ne pas déléguer<\/h3><ul><li>Quand tu <strong>apprends<\/strong> une notion. Écris-la toi-même. Demande plutôt à l'IA de t'expliquer, de relire ton code ou de te proposer des exercices.<\/li><li>Quand tu ne saurais pas <strong>dire si le résultat est juste<\/strong>. Sans critère de vérification, tu ne délègues pas : tu espères.<\/li><li>Sur le <strong>cœur sensible<\/strong> d'un système (sécurité, argent, données personnelles) sans relecture experte.<\/li><\/ul><h3>Bien s'en servir pour progresser<\/h3><ul><li>« Explique-moi ce message d'erreur et donne-moi une piste, sans me donner la solution. »<\/li><li>« Voici ma fonction. Quels cas limites ai-je oubliés ? »<\/li><li>« Relis ce code comme le ferait un développeur expérimenté et classe tes remarques par gravité. »<\/li><li>« Propose trois exercices sur les dictionnaires, du plus simple au plus difficile, sans les corrigés. »<\/li><\/ul><h3>Le plan d'entraînement<\/h3><ol><li>Refais un projet de ce cours <strong>sans<\/strong> assistance, pour savoir où tu en es.<\/li><li>Refais-le <strong>avec<\/strong> un agent, en écrivant d'abord la demande et les tests. Compare les deux codes : lequel est le plus clair ? Qu'a-t-il fait que tu n'aurais pas fait, et l'inverse ?<\/li><li>Demande à l'agent une fonctionnalité que tu ne sais pas écrire. Ne valide rien avant de pouvoir expliquer chaque ligne à voix haute.<\/li><\/ol><div class=\"note\"><span class=\"lab\">À retenir<\/span><p>L'objectif n'est pas de taper le moins de code possible. C'est de livrer un programme juste, que tu comprends et que tu peux maintenir. L'agent est un moyen d'y arriver plus vite, à condition de rester celui qui sait.<\/p><\/div>"}]}]}, {"id": "projets", "title": "Projets finaux et suite", "desc": "Trois projets pour prouver que tu sais programmer seul, puis les prochaines étapes sur ton ordinateur.", "lessons": [{"id": "projet-gestionnaire-de-taches", "title": "Projet 1 : un gestionnaire de tâches", "blocks": [{"t": "html", "h": "<p>Les projets finaux ne t'apprennent rien de nouveau : ils te demandent de tout assembler, sans guidage. Il n'y a pas d'indice. Si tu bloques, reviens à la méthode : exemples à la main, plan en commentaires, une étape à la fois.<\/p><p>Tu vas écrire le cœur d'une application de listes de tâches, avec sauvegarde dans un fichier.<\/p>"}, {"t": "exo", "id": "projet-gestionnaire-de-taches-1", "title": "La classe GestionnaireTaches", "h": "<p>Écris une classe <code>GestionnaireTaches<\/code> avec les méthodes suivantes.<\/p><ul><li><code>ajouter(titre, priorite=2)<\/code> : ajoute une tâche non terminée. La priorité vaut 1 (urgente), 2 ou 3. Si une tâche porte déjà ce titre, ou si la priorité n'est pas 1, 2 ou 3, lève une <code>ValueError<\/code>.<\/li><li><code>terminer(titre)<\/code> : marque la tâche comme terminée. Si le titre est inconnu, lève une <code>KeyError<\/code>.<\/li><li><code>a_faire()<\/code> : renvoie la liste des <strong>titres<\/strong> des tâches non terminées, triées par priorité croissante ; à priorité égale, dans l'ordre d'ajout.<\/li><li><code>progression()<\/code> : renvoie le pourcentage de tâches terminées, sous forme d'entier arrondi (0 s'il n'y a aucune tâche).<\/li><li><code>sauvegarder(nom_fichier)<\/code> : écrit toutes les tâches dans un fichier JSON.<\/li><li><code>charger(nom_fichier)<\/code> : remplace les tâches par celles du fichier.<\/li><\/ul>", "starter": "import json\n\n\nclass GestionnaireTaches:\n    def __init__(self):\n        self.taches = []\n\n\ng = GestionnaireTaches()\ng.ajouter(\"Réviser les dictionnaires\", 1)\ng.ajouter(\"Faire les courses\", 3)\ng.ajouter(\"Appeler Camille\")\ng.terminer(\"Faire les courses\")\nprint(g.a_faire())\nprint(g.progression(), \"%\")", "solution": "import json\n\n\nclass GestionnaireTaches:\n    def __init__(self):\n        self.taches = []\n\n    def _trouver(self, titre):\n        for tache in self.taches:\n            if tache[\"titre\"] == titre:\n                return tache\n        return None\n\n    def ajouter(self, titre, priorite=2):\n        if priorite not in (1, 2, 3):\n            raise ValueError(\"La priorité doit valoir 1, 2 ou 3\")\n        if self._trouver(titre) is not None:\n            raise ValueError(\"Cette tâche existe déjà\")\n        self.taches.append({\"titre\": titre, \"priorite\": priorite, \"terminee\": False})\n\n    def terminer(self, titre):\n        tache = self._trouver(titre)\n        if tache is None:\n            raise KeyError(titre)\n        tache[\"terminee\"] = True\n\n    def a_faire(self):\n        restantes = [t for t in self.taches if not t[\"terminee\"]]\n        return [t[\"titre\"] for t in sorted(restantes, key=lambda t: t[\"priorite\"])]\n\n    def progression(self):\n        if not self.taches:\n            return 0\n        terminees = sum(1 for t in self.taches if t[\"terminee\"])\n        return round(100 * terminees / len(self.taches))\n\n    def sauvegarder(self, nom_fichier):\n        with open(nom_fichier, \"w\", encoding=\"utf-8\") as fichier:\n            json.dump(self.taches, fichier, ensure_ascii=False)\n\n    def charger(self, nom_fichier):\n        with open(nom_fichier, encoding=\"utf-8\") as fichier:\n            self.taches = json.load(fichier)\n\n\ng = GestionnaireTaches()\ng.ajouter(\"Réviser les dictionnaires\", 1)\ng.ajouter(\"Faire les courses\", 3)\ng.ajouter(\"Appeler Camille\")\ng.terminer(\"Faire les courses\")\nprint(g.a_faire())\nprint(g.progression(), \"%\")", "tests": "def leve(exc, f, *a):\n    try:\n        f(*a)\n    except exc:\n        return True\n    except Exception:\n        return False\n    return False\ng = GestionnaireTaches()\nassert g.progression() == 0 and g.a_faire() == [], \"Un gestionnaire vide a une progression de 0 et aucune tâche à faire.\"\ng.ajouter(\"B\", 3)\ng.ajouter(\"A\", 1)\ng.ajouter(\"C\")\ng.ajouter(\"D\", 1)\nassert g.a_faire() == [\"A\", \"D\", \"C\", \"B\"], \"a_faire() doit trier par priorité, puis par ordre d'ajout : on attend ['A', 'D', 'C', 'B']. Tu obtiens %r.\" % (g.a_faire(),)\nassert leve(ValueError, g.ajouter, \"A\"), \"Ajouter un titre déjà présent doit lever une ValueError.\"\nassert leve(ValueError, g.ajouter, \"Z\", 5), \"Une priorité de 5 doit lever une ValueError.\"\nassert leve(KeyError, g.terminer, \"inconnue\"), \"Terminer une tâche inconnue doit lever une KeyError.\"\ng.terminer(\"D\")\nassert g.a_faire() == [\"A\", \"C\", \"B\"], \"Une tâche terminée ne doit plus apparaître dans a_faire().\"\nassert g.progression() == 25, \"Avec 1 tâche terminée sur 4, la progression vaut 25. Tu obtiens %r.\" % (g.progression(),)\ng.sauvegarder(\"taches_test.json\")\nimport json\nwith open(\"taches_test.json\", encoding=\"utf-8\") as f:\n    json.load(f)\nh = GestionnaireTaches()\nh.ajouter(\"temporaire\")\nh.charger(\"taches_test.json\")\nassert h.a_faire() == [\"A\", \"C\", \"B\"] and h.progression() == 25, \"Après sauvegarder puis charger, on doit retrouver exactement les mêmes tâches, terminées ou non.\"\nh.terminer(\"A\")\nassert g.a_faire() == [\"A\", \"C\", \"B\"], \"Deux gestionnaires doivent être indépendants.\"", "hint": "<p>Représente chaque tâche par un dictionnaire <code>{\"titre\": ..., \"priorite\": ..., \"terminee\": False}<\/code> rangé dans <code>self.taches<\/code>. Écris d'abord une méthode auxiliaire qui retrouve une tâche par son titre : <code>ajouter<\/code> et <code>terminer<\/code> s'en servent toutes les deux. <code>sorted<\/code> est stable : à priorité égale, l'ordre d'ajout est conservé.<\/p>", "stdin": "", "skel": "import json\n\nclass GestionnaireTaches:\n    def __init__(self):\n        self.taches = []\n\n    def _trouver(self, titre):\n        for tache in self.taches:\n            if ...:\n                return ...\n        return ...\n\n    def ajouter(self, titre, priorite=2):\n        if ...:\n            ...\n        if ...:\n            ...\n        ...\n\n    def terminer(self, titre):\n        ...\n        if ...:\n            ...\n        ...\n\n    def a_faire(self):\n        ...\n        return ...\n\n    def progression(self):\n        if ...:\n            return ...\n        ...\n        return ...\n\n    def sauvegarder(self, nom_fichier):\n        with open(nom_fichier, \"w\", encoding=\"utf-8\") as fichier:\n            ...\n\n    def charger(self, nom_fichier):\n        with open(nom_fichier, encoding=\"utf-8\") as fichier:\n            ...\n\ng = GestionnaireTaches()\ng.ajouter(\"Réviser les dictionnaires\", 1)\ng.ajouter(\"Faire les courses\", 3)\ng.ajouter(\"Appeler Camille\")\ng.terminer(\"Faire les courses\")\nprint(g.a_faire())\nprint(g.progression(), \"%\")"}]}, {"id": "projet-analyseur-de-texte", "title": "Projet 2 : un analyseur de texte", "blocks": [{"t": "html", "h": "<p>Les outils qui annoncent « temps de lecture : 4 minutes » ou qui mesurent la lisibilité d'un article reposent sur ce que tu vas écrire.<\/p>"}, {"t": "exo", "id": "projet-analyseur-de-texte-1", "title": "La fonction analyser", "h": "<p>Écris <code>analyser(texte)<\/code> qui renvoie un dictionnaire avec ces clés :<\/p><ul><li><code>nb_phrases<\/code> : le nombre de phrases. Une phrase se termine par <code>.<\/code>, <code>!<\/code> ou <code>?<\/code>. Un morceau vide ne compte pas.<\/li><li><code>nb_mots<\/code> : le nombre de mots. Un mot est une suite de lettres : la ponctuation <code>. , ; : ! ?<\/code> et les apostrophes séparent les mots et n'en font pas partie.<\/li><li><code>mots_uniques<\/code> : le nombre de mots différents, sans tenir compte des majuscules.<\/li><li><code>mot_le_plus_long<\/code> : le mot le plus long, en minuscules ; en cas d'égalité, le premier rencontré.<\/li><li><code>top3<\/code> : la liste des trois mots de plus de 3 lettres les plus fréquents, en minuscules, du plus fréquent au moins fréquent ; en cas d'égalité, le premier rencontré d'abord.<\/li><li><code>minutes_de_lecture<\/code> : le nombre de mots divisé par 200, arrondi à l'entier supérieur, avec un minimum de 1.<\/li><\/ul>", "starter": "def analyser(texte):\n    pass\n\n\nexemple = \"Le code est lu plus souvent qu'il n'est écrit. Écrire du code clair est donc essentiel ! Le code clair se relit vite.\"\nprint(analyser(exemple))", "solution": "import math\n\n\ndef analyser(texte):\n    morceaux = texte.replace(\"!\", \".\").replace(\"?\", \".\").split(\".\")\n    nb_phrases = len([m for m in morceaux if m.strip()])\n\n    propre = texte.lower()\n    for signe in \".,;:!?'’\":\n        propre = propre.replace(signe, \" \")\n    mots = propre.split()\n\n    compteur = {}\n    for mot in mots:\n        if len(mot) > 3:\n            compteur[mot] = compteur.get(mot, 0) + 1\n    classement = sorted(compteur, key=lambda m: compteur[m], reverse=True)\n\n    plus_long = \"\"\n    for mot in mots:\n        if len(mot) > len(plus_long):\n            plus_long = mot\n\n    return {\n        \"nb_phrases\": nb_phrases,\n        \"nb_mots\": len(mots),\n        \"mots_uniques\": len(set(mots)),\n        \"mot_le_plus_long\": plus_long,\n        \"top3\": classement[:3],\n        \"minutes_de_lecture\": max(1, math.ceil(len(mots) / 200)),\n    }\n\n\nexemple = \"Le code est lu plus souvent qu'il n'est écrit. Écrire du code clair est donc essentiel ! Le code clair se relit vite.\"\nprint(analyser(exemple))", "tests": "ex = \"Le code est lu plus souvent qu'il n'est écrit. Écrire du code clair est donc essentiel ! Le code clair se relit vite.\"\nr = analyser(ex)\nassert isinstance(r, dict), \"analyser doit renvoyer un dictionnaire.\"\nattendu = {\"nb_phrases\": 3, \"nb_mots\": 24, \"mots_uniques\": 18, \"mot_le_plus_long\": \"essentiel\", \"top3\": [\"code\", \"clair\", \"plus\"], \"minutes_de_lecture\": 1}\nfor cle, valeur in attendu.items():\n    assert cle in r, \"Il manque la clé %r.\" % cle\n    assert r[cle] == valeur, \"Pour %r, on attend %r. Tu obtiens %r.\" % (cle, valeur, r[cle])\nr2 = analyser(\"Oui ? Non. \" + \"mot \" * 401)\nassert r2[\"nb_phrases\"] == 3, \"« Oui ? Non. » suivi d'un texte sans point final compte 3 phrases.\"\nassert r2[\"minutes_de_lecture\"] == 3, \"403 mots demandent 3 minutes de lecture (arrondi supérieur).\"\nassert r2[\"top3\"] == [], \"Aucun mot de plus de 3 lettres : top3 est une liste vide.\"\nr3 = analyser(\"\")\nassert r3[\"nb_mots\"] == 0 and r3[\"nb_phrases\"] == 0 and r3[\"mot_le_plus_long\"] == \"\" and r3[\"minutes_de_lecture\"] == 1, \"Un texte vide ne doit pas faire planter la fonction : 0 mot, 0 phrase, mot le plus long vide, 1 minute.\"", "hint": "<p>Traite les indicateurs un par un. Phrases : remplace <code>!<\/code> et <code>?<\/code> par <code>.<\/code>, découpe, ne compte pas les morceaux vides. Mots : passe en minuscules, remplace chaque signe de ponctuation et les apostrophes par un espace, puis <code>split()<\/code>. Le reste se calcule à partir de cette liste de mots.<\/p>", "stdin": "", "skel": ""}]}, {"id": "projet-rapport-de-ventes", "title": "Projet 3 : le rapport de ventes", "blocks": [{"t": "html", "h": "<p>Le dernier projet est celui d'un analyste : à partir de deux fichiers bruts, produire un rapport mensuel prêt à être envoyé. Tu peux le réaliser en Python pur ou avec pandas, à ton choix. Les deux approches sont acceptées, seul le résultat est vérifié.<\/p>"}, {"t": "exo", "id": "projet-rapport-de-ventes-1", "title": "Le rapport mensuel", "h": "<p>Écris <code>rapport_mensuel(fichier_ventes, fichier_clients)<\/code> qui renvoie une <strong>liste de dictionnaires<\/strong>, un par mois, dans l'ordre chronologique. Chaque dictionnaire contient :<\/p><ul><li><code>mois<\/code> : le mois au format <code>AAAA-MM<\/code> ;<\/li><li><code>ca<\/code> : le chiffre d'affaires du mois, arrondi à 2 décimales ;<\/li><li><code>nb_ventes<\/code> : le nombre de ventes du mois ;<\/li><li><code>categorie_phare<\/code> : la catégorie au chiffre d'affaires le plus élevé ce mois-là ;<\/li><li><code>meilleur_client<\/code> : le <strong>nom<\/strong> du client qui a le plus dépensé ce mois-là ;<\/li><li><code>evolution<\/code> : la variation du chiffre d'affaires par rapport au mois précédent, en pourcentage arrondi à 1 décimale, ou <code>None<\/code> pour le premier mois.<\/li><\/ul><p>Écris ensuite <code>afficher_rapport(rapport)<\/code> qui affiche une ligne par mois au format <code>2025-02 | 222.90 € | 5 ventes | +56.0 %<\/code>, la dernière partie étant remplacée par un tiret <code>-<\/code> pour le premier mois.<\/p>", "starter": "def rapport_mensuel(fichier_ventes, fichier_clients):\n    pass\n\n\ndef afficher_rapport(rapport):\n    pass\n\n\nafficher_rapport(rapport_mensuel(\"ventes.csv\", \"clients.csv\"))", "solution": "import csv\n\n\ndef rapport_mensuel(fichier_ventes, fichier_clients):\n    with open(fichier_clients, encoding=\"utf-8\") as fichier:\n        noms = {ligne[\"client_id\"]: ligne[\"nom\"] for ligne in csv.DictReader(fichier)}\n\n    par_mois = {}\n    with open(fichier_ventes, encoding=\"utf-8\") as fichier:\n        for v in csv.DictReader(fichier):\n            mois = v[\"date\"][:7]\n            montant = int(v[\"quantite\"]) * float(v[\"prix_unitaire\"])\n            bloc = par_mois.setdefault(mois, {\"ca\": 0, \"nb\": 0, \"categories\": {}, \"clients\": {}})\n            bloc[\"ca\"] += montant\n            bloc[\"nb\"] += 1\n            bloc[\"categories\"][v[\"categorie\"]] = bloc[\"categories\"].get(v[\"categorie\"], 0) + montant\n            bloc[\"clients\"][v[\"client_id\"]] = bloc[\"clients\"].get(v[\"client_id\"], 0) + montant\n\n    rapport = []\n    precedent = None\n    for mois in sorted(par_mois):\n        bloc = par_mois[mois]\n        evolution = None\n        if precedent is not None:\n            evolution = round((bloc[\"ca\"] - precedent) / precedent * 100, 1)\n        rapport.append({\n            \"mois\": mois,\n            \"ca\": round(bloc[\"ca\"], 2),\n            \"nb_ventes\": bloc[\"nb\"],\n            \"categorie_phare\": max(bloc[\"categories\"], key=lambda c: bloc[\"categories\"][c]),\n            \"meilleur_client\": noms[max(bloc[\"clients\"], key=lambda c: bloc[\"clients\"][c])],\n            \"evolution\": evolution,\n        })\n        precedent = bloc[\"ca\"]\n    return rapport\n\n\ndef afficher_rapport(rapport):\n    for ligne in rapport:\n        if ligne[\"evolution\"] is None:\n            evolution = \"-\"\n        else:\n            evolution = f\"{ligne['evolution']:+.1f} %\"\n        print(f\"{ligne['mois']} | {ligne['ca']:.2f} € | {ligne['nb_ventes']} ventes | {evolution}\")\n\n\nafficher_rapport(rapport_mensuel(\"ventes.csv\", \"clients.csv\"))", "tests": "r = rapport_mensuel(\"ventes.csv\", \"clients.csv\")\nassert isinstance(r, list) and len(r) == 3, \"Le rapport doit être une liste de 3 dictionnaires (janvier, février, mars).\"\nattendu = [\n    {\"mois\": \"2025-01\", \"ca\": 142.9, \"nb_ventes\": 6, \"categorie_phare\": \"Informatique\", \"meilleur_client\": \"Diego\", \"evolution\": None},\n    {\"mois\": \"2025-02\", \"ca\": 222.9, \"nb_ventes\": 5, \"categorie_phare\": \"Informatique\", \"meilleur_client\": \"Emma\", \"evolution\": 56.0},\n    {\"mois\": \"2025-03\", \"ca\": 288.8, \"nb_ventes\": 7, \"categorie_phare\": \"Informatique\", \"meilleur_client\": \"Chloé\", \"evolution\": 29.6},\n]\nfor obtenu, att in zip(r, attendu):\n    for cle, valeur in att.items():\n        assert cle in obtenu, \"Il manque la clé %r pour le mois %s.\" % (cle, att[\"mois\"])\n        o = obtenu[cle]\n        if valeur is None:\n            assert o is None, \"Pour %s, %r doit valoir None. Tu obtiens %r.\" % (att[\"mois\"], cle, o)\n        elif isinstance(valeur, float):\n            assert o is not None and abs(float(o) - valeur) < 0.006, \"Pour %s, %r doit valoir %r. Tu obtiens %r.\" % (att[\"mois\"], cle, valeur, o)\n        elif isinstance(valeur, int):\n            assert int(o) == valeur, \"Pour %s, %r doit valoir %r. Tu obtiens %r.\" % (att[\"mois\"], cle, valeur, o)\n        else:\n            assert str(o) == valeur, \"Pour %s, %r doit valoir %r. Tu obtiens %r.\" % (att[\"mois\"], cle, valeur, o)\nsortie = __capture__(afficher_rapport, attendu)\nsortie_attendue(\"2025-01 | 142.90 € | 6 ventes | -\\n2025-02 | 222.90 € | 5 ventes | +56.0 %\\n2025-03 | 288.80 € | 7 ventes | +29.6 %\", sortie)\ns2 = __capture__(afficher_rapport, [{\"mois\": \"2025-01\", \"ca\": 100.0, \"nb_ventes\": 2, \"categorie_phare\": \"X\", \"meilleur_client\": \"Y\", \"evolution\": None}, {\"mois\": \"2025-02\", \"ca\": 90.0, \"nb_ventes\": 1, \"categorie_phare\": \"X\", \"meilleur_client\": \"Y\", \"evolution\": -10.0}])\nsortie_attendue(\"2025-01 | 100.00 € | 2 ventes | -\\n2025-02 | 90.00 € | 1 ventes | -10.0 %\", s2)", "hint": "<p>Regroupe d'abord par mois dans un dictionnaire dont chaque valeur contient le chiffre d'affaires, le nombre de ventes, un dictionnaire de montants par catégorie et un autre par client. Parcours ensuite les mois triés en gardant le chiffre d'affaires du mois précédent pour calculer l'évolution. Dans une f-string, <code>{valeur:+.1f}<\/code> affiche le signe.<\/p>", "stdin": "", "skel": ""}]}, {"id": "projets-sur-ta-machine", "title": "Cinq projets à mener sur ta machine", "blocks": [{"t": "html", "h": "<p>Certaines choses ne se font pas dans une page web : lancer un serveur, parler à une vraie API, planifier une tâche, publier un dépôt. Voici cinq fiches de projet, de difficulté croissante. Pour chacune : crée un dossier, un environnement virtuel, un dépôt Git, et un <code>README.md<\/code> qui explique comment lancer le projet. Les étapes d'installation sont dans la leçon suivante.<\/p><p>Cette page ne peut pas corriger ces projets. Les <strong>critères de réussite<\/strong> de chaque fiche jouent ce rôle : ne coche une ligne que si tu peux la démontrer.<\/p><h3>Fiche 1 · Un outil en ligne de commande<\/h3><p><strong>Objectif<\/strong> : un programme <code>stats.py<\/code> qui reçoit un fichier CSV et une colonne, et affiche le nombre de lignes, le minimum, le maximum et la moyenne.<\/p><pre class=\"static\">import argparse\n\nanalyseur = argparse.ArgumentParser(description=\"Statistiques d'une colonne CSV\")\nanalyseur.add_argument(\"fichier\")\nanalyseur.add_argument(\"--colonne\", required=True)\nanalyseur.add_argument(\"--decimales\", type=int, default=2)\narguments = analyseur.parse_args()\nprint(arguments.fichier, arguments.colonne, arguments.decimales)<\/pre><ul><li><strong>Étapes<\/strong> : lire les arguments avec <code>argparse<\/code> ; charger le fichier ; calculer ; afficher ; gérer les erreurs.<\/li><li><strong>Réussite<\/strong> : <code>python stats.py ventes.csv --colonne quantite<\/code> affiche les quatre valeurs ; <code>python stats.py --help<\/code> affiche une aide lisible ; un fichier absent ou une colonne inconnue donnent un message clair, sans trace d'erreur Python ; trois tests pytest passent.<\/li><li><strong>Pièges<\/strong> : tout écrire dans un seul bloc. Sépare le calcul (une fonction pure, testable) de l'affichage.<\/li><\/ul><h3>Fiche 2 · Un pipeline planifié sur une vraie API<\/h3><p><strong>Objectif<\/strong> : chaque jour, récupérer des données auprès d'une API publique sans clé (météo, données ouvertes), les stocker dans SQLite, et pouvoir relancer sans doublon.<\/p><ul><li><strong>Étapes<\/strong> : choisir l'API et lire sa documentation ; extraire avec <code>requests<\/code>, <code>timeout<\/code> et relances ; valider ; charger avec une clé primaire et <code>INSERT OR REPLACE<\/code> ; journaliser avec <code>logging<\/code> ; planifier (cron sous macOS et Linux, Planificateur de tâches sous Windows).<\/li><li><strong>Réussite<\/strong> : deux exécutions de suite laissent le même nombre de lignes ; un fichier journal raconte chaque exécution, avec les volumes ; couper le réseau produit une erreur propre et un code de sortie différent de zéro ; la configuration (URL, chemin de la base) vient de variables d'environnement.<\/li><li><strong>Pièges<\/strong> : appeler l'API dans les tests. Teste la transformation avec des données d'exemple enregistrées dans un fichier.<\/li><\/ul><h3>Fiche 3 · Une application de données avec Streamlit<\/h3><p><strong>Objectif<\/strong> : une page web où l'on dépose un fichier CSV de ventes et où s'affichent les chiffres clés, un filtre par catégorie et deux graphiques.<\/p><pre class=\"static\">import pandas as pd\nimport streamlit as st\n\nst.title(\"Tableau de bord des ventes\")\nfichier = st.file_uploader(\"Dépose un fichier CSV\", type=\"csv\")\nif fichier is not None:\n    df = pd.read_csv(fichier)\n    df[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\n    categorie = st.selectbox(\"Catégorie\", [\"Toutes\"] + sorted(df[\"categorie\"].unique()))\n    if categorie != \"Toutes\":\n        df = df[df[\"categorie\"] == categorie]\n    st.metric(\"Chiffre d'affaires\", f\"{df['montant'].sum():.2f} €\")\n    st.bar_chart(df.groupby(\"produit\")[\"montant\"].sum())<\/pre><p>Lancement : <code>pip install streamlit pandas<\/code>, puis <code>streamlit run app.py<\/code>.<\/p><ul><li><strong>Réussite<\/strong> : l'application ne plante pas sur un fichier vide ou mal formé et affiche un message compréhensible ; les calculs sont dans un module séparé, couvert par des tests ; une personne qui ne connaît pas le projet le lance en suivant le README.<\/li><li><strong>Pièges<\/strong> : mélanger calculs et interface. L'interface appelle des fonctions, elle ne calcule pas.<\/li><\/ul><h3>Fiche 4 · Une API avec FastAPI<\/h3><p><strong>Objectif<\/strong> : exposer le catalogue et les commandes de la boutique, comme l'API simulée de ce cours, mais pour de vrai.<\/p><pre class=\"static\">from fastapi import FastAPI, HTTPException\n\napp = FastAPI()\nPRODUITS = {1: {\"id\": 1, \"nom\": \"Carnet\", \"prix\": 4.5}}\n\n\n@app.get(\"/produits/{identifiant}\")\ndef lire_produit(identifiant: int):\n    if identifiant not in PRODUITS:\n        raise HTTPException(status_code=404, detail=\"produit introuvable\")\n    return PRODUITS[identifiant]<\/pre><p>Lancement : <code>pip install \"fastapi[standard]\"<\/code>, puis <code>fastapi dev main.py<\/code>. La documentation interactive est générée automatiquement à l'adresse <code>/docs<\/code>.<\/p><ul><li><strong>Étapes<\/strong> : routes de lecture ; stockage dans SQLite ; pagination de <code>/commandes<\/code> ; route <code>POST<\/code> pour créer une commande, avec validation des données ; tests.<\/li><li><strong>Réussite<\/strong> : les codes 200, 404 et 422 sont renvoyés dans les bons cas ; la pagination est testée à ses limites ; ton pipeline de la fiche 2 sait consommer ton API.<\/li><li><strong>Pièges<\/strong> : assembler du SQL avec des f-strings. Toujours des paramètres.<\/li><\/ul><h3>Fiche 5 · Un projet mené avec un agent IA<\/h3><p><strong>Objectif<\/strong> : ajouter une fonctionnalité à l'un des projets précédents en la déléguant à un agent de programmation, en appliquant la méthode du module « Coder avec des agents IA ».<\/p><ul><li><strong>Étapes<\/strong> : écrire le fichier d'instructions du projet ; rédiger la demande avec ses cinq éléments ; écrire les tests toi-même ; demander un plan, le corriger ; laisser l'agent coder sur une branche ; relire la différence avec la grille de relecture ; fusionner.<\/li><li><strong>Réussite<\/strong> : tu peux expliquer chaque ligne ajoutée ; tes tests passent et aucun n'a été modifié par l'agent ; tu as noté au moins deux défauts trouvés à la relecture ; l'historique Git montre des étapes petites et lisibles.<\/li><li><strong>Pièges<\/strong> : valider parce que « les tests passent ». Ouvre le code.<\/li><\/ul>"}]}, {"id": "et-maintenant", "title": "Et maintenant ?", "blocks": [{"t": "html", "h": "<p>Si tu as résolu les exercices de ce cours, tu sais programmer en Python : lire un problème, le découper, écrire le code, le tester et le corriger. La suite se passe sur ta machine, avec de vrais projets.<\/p><h3>Installer Python chez toi<\/h3><ol><li>Télécharge Python sur <a href=\"https://www.python.org/downloads/\">python.org<\/a> et installe-le. Sous Windows, coche la case « Add Python to PATH ».<\/li><li>Installe un éditeur de code. <a href=\"https://code.visualstudio.com/\">Visual Studio Code<\/a>, avec son extension Python, est le plus répandu.<\/li><li>Crée un fichier <code>bonjour.py<\/code>, écris <code>print(\"Bonjour\")<\/code>, puis lance-le depuis le terminal avec la commande <code>python bonjour.py<\/code>.<\/li><\/ol><p>Sur ton ordinateur, <code>input()<\/code> fonctionne en direct : le programme s'arrête et attend ta saisie au clavier.<\/p><h3>Un environnement par projet<\/h3><p>Chaque projet devrait avoir son propre <strong>environnement virtuel<\/strong> : un dossier isolé qui contient ses bibliothèques, pour que les projets ne se gênent pas. Dans le terminal, à la racine du projet :<\/p><pre class=\"static\">python -m venv .venv\n.venv\\Scripts\\activate          (Windows)\nsource .venv/bin/activate       (macOS et Linux)\npip install pandas<\/pre><p><code>pip<\/code> installe les bibliothèques publiées par la communauté. Il en existe des centaines de milliers.<\/p><h3>Les outils du quotidien<\/h3><ul><li><strong>Git<\/strong> et GitHub pour conserver l'historique de ton code et le partager. C'est aussi ta vitrine pour un recruteur.<\/li><li><strong>Jupyter<\/strong> pour explorer des données cellule par cellule, avec les graphiques sous les yeux.<\/li><li><strong>pytest<\/strong> pour écrire des tests automatiques, dans la continuité des <code>assert<\/code> de ce cours.<\/li><li><strong>ruff<\/strong> pour vérifier et formater ton code selon la PEP 8.<\/li><\/ul><h3>Quoi apprendre ensuite, selon ton objectif<\/h3><div class=\"tw\"><table><thead><tr><th>Objectif<\/th><th>Bibliothèques à découvrir<\/th><\/tr><\/thead><tbody><tr><td>Analyse de données<\/td><td>pandas en profondeur, seaborn ou plotly pour les graphiques, SQL avancé, statistiques<\/td><\/tr><tr><td>Ingénierie de données<\/td><td>SQLAlchemy, Polars, DuckDB, un ordonnanceur comme Airflow, dbt, un cloud<\/td><\/tr><tr><td>Applications d'IA<\/td><td>le SDK d'un fournisseur de modèles, les embeddings et une base vectorielle, l'évaluation<\/td><\/tr><tr><td>Automatisation<\/td><td>pathlib, openpyxl pour Excel, requests, schedule<\/td><\/tr><tr><td>Web<\/td><td>FastAPI ou Django, Streamlit pour des applications de données<\/td><\/tr><tr><td>Machine learning<\/td><td>numpy, scikit-learn<\/td><\/tr><\/tbody><\/table><\/div><h3>Comment continuer à progresser<\/h3><ul><li><strong>Construis un projet qui te sert à toi.<\/strong> Suivre ton budget, renommer tes photos, analyser tes séances de sport. La motivation vient de l'utilité.<\/li><li><strong>Lis du code écrit par d'autres<\/strong>, par exemple celui des bibliothèques que tu utilises.<\/li><li><strong>Résous un petit problème régulièrement<\/strong> sur des sites d'exercices comme Exercism, Codewars ou Advent of Code.<\/li><li><strong>Lis la documentation officielle<\/strong> sur <a href=\"https://docs.python.org/fr/3/\">docs.python.org<\/a>. Elle existe en français.<\/li><li><strong>Reviens ici<\/strong> refaire les exercices des modules « Penser comme un programmeur » et « Algorithmes classiques » sans regarder tes anciennes solutions.<\/li><\/ul>"}]}, {"id": "aide-memoire", "title": "Aide-mémoire", "blocks": [{"t": "html", "h": "<p>Toute la syntaxe du cours sur une page. Modifie les exemples pour vérifier ce dont tu doutes.<\/p><h3>Types et conversions<\/h3>"}, {"t": "code", "c": "entier, flottant, texte, booleen, rien = 42, 3.14, \"abc\", True, None\nprint(type(entier), type(flottant), type(texte), type(booleen), type(rien))\nprint(int(\"42\"), float(\"3.5\"), str(42), bool(0), list(\"abc\"))\nprint(7 / 2, 7 // 2, 7 % 2, 2 ** 3)", "err": false}, {"t": "html", "h": "<h3>Conditions et boucles<\/h3>"}, {"t": "code", "c": "n = 7\nif n > 10:\n    print(\"grand\")\nelif n > 5:\n    print(\"moyen\")\nelse:\n    print(\"petit\")\n\nfor i in range(3):\n    print(i, end=\" \")\nprint()\n\nwhile n > 0:\n    n -= 3\nprint(n)\n\nstatut = \"pair\" if n % 2 == 0 else \"impair\"\nprint(statut)", "err": false}, {"t": "html", "h": "<h3>Textes<\/h3>"}, {"t": "code", "c": "s = \"  Bonjour le Monde  \"\nprint(s.strip().lower(), s.strip().upper(), len(s.strip()))\nprint(s.strip()[0], s.strip()[-1], s.strip()[0:7], s.strip()[::-1])\nprint(s.split(), \"-\".join([\"a\", \"b\"]), s.replace(\"Monde\", \"Python\").strip())\nprint(\"jour\" in s, s.strip().startswith(\"Bon\"), s.count(\"o\"))\nprint(f\"{3.14159:.2f} | {42:>6} | {'abc':<6}| {1234567:,}\")", "err": false}, {"t": "html", "h": "<h3>Listes, tuples, ensembles<\/h3>"}, {"t": "code", "c": "l = [3, 1, 2]\nl.append(5)\nl.insert(0, 9)\nl.remove(1)\ndernier = l.pop()\nprint(l, dernier, len(l), sum(l), min(l), max(l), sorted(l), 3 in l)\nprint([x * 2 for x in l if x > 2])\nfor position, valeur in enumerate(l):\n    print(position, valeur, end=\" | \")\nprint()\na, b = (1, 2)\nprint(a, b, list(zip([1, 2], [\"x\", \"y\"])))\nprint({1, 2} | {2, 3}, {1, 2} & {2, 3}, {1, 2} - {2, 3})", "err": false}, {"t": "html", "h": "<h3>Dictionnaires<\/h3>"}, {"t": "code", "c": "d = {\"a\": 1, \"b\": 2}\nd[\"c\"] = 3\ndel d[\"a\"]\nprint(d, d.get(\"z\", 0), \"b\" in d, list(d.keys()), list(d.values()))\nfor cle, valeur in d.items():\n    print(cle, valeur)\ncompteur = {}\nfor lettre in \"abracadabra\":\n    compteur[lettre] = compteur.get(lettre, 0) + 1\nprint(compteur)\nprint(sorted(compteur.items(), key=lambda paire: paire[1], reverse=True)[:2])", "err": false}, {"t": "html", "h": "<h3>Fonctions, erreurs, fichiers<\/h3>"}, {"t": "code", "c": "def diviser(a, b=1):\n    \"\"\"Renvoie a / b, ou None si b vaut 0.\"\"\"\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None\n\nprint(diviser(6, 3), diviser(6), diviser(6, 0))\n\nwith open(\"memo.txt\", \"w\", encoding=\"utf-8\") as fichier:\n    fichier.write(\"ligne 1\\nligne 2\\n\")\nwith open(\"memo.txt\", encoding=\"utf-8\") as fichier:\n    for ligne in fichier:\n        print(ligne.strip())", "err": false}, {"t": "html", "h": "<h3>Classes<\/h3>"}, {"t": "code", "c": "from dataclasses import dataclass\n\n\nclass Compte:\n    def __init__(self, titulaire, solde=0):\n        self.titulaire = titulaire\n        self.solde = solde\n\n    def deposer(self, montant):\n        self.solde += montant\n\n    def __str__(self):\n        return f\"{self.titulaire} : {self.solde} €\"\n\n\n@dataclass\nclass Point:\n    x: float\n    y: float\n\n\nc = Compte(\"Ada\")\nc.deposer(50)\nprint(c, Point(1, 2))", "err": false}, {"t": "html", "h": "<h3>SQL depuis Python<\/h3>"}, {"t": "code", "c": "from base_boutique import ouvrir\n\nconn = ouvrir()\nrequete = \"SELECT categorie, ROUND(SUM(quantite * prix_unitaire), 2) FROM ventes WHERE quantite >= ? GROUP BY categorie\"\nprint(conn.execute(requete, (2,)).fetchall())", "err": false}, {"t": "html", "h": "<h3>pandas<\/h3>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\ndf[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\nprint(df.shape, list(df.columns))\nprint(df[df[\"montant\"] > 60][[\"produit\", \"montant\"]])\nprint(df.groupby(\"categorie\")[\"montant\"].agg([\"sum\", \"mean\", \"count\"]).round(2))\nprint(df.sort_values(\"montant\", ascending=False).head(2)[[\"date\", \"produit\", \"montant\"]])", "err": false}]}]}];
const HARNESS="import sys, io, os, json, base64, builtins, traceback, warnings, importlib\n\nwarnings.filterwarnings('ignore', category=DeprecationWarning)\nwarnings.filterwarnings('ignore', message='.*non-interactive.*')\nwarnings.filterwarnings('ignore', message='.*non-GUI backend.*')\nos.environ.setdefault('MPLBACKEND', 'Agg')\nsys.dont_write_bytecode = True\n\n_PZ_FILES = {}\n_PZ_MAX = 100000\n\n\nclass _PzOut(io.StringIO):\n    def write(self, s):\n        if self.tell() > _PZ_MAX:\n            raise RuntimeError(\"Trop de texte affiché : ta boucle ne s'arrête probablement jamais.\")\n        return super().write(s)\n\n\ndef _pz_reset_files(extra=None):\n    cwd = os.getcwd()\n    for name in os.listdir(cwd):\n        if name.endswith(('.db', '.sqlite')):\n            os.remove(os.path.join(cwd, name))\n    for name, content in list(_PZ_FILES.items()) + list((extra or {}).items()):\n        with open(name, 'w', encoding='utf-8') as f:\n            f.write(content)\n    for name, mod in list(sys.modules.items()):\n        f = getattr(mod, '__file__', None)\n        if f and os.path.dirname(os.path.abspath(f)) == cwd:\n            del sys.modules[name]\n    lg = sys.modules.get('logging')\n    if lg is not None:\n        for logger in [lg.getLogger()] + [l for l in lg.root.manager.loggerDict.values() if isinstance(l, lg.Logger)]:\n            for h in logger.handlers[:]:\n                logger.removeHandler(h)\n            logger.setLevel(lg.NOTSET)\n            logger.disabled = False\n            logger.propagate = True\n        lg.getLogger().setLevel(lg.WARNING)\n    if cwd not in sys.path:\n        sys.path.insert(0, cwd)\n    importlib.invalidate_caches()\n\n\ndef _pz_figs():\n    plt = sys.modules.get('matplotlib.pyplot')\n    imgs = []\n    if plt is None:\n        return imgs\n    for n in plt.get_fignums()[:4]:\n        b = io.BytesIO()\n        plt.figure(n).savefig(b, format='png', dpi=110, bbox_inches='tight', facecolor='white')\n        imgs.append(base64.b64encode(b.getvalue()).decode())\n    return imgs\n\n\ndef _pz_err(e, code):\n    name = type(e).__name__\n    src = code.split('\\n')\n    if isinstance(e, SyntaxError) and e.filename == 'ton_code.py':\n        return {'type': name, 'msg': e.msg, 'line': e.lineno, 'text': (e.text or '').rstrip('\\n')}\n    frames = [f for f in traceback.extract_tb(e.__traceback__) if f.filename == 'ton_code.py']\n    line = frames[-1].lineno if frames else None\n    text = src[line - 1] if line and 0 < line <= len(src) else ''\n    msg = str(e)\n    if isinstance(e, KeyError):\n        msg = 'clé introuvable : ' + msg\n    return {'type': name, 'msg': msg, 'line': line, 'text': text}\n\n\ndef _pz_exec(code, stdin, files=None):\n    ns = {'__name__': '__main__'}\n    out = _PzOut()\n    it = iter(stdin.split('\\n')) if stdin else iter(())\n\n    def _input(prompt=''):\n        out.write(str(prompt))\n        try:\n            v = next(it)\n        except StopIteration:\n            raise EOFError(\"input() attend une saisie, mais la zone « Saisies » ne contient plus de ligne.\") from None\n        out.write(v + '\\n')\n        return v\n\n    old = (sys.stdout, sys.stderr, builtins.input)\n    sys.stdout = out\n    sys.stderr = out\n    builtins.input = _input\n    err = None\n    try:\n        _pz_reset_files(files)\n        exec(compile(code, 'ton_code.py', 'exec'), ns)\n    except SystemExit:\n        pass\n    except BaseException as e:\n        err = _pz_err(e, code)\n    finally:\n        sys.stdout, sys.stderr, builtins.input = old\n    return ns, out.getvalue(), err\n\n\ndef _pz_norm(txt):\n    lines = [l.rstrip() for l in str(txt).replace('\\r', '').split('\\n')]\n    while lines and lines[-1] == '':\n        lines.pop()\n    while lines and lines[0] == '':\n        lines.pop(0)\n    return lines\n\n\ndef _pz_run(code, tests=None, stdin='', files_json=None):\n    files = json.loads(files_json) if files_json else {}\n    plt = sys.modules.get('matplotlib.pyplot')\n    if plt is not None:\n        plt.close('all')\n    ns, out, err = _pz_exec(code, stdin, files)\n    res = {'out': out, 'err': err, 'passed': None, 'msg': None, 'imgs': []}\n    try:\n        res['imgs'] = _pz_figs()\n    except Exception:\n        pass\n    if tests is None:\n        return json.dumps(res)\n    if err is not None:\n        res['passed'] = False\n        res['msg'] = \"Ton programme s'arrête sur une erreur. Corrige-la d'abord, puis vérifie à nouveau.\"\n        return json.dumps(res)\n\n    def __run__(saisies=''):\n        ns2, out2, err2 = _pz_exec(code, saisies, files)\n        if err2:\n            raise AssertionError(\"Avec les saisies %r, ton programme plante : %s : %s\"\n                                 % (saisies.split('\\n'), err2['type'], err2['msg']))\n        return out2\n\n    def sortie_attendue(attendu, sortie=None):\n        got = _pz_norm(out if sortie is None else sortie)\n        exp = _pz_norm(attendu)\n        if got != exp:\n            raise AssertionError(\"Sortie attendue :\\n%s\\n\\nTa sortie :\\n%s\"\n                                 % ('\\n'.join(exp), '\\n'.join(got) if got else '(rien)'))\n\n    def __capture__(fn, *a, **k):\n        b = io.StringIO()\n        o = sys.stdout\n        sys.stdout = b\n        try:\n            fn(*a, **k)\n        finally:\n            sys.stdout = o\n        return b.getvalue()\n\n    def rejoue(avant, apres, saisies=''):\n        if avant not in code:\n            raise AssertionError(\"Garde la ligne « %s » telle quelle dans ton code : elle sert à tester ton programme avec d'autres valeurs.\" % avant)\n        ns3, out3, err3 = _pz_exec(code.replace(avant, apres, 1), saisies, files)\n        if err3:\n            raise AssertionError(\"Avec « %s », ton programme plante : %s : %s\" % (apres, err3['type'], err3['msg']))\n        ns3['__out__'] = out3\n        ns3['__lines__'] = _pz_norm(out3)\n        return ns3\n\n    ns.update(lignes=_pz_norm, rejoue=rejoue, __files__=files, __out__=out, __code__=code, __run__=__run__, __lines__=_pz_norm(out),\n              sortie_attendue=sortie_attendue, __capture__=__capture__)\n    o = sys.stdout\n    sys.stdout = io.StringIO()\n    msg = None\n    try:\n        exec(tests, ns)\n    except AssertionError as e:\n        msg = str(e) or \"Le résultat n'est pas encore celui attendu. Relis l'énoncé.\"\n    except NameError as e:\n        msg = \"Je ne trouve pas le nom demandé (%s). Vérifie qu'il est écrit exactement comme dans l'énoncé.\" % e\n    except RecursionError:\n        msg = \"Ta fonction s'appelle elle-même sans jamais s'arrêter (RecursionError).\"\n    except Exception as e:\n        msg = \"En testant ton code : %s : %s\" % (type(e).__name__, e)\n    finally:\n        sys.stdout = o\n    res['passed'] = msg is None\n    res['msg'] = msg\n    return json.dumps(res)\n";

connect(\":memory:\")\n    conn.execute(\"CREATE TABLE clients (client_id TEXT PRIMARY KEY, nom TEXT, ville TEXT)\")\n    conn.execute(\n        \"CREATE TABLE ventes (date TEXT, client_id TEXT, produit TEXT, categorie TEXT, \"\n        \"quantite INTEGER, prix_unitaire REAL)\"\n    )\n    with open(\"clients.csv\", encoding=\"utf-8\") as f:\n        conn.executemany(\"INSERT INTO clients VALUES (:client_id, :nom, :ville)\", list(csv.DictReader(f)))\n    with open(\"ventes.csv\", encoding=\"utf-8\") as f:\n        conn.executemany(\n            \"INSERT INTO ventes VALUES (:date, :client_id, :produit, :categorie, :quantite, :prix_unitaire)\",\n            list(csv.DictReader(f)),\n        )\n    conn.commit()\n    return conn\n", "api_boutique.py": "\"\"\"Fausse API de la boutique, pour s'entraîner sans réseau.\n\nElle imite la bibliothèque requests : get(url, params=None, headers=None) renvoie\nune réponse dotée de .status_code, .ok, .text et .json().\n\"\"\"\nimport json as _json\nimport math as _math\n\nBASE = \"https://api.boutique.test\"\nNB_APPELS = 0\n_ECHECS_RESTANTS = {\"/instable\": 2}\n\nPRODUITS = [\n    {\"id\": 1, \"nom\": \"Carnet\", \"categorie\": \"Papeterie\", \"prix\": 4.5},\n    {\"id\": 2, \"nom\": \"Stylo\", \"categorie\": \"Papeterie\", \"prix\": 1.2},\n    {\"id\": 3, \"nom\": \"Lampe\", \"categorie\": \"Maison\", \"prix\": 29.9},\n    {\"id\": 4, \"nom\": \"Tasse\", \"categorie\": \"Maison\", \"prix\": 8.0},\n    {\"id\": 5, \"nom\": \"Clavier\", \"categorie\": \"Informatique\", \"prix\": 49.0},\n    {\"id\": 6, \"nom\": \"Souris\", \"categorie\": \"Informatique\", \"prix\": 19.5},\n]\n_LIGNES = [\n    (\"2025-01-06\", \"C01\", 1, 3), (\"2025-01-06\", \"C02\", 2, 10), (\"2025-01-09\", \"C03\", 3, 1),\n    (\"2025-01-14\", \"C01\", 4, 2), (\"2025-01-20\", \"C04\", 5, 1), (\"2025-01-27\", \"C02\", 1, 5),\n    (\"2025-02-03\", \"C05\", 6, 2), (\"2025-02-03\", \"C03\", 2, 20), (\"2025-02-11\", \"C01\", 3, 1),\n    (\"2025-02-17\", \"C04\", 4, 4), (\"2025-02-24\", \"C05\", 5, 2), (\"2025-03-03\", \"C02\", 6, 1),\n    (\"2025-03-10\", \"C03\", 1, 8), (\"2025-03-12\", \"C01\", 2, 15), (\"2025-03-18\", \"C04\", 3, 2),\n    (\"2025-03-25\", \"C05\", 4, 6), (\"2025-03-28\", \"C02\", 5, 1), (\"2025-03-31\", \"C03\", 6, 3),\n]\nCOMMANDES = [\n    {\"id\": 100 + i, \"date\": d, \"client_id\": c, \"produit_id\": p, \"quantite\": q}\n    for i, (d, c, p, q) in enumerate(_LIGNES, start=1)\n]\n\n\nclass Reponse:\n    def __init__(self, status_code, donnees):\n        self.status_code = status_code\n        self.ok = 200 <= status_code < 300\n        self.text = _json.dumps(donnees, ensure_ascii=False)\n\n    def json(self):\n        return _json.loads(self.text)\n\n\ndef get(url, params=None, headers=None):\n    global NB_APPELS\n    NB_APPELS += 1\n    params = params or {}\n    headers = headers or {}\n    chemin = url.replace(BASE, \"\")\n    if not chemin.startswith(\"/\"):\n        chemin = \"/\" + chemin\n    chemin = chemin.rstrip(\"/\") or \"/\"\n\n    if chemin == \"/produits\":\n        resultat = PRODUITS\n        if \"categorie\" in params:\n            resultat = [p for p in PRODUITS if p[\"categorie\"] == params[\"categorie\"]]\n        return Reponse(200, resultat)\n    if chemin.startswith(\"/produits/\"):\n        identifiant = chemin.split(\"/\")[-1]\n        for p in PRODUITS:\n            if str(p[\"id\"]) == identifiant:\n                return Reponse(200, p)\n        return Reponse(404, {\"erreur\": \"produit introuvable\"})\n    if chemin == \"/commandes\":\n        try:\n            page = int(params.get(\"page\", 1))\n            par_page = int(params.get(\"par_page\", 5))\n        except ValueError:\n            return Reponse(400, {\"erreur\": \"page et par_page doivent être des entiers\"})\n        if page < 1 or not 1 <= par_page <= 10:\n            return Reponse(400, {\"erreur\": \"page >= 1 et par_page entre 1 et 10\"})\n        debut = (page - 1) * par_page\n        return Reponse(200, {\n            \"page\": page,\n            \"pages\": _math.ceil(len(COMMANDES) / par_page),\n            \"total\": len(COMMANDES),\n            \"resultats\": COMMANDES[debut:debut + par_page],\n        })\n    if chemin == \"/instable\":\n        if _ECHECS_RESTANTS[chemin] > 0:\n            _ECHECS_RESTANTS[chemin] -= 1\n            return Reponse(503, {\"erreur\": \"service momentanément indisponible\"})\n        return Reponse(200, {\"statut\": \"ok\"})\n    if chemin == \"/toujours-en-panne\":\n        return Reponse(503, {\"erreur\": \"service indisponible\"})\n    if chemin == \"/prive/stats\":\n        if headers.get(\"Authorization\") != \"Bearer cle-secrete-123\":\n            return Reponse(401, {\"erreur\": \"authentification requise\"})\n        return Reponse(200, {\"ca_total\": 654.6, \"nb_commandes\": 18})\n    return Reponse(404, {\"erreur\": \"chemin inconnu\"})\n", "faux_llm.py": "\"\"\"Faux modèle de langage, pour s'entraîner sans clé ni réseau.\n\ngenerer(prompt, systeme=\"\", temperature=0.0) renvoie un texte, comme le ferait une API de LLM.\nComme un vrai modèle, il ne respecte pas toujours le format demandé à la lettre.\ndiscuter(messages, outils) simule un modèle capable de demander l'appel d'un outil.\n\"\"\"\nimport json as _json\nimport re as _re\n\nNB_APPELS = 0\nTOKENS_ENTREE = 0\nTOKENS_SORTIE = 0\n\n_POSITIFS = [\"super\", \"parfait\", \"excellent\", \"ravi\", \"rapide\", \"génial\", \"recommande\", \"top\", \"adore\", \"satisfait\", \"merci\"]\n_NEGATIFS = [\"déçu\", \"décevant\", \"cassé\", \"lent\", \"retard\", \"nul\", \"mauvais\", \"jamais\", \"remboursement\", \"abîmé\", \"pire\"]\n_PRODUITS = [\"carnet\", \"stylo\", \"lampe\", \"tasse\", \"clavier\", \"souris\"]\n\n\ndef compter_tokens(texte):\n    \"\"\"Estimation grossière : un token vaut environ 4 caractères.\"\"\"\n    return max(1, len(texte) // 4)\n\n\ndef _sentiment(texte):\n    mots = _re.findall(r\"\\w+\", texte.lower())\n    positifs = sum(any(m.startswith(racine) for m in mots) for racine in _POSITIFS)\n    negatifs = sum(any(m.startswith(racine) for m in mots) for racine in _NEGATIFS)\n    if positifs > negatifs:\n        return \"positif\"\n    if negatifs > positifs:\n        return \"négatif\"\n    return \"neutre\"\n\n\ndef generer(prompt, systeme=\"\", temperature=0.0):\n    global NB_APPELS, TOKENS_ENTREE, TOKENS_SORTIE\n    NB_APPELS += 1\n    TOKENS_ENTREE += compter_tokens(systeme + prompt)\n    consigne = (systeme + \"\\n\" + prompt).lower()\n    texte = prompt\n    for marqueur in (\"Avis :\", \"Texte :\", \"Message :\"):\n        if marqueur in prompt:\n            texte = prompt.split(marqueur)[-1].strip()\n    veut_json = \"json\" in consigne\n\n    if \"sentiment\" in consigne:\n        label = _sentiment(texte)\n        if veut_json:\n            reponse = _json.dumps({\"sentiment\": label}, ensure_ascii=False)\n            if NB_APPELS % 3 == 0:\n                reponse = \"Voici le résultat demandé :\\n```json\\n\" + reponse + \"\\n```\"\n        else:\n            reponse = \"Ce message exprime un sentiment plutôt \" + label + \".\"\n    elif \"extrai\" in consigne and veut_json:\n        montant = _re.search(r\"(\\d+(?:[.,]\\d+)?)\\s*(?:€|euros)\", texte)\n        date = _re.search(r\"\\d{4}-\\d{2}-\\d{2}\", texte)\n        donnees = {\n            \"montant\": montant.group(1) if montant else None,\n            \"date\": date.group(0) if date else None,\n        }\n        reponse = _json.dumps(donnees, ensure_ascii=False)\n    elif \"résum\" in consigne:\n        reponse = \"En résumé : \" + _re.split(r\"(?<=[.!?])\\s\", texte.strip())[0]\n    else:\n        reponse = \"Je suis un modèle simulé. Je sais analyser un sentiment, extraire un montant et une date, ou résumer un texte.\"\n    TOKENS_SORTIE += compter_tokens(reponse)\n    return reponse\n\n\ndef discuter(messages, outils=None):\n    \"\"\"Renvoie {\"type\": \"appel_outil\", \"outil\": ..., \"arguments\": {...}} ou {\"type\": \"texte\", \"contenu\": ...}.\"\"\"\n    global NB_APPELS\n    NB_APPELS += 1\n    outils = list(outils or [])\n    question = \"\"\n    for m in messages:\n        if m[\"role\"] == \"user\":\n            question = m[\"contenu\"].lower()\n    resultats = [m for m in messages if m[\"role\"] == \"outil\"]\n    produit = next((p for p in _PRODUITS if p in question), None)\n    besoins = []\n    if produit:\n        for nom in (\"stock\", \"prix\"):\n            if nom in question and nom in outils:\n                besoins.append(nom)\n    if len(resultats) < len(besoins):\n        return {\"type\": \"appel_outil\", \"outil\": besoins[len(resultats)], \"arguments\": {\"produit\": produit}}\n    if besoins:\n        morceaux = [besoins[i] + \" = \" + str(resultats[i][\"contenu\"]) for i in range(len(besoins))]\n        return {\"type\": \"texte\", \"contenu\": \"Pour le produit \" + produit + \" : \" + \", \".join(morceaux) + \".\"}\n    return {\"type\": \"texte\", \"contenu\": \"Je n'ai pas d'outil pour répondre à cette question.\"}\n", "commandes.csv": "id,date,client_id,region,canal,categorie,produit,quantite,prix_unitaire,montant,statut\n1001,2025-01-06,C04,Nord,En ligne,Informatique,Souris,1,19.50,19.50,annulee\n1002,2025-01-07,C02,Ouest,En ligne,Maison,Lampe,1,29.90,29.90,livree\n1003,2025-01-15,C03,Sud,En ligne,Informatique,Clavier,1,49.00,49.00,livree\n1004,2025-01-16,C05,Ouest,Magasin,Maison,Lampe,1,29.90,29.90,livree\n1005,2025-01-17,C03,Sud,Magasin,Informatique,Souris,1,19.50,19.50,livree\n1006,2025-01-18,C03,Sud,Magasin,Papeterie,Stylo,5,1.20,6.00,annulee\n1007,2025-01-19,C04,Nord,En ligne,Papeterie,Agenda,2,12.00,24.00,livree\n1008,2025-01-21,C03,Sud,En ligne,Informatique,Écran,1,189.00,189.00,livree\n1009,2025-01-22,C05,Ouest,Magasin,Papeterie,Agenda,8,12.00,96.00,livree\n1010,2025-01-24,C04,Nord,Magasin,Papeterie,Stylo,5,1.20,6.00,livree\n1011,2025-01-25,C03,Sud,En ligne,Papeterie,Carnet,8,4.50,36.00,livree\n1012,2025-01-27,C01,Sud,Magasin,Papeterie,Stylo,2,1.20,2.40,a /* ---------- moteur Python (Pyodide) ---------- */
function engineCore(pyodide, harness, files) {
  pyodide.runPython(harness);
  pyodide.globals.get("_PZ_FILES").update(pyodide.toPy(files));
  const runFn = pyodide.globals.get("_pz_run");
  return async function (job, notify) {
    const all = job.code + "\n" + (job.tests || "") + "\n" + Object.values(job.files || {}).join("\n");
    if (/\bimport\b/.test(all)) {
      if (/pandas|numpy|matplotlib|sqlite3/.test(all)) notify("pkg");
      try { await pyodide.loadPackagesFromImports(all); } catch (e) {}
    }
    notify("start");
    return JSON.parse(runFn(job.code, job.tests == null ? undefined : job.tests, job.stdin || "", JSON.stringify(job.files || {})));
  };
}
function workerMain(PYO, harness, files) {
  const runP = (async () => engineCore(await loadPyodide({ indexURL: PYO }), harness, files))();
  runP.then(() => postMessage({ t: "ready" }), e => postMessage({ t: "fail", m: String(e) }));
  onmessage = async ev => {
    const job = ev.data;
    try {
      const run = await runP;
      const res = await run(job, s => postMessage({ t: s, id: job.id }));
      postMessage({ t: "done", id: job.id, res });
    } catch (e) {
      postMessage({ t: "done", id: job.id, res: { out: "", err: { type: "Erreur interne", msg: String(e) }, passed: job.tests == null ? null : false, msg: null } });
    }
  };
}
const STATUS = { load: "Python se charge…", ready: "Python prêt", run: "Exécution…", pkg: "Chargement des bibliothèques…", fail: "Python indisponible" };
function setStatus(s) { const e = $("#status"); e.dataset.s = s; e.firstElementChild.textContent = STATUS[s]; }

const engine = {
  mode: null, worker: null, up: false, failed: false, busy: false, current: null, seq: 0, mainRun: null,
  newReady() { this.up = false; this.ready = new Promise(r => { this._ok = r; }); setStatus("load"); },
  init() { this.newReady(); try { this.startWorker(); } catch (e) { this.startMain(); } },
  isUp() { this.up = true; if (!this.busy) setStatus("ready"); this._ok(true); },
  startWorker() {
    const src = `importScripts(${JSON.stringify(PYO + "pyodide.js")});\n${engineCore.toString()}\n(${workerMain.toString()})(${JSON.stringify(PYO)},${JSON.stringify(HARNESS)},${JSON.stringify(FILES)});`;
    const w = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    this.worker = w;
    let ok = false;
    const fallback = () => { if (ok || this.worker !== w) return; w.terminate(); this.worker = null; this.startMain(); };
    w.onmessage = ev => {
      const m = ev.data;
      if (m.t === "ready") { ok = true; this.mode = "worker"; this.isUp(); }
      else if (m.t === "fail") fallback();
      else this.onMsg(m);
    };
    w.onerror = ev => { ev.preventDefault && ev.preventDefault(); fallback(); };
  },
  async startMain() {
    try {
      await new Promise((res, rej) => { const s = el("script", { src: PYO + "pyodide.js" }); s.onload = res; s.onerror = rej; document.head.append(s); });
      const py = await loadPyodide({ indexURL: PYO });
      this.mainRun = engineCore(py, HARNESS, FILES);
      this.mode = "main"; this.isUp();
    } catch (e) { this.failed = true; setStatus("fail"); this._ok(false); }
  },
  onMsg(m) {
    const c = this.current;
    if (!c || m.id !== c.id) return;
    if (m.t === "pkg") setStatus("pkg");
    else if (m.t === "start") { setStatus("run"); c.timer = setTimeout(() => this.kill("timeout"), c.limit); }
    else if (m.t === "done") { clearTimeout(c.timer); this.current = null; c.resolve(m.res); }
  },
  kill(why) {
    const c = this.current;
    if (!c) return;
    clearTimeout(c.timer); this.current = null;
    this.worker.terminate(); this.newReady(); this.startWorker();
    c.resolve({ out: "", passed: c.job.tests == null ? null : false, msg: null, err: why === "timeout"
      ? { type: "Temps dépassé", msg: "Ton programme tourne depuis trop longtemps et a été arrêté. Une boucle while dont la condition ne devient jamais fausse ?" }
      : { type: "Arrêt", msg: "Tu as arrêté le programme." } });
  },
  async run(job) {
    this.busy = true;
    try {
      const ok = await this.ready;
      if (!ok) return { out: "", passed: job.tests == null ? null : false, msg: null, err: { type: "Python indisponible", msg: "Python n'a pas pu se charger. Vérifie ta connexion internet, puis recharge la page." } };
      if (this.mode === "main") {
        setStatus("run");
        await new Promise(r => setTimeout(r, 30));
        try { return await this.mainRun(job, s => { if (s === "pkg") setStatus("pkg"); }); }
        catch (e) { return { out: "", passed: job.tests == null ? null : false, msg: null, err: { type: "Erreur interne", msg: String(e) } }; }
      }
      return await new Promise(resolve => {
        const id = ++this.seq;
        this.current = { id, resolve, job, timer: null, limit: /pandas|numpy|matplotlib/.test(job.code + Object.values(job.files || {}).join("")) ? 60000 : 10000 };
        this.worker.postMessage({ id, code: job.code, tests: job.tests == null ? null : job.tests, stdin: job.stdin || "", files: job.files || {} });
      });
    } finally { this.busy = false; if (this.up) setStatus("ready"); }
  },
};

        } else await sync.signIn(email.value.trim(), pass.value);
      } catch (e) { msg.className = "msg ko"; msg.textContent = sync.text(e); }
    };
    const form = el("form", { onsubmit: ev => { ev.preventDefault(); go(false); } },
      el("label", { for: "acct-email" }, "E-mail"), email,
      el("label", { for: "acct-pass" }, "Mot de passe"), pass,
      el("div", { class: "row" }, el("button", { class: "btn", type: "submit" }, "Se connecter"), el("button", { class: "btn", type: "button", onclick: () => go(true) }, "Créer un compte")));
    box.append(el("div", { class: "prose" }, el("p", null, "Un compte permet de retrouver ta progression sur tous tes appareils. La progression déjà enregistrée dans ce navigateur est conservée : elle est fusionnée avec celle du compte à la connexion.")), form, msg);
  };
  sync.onChange = draw;
  viewCleanup = () => { sync.onChange = null; };
  draw();
}
function renderLesson(l) {
  const col = el("article", { class: "col lesson" });
  main.replaceChildren(col);
  col.append(el("p", { class: "crumb" }, ">>> " + l.mod.num + " · " + l.mod.title), el("h1", null, l.title));
  let n = 0;
  l.blocks.forEach(b => {
    if (b.t === "html") col.append(el("div", { class: "prose", html: b.h }));
    else if (b.t === "code") col.append(el("div", { class: "runner" }, consoleBlock(b.c, { name: "exemple modifiable", stdin: b.stdin, files: b.files })));
    else if (b.t === "exo") col.append(exoBlock(b, ++n));
    else if (b.t === "check") col.append(checkBlock(b));
    else col.append(quizBlock(b, ++n));
  });
  const prev = LESSONS[l.idx - 1], next = LESSONS[l.idx + 1], pg = el("nav", { class: "pager", "aria-label": "Leçon précédente et suivante" });
  if (prev) pg.append(el("a", { href: "#" + prev.id }, el("small", null, "← Leçon précédente"), el("span", null, prev.title)));
  if (next) pg.append(el("a", { class: "nx", href: "#" + next.id }, el("small", null, "Leçon suivante →"), el("span", null, next.title)));
  col.append(pg);
  store.d.last = l.id; store.d.lt = Date.now(); store.d.seen[l.id] = 1; store.save();
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  editors = [];
  if (viewCleanup) { viewCleanup(); viewCleanup = null; }
  document.body.classList.remove("nav"); $("#burger").setAttribute("aria-expanded", "false");
  if (BY_ID[h]) { current = h; renderLesson(BY_ID[h]); }
  else if (h === "bac-a-sable") { current = h; renderSandbox(); }
  else if (h === "revision") { current = h; renderReview(); }
  else if (h === "entretien") { current = h; renderInterview(); }
  else if (h === "glossaire") { current = h; renderGloss(); }
  else if (h === "compte") { current = h; renderAccount(); }
  else if (h === "positionnement") { current = h; renderDiag(); }
  else if (h.startsWith("bilan-") && MODS[h.slice(6)] && bilanPool(MODS[h.slice(6)]).length >= 3) { current = h; renderBilan(MODS[h.slice(6)]); }
  else { current = "accueil"; renderHome(); }
  renderSide(); renderGauge();
  editors.forEach(c => c.refresh());
  window.scrollTo(0, 0);
  const on = $("#side a.on[aria-current]"); if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest" });
}
$("#burger").addEventListener("click", () => { const o = document.body.classList.toggle("nav"); $("#burger").setAttribute("aria-expanded", String(o)); });
$("#scrim").addEventListener("click", () => { document.body.classList.remove("nav"); $("#burger").setAttribute("aria-expanded", "false"); });
window.addEventListener("hashchange", route);
route();
engine.init();
sync.init();
</script>
