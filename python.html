s textes (clés <code>id<\/code>, <code>date<\/code>, <code>produit<\/code>, <code>categorie<\/code>, <code>quantite<\/code>, <code>prix_unitaire<\/code>) et renvoie une nouvelle liste de dictionnaires où : <code>id<\/code> et <code>quantite<\/code> sont des entiers, <code>prix_unitaire<\/code> est un float, <code>produit<\/code> et <code>categorie<\/code> sont sans espaces autour et avec une majuscule initiale, et une clé <code>montant<\/code> (quantité fois prix, arrondi à 2 décimales) est ajoutée. La liste reçue ne doit pas être modifiée. On suppose ici que les lignes sont valides.<\/p>", "starter": "def transformer(lignes):\n    pass\n\n\nexemple = [{\"id\": \"2\", \"date\": \"2025-04-02\", \"produit\": \" stylo \", \"categorie\": \"papeterie\", \"quantite\": \"10\", \"prix_unitaire\": \"1.20\"}]\nprint(transformer(exemple))", "solution": "def transformer(lignes):\n    resultat = []\n    for l in lignes:\n        quantite = int(l[\"quantite\"])\n        prix = float(l[\"prix_unitaire\"])\n        resultat.append({\n            \"id\": int(l[\"id\"]),\n            \"date\": l[\"date\"],\n            \"produit\": l[\"produit\"].strip().title(),\n            \"categorie\": l[\"categorie\"].strip().title(),\n            \"quantite\": quantite,\n            \"prix_unitaire\": prix,\n            \"montant\": round(quantite * prix, 2),\n        })\n    return resultat\n\n\nexemple = [{\"id\": \"2\", \"date\": \"2025-04-02\", \"produit\": \" stylo \", \"categorie\": \"papeterie\", \"quantite\": \"10\", \"prix_unitaire\": \"1.20\"}]\nprint(transformer(exemple))", "tests": "src = [{\"id\": \"2\", \"date\": \"2025-04-02\", \"produit\": \" stylo \", \"categorie\": \"papeterie\", \"quantite\": \"10\", \"prix_unitaire\": \"1.20\"}, {\"id\": \"3\", \"date\": \"2025-04-05\", \"produit\": \"Lampe\", \"categorie\": \"MAISON\", \"quantite\": \"1\", \"prix_unitaire\": \"29.90\"}]\ncopie = [dict(x) for x in src]\nr = transformer(src)\nassert r == [{\"id\": 2, \"date\": \"2025-04-02\", \"produit\": \"Stylo\", \"categorie\": \"Papeterie\", \"quantite\": 10, \"prix_unitaire\": 1.2, \"montant\": 12.0}, {\"id\": 3, \"date\": \"2025-04-05\", \"produit\": \"Lampe\", \"categorie\": \"Maison\", \"quantite\": 1, \"prix_unitaire\": 29.9, \"montant\": 29.9}], \"Résultat obtenu : %r\" % (r,)\nassert src == copie, \"La liste reçue a été modifiée. Construis de nouveaux dictionnaires au lieu de changer ceux que tu reçois.\"\nassert transformer([]) == [], \"Une liste vide donne une liste vide.\"", "hint": "<p>Pour chaque ligne, construis un <strong>nouveau<\/strong> dictionnaire avec les sept clés. <code>.strip().title()<\/code> nettoie les textes.<\/p>", "stdin": "", "skel": ""}]}, {"id": "valider-et-rejeter", "title": "Valider et mettre en quarantaine", "blocks": [{"t": "html", "h": "<p>Un pipeline reçoit tôt ou tard des données fausses. Trois réactions sont possibles, et deux sont mauvaises :<\/p><ul><li><strong>planter<\/strong> à la première ligne invalide : mille lignes saines sont bloquées par une seule ;<\/li><li><strong>ignorer en silence<\/strong> les lignes invalides : les totaux sont faux et personne ne le sait ;<\/li><li><strong>mettre en quarantaine<\/strong> : la ligne invalide part dans une table de rejets avec la <strong>raison<\/strong> du rejet, les autres continuent, et le pipeline annonce combien il en a écarté.<\/li><\/ul><p>La troisième est la bonne. Elle demande d'écrire les règles de validation noir sur blanc.<\/p>"}, {"t": "code", "c": "from datetime import date\n\n\ndef erreurs(ligne):\n    \"\"\"Renvoie la liste des problèmes d'une ligne. Liste vide = ligne valide.\"\"\"\n    problemes = []\n    try:\n        date.fromisoformat(ligne[\"date\"])\n    except ValueError:\n        problemes.append(\"date invalide\")\n    try:\n        if int(ligne[\"quantite\"]) <= 0:\n            problemes.append(\"quantité négative ou nulle\")\n    except ValueError:\n        problemes.append(\"quantité illisible\")\n    return problemes\n\n\nprint(erreurs({\"date\": \"2025-04-02\", \"quantite\": \"3\"}))\nprint(erreurs({\"date\": \"05/04/2025\", \"quantite\": \"\"}))\nprint(erreurs({\"date\": \"2025-02-30\", \"quantite\": \"-1\"}))", "err": false}, {"t": "html", "h": "<p>Renvoyer <strong>toutes<\/strong> les erreurs d'une ligne, et pas seulement la première, fait gagner un temps précieux à la personne qui devra corriger la source.<\/p><h3>Annoncer ce que l'on a fait<\/h3><p>Un pipeline se termine toujours par un bilan : lignes lues, chargées, rejetées. Et il se méfie de lui-même : si la moitié des lignes est rejetée, la source a probablement changé de format, et il vaut mieux s'arrêter que charger des données partielles.<\/p>"}, {"t": "code", "c": "lues, rejetees = 1200, 700\ntaux = rejetees / lues\nprint(f\"{lues} lues, {lues - rejetees} chargées, {rejetees} rejetées ({taux:.0%})\")\nif taux > 0.2:\n    print(\"ALERTE : trop de rejets, chargement annulé\")", "err": false}, {"t": "exo", "id": "valider-et-rejeter-1", "title": "Séparer le bon grain de l'ivraie", "h": "<p>Écris <code>trier(lignes)<\/code> qui reçoit les lignes brutes (dictionnaires de textes) et renvoie deux listes : les lignes valides, et les rejets. Chaque rejet est un dictionnaire <code>{\"ligne\": la ligne d'origine, \"raisons\": [liste des raisons]}<\/code>.<\/p><p>Les règles, avec le texte exact de chaque raison : la date doit être au format <code>AAAA-MM-JJ<\/code> et exister (<code>\"date invalide\"<\/code>) ; la quantité doit être un entier strictement positif (<code>\"quantite invalide\"<\/code>) ; le prix unitaire doit être un nombre strictement positif (<code>\"prix invalide\"<\/code>).<\/p>", "starter": "import csv\nfrom datetime import date\n\n\ndef trier(lignes):\n    pass\n\n\nwith open(\"ventes_brutes.csv\", encoding=\"utf-8\") as f:\n    valides, rejets = trier(list(csv.DictReader(f)))\nprint(len(valides), \"valides\")\nfor r in rejets:\n    print(r[\"ligne\"][\"id\"], r[\"raisons\"])", "solution": "import csv\nfrom datetime import date\n\n\ndef raisons_de_rejet(ligne):\n    raisons = []\n    try:\n        date.fromisoformat(ligne[\"date\"])\n    except ValueError:\n        raisons.append(\"date invalide\")\n    try:\n        if int(ligne[\"quantite\"]) <= 0:\n            raisons.append(\"quantite invalide\")\n    except ValueError:\n        raisons.append(\"quantite invalide\")\n    try:\n        if float(ligne[\"prix_unitaire\"]) <= 0:\n            raisons.append(\"prix invalide\")\n    except ValueError:\n        raisons.append(\"prix invalide\")\n    return raisons\n\n\ndef trier(lignes):\n    valides, rejets = [], []\n    for ligne in lignes:\n        raisons = raisons_de_rejet(ligne)\n        if raisons:\n            rejets.append({\"ligne\": ligne, \"raisons\": raisons})\n        else:\n            valides.append(ligne)\n    return valides, rejets\n\n\nwith open(\"ventes_brutes.csv\", encoding=\"utf-8\") as f:\n    valides, rejets = trier(list(csv.DictReader(f)))\nprint(len(valides), \"valides\")\nfor r in rejets:\n    print(r[\"ligne\"][\"id\"], r[\"raisons\"])", "tests": "import csv\nwith open(\"ventes_brutes.csv\", encoding=\"utf-8\") as f:\n    v, r = trier(list(csv.DictReader(f)))\nassert [x[\"id\"] for x in v] == [\"1\", \"2\", \"3\", \"7\", \"7\", \"8\", \"10\", \"11\"], \"Lignes valides attendues (par id) : 1, 2, 3, 7, 7, 8, 10, 11. Tu obtiens %r. Le doublon n'est pas une erreur de validation : il sera traité plus tard.\" % ([x[\"id\"] for x in v],)\nobtenu = {x[\"ligne\"][\"id\"]: x[\"raisons\"] for x in r}\nassert obtenu == {\"4\": [\"quantite invalide\"], \"5\": [\"quantite invalide\"], \"6\": [\"date invalide\"], \"9\": [\"prix invalide\"]}, \"Rejets attendus : 4 et 5 (quantite invalide), 6 (date invalide), 9 (prix invalide). Tu obtiens %r.\" % (obtenu,)\nv2, r2 = trier([{\"id\": \"x\", \"date\": \"2025-02-30\", \"quantite\": \"0\", \"prix_unitaire\": \"-1\"}])\nassert v2 == [] and r2[0][\"raisons\"] == [\"date invalide\", \"quantite invalide\", \"prix invalide\"], \"Une ligne qui cumule les trois problèmes doit porter les trois raisons, dans cet ordre.\"", "hint": "<p>Écris une fonction auxiliaire qui renvoie la liste des raisons d'une ligne, avec un <code>try<\/code> / <code>except ValueError<\/code> par règle. <code>trier<\/code> range ensuite chaque ligne d'un côté ou de l'autre selon que cette liste est vide ou non.<\/p>", "stdin": "", "skel": "import csv\nfrom datetime import date\n\ndef raisons_de_rejet(ligne):\n    ...\n    try:\n        ...\n    except ValueError:\n        ...\n    try:\n        if ...:\n            ...\n    except ValueError:\n        ...\n    try:\n        if ...:\n            ...\n    except ValueError:\n        ...\n    return ...\n\ndef trier(lignes):\n    ...\n    for ligne in lignes:\n        ...\n        if ...:\n            ...\n        else:\n            ...\n    return ...\n\nwith open(\"ventes_brutes.csv\", encoding=\"utf-8\") as f:\n    valides, rejets = trier(list(csv.DictReader(f)))\nprint(len(valides), \"valides\")\nfor r in rejets:\n    print(r[\"ligne\"][\"id\"], r[\"raisons\"])"}]}, {"id": "relancer-sans-degat", "title": "Relancer sans dégât", "blocks": [{"t": "html", "h": "<p>Un pipeline échoue un jour au milieu de son travail : coupure réseau, disque plein. On le relance. S'il recharge ce qu'il avait déjà chargé, les ventes sont comptées deux fois. Un bon pipeline est <strong>idempotent<\/strong> : le lancer une fois ou dix fois donne le même résultat.<\/p><p>Regarde ce qui arrive au pipeline naïf.<\/p>"}, {"t": "code", "c": "import sqlite3\n\nconn = sqlite3.connect(\":memory:\")\nconn.execute(\"CREATE TABLE ventes (id INTEGER, montant REAL)\")\nlot = [(1, 13.5), (2, 12.0)]\n\nfor essai in range(2):\n    conn.executemany(\"INSERT INTO ventes VALUES (?, ?)\", lot)\nprint(conn.execute(\"SELECT COUNT(*), SUM(montant) FROM ventes\").fetchone())", "err": false}, {"t": "html", "h": "<h3>Première parade : une clé et un remplacement<\/h3><p>On déclare une <strong>clé primaire<\/strong>, qui interdit deux lignes de même identifiant, et on insère avec <code>INSERT OR REPLACE<\/code> : si la clé existe déjà, la ligne est remplacée au lieu d'être ajoutée. Cette opération s'appelle un <strong>upsert<\/strong>.<\/p>"}, {"t": "code", "c": "import sqlite3\n\nconn = sqlite3.connect(\":memory:\")\nconn.execute(\"CREATE TABLE ventes (id INTEGER PRIMARY KEY, montant REAL)\")\n\nfor lot in ([(1, 13.5), (2, 12.0)], [(1, 13.5), (2, 12.0)], [(2, 15.0), (3, 29.9)]):\n    conn.executemany(\"INSERT OR REPLACE INTO ventes VALUES (?, ?)\", lot)\nprint(conn.execute(\"SELECT * FROM ventes ORDER BY id\").fetchall())", "err": false}, {"t": "html", "h": "<p>Trois chargements, dont un en double et un qui corrige la vente 2 : la table contient trois lignes justes.<\/p><h3>Deuxième parade : ne traiter que le nouveau<\/h3><p>Recharger tout l'historique chaque nuit devient vite trop long. Un chargement <strong>incrémental<\/strong> ne traite que ce qui est arrivé depuis la dernière fois. On mémorise un <strong>repère<\/strong> (la date ou l'identifiant le plus récent déjà chargé) et on ne garde que ce qui le dépasse.<\/p>"}, {"t": "code", "c": "import sqlite3\n\nconn = sqlite3.connect(\":memory:\")\nconn.execute(\"CREATE TABLE ventes (id INTEGER PRIMARY KEY, date TEXT)\")\nconn.executemany(\"INSERT INTO ventes VALUES (?, ?)\", [(1, \"2025-04-02\"), (2, \"2025-04-05\")])\n\nrepere = conn.execute(\"SELECT MAX(date) FROM ventes\").fetchone()[0]\nsource = [(2, \"2025-04-05\"), (3, \"2025-04-07\"), (4, \"2025-04-09\")]\nnouvelles = [ligne for ligne in source if ligne[1] > repere]\nprint(\"repère :\", repere, \"| à charger :\", nouvelles)", "err": false}, {"t": "html", "h": "<p>Les dates au format <code>AAAA-MM-JJ<\/code> se comparent correctement comme de simples textes : c'est l'une des raisons d'utiliser ce format partout.<\/p><h3>Tout ou rien : les transactions<\/h3><p>Si le pipeline plante au milieu d'un chargement, la table ne doit pas rester à moitié remplie. Utilisée dans un <code>with<\/code>, la connexion ouvre une <strong>transaction<\/strong> : tout est validé à la fin du bloc, ou tout est annulé si une erreur survient.<\/p>"}, {"t": "code", "c": "import sqlite3\n\nconn = sqlite3.connect(\":memory:\")\nconn.execute(\"CREATE TABLE ventes (id INTEGER PRIMARY KEY, montant REAL NOT NULL)\")\ntry:\n    with conn:\n        conn.execute(\"INSERT INTO ventes VALUES (1, 13.5)\")\n        conn.execute(\"INSERT INTO ventes VALUES (2, NULL)\")   # interdit par NOT NULL\nexcept sqlite3.IntegrityError as erreur:\n    print(\"Chargement annulé :\", erreur)\nprint(conn.execute(\"SELECT COUNT(*) FROM ventes\").fetchone()[0], \"ligne dans la table\")", "err": false}, {"t": "exo", "id": "relancer-sans-degat-1", "title": "Un chargement que l'on peut relancer", "h": "<p>Écris <code>charger(conn, lignes)<\/code>. Les lignes sont des dictionnaires avec les clés <code>id<\/code>, <code>date<\/code> et <code>montant<\/code>. La fonction crée la table <code>ventes<\/code> si elle n'existe pas (avec <code>id<\/code> comme clé primaire), y charge les lignes de façon idempotente, et renvoie le nombre total de lignes de la table. La relancer avec les mêmes lignes ne doit rien dupliquer ; une ligne dont le montant a changé doit être mise à jour.<\/p>", "starter": "import sqlite3\n\n\ndef charger(conn, lignes):\n    pass\n\n\nconn = sqlite3.connect(\":memory:\")\nlot = [{\"id\": 1, \"date\": \"2025-04-02\", \"montant\": 13.5}, {\"id\": 2, \"date\": \"2025-04-02\", \"montant\": 12.0}]\nprint(charger(conn, lot), charger(conn, lot))", "solution": "import sqlite3\n\n\ndef charger(conn, lignes):\n    with conn:\n        conn.execute(\"CREATE TABLE IF NOT EXISTS ventes (id INTEGER PRIMARY KEY, date TEXT, montant REAL)\")\n        conn.executemany(\"INSERT OR REPLACE INTO ventes VALUES (:id, :date, :montant)\", lignes)\n    return conn.execute(\"SELECT COUNT(*) FROM ventes\").fetchone()[0]\n\n\nconn = sqlite3.connect(\":memory:\")\nlot = [{\"id\": 1, \"date\": \"2025-04-02\", \"montant\": 13.5}, {\"id\": 2, \"date\": \"2025-04-02\", \"montant\": 12.0}]\nprint(charger(conn, lot), charger(conn, lot))", "tests": "import sqlite3\nc = sqlite3.connect(\":memory:\")\nlot = [{\"id\": 1, \"date\": \"2025-04-02\", \"montant\": 13.5}, {\"id\": 2, \"date\": \"2025-04-02\", \"montant\": 12.0}]\nassert charger(c, lot) == 2, \"Le premier chargement doit renvoyer 2.\"\nassert charger(c, lot) == 2, \"Relancer le même chargement ne doit pas dupliquer les lignes : on attend toujours 2.\"\nassert charger(c, [{\"id\": 2, \"date\": \"2025-04-02\", \"montant\": 15.0}, {\"id\": 3, \"date\": \"2025-04-05\", \"montant\": 29.9}]) == 3, \"Après un lot contenant une correction et une nouvelle ligne, on attend 3 lignes.\"\nassert c.execute(\"SELECT id, montant FROM ventes ORDER BY id\").fetchall() == [(1, 13.5), (2, 15.0), (3, 29.9)], \"La vente 2 doit avoir été mise à jour à 15.0.\"", "hint": "<p><code>CREATE TABLE IF NOT EXISTS ventes (id INTEGER PRIMARY KEY, ...)<\/code> puis <code>INSERT OR REPLACE<\/code>. Avec des dictionnaires, les paramètres s'écrivent <code>:id<\/code>, <code>:date<\/code>, <code>:montant<\/code> au lieu de <code>?<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "relancer-sans-degat-2", "title": "Seulement les nouveautés", "h": "<p>Écris <code>a_charger(conn, lignes)<\/code> qui renvoie les lignes dont la <code>date<\/code> est strictement postérieure à la date la plus récente déjà présente dans la table <code>ventes<\/code>. Si la table est vide, toutes les lignes sont à charger.<\/p>", "starter": "import sqlite3\n\n\ndef a_charger(conn, lignes):\n    pass\n\n\nconn = sqlite3.connect(\":memory:\")\nconn.execute(\"CREATE TABLE ventes (id INTEGER PRIMARY KEY, date TEXT, montant REAL)\")\nconn.execute(\"INSERT INTO ventes VALUES (1, '2025-04-05', 10)\")\nprint(a_charger(conn, [{\"id\": 1, \"date\": \"2025-04-05\"}, {\"id\": 2, \"date\": \"2025-04-07\"}]))", "solution": "import sqlite3\n\n\ndef a_charger(conn, lignes):\n    repere = conn.execute(\"SELECT MAX(date) FROM ventes\").fetchone()[0]\n    if repere is None:\n        return list(lignes)\n    return [l for l in lignes if l[\"date\"] > repere]\n\n\nconn = sqlite3.connect(\":memory:\")\nconn.execute(\"CREATE TABLE ventes (id INTEGER PRIMARY KEY, date TEXT, montant REAL)\")\nconn.execute(\"INSERT INTO ventes VALUES (1, '2025-04-05', 10)\")\nprint(a_charger(conn, [{\"id\": 1, \"date\": \"2025-04-05\"}, {\"id\": 2, \"date\": \"2025-04-07\"}]))", "tests": "import sqlite3\nc = sqlite3.connect(\":memory:\")\nc.execute(\"CREATE TABLE ventes (id INTEGER PRIMARY KEY, date TEXT, montant REAL)\")\nsrc = [{\"id\": 1, \"date\": \"2025-04-05\"}, {\"id\": 2, \"date\": \"2025-04-07\"}, {\"id\": 3, \"date\": \"2025-03-01\"}]\nassert a_charger(c, src) == src, \"Si la table est vide, toutes les lignes sont à charger. MAX(date) vaut alors None.\"\nc.execute(\"INSERT INTO ventes VALUES (1, '2025-04-05', 10)\")\nassert a_charger(c, src) == [{\"id\": 2, \"date\": \"2025-04-07\"}], \"Avec un repère au 2025-04-05, seule la ligne du 2025-04-07 est à charger. Tu obtiens %r.\" % (a_charger(c, src),)", "hint": "<p><code>SELECT MAX(date) FROM ventes<\/code> renvoie <code>None<\/code> quand la table est vide : traite ce cas d'abord.<\/p>", "stdin": "", "skel": ""}, {"t": "quiz", "id": "relancer-sans-degat-3", "title": "Combien de lignes à la fin ?", "h": "", "code": "import sqlite3\n\nconn = sqlite3.connect(\":memory:\")\nconn.execute(\"CREATE TABLE a (id INTEGER, v TEXT)\")\nconn.execute(\"CREATE TABLE b (id INTEGER PRIMARY KEY, v TEXT)\")\nfor lot in ([(1, \"x\"), (2, \"y\")], [(2, \"z\"), (3, \"w\")]):\n    conn.executemany(\"INSERT INTO a VALUES (?, ?)\", lot)\n    conn.executemany(\"INSERT OR REPLACE INTO b VALUES (?, ?)\", lot)\nprint(conn.execute(\"SELECT COUNT(*) FROM a\").fetchone()[0])\nprint(conn.execute(\"SELECT COUNT(*) FROM b\").fetchone()[0])\nprint(conn.execute(\"SELECT v FROM b WHERE id = 2\").fetchone()[0])", "expected": "4\n3\nz"}]}, {"id": "projet-pipeline", "title": "Projet : un pipeline en trois couches", "blocks": [{"t": "html", "h": "<p>Les plateformes de données modernes rangent les données en trois couches, souvent appelées <strong>bronze<\/strong>, <strong>argent<\/strong> et <strong>or<\/strong> (architecture « médaillon »).<\/p><div class=\"tw\"><table><thead><tr><th>Couche<\/th><th>Contenu<\/th><th>Règle<\/th><\/tr><\/thead><tbody><tr><td><strong>Bronze<\/strong><\/td><td>les données brutes, telles que reçues<\/td><td>on ne modifie rien, on ajoute seulement la date et la source d'ingestion<\/td><\/tr><tr><td><strong>Argent<\/strong><\/td><td>les données nettoyées, typées, validées, sans doublon<\/td><td>une ligne par objet métier<\/td><\/tr><tr><td><strong>Or<\/strong><\/td><td>les tables prêtes pour le métier : agrégats, indicateurs<\/td><td>une table par usage<\/td><\/tr><\/tbody><\/table><\/div><p>L'intérêt : si une règle de nettoyage était fausse, on corrige le code et on reconstruit l'argent et l'or à partir du bronze, sans redemander les données à la source. Et chacun sait où regarder : le bronze pour enquêter, l'or pour décider.<\/p><p>Tu vas assembler tout le module dans un seul pipeline. Procède par étapes, en vérifiant chaque table avec un <code>SELECT<\/code> avant de passer à la suivante.<\/p>"}, {"t": "exo", "id": "projet-pipeline-1", "title": "Bronze, argent, or", "h": "<p>Écris <code>executer(conn, nom_fichier)<\/code> qui construit quatre tables à partir d'un fichier au format de <code>ventes_brutes.csv<\/code>, puis renvoie un bilan.<\/p><ul><li><code>bronze_ventes<\/code> : toutes les lignes du fichier, <strong>sans aucune modification<\/strong>, en colonnes texte (<code>id<\/code>, <code>date<\/code>, <code>client_id<\/code>, <code>produit<\/code>, <code>categorie<\/code>, <code>quantite<\/code>, <code>prix_unitaire<\/code>), plus une colonne <code>source<\/code> contenant le nom du fichier.<\/li><li><code>rejets<\/code> : une ligne par vente invalide, avec les colonnes <code>id<\/code> (texte) et <code>raisons<\/code> (les raisons séparées par <code>, <\/code>). Mêmes règles et mêmes textes que dans la leçon « Valider et mettre en quarantaine ».<\/li><li><code>silver_ventes<\/code> : les ventes valides, typées, sans doublon, avec <code>id<\/code> entier en clé primaire, <code>date<\/code>, <code>client_id<\/code>, <code>produit<\/code> et <code>categorie<\/code> nettoyés (sans espaces, majuscule initiale), <code>quantite<\/code> entière, <code>prix_unitaire<\/code> réel et <code>montant<\/code> arrondi à 2 décimales.<\/li><li><code>gold_ca_mensuel<\/code> : une ligne par mois, avec <code>mois<\/code> (<code>AAAA-MM<\/code>), <code>nb_ventes<\/code> et <code>ca<\/code> arrondi à 2 décimales.<\/li><\/ul><p>La fonction renvoie <code>{\"lues\": ..., \"valides\": ..., \"rejetees\": ...}<\/code>, où <code>valides<\/code> est le nombre de lignes de <code>silver_ventes<\/code>. Elle doit être <strong>idempotente<\/strong> : l'exécuter deux fois de suite laisse exactement les mêmes tables.<\/p>", "starter": "import csv\nimport sqlite3\nfrom datetime import date\n\n\ndef executer(conn, nom_fichier):\n    pass\n\n\nconn = sqlite3.connect(\":memory:\")\nprint(executer(conn, \"ventes_brutes.csv\"))\nfor table in [\"bronze_ventes\", \"rejets\", \"silver_ventes\", \"gold_ca_mensuel\"]:\n    print(table, conn.execute(f\"SELECT COUNT(*) FROM {table}\").fetchone()[0])", "solution": "import csv\nimport sqlite3\nfrom datetime import date\n\nCOLONNES = [\"id\", \"date\", \"client_id\", \"produit\", \"categorie\", \"quantite\", \"prix_unitaire\"]\n\n\ndef extraire(nom_fichier):\n    with open(nom_fichier, encoding=\"utf-8\") as fichier:\n        return list(csv.DictReader(fichier))\n\n\ndef raisons_de_rejet(ligne):\n    raisons = []\n    try:\n        date.fromisoformat(ligne[\"date\"])\n    except ValueError:\n        raisons.append(\"date invalide\")\n    try:\n        if int(ligne[\"quantite\"]) <= 0:\n            raisons.append(\"quantite invalide\")\n    except ValueError:\n        raisons.append(\"quantite invalide\")\n    try:\n        if float(ligne[\"prix_unitaire\"]) <= 0:\n            raisons.append(\"prix invalide\")\n    except ValueError:\n        raisons.append(\"prix invalide\")\n    return raisons\n\n\ndef nettoyer(ligne):\n    quantite = int(ligne[\"quantite\"])\n    prix = float(ligne[\"prix_unitaire\"])\n    return {\n        \"id\": int(ligne[\"id\"]),\n        \"date\": ligne[\"date\"],\n        \"client_id\": ligne[\"client_id\"].strip(),\n        \"produit\": ligne[\"produit\"].strip().title(),\n        \"categorie\": ligne[\"categorie\"].strip().title(),\n        \"quantite\": quantite,\n        \"prix_unitaire\": prix,\n        \"montant\": round(quantite * prix, 2),\n    }\n\n\ndef executer(conn, nom_fichier):\n    brutes = extraire(nom_fichier)\n    valides, rejets = [], []\n    for ligne in brutes:\n        raisons = raisons_de_rejet(ligne)\n        if raisons:\n            rejets.append((ligne[\"id\"], \", \".join(raisons)))\n        else:\n            valides.append(nettoyer(ligne))\n\n    with conn:\n        # Bronze : copie fidèle de la source, reconstruite à chaque exécution\n        conn.execute(\"DROP TABLE IF EXISTS bronze_ventes\")\n        conn.execute(\"CREATE TABLE bronze_ventes (id TEXT, date TEXT, client_id TEXT, produit TEXT, categorie TEXT, quantite TEXT, prix_unitaire TEXT, source TEXT)\")\n        conn.executemany(\n            \"INSERT INTO bronze_ventes VALUES (?, ?, ?, ?, ?, ?, ?, ?)\",\n            [tuple(l[c] for c in COLONNES) + (nom_fichier,) for l in brutes],\n        )\n        # Quarantaine\n        conn.execute(\"DROP TABLE IF EXISTS rejets\")\n        conn.execute(\"CREATE TABLE rejets (id TEXT, raisons TEXT)\")\n        conn.executemany(\"INSERT INTO rejets VALUES (?, ?)\", rejets)\n        # Argent : la clé primaire et le remplacement suppriment les doublons\n        conn.execute(\"CREATE TABLE IF NOT EXISTS silver_ventes (id INTEGER PRIMARY KEY, date TEXT, client_id TEXT, produit TEXT, categorie TEXT, quantite INTEGER, prix_unitaire REAL, montant REAL)\")\n        conn.executemany(\n            \"INSERT OR REPLACE INTO silver_ventes VALUES (:id, :date, :client_id, :produit, :categorie, :quantite, :prix_unitaire, :montant)\",\n            valides,\n        )\n        # Or : agrégat reconstruit à partir de l'argent\n        conn.execute(\"DROP TABLE IF EXISTS gold_ca_mensuel\")\n        conn.execute(\n            \"CREATE TABLE gold_ca_mensuel AS \"\n            \"SELECT substr(date, 1, 7) AS mois, COUNT(*) AS nb_ventes, ROUND(SUM(montant), 2) AS ca \"\n            \"FROM silver_ventes GROUP BY mois ORDER BY mois\"\n        )\n    nb_valides = conn.execute(\"SELECT COUNT(*) FROM silver_ventes\").fetchone()[0]\n    return {\"lues\": len(brutes), \"valides\": nb_valides, \"rejetees\": len(rejets)}\n\n\nconn = sqlite3.connect(\":memory:\")\nprint(executer(conn, \"ventes_brutes.csv\"))\nfor table in [\"bronze_ventes\", \"rejets\", \"silver_ventes\", \"gold_ca_mensuel\"]:\n    print(table, conn.execute(f\"SELECT COUNT(*) FROM {table}\").fetchone()[0])", "tests": "import sqlite3\ndef etat(c):\n    return {\n        \"bronze\": c.execute(\"SELECT id, date, produit, categorie, quantite, prix_unitaire, source FROM bronze_ventes ORDER BY rowid\").fetchall(),\n        \"rejets\": sorted(c.execute(\"SELECT id, raisons FROM rejets\").fetchall()),\n        \"silver\": c.execute(\"SELECT id, date, client_id, produit, categorie, quantite, prix_unitaire, montant FROM silver_ventes ORDER BY id\").fetchall(),\n        \"gold\": c.execute(\"SELECT mois, nb_ventes, ca FROM gold_ca_mensuel ORDER BY mois\").fetchall(),\n    }\nc = sqlite3.connect(\":memory:\")\nbilan = executer(c, \"ventes_brutes.csv\")\nassert bilan == {\"lues\": 12, \"valides\": 7, \"rejetees\": 4}, \"Bilan attendu : 12 lues, 7 valides, 4 rejetées. Tu obtiens %r.\" % (bilan,)\ne = etat(c)\nassert len(e[\"bronze\"]) == 12, \"bronze_ventes doit contenir les 12 lignes du fichier, doublon compris. Tu en as %d.\" % len(e[\"bronze\"])\nassert e[\"bronze\"][1] == (\"2\", \"2025-04-02\", \" stylo \", \"papeterie\", \"10\", \"1.20\", \"ventes_brutes.csv\"), \"Le bronze doit garder les valeurs d'origine, en texte, sans nettoyage, avec le nom du fichier en source. Ligne 2 obtenue : %r\" % (e[\"bronze\"][1],)\nassert e[\"rejets\"] == [(\"4\", \"quantite invalide\"), (\"5\", \"quantite invalide\"), (\"6\", \"date invalide\"), (\"9\", \"prix invalide\")], \"Rejets attendus : 4, 5 (quantite invalide), 6 (date invalide), 9 (prix invalide). Tu obtiens %r.\" % (e[\"rejets\"],)\nassert [l[0] for l in e[\"silver\"]] == [1, 2, 3, 7, 8, 10, 11], \"silver_ventes doit contenir les ventes 1, 2, 3, 7, 8, 10, 11, sans doublon. Tu obtiens %r.\" % ([l[0] for l in e[\"silver\"]],)\nassert e[\"silver\"][1] == (2, \"2025-04-02\", \"C02\", \"Stylo\", \"Papeterie\", 10, 1.2, 12.0), \"La vente 2 nettoyée doit être (2, '2025-04-02', 'C02', 'Stylo', 'Papeterie', 10, 1.2, 12.0). Tu obtiens %r.\" % (e[\"silver\"][1],)\nassert e[\"silver\"][2][4] == \"Maison\", \"La catégorie 'MAISON' doit devenir 'Maison'.\"\nassert e[\"gold\"] == [(\"2025-04\", 5, 116.9), (\"2025-05\", 2, 91.8)], \"gold_ca_mensuel attendu : ('2025-04', 5, 116.9) et ('2025-05', 2, 91.8). Tu obtiens %r.\" % (e[\"gold\"],)\nbilan2 = executer(c, \"ventes_brutes.csv\")\nassert bilan2 == bilan and etat(c) == e, \"Une seconde exécution doit laisser exactement les mêmes tables et le même bilan : le pipeline n'est pas idempotent.\"", "hint": "<p>Reprends tes fonctions des leçons précédentes : extraire, valider, nettoyer. Pour l'idempotence : reconstruis bronze, rejets et or à chaque exécution (<code>DROP TABLE IF EXISTS<\/code> puis création), et charge l'argent avec <code>INSERT OR REPLACE<\/code> sur une clé primaire, ce qui élimine aussi le doublon. L'or se calcule en SQL à partir de l'argent : <code>CREATE TABLE gold_ca_mensuel AS SELECT ... GROUP BY mois<\/code>.<\/p>", "stdin": "", "skel": ""}]}]}, {"id": "playbook", "title": "Le playbook de l'analyste", "desc": "La méthode complète d'une analyse, de la question métier à la présentation, et le référentiel SQL traduit en pandas.", "lessons": [{"id": "pb-etat-d-esprit", "title": "Le bon état d'esprit et la méthode A → Z", "blocks": [{"t": "html", "h": "<p>Ce module est la version Python du <strong>Data Playbook<\/strong> : la même méthode d'analyse, de la question métier jusqu'à la présentation, mais écrite avec <strong>pandas<\/strong> au lieu de SQL. Tu n'y apprends presque pas de syntaxe nouvelle. Tu y apprends <strong>dans quel ordre<\/strong> utiliser ce que tu sais déjà, et <strong>pourquoi<\/strong>.<\/p><p>Il suppose que tu as vu <a href=\"#decouvrir-pandas\">pandas<\/a>, <a href=\"#premiers-graphiques\">les graphiques<\/a> et <a href=\"#sql-depuis-python\">SQL depuis Python<\/a>. Si un geste te manque, chaque fiche renvoie vers la leçon qui l'explique.<\/p><h3>Pourquoi on a la page blanche<\/h3><p>Un cours t'apprend à utiliser des outils. Mais analyser des données, c'est d'abord <strong>poser les bonnes questions<\/strong>, pas lancer des commandes au hasard en espérant voir apparaître quelque chose.<\/p><div class=\"note\"><span class=\"lab\">La règle fondamentale<\/span><p>Une analyse commence toujours par une <strong>question métier<\/strong>, jamais par un <code>read_csv<\/code>.<\/p><\/div><p>Avant d'ouvrir un fichier, réponds à quatre questions. Écris les réponses : elles guideront tout le reste.<\/p><div class=\"tw\"><table><thead><tr><th>Question<\/th><th>Pourquoi elle compte<\/th><\/tr><\/thead><tbody><tr><td><strong>Quel est l'objectif ?<\/strong><\/td><td>Comprendre les ventes ? Réduire les annulations ? L'objectif décide de ce que tu calcules et de ce que tu laisses de côté.<\/td><\/tr><tr><td><strong>Pour qui ?<\/strong><\/td><td>Un directeur veut trois chiffres. Un responsable opérationnel veut le détail.<\/td><\/tr><tr><td><strong>Sur quelle période ?<\/strong><\/td><td>Semaine, mois, année ? Comparée à la période précédente, ou à la même période l'an dernier ?<\/td><\/tr><tr><td><strong>À quelle granularité ?<\/strong><\/td><td>Par produit ? Par région ? Par client ? C'est le niveau auquel tu vas regrouper (<code>groupby<\/code>).<\/td><\/tr><\/tbody><\/table><\/div><h3>Les 3 types d'analyses<\/h3><div class=\"tw\"><table><thead><tr><th>Type<\/th><th>Question posée<\/th><th>Exemple<\/th><\/tr><\/thead><tbody><tr><td>Descriptive<\/td><td>Que s'est-il passé ?<\/td><td>Chiffre d'affaires du mois dernier par région<\/td><\/tr><tr><td>Diagnostic<\/td><td>Pourquoi est-ce arrivé ?<\/td><td>Pourquoi les ventes en magasin baissent-elles au printemps ?<\/td><\/tr><tr><td>Prédictive<\/td><td>Que va-t-il se passer ?<\/td><td>Tendance des commandes pour le trimestre suivant<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\"><span class=\"lab\">Conseil<\/span><p>En début de carrière, concentre-toi sur le descriptif et le diagnostic : c'est l'essentiel du travail réel d'un analyste.<\/p><\/div>"}, {"t": "html", "h": "<h3>Le jeu de données du module<\/h3><p>Toutes les leçons du module travaillent sur le même fichier, <code>commandes.csv<\/code> : 72 commandes d'une petite boutique, de janvier à juin 2025. Une ligne = une commande.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nprint(df.shape)\nprint(df.dtypes)\nprint(df[[\"id\", \"date\", \"region\", \"canal\", \"categorie\", \"montant\", \"statut\"]].head())", "err": false}, {"t": "html", "h": "<p><code>parse_dates=[\"date\"]<\/code> demande à pandas de lire la colonne <code>date<\/code> comme de vraies dates, et pas comme du texte. Sans cela, impossible d'extraire un mois ou de calculer une durée.<\/p><h3>La convention de nommage<\/h3><p>Le playbook SQL écrit ses requêtes avec des noms génériques (<code>col_num_1<\/code>, <code>col_cat_1<\/code>…), à remplacer par tes vraies colonnes. Ici, le code doit s'exécuter : il utilise donc les vraies colonnes de <code>commandes.csv<\/code>. Voici la correspondance. Quand tu reprendras une fiche sur tes propres données, remplace chaque colonne par la tienne, <strong>de même rôle<\/strong>.<\/p><div class=\"tw\"><table><thead><tr><th>Nom générique (playbook SQL)<\/th><th>Rôle<\/th><th>Dans commandes.csv<\/th><\/tr><\/thead><tbody><tr><td><code>table_1<\/code><\/td><td>la table analysée<\/td><td>le DataFrame <code>df<\/code><\/td><\/tr><tr><td><code>id<\/code> / <code>id_fk<\/code><\/td><td>clé primaire / clé étrangère<\/td><td><code>id<\/code> / <code>client_id<\/code><\/td><\/tr><tr><td><code>col_num_1<\/code><\/td><td>valeur numérique (montant, quantité, prix…)<\/td><td><code>montant<\/code>, et aussi <code>quantite<\/code>, <code>prix_unitaire<\/code><\/td><\/tr><tr><td><code>col_cat_1<\/code><\/td><td>catégorie ou texte (pays, type, statut…)<\/td><td><code>categorie<\/code>, et aussi <code>region<\/code>, <code>canal<\/code>, <code>produit<\/code>, <code>statut<\/code><\/td><\/tr><tr><td><code>col_date_1<\/code><\/td><td>date<\/td><td><code>date<\/code><\/td><\/tr><\/tbody><\/table><\/div><h3>5 questions pour démarrer, quel que soit le fichier<\/h3><p>Devant un jeu de données inconnu, ces cinq questions marchent toujours. Chacune tient en une ligne de pandas.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\n# 1. Combien de lignes et de colonnes ?\nprint(df.shape)\n\n# 2. Quelle période couvre le jeu de données ?\nprint(df[\"date\"].min().date(), \"→\", df[\"date\"].max().date())\n\n# 3. Y a-t-il des valeurs manquantes ?\nprint(df.isna().sum().sum(), \"valeur(s) manquante(s)\")\n\n# 4. Quelles sont les métriques disponibles ? (les colonnes numériques)\nprint(list(df.select_dtypes(\"number\").columns))\n\n# 5. Une tendance ou une anomalie visible ? Le total par mois\nprint(df.groupby(df[\"date\"].dt.strftime(\"%Y-%m\"))[\"montant\"].sum())", "err": false}, {"t": "html", "h": "<h3>La méthode A → Z : les 6 étapes d'une analyse structurée<\/h3><p>Une analyse suit toujours le même chemin. Les leçons de ce module le parcourent dans l'ordre.<\/p><div class=\"tw\"><table><thead><tr><th>Étape<\/th><th>Ce que tu fais<\/th><th>Outils Python<\/th><th>Leçon<\/th><\/tr><\/thead><tbody><tr><td>01<\/td><td><strong>Comprendre le contexte et définir les questions.<\/strong> Quel problème résout-on ? Rédige 3 à 5 questions clés.<\/td><td>un carnet, pas du code<\/td><td>cette leçon<\/td><\/tr><tr><td>02<\/td><td><strong>Explorer les données (EDA).<\/strong> Tables, colonnes, types, clés de jointure.<\/td><td><code>shape<\/code>, <code>info<\/code>, <code>describe<\/code>, <code>value_counts<\/code><\/td><td><a href=\"#pb-eda\">Explorer<\/a><\/td><\/tr><tr><td>03<\/td><td><strong>Nettoyer et préparer.<\/strong> Valeurs manquantes, doublons, formats incohérents.<\/td><td><code>isna<\/code>, <code>drop_duplicates<\/code>, <code>str<\/code>, <code>to_datetime<\/code><\/td><td><a href=\"#pb-nettoyage\">Nettoyer<\/a><\/td><\/tr><tr><td>04<\/td><td><strong>Calculer les KPIs et les agrégations.<\/strong> Sommes, moyennes, ratios, segmentés par dimension.<\/td><td><code>groupby<\/code>, <code>agg<\/code>, <code>pivot_table<\/code><\/td><td><a href=\"#pb-kpis\">KPIs<\/a><\/td><\/tr><tr><td>05<\/td><td><strong>Analyser et trouver des insights.<\/strong> Tendances, anomalies, corrélations. « Et alors ? »<\/td><td><code>pct_change<\/code>, <code>quantile<\/code>, <code>corr<\/code><\/td><td><a href=\"#pb-stats\">Statistiques<\/a>, <a href=\"#pb-insights\">Insights<\/a><\/td><\/tr><tr><td>06<\/td><td><strong>Visualiser et communiquer.<\/strong> Les bons graphiques, une conclusion claire en 30 secondes.<\/td><td>matplotlib, f-strings<\/td><td><a href=\"#pb-visualiser\">Visualiser<\/a>, <a href=\"#pb-communiquer\">Communiquer<\/a><\/td><\/tr><\/tbody><\/table><\/div><p>Entre les étapes 03 et 04, le module contient un <strong>référentiel SQL → pandas<\/strong> en quatre niveaux : 21 fiches numérotées, de <code>SELECT *<\/code> aux fonctions de fenêtrage. C'est la boîte à outils dans laquelle tu piocheras pour toutes les autres étapes. La dernière leçon est une <a href=\"#pb-checklist\">checklist interactive<\/a> à cocher pendant tes propres analyses.<\/p>"}]}, {"id": "pb-eda", "title": "Explorer un jeu de données (EDA)", "blocks": [{"t": "html", "h": "<p>L'<strong>EDA<\/strong> (<em>Exploratory Data Analysis<\/em>, analyse exploratoire) est ta première conversation avec les données. L'objectif n'est pas encore de nettoyer ni d'analyser : c'est d'<strong>observer<\/strong>. Comprendre ce que tu as avant de décider ce que tu peux en faire.<\/p><p>Cinq gestes suffisent pour comprendre un fichier inconnu en cinq minutes.<\/p><h3>1 · Vue générale : volume, période, unicité<\/h3><p>Combien de lignes ? Sur quelle période ? La colonne qui sert d'identifiant est-elle vraiment unique ? <code>nunique()<\/code> compte les valeurs distinctes : c'est le <code>COUNT(DISTINCT id)<\/code> de SQL.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nprint(\"lignes      :\", len(df))\nprint(\"début       :\", df[\"date\"].min().date())\nprint(\"fin         :\", df[\"date\"].max().date())\nprint(\"nb de jours :\", (df[\"date\"].max() - df[\"date\"].min()).days)\n\n# Y a-t-il des doublons sur la clé principale ?\nprint(\"ids uniques :\", df[\"id\"].nunique())\nprint(\"doublons    :\", df[\"id\"].duplicated().sum())", "err": false}, {"t": "html", "h": "<p>Si le nombre de lignes dépasse le nombre d'identifiants uniques, il y a des doublons sur la clé. Ici, 72 lignes et 72 identifiants : la clé est saine.<\/p><p>pandas offre un raccourci que SQL n'a pas : <code>df.info()<\/code> donne en un appel les colonnes, leur type et le nombre de valeurs renseignées.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\ndf.info()", "err": false}, {"t": "html", "h": "<h3>2 · Distribution des catégories<\/h3><p>Pour chaque colonne de texte : quelles valeurs, combien de fois, et quel pourcentage du total ? <code>value_counts()<\/code> fait le <code>GROUP BY … COUNT(*)<\/code> et trie du plus fréquent au plus rare. Avec <code>normalize=True<\/code>, il renvoie des proportions.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nnb = df[\"categorie\"].value_counts()\npct = (df[\"categorie\"].value_counts(normalize=True) * 100).round(1)\nprint(pd.DataFrame({\"nb\": nb, \"pct\": pct}))\n\n# À répéter pour chaque colonne catégorielle\nfor colonne in [\"region\", \"canal\", \"statut\"]:\n    print()\n    print(df[colonne].value_counts())", "err": false}, {"t": "html", "h": "<div class=\"note\"><span class=\"lab\">Ce qu'il faut regarder<\/span><p>Cherche les valeurs inattendues, les fautes de frappe (« france » et « France » comptent pour deux valeurs), les catégories à 0 % ou à 100 %.<\/p><\/div><h3>3 · Profil des colonnes numériques<\/h3><p><code>describe()<\/code> résume une colonne numérique : nombre de valeurs, moyenne, écart-type, minimum, quartiles, maximum. La ligne <code>50%<\/code> est la <strong>médiane<\/strong>.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nprint(df[\"montant\"].describe().round(2))\nprint()\nprint(\"valeurs manquantes :\", df[\"montant\"].isna().sum())\nprint(\"moyenne :\", round(df[\"montant\"].mean(), 2), \"| médiane :\", df[\"montant\"].median())", "err": false}, {"t": "html", "h": "<div class=\"note\"><span class=\"lab\">Ce qu'il faut regarder<\/span><p>Si la moyenne est nettement plus grande que la médiane, la distribution est asymétrique : quelques grosses valeurs tirent la moyenne vers le haut. C'est le cas ici (71,52 € contre 45 €). Compare toujours les deux avant de choisir ton indicateur.<\/p><\/div><h3>4 · Tendance temporelle rapide<\/h3><p>Volume et montant par mois, dans l'ordre chronologique. <code>dt.strftime(\"%Y-%m\")<\/code> transforme chaque date en texte <code>2025-03<\/code> : c'est l'équivalent du <code>FORMAT(col_date_1, 'yyyy-MM')<\/code> du playbook.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\ndf[\"mois\"] = df[\"date\"].dt.strftime(\"%Y-%m\")\n\npar_mois = df.groupby(\"mois\").agg(\n    nb_lignes=(\"id\", \"count\"),\n    total=(\"montant\", \"sum\"),\n)\nprint(par_mois)", "err": false}, {"t": "html", "h": "<div class=\"note\"><span class=\"lab\">Ce qu'il faut regarder<\/span><p>Cherche les mois vides (données manquantes ?), les pics inhabituels, les ruptures de tendance. Ici : 12 commandes chaque mois, mais un total qui varie du simple au double. Le volume est stable, c'est donc la <strong>valeur<\/strong> des commandes qui bouge. Première piste à creuser.<\/p><\/div><h3>5 · Croisement de deux dimensions<\/h3><p>Un <code>groupby<\/code> sur deux colonnes donne une ligne par combinaison. <code>pd.crosstab<\/code> présente le même résultat en tableau croisé, plus facile à lire.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\ncroise = df.groupby([\"categorie\", \"canal\"]).agg(\n    nb=(\"id\", \"count\"),\n    total=(\"montant\", \"sum\"),\n)\nprint(croise)\nprint()\nprint(pd.crosstab(df[\"categorie\"], df[\"canal\"], values=df[\"montant\"], aggfunc=\"sum\").round(1))", "err": false}, {"t": "html", "h": "<h3>Ce que tu cherches pendant l'EDA<\/h3><div class=\"tw\"><table><thead><tr><th>Question<\/th><th>Geste pandas<\/th><th>Signal d'alerte<\/th><\/tr><\/thead><tbody><tr><td>Volume cohérent ?<\/td><td><code>len(df)<\/code><\/td><td>0 ligne, ou beaucoup moins qu'attendu<\/td><\/tr><tr><td>Période attendue ?<\/td><td><code>df[\"date\"].min()<\/code>, <code>.max()<\/code><\/td><td>dates futures ou trop anciennes<\/td><\/tr><tr><td>Clé unique ?<\/td><td><code>df[\"id\"].duplicated().sum()<\/code><\/td><td>résultat supérieur à 0 : doublons<\/td><\/tr><tr><td>Valeurs manquantes ?<\/td><td><code>df.isna().mean()<\/code><\/td><td>plus de 10 % sur une colonne clé<\/td><\/tr><tr><td>Valeurs aberrantes ?<\/td><td><code>df[\"montant\"].describe()<\/code><\/td><td>minimum négatif, maximum irréaliste<\/td><\/tr><tr><td>Catégories cohérentes ?<\/td><td><code>value_counts()<\/code><\/td><td>fautes de frappe, valeurs inattendues<\/td><\/tr><tr><td>Tendance normale ?<\/td><td><code>groupby(\"mois\")<\/code><\/td><td>mois vides, pics isolés<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "exo", "id": "pb-eda-1", "title": "La fiche d'identité", "h": "<p>Calcule trois variables qui résument le fichier : <code>nb_lignes<\/code> (nombre de commandes), <code>nb_clients<\/code> (nombre de clients distincts) et <code>part_en_ligne<\/code> (pourcentage des commandes passées sur le canal <code>En ligne<\/code>, arrondi à 1 décimale).<\/p>", "starter": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n# Calcule nb_lignes, nb_clients et part_en_ligne\n\nprint(nb_lignes, nb_clients, part_en_ligne)", "solution": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\nnb_lignes = len(df)\nnb_clients = df[\"client_id\"].nunique()\npart_en_ligne = round((df[\"canal\"] == \"En ligne\").mean() * 100, 1)\n\nprint(nb_lignes, nb_clients, part_en_ligne)", "tests": "assert nb_lignes == 72, \"Le fichier contient 72 commandes. Tu obtiens %r.\" % (nb_lignes,)\nassert nb_clients == 6, \"Il y a 6 clients distincts. Tu obtiens %r. Pense à nunique().\" % (nb_clients,)\nassert abs(float(part_en_ligne) - 63.9) < 0.051, \"46 commandes sur 72 sont en ligne, soit 63.9 %%. Tu obtiens %r.\" % (part_en_ligne,)\nns = rejoue('df = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])', 'df = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"]).head(10)')\nassert ns[\"nb_lignes\"] == 10 and ns[\"nb_clients\"] == 4 and abs(float(ns[\"part_en_ligne\"]) - 50.0) < 0.051, \"Tes calculs doivent partir de df : sur les 10 premières lignes, on attend 10, 4 et 50.0.\"", "hint": "<p><code>len(df)<\/code> compte les lignes, <code>nunique()<\/code> les valeurs distinctes. La moyenne d'une colonne de <code>True<\/code>/<code>False<\/code> donne la proportion de <code>True<\/code> : <code>(df[\"canal\"] == \"En ligne\").mean()<\/code>.<\/p>", "stdin": "", "skel": ""}]}, {"id": "pb-nettoyage", "title": "Nettoyer les données", "blocks": [{"t": "html", "h": "<p>Une donnée propre est la base de toute analyse fiable. Dans un vrai projet, on estime que <strong>80 % du temps<\/strong> passe à nettoyer et préparer les données, et 20 % seulement à les analyser. Ce n'est pas du temps perdu : un seul doublon fausse toutes tes sommes.<\/p><h3>Les 6 problèmes que tu rencontreras partout<\/h3><div class=\"tw\"><table><thead><tr><th>Problème<\/th><th>Pourquoi c'est grave<\/th><th>Réflexe pandas<\/th><\/tr><\/thead><tbody><tr><td><strong>Valeurs manquantes<\/strong><\/td><td>Supprimer ? Remplacer par 0, par la médiane, par « Inconnu » ? La réponse dépend du contexte métier.<\/td><td><code>isna<\/code>, <code>fillna<\/code>, <code>dropna<\/code><\/td><\/tr><tr><td><strong>Doublons<\/strong><\/td><td>Des lignes dupliquées faussent toutes les sommes.<\/td><td><code>duplicated<\/code>, <code>drop_duplicates<\/code><\/td><\/tr><tr><td><strong>Formats incohérents<\/strong><\/td><td>« 2025-07-03 » et « 03/07/2025 » : la même date, deux écritures.<\/td><td><code>pd.to_datetime<\/code><\/td><\/tr><tr><td><strong>Valeurs aberrantes<\/strong><\/td><td>Un prix à −35 € ou à 37 800 € ? À vérifier avant tout calcul.<\/td><td><code>describe<\/code>, <code>quantile<\/code>, <code>between<\/code><\/td><\/tr><tr><td><strong>Casse et espaces<\/strong><\/td><td>« Sud », « SUD » et « Sud » suivi d'un espace sont trois valeurs différentes.<\/td><td><code>str.strip<\/code>, <code>str.title<\/code><\/td><\/tr><tr><td><strong>Mauvais type<\/strong><\/td><td>Un montant stocké en texte : calculs impossibles.<\/td><td><code>dtypes<\/code>, <code>pd.to_numeric<\/code>, <code>astype<\/code><\/td><\/tr><\/tbody><\/table><\/div><p>Le fichier <code>commandes_brutes.csv<\/code> contient 12 lignes et les six problèmes à la fois. On commence toujours par un diagnostic, sans rien modifier.<\/p><h3>Le diagnostic<\/h3>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes_brutes.csv\")\n\nprint(df.dtypes)\nprint()\nprint(df.isna().sum())\nprint()\nprint(df[[\"id\", \"date\", \"region\", \"categorie\", \"montant\"]])", "err": false}, {"t": "html", "h": "<p>Trois alertes dès la première lecture. <code>montant<\/code> a le type <code>object<\/code> : c'est du texte, pas un nombre. <code>region<\/code> et <code>montant<\/code> ont chacune une valeur manquante (affichée <code>NaN<\/code>). Et les dates n'ont pas toutes le même format.<\/p><h3>Mauvais type : convertir une colonne<\/h3><p>Une seule valeur écrite <code>16,00<\/code> (virgule à la française) a suffi à faire basculer toute la colonne en texte. On remplace la virgule par un point, puis <code>pd.to_numeric<\/code> convertit. Avec <code>errors=\"coerce\"<\/code>, ce qui reste inconvertible devient <code>NaN<\/code> au lieu de provoquer une erreur. C'est l'équivalent du <code>CAST<\/code> de SQL.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes_brutes.csv\")\n\ndf[\"montant\"] = pd.to_numeric(df[\"montant\"].str.replace(\",\", \".\"), errors=\"coerce\")\n\nprint(df[\"montant\"].dtype)\nprint(df[\"montant\"].tolist())", "err": false}, {"t": "html", "h": "<h3>Casse et espaces<\/h3><p><code>str.strip()<\/code> enlève les espaces au début et à la fin (le <code>TRIM<\/code> de SQL). <code>str.title()<\/code> met une majuscule à chaque mot ; <code>str.upper()<\/code> et <code>str.lower()<\/code> existent aussi. Peu importe la convention choisie, tant qu'elle est la même partout.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes_brutes.csv\")\n\nprint(df[\"region\"].value_counts(dropna=False))\n\ndf[\"region\"] = df[\"region\"].str.strip().str.title()\ndf[\"categorie\"] = df[\"categorie\"].str.strip().str.title()\n\nprint()\nprint(df[\"region\"].value_counts(dropna=False))", "err": false}, {"t": "html", "h": "<p>Sept écritures différentes avant, trois après (plus la valeur manquante, traitée plus bas). <code>dropna=False<\/code> demande à <code>value_counts<\/code> de compter aussi les <code>NaN<\/code>, qu'il ignore par défaut.<\/p><h3>Formats de dates incohérents<\/h3><p>La méthode la plus sûre : essayer chaque format connu avec <code>errors=\"coerce\"<\/code>, puis combiner. <code>fillna<\/code> remplit les trous du premier essai avec les résultats du second.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes_brutes.csv\")\n\niso = pd.to_datetime(df[\"date\"], format=\"%Y-%m-%d\", errors=\"coerce\")\nfrancais = pd.to_datetime(df[\"date\"], format=\"%d/%m/%Y\", errors=\"coerce\")\ndf[\"date\"] = iso.fillna(francais)\n\nprint(df[\"date\"].dt.strftime(\"%Y-%m-%d\").tolist())\nprint(\"dates illisibles :\", df[\"date\"].isna().sum())", "err": false}, {"t": "html", "h": "<div class=\"warn\"><span class=\"lab\">Attention<\/span><p>Ne laisse jamais pandas deviner seul un format ambigu : <code>03/07/2025<\/code> est le 3 juillet en France et le 7 mars aux États-Unis. Indique toujours le format attendu.<\/p><\/div><h3>Valeurs manquantes<\/h3><p>D'abord l'audit, colonne par colonne. <code>isna()<\/code> marque les valeurs manquantes, <code>sum()<\/code> les compte, <code>mean()<\/code> en donne la proportion. Ensuite, la décision : elle dépend du sens de la colonne, pas d'une règle technique.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes_brutes.csv\")\ndf[\"montant\"] = pd.to_numeric(df[\"montant\"].str.replace(\",\", \".\"), errors=\"coerce\")\n\n# Audit : nombre et pourcentage de valeurs manquantes par colonne\naudit = pd.DataFrame({\"nb\": df.isna().sum(), \"pct\": (df.isna().mean() * 100).round(1)})\nprint(audit[audit[\"nb\"] > 0])\n\n# Remplacer par un libellé (le COALESCE de SQL)\ndf[\"region\"] = df[\"region\"].fillna(\"Inconnu\")\n\n# Trois options pour un nombre manquant : à choisir selon le contexte métier\nprint(df[\"montant\"].fillna(0).tolist())                       # par 0\nprint(df[\"montant\"].fillna(df[\"montant\"].median()).tolist())  # par la médiane\nprint(len(df.dropna(subset=[\"montant\"])), \"lignes après suppression\")", "err": false}, {"t": "html", "h": "<div class=\"note\"><span class=\"lab\">À retenir<\/span><p>Remplacer un montant manquant par 0 fait baisser la moyenne. Le remplacer par la médiane invente une vente. Supprimer la ligne fait disparaître une commande. Aucune option n'est neutre : note toujours celle que tu as choisie, et pourquoi.<\/p><\/div><h3>Doublons<\/h3><p><code>duplicated()<\/code> marque les lignes déjà vues. Avec <code>keep=False<\/code>, il marque <strong>toutes<\/strong> les lignes d'un groupe de doublons, ce qui permet de les regarder avant de décider.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes_brutes.csv\")\niso = pd.to_datetime(df[\"date\"], format=\"%Y-%m-%d\", errors=\"coerce\")\ndf[\"date\"] = iso.fillna(pd.to_datetime(df[\"date\"], format=\"%d/%m/%Y\", errors=\"coerce\"))\n\n# Voir les doublons exacts (toutes les colonnes identiques)\nprint(df[df.duplicated(keep=False)][[\"id\", \"date\", \"client_id\", \"produit\", \"montant\"]])\n\n# Les supprimer : on garde la première occurrence\nsans_doublons = df.drop_duplicates()\nprint(len(df), \"→\", len(sans_doublons), \"lignes\")\n\n# Doublons sur une combinaison de colonnes clés seulement\nprint(df.duplicated(subset=[\"client_id\", \"date\", \"produit\"]).sum(), \"doublon(s) sur la clé métier\")\n\n# Garder 1 ligne par clé, la plus récente : trier, puis keep=\"last\"\ndernieres = df.sort_values(\"date\").drop_duplicates(subset=[\"client_id\"], keep=\"last\")\nprint(dernieres[[\"client_id\", \"date\", \"produit\"]])", "err": false}, {"t": "html", "h": "<p>Le dernier geste remplace le motif SQL <code>ROW_NUMBER() OVER (PARTITION BY … ORDER BY … DESC)<\/code> suivi de <code>WHERE rn = 1<\/code> : on trie, puis on garde une seule ligne par groupe. Les deux premières lignes de la console convertissent les dates : sans cela, le tri se ferait sur du texte, et <code>08/07/2025<\/code> serait classé avant <code>2025-07-01<\/code>.<\/p><h3>Valeurs aberrantes<\/h3><p>Deux méthodes. Le <strong>seuil fixe<\/strong>, rapide quand on connaît le métier (un montant ne peut pas être négatif). Les <strong>percentiles<\/strong>, quand on ne sait pas d'avance où placer la limite.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes_brutes.csv\")\ndf[\"montant\"] = pd.to_numeric(df[\"montant\"].str.replace(\",\", \".\"), errors=\"coerce\")\n\n# Méthode 1 : seuil fixe, dicté par le métier\nprint(df[(df[\"montant\"] < 0) | (df[\"montant\"] > 10000)][[\"id\", \"produit\", \"quantite\", \"montant\"]])\n\n# Méthode 2 : la règle de l'IQR (écart interquartile)\nq1, q3 = df[\"montant\"].quantile(0.25), df[\"montant\"].quantile(0.75)\niqr = q3 - q1\nbas, haut = q1 - 1.5 * iqr, q3 + 1.5 * iqr\nprint(\"bornes :\", round(bas, 2), \"→\", round(haut, 2))\nprint(df[(df[\"montant\"] < bas) | (df[\"montant\"] > haut)][[\"id\", \"produit\", \"quantite\", \"montant\"]])", "err": false}, {"t": "html", "h": "<p>Le seuil fixe trouve les deux lignes fautives. La règle de l'IQR en signale une troisième, l'écran à 189 € : une valeur <strong>inhabituelle<\/strong>, mais parfaitement <strong>légitime<\/strong>. Une méthode statistique désigne des suspects, elle ne rend pas de verdict. C'est toi qui tranches, en regardant la ligne : ici, 37 800 € pour 2 écrans à 189 € est manifestement une erreur de saisie (378,00 €).<\/p><div class=\"note\"><span class=\"lab\">Variante<\/span><p>Le playbook SQL utilise les 1<sup>er<\/sup> et 99<sup>e<\/sup> percentiles : <code>df[\"montant\"].quantile(0.01)<\/code> et <code>quantile(0.99)<\/code>. Cette méthode convient aux grands volumes ; sur 12 lignes, elle n'isolerait rien d'utile.<\/p><\/div><h3>Intégrité référentielle : les lignes orphelines<\/h3><p>Chaque commande désigne un client par son <code>client_id<\/code>. Ce client existe-t-il dans la table des clients ? En SQL, on fait un <code>LEFT JOIN<\/code> puis <code>WHERE t1.id IS NULL<\/code>. En pandas, <code>merge<\/code> accepte <code>indicator=True<\/code>, qui ajoute une colonne <code>_merge<\/code> indiquant d'où vient chaque ligne.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes_brutes.csv\")\nclients = pd.read_csv(\"clients.csv\")\n\ncontrole = df.merge(clients, on=\"client_id\", how=\"left\", indicator=True)\norphelines = controle[controle[\"_merge\"] == \"left_only\"]\n\nprint(orphelines[[\"id\", \"client_id\", \"produit\"]])\nprint(\"nombre d'orphelines :\", len(orphelines))", "err": false}, {"t": "html", "h": "<h3>Tout assembler dans une fonction<\/h3><p>Un nettoyage doit être <strong>rejouable<\/strong> : demain, le fichier aura de nouvelles lignes. On range donc toutes les étapes dans une fonction, qui prend le tableau brut et renvoie le tableau propre, en affichant ce qu'elle a écarté.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\n\ndef nettoyer(brut):\n    df = brut.copy()\n    df[\"montant\"] = pd.to_numeric(df[\"montant\"].str.replace(\",\", \".\"), errors=\"coerce\")\n    iso = pd.to_datetime(df[\"date\"], format=\"%Y-%m-%d\", errors=\"coerce\")\n    df[\"date\"] = iso.fillna(pd.to_datetime(df[\"date\"], format=\"%d/%m/%Y\", errors=\"coerce\"))\n    for colonne in [\"region\", \"categorie\"]:\n        df[colonne] = df[colonne].str.strip().str.title()\n    df[\"region\"] = df[\"region\"].fillna(\"Inconnu\")\n    df = df.drop_duplicates()\n    valide = df[\"montant\"].between(0.01, 10000)\n    print(len(brut) - len(df), \"doublon(s) supprimé(s),\", (~valide).sum(), \"ligne(s) au montant invalide écartée(s)\")\n    return df[valide]\n\n\npropre = nettoyer(pd.read_csv(\"commandes_brutes.csv\"))\nprint(propre[[\"id\", \"date\", \"region\", \"categorie\", \"montant\"]])", "err": false}, {"t": "html", "h": "<p><code>brut.copy()<\/code> évite de modifier le tableau reçu : c'est le piège des références vu dans <a href=\"#copies-et-tris\">Copies, références et tris<\/a>. <code>between(a, b)<\/code> est le <code>BETWEEN<\/code> de SQL, bornes incluses ; une valeur manquante n'est jamais « entre », elle est donc écartée elle aussi.<\/p>"}, {"t": "exo", "id": "pb-nettoyage-1", "title": "Le grand ménage", "h": "<p>Nettoie <code>commandes_brutes.csv<\/code> et range le résultat dans <code>propre<\/code>, en quatre étapes :<\/p><ol><li>convertis <code>montant<\/code> en nombre (attention à la virgule) ;<\/li><li>harmonise <code>region<\/code> : sans espaces autour, une majuscule au début, et <code>Inconnu<\/code> pour la valeur manquante ;<\/li><li>supprime les doublons exacts ;<\/li><li>ne garde que les lignes dont le montant est strictement positif et inférieur ou égal à 10 000.<\/li><\/ol>", "starter": "import pandas as pd\n\ndf = pd.read_csv(\"commandes_brutes.csv\")\n# Nettoie df et construis propre\n\nprint(len(propre), round(propre[\"montant\"].sum(), 2))", "solution": "import pandas as pd\n\ndf = pd.read_csv(\"commandes_brutes.csv\")\ndf[\"montant\"] = pd.to_numeric(df[\"montant\"].str.replace(\",\", \".\"), errors=\"coerce\")\ndf[\"region\"] = df[\"region\"].str.strip().str.title().fillna(\"Inconnu\")\ndf = df.drop_duplicates()\npropre = df[(df[\"montant\"] > 0) & (df[\"montant\"] <= 10000)]\n\nprint(len(propre), round(propre[\"montant\"].sum(), 2))", "tests": "import pandas as pd\nassert isinstance(propre, pd.DataFrame), \"propre doit être un DataFrame.\"\nassert str(propre[\"montant\"].dtype) == \"float64\", \"La colonne montant doit être numérique : remplace la virgule par un point, puis utilise pd.to_numeric.\"\nassert propre[\"id\"].is_unique, \"Il reste un doublon : la commande 2005 apparaît deux fois. Utilise drop_duplicates().\"\nassert len(propre) == 8, \"On attend 8 lignes : 12 au départ, moins 1 doublon, 1 montant manquant, 1 montant négatif et 1 montant aberrant. Tu en obtiens %d.\" % len(propre)\nassert abs(float(propre[\"montant\"].sum()) - 384.4) < 0.005, \"La somme des montants doit valoir 384.4. Tu obtiens %r.\" % round(float(propre[\"montant\"].sum()), 2)\nregions = sorted(propre[\"region\"].unique())\nassert regions == [\"Inconnu\", \"Nord\", \"Ouest\", \"Sud\"], \"Les régions attendues sont Inconnu, Nord, Ouest et Sud. Tu obtiens %r.\" % (regions,)", "hint": "<p>Étape 1 : <code>pd.to_numeric(df[\"montant\"].str.replace(\",\", \".\"), errors=\"coerce\")<\/code>. Étape 2 : enchaîne <code>.str.strip().str.title().fillna(\"Inconnu\")<\/code>. Étape 4 : combine deux conditions avec <code>&amp;<\/code>, chacune entre parenthèses.<\/p>", "stdin": "", "skel": ""}]}, {"id": "pb-ref-debutant", "title": "Référentiel SQL → pandas, niveau débutant", "blocks": [{"t": "html", "h": "<p>Le référentiel reprend, dans le même ordre et avec les mêmes numéros, les 21 fiches du référentiel SQL du playbook. Pour chaque fiche : le <strong>rappel SQL<\/strong> (à lire), puis l'<strong>équivalent pandas<\/strong> (à exécuter et à modifier). Les requêtes SQL sont écrites pour la table <code>commandes<\/code> ; la <a href=\"#pb-etat-d-esprit\">convention de nommage<\/a> donne la correspondance avec les noms génériques.<\/p><p>Niveau débutant, fiches 1 à 7 : lire, choisir, filtrer, trier. Ces sept gestes couvrent une grande partie des besoins quotidiens.<\/p><div class=\"tw\"><table><thead><tr><th>SQL<\/th><th>pandas<\/th><\/tr><\/thead><tbody><tr><td><code>SELECT *<\/code><\/td><td><code>df<\/code><\/td><\/tr><tr><td><code>SELECT a, b<\/code><\/td><td><code>df[[\"a\", \"b\"]]<\/code><\/td><\/tr><tr><td><code>AS<\/code><\/td><td><code>rename(columns={…})<\/code><\/td><\/tr><tr><td><code>WHERE<\/code><\/td><td><code>df[condition]<\/code><\/td><\/tr><tr><td><code>ORDER BY<\/code><\/td><td><code>sort_values<\/code><\/td><\/tr><tr><td><code>LIMIT<\/code> / <code>TOP<\/code><\/td><td><code>head<\/code>, <code>nlargest<\/code><\/td><\/tr><tr><td><code>DISTINCT<\/code><\/td><td><code>unique<\/code>, <code>nunique<\/code>, <code>drop_duplicates<\/code><\/td><\/tr><\/tbody><\/table><\/div><h3>1 · Lire toute une table<\/h3><pre class=\"static sql\">SELECT *\nFROM commandes;<\/pre><p>En pandas, la table entière est le DataFrame lui-même. On n'affiche presque jamais tout : <code>head(n)<\/code> montre les <code>n<\/code> premières lignes, <code>tail(n)<\/code> les dernières.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nprint(df.head(3))\nprint(len(df), \"lignes,\", len(df.columns), \"colonnes\")", "err": false}, {"t": "html", "h": "<p>Quand le tableau est trop large pour l'écran, pandas remplace les colonnes du milieu par <code>...<\/code>. Rien n'est perdu : c'est seulement l'affichage.<\/p><h3>2 · Sélectionner des colonnes précises<\/h3><pre class=\"static sql\">SELECT id, categorie, montant, date\nFROM commandes;<\/pre><p>Des <strong>doubles crochets<\/strong> : les crochets extérieurs disent « je sélectionne », les crochets intérieurs sont une liste de noms de colonnes.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nprint(df[[\"id\", \"categorie\", \"montant\", \"date\"]].head())", "err": false}, {"t": "html", "h": "<h3>3 · Alias (renommer)<\/h3><pre class=\"static sql\">SELECT categorie AS famille,\n       montant   AS ca\nFROM commandes;<\/pre><p><code>rename<\/code> prend un dictionnaire <code>{ancien_nom: nouveau_nom}<\/code> et renvoie un nouveau tableau ; <code>df<\/code> n'est pas modifié.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nrenomme = df[[\"categorie\", \"montant\"]].rename(columns={\"categorie\": \"famille\", \"montant\": \"ca\"})\nprint(renomme.head(3))", "err": false}, {"t": "html", "h": "<h3>4 · Filtrer les lignes (WHERE)<\/h3><pre class=\"static sql\">-- Égalité sur une catégorie\nSELECT * FROM commandes WHERE categorie = 'Maison';\n-- Comparaison numérique\nSELECT * FROM commandes WHERE montant &gt; 100;\n-- ET / OU\nSELECT * FROM commandes WHERE categorie = 'Maison' AND montant &gt; 50;\n-- Liste de valeurs\nSELECT * FROM commandes WHERE region IN ('Nord', 'Sud');\n-- Plage numérique\nSELECT * FROM commandes WHERE montant BETWEEN 10 AND 100;\n-- Recherche de texte partiel\nSELECT * FROM commandes WHERE produit LIKE '%la%';<\/pre><p>Une condition sur une colonne produit une colonne de <code>True<\/code>/<code>False<\/code>, appelée <strong>masque<\/strong>. <code>df[masque]<\/code> garde les lignes où le masque vaut <code>True<\/code>.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\n# Égalité sur une catégorie\nprint(len(df[df[\"categorie\"] == \"Maison\"]))\n\n# Comparaison numérique\nprint(len(df[df[\"montant\"] > 100]))\n\n# ET : &   OU : |   NON : ~   (chaque condition entre parenthèses)\nprint(len(df[(df[\"categorie\"] == \"Maison\") & (df[\"montant\"] > 50)]))\n\n# Liste de valeurs : IN devient isin\nprint(len(df[df[\"region\"].isin([\"Nord\", \"Sud\"])]))\n\n# Plage numérique : BETWEEN devient between (bornes incluses)\nprint(len(df[df[\"montant\"].between(10, 100)]))\n\n# Texte partiel : LIKE '%la%' devient str.contains\nprint(df[df[\"produit\"].str.contains(\"la\")][\"produit\"].unique())", "err": false}, {"t": "html", "h": "<div class=\"warn\"><span class=\"lab\">Attention<\/span><p>En pandas, <code>and<\/code> et <code>or<\/code> ne fonctionnent pas entre deux masques : il faut <code>&amp;<\/code> et <code>|<\/code>. Et comme ces opérateurs sont prioritaires sur les comparaisons, chaque condition doit être entourée de parenthèses.<\/p><\/div><p>Il existe aussi <code>df.query(\"categorie == 'Maison' and montant &gt; 50\")<\/code>, qui s'écrit presque comme un <code>WHERE<\/code>.<\/p><h3>5 · Trier (ORDER BY)<\/h3><pre class=\"static sql\">-- Croissant (par défaut)\nSELECT * FROM commandes ORDER BY montant ASC;\n-- Décroissant\nSELECT * FROM commandes ORDER BY montant DESC;\n-- Plusieurs colonnes\nSELECT * FROM commandes ORDER BY categorie ASC, montant DESC;<\/pre>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\ncolonnes = [\"id\", \"categorie\", \"montant\"]\n\n# Croissant (par défaut)\nprint(df.sort_values(\"montant\")[colonnes].head(3))\n\n# Décroissant\nprint(df.sort_values(\"montant\", ascending=False)[colonnes].head(3))\n\n# Plusieurs colonnes, chacune avec son sens\nprint(df.sort_values([\"categorie\", \"montant\"], ascending=[True, False])[colonnes].head(3))", "err": false}, {"t": "html", "h": "<h3>6 · Limiter les résultats<\/h3><pre class=\"static sql\">-- SQL Server / T-SQL\nSELECT TOP 10 * FROM commandes ORDER BY montant DESC;\n-- MySQL / PostgreSQL / SQLite\nSELECT * FROM commandes ORDER BY montant DESC LIMIT 10;<\/pre><p>On trie puis on prend la tête. <code>nlargest(n, colonne)<\/code> fait les deux en un appel ; <code>nsmallest<\/code> donne les plus petites.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nprint(df.sort_values(\"montant\", ascending=False).head(5)[[\"id\", \"produit\", \"montant\"]])\nprint(df.nlargest(5, \"montant\")[[\"id\", \"produit\", \"montant\"]])", "err": false}, {"t": "html", "h": "<h3>7 · Valeurs distinctes (DISTINCT)<\/h3><pre class=\"static sql\">-- Lister toutes les catégories uniques\nSELECT DISTINCT categorie FROM commandes;\n-- Compter les valeurs distinctes\nSELECT COUNT(DISTINCT categorie) AS nb_unique FROM commandes;<\/pre>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\n# Lister les valeurs uniques\nprint(df[\"categorie\"].unique())\n\n# Compter les valeurs distinctes\nprint(df[\"categorie\"].nunique())\n\n# DISTINCT sur plusieurs colonnes : les combinaisons qui existent\nprint(df[[\"region\", \"canal\"]].drop_duplicates().sort_values([\"region\", \"canal\"]))", "err": false}, {"t": "exo", "id": "pb-ref-debutant-1", "title": "Les 4 plus grosses commandes en ligne", "h": "<p>Construis <code>top<\/code> : les 4 commandes au plus gros <code>montant<\/code> parmi celles du canal <code>En ligne<\/code> dont le statut est <code>livree<\/code>. Le tableau ne doit contenir que les colonnes <code>id<\/code>, <code>produit<\/code> et <code>montant<\/code>, dans cet ordre, de la plus grosse commande à la plus petite.<\/p>", "starter": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n# Construis top\n\nprint(top)", "solution": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\nlivrees_en_ligne = df[(df[\"canal\"] == \"En ligne\") & (df[\"statut\"] == \"livree\")]\ntop = livrees_en_ligne.nlargest(4, \"montant\")[[\"id\", \"produit\", \"montant\"]]\n\nprint(top)", "tests": "import pandas as pd\nassert isinstance(top, pd.DataFrame), \"top doit être un DataFrame.\"\nassert list(top.columns) == [\"id\", \"produit\", \"montant\"], \"Les colonnes attendues sont id, produit, montant, dans cet ordre. Tu obtiens %r.\" % (list(top.columns),)\nassert len(top) == 4, \"On attend 4 lignes. Tu en obtiens %d.\" % len(top)\nm = [float(v) for v in top[\"montant\"]]\nassert m == [378.0, 189.0, 189.0, 189.0], \"Les montants attendus sont 378.0, 189.0, 189.0, 189.0. Tu obtiens %r. Vérifie les deux filtres (canal et statut) et le sens du tri.\" % (m,)\nassert set(int(i) for i in top[\"id\"]) == {1072, 1008, 1024, 1043}, \"Ce ne sont pas les bonnes commandes : garde uniquement le canal En ligne ET le statut livree.\"", "hint": "<p>Trois gestes : un filtre avec deux conditions reliées par <code>&amp;<\/code>, puis <code>nlargest(4, \"montant\")<\/code>, puis une sélection de colonnes avec des doubles crochets.<\/p>", "stdin": "", "skel": ""}]}, {"id": "pb-ref-intermediaire", "title": "Référentiel SQL → pandas, niveau intermédiaire", "blocks": [{"t": "html", "h": "<p>Niveau intermédiaire, fiches 8 à 14 : regrouper, croiser plusieurs tables, écrire une logique conditionnelle, manipuler les dates. Avec le niveau débutant, c'est l'essentiel du travail quotidien d'un analyste junior.<\/p><div class=\"tw\"><table><thead><tr><th>SQL<\/th><th>pandas<\/th><\/tr><\/thead><tbody><tr><td><code>GROUP BY<\/code> + agrégats<\/td><td><code>groupby(…).agg(…)<\/code><\/td><\/tr><tr><td><code>HAVING<\/code><\/td><td>un filtre <strong>après<\/strong> le <code>groupby<\/code><\/td><\/tr><tr><td><code>JOIN<\/code><\/td><td><code>merge<\/code><\/td><\/tr><tr><td><code>CASE WHEN<\/code><\/td><td><code>np.select<\/code>, <code>pd.cut<\/code><\/td><\/tr><tr><td>sous-requête<\/td><td>une variable intermédiaire<\/td><\/tr><tr><td><code>YEAR<\/code>, <code>FORMAT<\/code>, <code>DATEDIFF<\/code><\/td><td>l'accesseur <code>.dt<\/code><\/td><\/tr><tr><td><code>UNION ALL<\/code> / <code>UNION<\/code><\/td><td><code>pd.concat<\/code> (+ <code>drop_duplicates<\/code>)<\/td><\/tr><\/tbody><\/table><\/div><h3>8 · Agrégations (GROUP BY)<\/h3><pre class=\"static sql\">SELECT categorie,\n       COUNT(*)     AS nb,\n       SUM(montant) AS total,\n       AVG(montant) AS moyenne,\n       MIN(montant) AS minimum,\n       MAX(montant) AS maximum\nFROM commandes\nGROUP BY categorie\nORDER BY total DESC;<\/pre><p>Dans <code>agg<\/code>, chaque argument s'écrit <code>nom_du_resultat=(colonne, fonction)<\/code>. C'est l'équivalent exact de <code>FONCTION(colonne) AS nom<\/code>.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nbilan = df.groupby(\"categorie\").agg(\n    nb=(\"id\", \"count\"),\n    total=(\"montant\", \"sum\"),\n    moyenne=(\"montant\", \"mean\"),\n    minimum=(\"montant\", \"min\"),\n    maximum=(\"montant\", \"max\"),\n).sort_values(\"total\", ascending=False)\n\nprint(bilan.round(2))", "err": false}, {"t": "html", "h": "<h3>9 · Filtrer après agrégation (HAVING)<\/h3><pre class=\"static sql\">-- WHERE filtre les lignes AVANT l'agrégation\n-- HAVING filtre les groupes APRÈS l'agrégation\nSELECT produit, COUNT(*) AS nb\nFROM commandes\nWHERE statut = 'livree'     -- filtre les lignes d'abord\nGROUP BY produit\nHAVING COUNT(*) &gt;= 8;       -- filtre les groupes ensuite<\/pre><p>pandas n'a pas de mot spécial pour <code>HAVING<\/code>, et n'en a pas besoin : le code s'exécute de haut en bas. Un filtre placé <strong>avant<\/strong> le <code>groupby<\/code> est un <code>WHERE<\/code> ; un filtre placé <strong>après<\/strong> est un <code>HAVING<\/code>.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nlivrees = df[df[\"statut\"] == \"livree\"]           # WHERE : on filtre les lignes\nnb = livrees.groupby(\"produit\")[\"id\"].count()    # GROUP BY\nprint(nb[nb >= 8])                               # HAVING : on filtre les groupes", "err": false}, {"t": "html", "h": "<h3>10 · Jointures (JOIN)<\/h3><pre class=\"static sql\">-- INNER JOIN : seulement les correspondances dans les 2 tables\nSELECT co.id, cl.nom, co.montant\nFROM commandes co\nINNER JOIN clients cl ON co.client_id = cl.client_id;\n-- LEFT JOIN : toutes les lignes de commandes, même sans correspondance\nSELECT co.id, cl.nom, co.montant\nFROM commandes co\nLEFT JOIN clients cl ON co.client_id = cl.client_id;\n-- Jointure sur 3 tables\nSELECT co.id, cl.nom, ob.objectif\nFROM commandes co\nJOIN clients   cl ON co.client_id = cl.client_id\nJOIN objectifs ob ON co.region = ob.region;<\/pre><p><code>merge<\/code> croise deux tableaux. <code>on<\/code> nomme la colonne commune, <code>how<\/code> le type de jointure (<code>\"inner\"<\/code> par défaut, <code>\"left\"<\/code>, <code>\"right\"<\/code>, <code>\"outer\"<\/code>). Le fichier <code>clients.csv<\/code> connaît 5 clients, alors que les commandes en citent 6 : parfait pour voir la différence.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\nclients = pd.read_csv(\"clients.csv\")\n\n# INNER JOIN : seulement les commandes dont le client est connu\ninterne = df.merge(clients, on=\"client_id\", how=\"inner\")\nprint(len(df), \"commandes →\", len(interne), \"après INNER JOIN\")\n\n# LEFT JOIN : toutes les commandes ; nom vide (NaN) si le client est inconnu\ngauche = df.merge(clients, on=\"client_id\", how=\"left\")\nprint(len(gauche), \"après LEFT JOIN, dont\", gauche[\"nom\"].isna().sum(), \"sans client connu\")\n\n# Jointure sur 3 tables : on enchaîne les merge\nobjectifs = pd.DataFrame({\"region\": [\"Nord\", \"Ouest\", \"Sud\"], \"objectif\": [1500, 2500, 1500]})\ncomplet = df.merge(clients, on=\"client_id\").merge(objectifs, on=\"region\")\nprint(complet[[\"id\", \"nom\", \"region\", \"objectif\"]].head(3))", "err": false}, {"t": "html", "h": "<div class=\"note\"><span class=\"lab\">Le réflexe à garder<\/span><p>Compte toujours les lignes avant et après un <code>merge<\/code>. Moins de lignes : des clés n'ont pas trouvé de correspondance. Plus de lignes : une clé est en double dans l'une des tables, et tes sommes seront fausses. Quand les colonnes n'ont pas le même nom, utilise <code>left_on<\/code> et <code>right_on<\/code>.<\/p><\/div><h3>11 · Logique conditionnelle (CASE WHEN)<\/h3><pre class=\"static sql\">-- Segmenter une valeur numérique en catégories\nSELECT id, montant,\n  CASE\n    WHEN montant &gt;= 100 THEN 'Élevé'\n    WHEN montant &gt;= 50  THEN 'Moyen'\n    ELSE                     'Faible'\n  END AS segment\nFROM commandes;\n-- Compter conditionnellement (motif très courant)\nSELECT\n  SUM(CASE WHEN statut = 'annulee'   THEN 1 ELSE 0 END) AS nb_annulees,\n  SUM(CASE WHEN statut = 'retournee' THEN 1 ELSE 0 END) AS nb_retournees\nFROM commandes;<\/pre><p><code>np.select<\/code> (de la bibliothèque NumPy) se lit comme un <code>CASE WHEN<\/code> : une liste de conditions, la liste des valeurs correspondantes, et <code>default<\/code> pour le <code>ELSE<\/code>. Comme en SQL, la <strong>première<\/strong> condition vraie l'emporte.<\/p>"}, {"t": "code", "c": "import numpy as np\nimport pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\n# Segmenter une valeur numérique en catégories\nconditions = [df[\"montant\"] >= 100, df[\"montant\"] >= 50]\nvaleurs = [\"Élevé\", \"Moyen\"]\ndf[\"segment\"] = np.select(conditions, valeurs, default=\"Faible\")\nprint(df[\"segment\"].value_counts())\n\n# Compter conditionnellement : la somme d'un masque compte les True\nprint(\"annulées   :\", (df[\"statut\"] == \"annulee\").sum())\nprint(\"retournées :\", (df[\"statut\"] == \"retournee\").sum())", "err": false}, {"t": "html", "h": "<p>Pour découper une colonne numérique en tranches régulières, <code>pd.cut(df[\"montant\"], bins=[0, 50, 100, 1000], labels=[\"Faible\", \"Moyen\", \"Élevé\"], right=False)<\/code> donne le même résultat en une ligne. <code>right=False<\/code> signifie que chaque tranche inclut sa borne basse et exclut sa borne haute.<\/p><h3>12 · Sous-requêtes<\/h3><pre class=\"static sql\">-- Dans le WHERE : garder les lignes au-dessus de la moyenne\nSELECT * FROM commandes\nWHERE montant &gt; (SELECT AVG(montant) FROM commandes);\n-- Dans le FROM : un résultat intermédiaire utilisé comme une table\nSELECT sub.produit, sub.total\nFROM (\n  SELECT produit, SUM(montant) AS total\n  FROM commandes GROUP BY produit\n) AS sub\nWHERE sub.total &gt; 400;<\/pre><p>En Python, une sous-requête est simplement une <strong>variable intermédiaire<\/strong> : on calcule d'abord, on nomme le résultat, on s'en sert ensuite. Le code se lit dans l'ordre où il s'exécute.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\n# Dans le WHERE : une valeur calculée d'abord\nmoyenne = df[\"montant\"].mean()\nprint(round(moyenne, 2), \"→\", len(df[df[\"montant\"] > moyenne]), \"commandes au-dessus de la moyenne\")\n\n# Dans le FROM : un tableau intermédiaire\ntotaux = df.groupby(\"produit\")[\"montant\"].sum()\nprint(totaux[totaux > 400].sort_values(ascending=False))", "err": false}, {"t": "html", "h": "<h3>13 · Manipuler les dates<\/h3><pre class=\"static sql\">-- Extraire année, mois, jour (SQL Server)\nSELECT YEAR(date) AS annee, MONTH(date) AS mois, DAY(date) AS jour\nFROM commandes;\n-- Grouper par mois\nSELECT FORMAT(date, 'yyyy-MM') AS annee_mois, SUM(montant) AS total\nFROM commandes\nGROUP BY FORMAT(date, 'yyyy-MM')\nORDER BY annee_mois;\n-- Différence en jours\nSELECT DATEDIFF(day, date, '2025-06-30') AS nb_jours FROM commandes;\n-- Filtrer sur une période\nSELECT * FROM commandes\nWHERE date BETWEEN '2025-03-01' AND '2025-03-31';<\/pre><p>Une colonne de dates donne accès à l'accesseur <code>.dt<\/code> : <code>.dt.year<\/code>, <code>.dt.month<\/code>, <code>.dt.day<\/code>, <code>.dt.day_name()<\/code>… La soustraction de deux dates donne une durée, dont <code>.dt.days<\/code> extrait le nombre de jours.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\n# Extraire année, mois, jour\ndf[\"annee\"] = df[\"date\"].dt.year\ndf[\"mois\"] = df[\"date\"].dt.month\ndf[\"jour\"] = df[\"date\"].dt.day\nprint(df[[\"date\", \"annee\", \"mois\", \"jour\"]].head(3))\n\n# Grouper par mois\ndf[\"annee_mois\"] = df[\"date\"].dt.strftime(\"%Y-%m\")\nprint(df.groupby(\"annee_mois\")[\"montant\"].sum())\n\n# Différence en jours avec une date de référence\ndf[\"nb_jours\"] = (pd.Timestamp(\"2025-06-30\") - df[\"date\"]).dt.days\nprint(df[[\"date\", \"nb_jours\"]].tail(3))\n\n# Filtrer sur une période\nmars = df[df[\"date\"].between(\"2025-03-01\", \"2025-03-31\")]\nprint(len(mars), \"commandes en mars\")", "err": false}, {"t": "html", "h": "<h3>14 · Combiner des requêtes (UNION)<\/h3><pre class=\"static sql\">-- UNION ALL : empile (garde les doublons)\nSELECT region, canal FROM commandes_t1\nUNION ALL\nSELECT region, canal FROM commandes_t2;\n-- UNION : empile et supprime les doublons\nSELECT region, canal FROM commandes_t1\nUNION\nSELECT region, canal FROM commandes_t2;<\/pre><p><code>pd.concat<\/code> empile des tableaux qui ont les mêmes colonnes. <code>ignore_index=True<\/code> renumérote les lignes de 0 à n−1. Pour illustrer, on coupe les commandes en deux trimestres, puis on les réunit.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nt1 = df[df[\"date\"] < \"2025-04-01\"][[\"region\", \"canal\"]]\nt2 = df[df[\"date\"] >= \"2025-04-01\"][[\"region\", \"canal\"]]\n\n# UNION ALL : on empile tout\ntout = pd.concat([t1, t2], ignore_index=True)\nprint(len(t1), \"+\", len(t2), \"=\", len(tout))\n\n# UNION : on empile, puis on supprime les doublons\nprint(len(tout.drop_duplicates()), \"combinaisons distinctes\")", "err": false}, {"t": "exo", "id": "pb-ref-intermediaire-1", "title": "Les régions qui pèsent", "h": "<p>Construis <code>grosses<\/code> : le chiffre d'affaires par <code>region<\/code>, calculé <strong>uniquement sur les commandes livrées<\/strong> (statut <code>livree<\/code>), en ne gardant que les régions qui dépassent 1 070 €. Le résultat est une Series triée de la plus grosse région à la plus petite.<\/p><p>C'est un <code>WHERE<\/code>, un <code>GROUP BY<\/code> et un <code>HAVING<\/code>, dans cet ordre.<\/p>", "starter": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n# Construis grosses\n\nprint(grosses)", "solution": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\nlivrees = df[df[\"statut\"] == \"livree\"]\nca = livrees.groupby(\"region\")[\"montant\"].sum()\ngrosses = ca[ca > 1070].sort_values(as
