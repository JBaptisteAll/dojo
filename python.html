) * 1000:.1f} ms\")\ndebut = time.perf_counter()\nfibo_rapide(24)\nprint(f\"avec cache : {(time.perf_counter() - debut) * 1000:.3f} ms\")\nprint(fibo_rapide(90))", "err": false}, {"t": "html", "h": "<div class=\"warn\"><span class=\"lab\">Attention<\/span><p>Un cache ne convient qu'aux fonctions <strong>pures<\/strong> : mêmes arguments, même résultat, aucun effet extérieur. Mettre en cache une fonction qui lit un fichier ou l'heure courante renvoie des résultats périmés.<\/p><\/div>"}, {"t": "exo", "id": "memoire-et-cache-1", "title": "Les premières lignes valides", "h": "<p>Écris un <strong>générateur<\/strong> <code>lignes_valides(lignes)<\/code> qui parcourt un flux de textes et produit, convertis en <code>float<\/code>, ceux qui représentent un nombre. Écris ensuite <code>premiers(flux, n)<\/code> qui renvoie la liste des <code>n<\/code> premiers éléments d'un flux, sans consommer la suite. Les deux doivent fonctionner sur un flux infini.<\/p>", "starter": "from itertools import islice\n\n\ndef lignes_valides(lignes):\n    pass\n\n\ndef premiers(flux, n):\n    pass\n\n\nprint(premiers(lignes_valides([\"1\", \"x\", \"2.5\", \"\", \"4\"]), 2))", "solution": "from itertools import islice\n\n\ndef lignes_valides(lignes):\n    for texte in lignes:\n        try:\n            yield float(texte)\n        except ValueError:\n            continue\n\n\ndef premiers(flux, n):\n    return list(islice(flux, n))\n\n\nprint(premiers(lignes_valides([\"1\", \"x\", \"2.5\", \"\", \"4\"]), 2))", "tests": "import inspect, itertools\nassert inspect.isgenerator(lignes_valides([])), \"lignes_valides doit être un générateur : utilise yield.\"\nassert list(lignes_valides([\"1\", \"x\", \"2.5\", \"\", \"4\"])) == [1.0, 2.5, 4.0], \"On attend 1.0, 2.5 et 4.0.\"\ndef infini():\n    for i in itertools.count():\n        yield str(i) if i % 2 else \"pas un nombre\"\nassert premiers(lignes_valides(infini()), 3) == [1.0, 3.0, 5.0], \"Sur un flux infini, premiers(..., 3) doit renvoyer [1.0, 3.0, 5.0].\"\ng = iter(range(10))\nassert premiers(g, 2) == [0, 1] and next(g) == 2, \"premiers ne doit consommer que n éléments du flux.\"", "hint": "<p><code>lignes_valides<\/code> : une boucle avec <code>try: yield float(texte)<\/code> et <code>except ValueError: continue<\/code>. <code>premiers<\/code> : <code>list(islice(flux, n))<\/code>.<\/p>", "stdin": "", "skel": "from itertools import islice\n\ndef lignes_valides(lignes):\n    for texte in lignes:\n        try:\n            ...\n        except ValueError:\n            ...\n\ndef premiers(flux, n):\n    return ...\n\nprint(premiers(lignes_valides([\"1\", \"x\", \"2.5\", \"\", \"4\"]), 2))"}]}, {"id": "profiler-et-concurrence", "title": "Profiler, vectoriser, paralléliser", "blocks": [{"t": "html", "h": "<h3>Trouver le point chaud<\/h3><p>Un <strong>profileur<\/strong> mesure le temps passé dans chaque fonction. Celui de la bibliothèque standard s'appelle <code>cProfile<\/code>. On lit le tableau en cherchant la ligne au plus grand temps cumulé.<\/p>"}, {"t": "code", "c": "import cProfile\nimport pstats\n\n\ndef lent(n):\n    return sum(i * i for i in range(n))\n\n\ndef rapide(n):\n    return n\n\n\ndef programme():\n    for _ in range(30):\n        lent(20000)\n        rapide(20000)\n\n\nprofil = cProfile.Profile()\nprofil.runcall(programme)\npstats.Stats(profil).sort_stats(\"cumulative\").print_stats(4)", "err": false}, {"t": "html", "h": "<p>Presque tout le temps est passé dans <code>lent<\/code>. Optimiser <code>rapide<\/code> ne servirait à rien. C'est la leçon du profilage : quelques lignes concentrent l'essentiel du temps.<\/p><h3>Les leviers, du plus rentable au moins rentable<\/h3><ol><li><strong>Un meilleur algorithme ou une meilleure structure<\/strong> : passer de O(n²) à O(n) avec un dictionnaire.<\/li><li><strong>Ne pas refaire<\/strong> : cache, calcul sorti de la boucle, lecture unique du fichier.<\/li><li><strong>Vectoriser<\/strong> : confier les calculs numériques à NumPy, pandas ou Polars, écrits en C ou en Rust. Tu le verras dans le module « NumPy et Polars ».<\/li><li><strong>Paralléliser<\/strong>, en dernier, car c'est le plus délicat.<\/li><\/ol><h3>Faire plusieurs choses à la fois<\/h3><p>Deux situations très différentes :<\/p><ul><li>Le programme <strong>attend<\/strong> : une réponse d'API, une base de données, un fichier distant. Pendant l'attente, le processeur ne fait rien. On peut lancer plusieurs attentes en même temps avec des <strong>threads<\/strong> ou avec <code>asyncio<\/code>.<\/li><li>Le programme <strong>calcule<\/strong> : le processeur est occupé à 100 %. Il faut répartir le travail sur plusieurs cœurs avec <code>multiprocessing<\/code>.<\/li><\/ul><p>Cette page ne peut pas exécuter de code parallèle. Voici à quoi ressemble le cas le plus courant, cent appels d'API lancés par paquets de dix :<\/p><pre class=\"static\">from concurrent.futures import ThreadPoolExecutor\nimport requests\n\ndef telecharger(url):\n    return requests.get(url, timeout=10).json()\n\nwith ThreadPoolExecutor(max_workers=10) as executeur:\n    resultats = list(executeur.map(telecharger, urls))<\/pre><p><code>executeur.map<\/code> se comporte comme une boucle, sauf que dix appels sont en cours en permanence. Sur des appels réseau, le gain est souvent d'un facteur dix, pour trois lignes de code.<\/p>"}, {"t": "quiz", "id": "profiler-et-concurrence-1", "title": "Où part le temps ?", "h": "<p>Deux fonctions, appelées sur une liste de 1 000 éléments. Combien de comparaisons fait chacune dans le pire des cas ? Le programme affiche les deux nombres.<\/p>", "code": "def cherche_dans_liste(n):\n    return n * n          # n recherches, chacune parcourt n éléments\n\n\ndef cherche_dans_ensemble(n):\n    return n * 1          # n recherches, chacune en une étape\n\n\nprint(cherche_dans_liste(1000))\nprint(cherche_dans_ensemble(1000))", "expected": "1000000\n1000"}]}]}, {"id": "donnees-python", "title": "Analyser des données en Python pur", "desc": "Répondre à des questions métier avec un fichier, des boucles et des dictionnaires.", "lessons": [{"id": "questions-sur-les-ventes", "title": "Un fichier, des questions", "blocks": [{"t": "html", "h": "<p>Tu as maintenant tous les outils pour faire une vraie analyse. Le fichier <code>ventes.csv<\/code> contient les 18 ventes du premier trimestre 2025 d'une petite boutique : <code>date<\/code>, <code>client_id<\/code>, <code>produit<\/code>, <code>categorie<\/code>, <code>quantite<\/code>, <code>prix_unitaire<\/code>.<\/p><p>Une analyse suit toujours le même chemin : <strong>charger<\/strong> les données, les <strong>préparer<\/strong> (convertir les types, calculer les colonnes utiles), puis <strong>répondre<\/strong> aux questions avec les gestes filtrer, additionner, compter, regrouper, trier.<\/p>"}, {"t": "code", "c": "import csv\n\n\ndef charger_ventes(nom_fichier):\n    with open(nom_fichier, encoding=\"utf-8\") as fichier:\n        ventes = list(csv.DictReader(fichier))\n    for v in ventes:\n        v[\"quantite\"] = int(v[\"quantite\"])\n        v[\"prix_unitaire\"] = float(v[\"prix_unitaire\"])\n        v[\"montant\"] = v[\"quantite\"] * v[\"prix_unitaire\"]\n    return ventes\n\n\nventes = charger_ventes(\"ventes.csv\")\n\n# Question 1 : quel est le chiffre d'affaires total ?\nca_total = sum(v[\"montant\"] for v in ventes)\nprint(f\"CA total : {ca_total:.2f} €\")\n\n# Question 2 : combien de ventes dépassent 50 € ?\ngrosses = [v for v in ventes if v[\"montant\"] > 50]\nprint(len(grosses), \"ventes de plus de 50 €\")\n\n# Question 3 : quelle est la plus grosse vente ?\nrecord = max(ventes, key=lambda v: v[\"montant\"])\nprint(record[\"date\"], record[\"produit\"], record[\"montant\"])\n\n# Question 4 : combien de ventes par catégorie ?\npar_categorie = {}\nfor v in ventes:\n    par_categorie[v[\"categorie\"]] = par_categorie.get(v[\"categorie\"], 0) + 1\nprint(par_categorie)", "err": false}, {"t": "html", "h": "<p>Remarque la préparation : la colonne <code>montant<\/code> est calculée une fois au chargement, puis réutilisée par toutes les questions.<\/p><p>Dans les exercices suivants, la fonction <code>charger_ventes<\/code> t'est fournie. Tes fonctions reçoivent la liste <code>ventes<\/code> déjà préparée.<\/p>"}, {"t": "exo", "id": "questions-sur-les-ventes-1", "title": "Le chiffre d'affaires par catégorie", "h": "<p>Écris <code>ca_par_categorie(ventes)<\/code> qui renvoie un dictionnaire catégorie → chiffre d'affaires, arrondi à 2 décimales.<\/p>", "starter": "import csv\n\n\ndef charger_ventes(nom_fichier):\n    with open(nom_fichier, encoding=\"utf-8\") as fichier:\n        ventes = list(csv.DictReader(fichier))\n    for v in ventes:\n        v[\"quantite\"] = int(v[\"quantite\"])\n        v[\"prix_unitaire\"] = float(v[\"prix_unitaire\"])\n        v[\"montant\"] = v[\"quantite\"] * v[\"prix_unitaire\"]\n    return ventes\n\n\ndef ca_par_categorie(ventes):\n    pass\n\n\nprint(ca_par_categorie(charger_ventes(\"ventes.csv\")))", "solution": "import csv\n\n\ndef charger_ventes(nom_fichier):\n    with open(nom_fichier, encoding=\"utf-8\") as fichier:\n        ventes = list(csv.DictReader(fichier))\n    for v in ventes:\n        v[\"quantite\"] = int(v[\"quantite\"])\n        v[\"prix_unitaire\"] = float(v[\"prix_unitaire\"])\n        v[\"montant\"] = v[\"quantite\"] * v[\"prix_unitaire\"]\n    return ventes\n\n\ndef ca_par_categorie(ventes):\n    totaux = {}\n    for v in ventes:\n        totaux[v[\"categorie\"]] = totaux.get(v[\"categorie\"], 0) + v[\"montant\"]\n    return {categorie: round(total, 2) for categorie, total in totaux.items()}\n\n\nprint(ca_par_categorie(charger_ventes(\"ventes.csv\")))", "tests": "r = ca_par_categorie(charger_ventes(\"ventes.csv\"))\nassert r == {\"Papeterie\": 126.0, \"Maison\": 215.6, \"Informatique\": 313.0}, \"On attend {'Papeterie': 126.0, 'Maison': 215.6, 'Informatique': 313.0}. Tu obtiens %r.\" % (r,)\nassert ca_par_categorie([{\"categorie\": \"X\", \"montant\": 1.004}, {\"categorie\": \"X\", \"montant\": 1.004}]) == {\"X\": 2.01}, \"Arrondis le total de chaque catégorie, pas chaque montant.\"", "hint": "<p>Le geste « regrouper » : <code>totaux[cle] = totaux.get(cle, 0) + v[\"montant\"]<\/code>. Arrondis à la fin avec une compréhension de dictionnaire.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "questions-sur-les-ventes-2", "title": "Le produit vedette", "h": "<p>Écris <code>produit_vedette(ventes)<\/code> qui renvoie le nom du produit dont la <strong>quantité totale vendue<\/strong> est la plus élevée.<\/p>", "starter": "import csv\n\n\ndef charger_ventes(nom_fichier):\n    with open(nom_fichier, encoding=\"utf-8\") as fichier:\n        ventes = list(csv.DictReader(fichier))\n    for v in ventes:\n        v[\"quantite\"] = int(v[\"quantite\"])\n        v[\"prix_unitaire\"] = float(v[\"prix_unitaire\"])\n        v[\"montant\"] = v[\"quantite\"] * v[\"prix_unitaire\"]\n    return ventes\n\n\ndef produit_vedette(ventes):\n    pass\n\n\nprint(produit_vedette(charger_ventes(\"ventes.csv\")))", "solution": "import csv\n\n\ndef charger_ventes(nom_fichier):\n    with open(nom_fichier, encoding=\"utf-8\") as fichier:\n        ventes = list(csv.DictReader(fichier))\n    for v in ventes:\n        v[\"quantite\"] = int(v[\"quantite\"])\n        v[\"prix_unitaire\"] = float(v[\"prix_unitaire\"])\n        v[\"montant\"] = v[\"quantite\"] * v[\"prix_unitaire\"]\n    return ventes\n\n\ndef produit_vedette(ventes):\n    quantites = {}\n    for v in ventes:\n        quantites[v[\"produit\"]] = quantites.get(v[\"produit\"], 0) + v[\"quantite\"]\n    return max(quantites, key=lambda produit: quantites[produit])\n\n\nprint(produit_vedette(charger_ventes(\"ventes.csv\")))", "tests": "assert produit_vedette(charger_ventes(\"ventes.csv\")) == \"Stylo\", \"Le produit le plus vendu en quantité est le Stylo (45 unités). Tu obtiens %r.\" % (produit_vedette(charger_ventes(\"ventes.csv\")),)\nassert produit_vedette([{\"produit\": \"A\", \"quantite\": 5}, {\"produit\": \"B\", \"quantite\": 3}, {\"produit\": \"B\", \"quantite\": 3}]) == \"B\", \"Additionne les quantités par produit avant de chercher le maximum.\"", "hint": "<p>Deux étapes : regrouper les quantités par produit dans un dictionnaire, puis <code>max(quantites, key=lambda p: quantites[p])<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "questions-sur-les-ventes-3", "title": "L'évolution mensuelle", "h": "<p>Écris <code>ca_par_mois(ventes)<\/code> qui renvoie un dictionnaire dont les clés sont les mois au format <code>AAAA-MM<\/code> et les valeurs le chiffre d'affaires du mois, arrondi à 2 décimales.<\/p>", "starter": "import csv\n\n\ndef charger_ventes(nom_fichier):\n    with open(nom_fichier, encoding=\"utf-8\") as fichier:\n        ventes = list(csv.DictReader(fichier))\n    for v in ventes:\n        v[\"quantite\"] = int(v[\"quantite\"])\n        v[\"prix_unitaire\"] = float(v[\"prix_unitaire\"])\n        v[\"montant\"] = v[\"quantite\"] * v[\"prix_unitaire\"]\n    return ventes\n\n\ndef ca_par_mois(ventes):\n    pass\n\n\nprint(ca_par_mois(charger_ventes(\"ventes.csv\")))", "solution": "import csv\n\n\ndef charger_ventes(nom_fichier):\n    with open(nom_fichier, encoding=\"utf-8\") as fichier:\n        ventes = list(csv.DictReader(fichier))\n    for v in ventes:\n        v[\"quantite\"] = int(v[\"quantite\"])\n        v[\"prix_unitaire\"] = float(v[\"prix_unitaire\"])\n        v[\"montant\"] = v[\"quantite\"] * v[\"prix_unitaire\"]\n    return ventes\n\n\ndef ca_par_mois(ventes):\n    totaux = {}\n    for v in ventes:\n        mois = v[\"date\"][:7]\n        totaux[mois] = totaux.get(mois, 0) + v[\"montant\"]\n    return {mois: round(total, 2) for mois, total in totaux.items()}\n\n\nprint(ca_par_mois(charger_ventes(\"ventes.csv\")))", "tests": "r = ca_par_mois(charger_ventes(\"ventes.csv\"))\nassert r == {\"2025-01\": 142.9, \"2025-02\": 222.9, \"2025-03\": 288.8}, \"On attend {'2025-01': 142.9, '2025-02': 222.9, '2025-03': 288.8}. Tu obtiens %r.\" % (r,)", "hint": "<p>Les sept premiers caractères de la date donnent le mois : <code>v[\"date\"][:7]<\/code>. Le reste est un regroupement.<\/p>", "stdin": "", "skel": ""}, {"t": "quiz", "id": "questions-sur-les-ventes-4", "title": "Un regroupement à la main", "h": "", "code": "ventes = [(\"Maison\", 30), (\"Papeterie\", 12), (\"Maison\", 16), (\"Papeterie\", 8), (\"Jardin\", 5)]\ntotaux = {}\nfor categorie, montant in ventes:\n    totaux[categorie] = totaux.get(categorie, 0) + montant\nmeilleure = max(totaux, key=lambda c: totaux[c])\nprint(totaux)\nprint(meilleure, len(totaux))", "expected": "{'Maison': 46, 'Papeterie': 20, 'Jardin': 5}\nMaison 3"}]}, {"id": "croiser-deux-fichiers", "title": "Croiser deux fichiers", "blocks": [{"t": "html", "h": "<p>Le fichier des ventes ne contient qu'un identifiant de client (<code>C01<\/code>, <code>C02<\/code>...). Le nom et la ville se trouvent dans un autre fichier, <code>clients.csv<\/code>. Répondre à « quel est le chiffre d'affaires par ville ? » demande de <strong>croiser<\/strong> les deux. Les analystes appellent cela une <strong>jointure<\/strong>.<\/p><p>La technique : transformer le fichier de référence en dictionnaire indexé par l'identifiant. Retrouver un client devient alors instantané.<\/p>"}, {"t": "code", "c": "import csv\n\nwith open(\"clients.csv\", encoding=\"utf-8\") as fichier:\n    clients = {ligne[\"client_id\"]: ligne for ligne in csv.DictReader(fichier)}\n\nprint(clients[\"C03\"])\nprint(clients[\"C03\"][\"ville\"])\n\nwith open(\"ventes.csv\", encoding=\"utf-8\") as fichier:\n    for v in list(csv.DictReader(fichier))[:3]:\n        client = clients[v[\"client_id\"]]\n        print(v[\"date\"], v[\"produit\"], \"->\", client[\"nom\"], \"à\", client[\"ville\"])", "err": false}, {"t": "html", "h": "<p>La première compréhension construit un dictionnaire dont chaque clé est un identifiant et chaque valeur la ligne complète du client. Ensuite, pour chaque vente, <code>clients[v[\"client_id\"]]<\/code> donne la fiche du client concerné.<\/p>"}, {"t": "exo", "id": "croiser-deux-fichiers-1", "title": "Le chiffre d'affaires par ville", "h": "<p>Écris <code>ca_par_ville(fichier_ventes, fichier_clients)<\/code> qui renvoie un dictionnaire ville → chiffre d'affaires arrondi à 2 décimales.<\/p>", "starter": "import csv\n\n\ndef ca_par_ville(fichier_ventes, fichier_clients):\n    pass\n\n\nprint(ca_par_ville(\"ventes.csv\", \"clients.csv\"))", "solution": "import csv\n\n\ndef ca_par_ville(fichier_ventes, fichier_clients):\n    with open(fichier_clients, encoding=\"utf-8\") as fichier:\n        villes = {ligne[\"client_id\"]: ligne[\"ville\"] for ligne in csv.DictReader(fichier)}\n    totaux = {}\n    with open(fichier_ventes, encoding=\"utf-8\") as fichier:\n        for v in csv.DictReader(fichier):\n            ville = villes[v[\"client_id\"]]\n            montant = int(v[\"quantite\"]) * float(v[\"prix_unitaire\"])\n            totaux[ville] = totaux.get(ville, 0) + montant\n    return {ville: round(total, 2) for ville, total in totaux.items()}\n\n\nprint(ca_par_ville(\"ventes.csv\", \"clients.csv\"))", "tests": "r = ca_par_ville(\"ventes.csv\", \"clients.csv\")\nassert r == {\"Lyon\": 225.8, \"Nantes\": 288.0, \"Lille\": 140.8}, \"On attend {'Lyon': 225.8, 'Nantes': 288.0, 'Lille': 140.8}. Tu obtiens %r.\" % (r,)", "hint": "<p>Étape 1 : un dictionnaire <code>client_id<\/code> → ville à partir de <code>clients.csv<\/code>. Étape 2 : parcourir les ventes, retrouver la ville de chacune, et regrouper les montants par ville.<\/p>", "stdin": "", "skel": "import csv\n\ndef ca_par_ville(fichier_ventes, fichier_clients):\n    with open(fichier_clients, encoding=\"utf-8\") as fichier:\n        ...\n    ...\n    with open(fichier_ventes, encoding=\"utf-8\") as fichier:\n        for v in csv.DictReader(fichier):\n            ...\n    return ...\n\nprint(ca_par_ville(\"ventes.csv\", \"clients.csv\"))"}, {"t": "exo", "id": "croiser-deux-fichiers-2", "title": "Le meilleur client", "h": "<p>Écris <code>meilleur_client(fichier_ventes, fichier_clients)<\/code> qui renvoie le <strong>nom<\/strong> du client ayant dépensé le plus.<\/p>", "starter": "import csv\n\n\ndef meilleur_client(fichier_ventes, fichier_clients):\n    pass\n\n\nprint(meilleur_client(\"ventes.csv\", \"clients.csv\"))", "solution": "import csv\n\n\ndef meilleur_client(fichier_ventes, fichier_clients):\n    with open(fichier_clients, encoding=\"utf-8\") as fichier:\n        noms = {ligne[\"client_id\"]: ligne[\"nom\"] for ligne in csv.DictReader(fichier)}\n    depenses = {}\n    with open(fichier_ventes, encoding=\"utf-8\") as fichier:\n        for v in csv.DictReader(fichier):\n            montant = int(v[\"quantite\"]) * float(v[\"prix_unitaire\"])\n            depenses[v[\"client_id\"]] = depenses.get(v[\"client_id\"], 0) + montant\n    gagnant = max(depenses, key=lambda c: depenses[c])\n    return noms[gagnant]\n\n\nprint(meilleur_client(\"ventes.csv\", \"clients.csv\"))", "tests": "assert meilleur_client(\"ventes.csv\", \"clients.csv\") == \"Emma\", \"Le meilleur client est Emma (185.00 €). Tu obtiens %r.\" % (meilleur_client(\"ventes.csv\", \"clients.csv\"),)", "hint": "<p>Regroupe les dépenses par <code>client_id<\/code>, trouve l'identifiant gagnant avec <code>max(..., key=...)<\/code>, puis traduis-le en nom grâce au fichier des clients.<\/p>", "stdin": "", "skel": "import csv\n\ndef meilleur_client(fichier_ventes, fichier_clients):\n    with open(fichier_clients, encoding=\"utf-8\") as fichier:\n        ...\n    ...\n    with open(fichier_ventes, encoding=\"utf-8\") as fichier:\n        for v in csv.DictReader(fichier):\n            ...\n    ...\n    return ...\n\nprint(meilleur_client(\"ventes.csv\", \"clients.csv\"))"}]}]}, {"id": "pandas", "title": "L'analyse de données avec pandas", "desc": "La bibliothèque de référence pour manipuler des tableaux : charger, filtrer, regrouper, nettoyer, croiser.", "lessons": [{"id": "decouvrir-pandas", "title": "Découvrir pandas", "blocks": [{"t": "html", "h": "<p>Tu viens d'analyser un fichier avec des boucles et des dictionnaires. Cela fonctionne, mais chaque question demande cinq à dix lignes. <strong>pandas<\/strong> est une bibliothèque qui réduit chacune de ces questions à une ligne. C'est l'outil quotidien des data analysts.<\/p><p>pandas ne fait pas partie de la bibliothèque standard : sur ton ordinateur, on l'installe avec <code>pip install pandas<\/code>. Ici, il est disponible directement.<\/p><div class=\"warn\"><span class=\"lab\">Attention<\/span><p>La première exécution d'un code qui importe pandas prend 10 à 30 secondes sur cette page, le temps de télécharger la bibliothèque. Les suivantes sont rapides.<\/p><\/div>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\nprint(df.head())\nprint(df.shape)", "err": false}, {"t": "html", "h": "<ul><li><code>import pandas as pd<\/code> : le surnom <code>pd<\/code> est une convention universelle.<\/li><li><code>pd.read_csv<\/code> lit le fichier et renvoie un <strong>DataFrame<\/strong> : un tableau avec des lignes et des colonnes nommées. On l'appelle souvent <code>df<\/code>.<\/li><li><code>head()<\/code> montre les 5 premières lignes, <code>shape<\/code> donne le couple (nombre de lignes, nombre de colonnes).<\/li><\/ul><p>Bonne nouvelle : pandas a deviné les types. Les quantités sont déjà des entiers, les prix des nombres à virgule.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\nprint(df.dtypes)\nprint(df.describe())", "err": false}, {"t": "html", "h": "<p><code>dtypes<\/code> liste le type de chaque colonne, <code>describe()<\/code> résume les colonnes numériques : effectif, moyenne, minimum, maximum, quartiles.<\/p><h3>Une colonne est une Series<\/h3><p>On sélectionne une colonne avec des crochets, comme une clé de dictionnaire. Le résultat est une <strong>Series<\/strong> : une colonne de valeurs, dotée de méthodes de calcul.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\nquantites = df[\"quantite\"]\nprint(quantites.sum(), quantites.mean(), quantites.max())\nprint(df[\"produit\"].unique())\nprint(df[\"categorie\"].value_counts())\nprint(df[[\"date\", \"produit\"]].head(3))", "err": false}, {"t": "html", "h": "<p><code>value_counts()<\/code> est le geste « compter » en un mot. Pour sélectionner plusieurs colonnes, on passe une <strong>liste<\/strong> de noms, d'où les doubles crochets.<\/p>"}, {"t": "exo", "id": "decouvrir-pandas-1", "title": "Premier contact", "h": "<p>Charge <code>ventes.csv<\/code> dans un DataFrame <code>df<\/code>, puis calcule trois variables : <code>nb_ventes<\/code> (le nombre de lignes), <code>quantite_totale<\/code> (la somme de la colonne <code>quantite<\/code>) et <code>prix_max<\/code> (le plus grand <code>prix_unitaire<\/code>).<\/p>", "starter": "import pandas as pd\n\n# Charge le fichier puis calcule les trois variables\n\nprint(nb_ventes, quantite_totale, prix_max)", "solution": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\nnb_ventes = len(df)\nquantite_totale = df[\"quantite\"].sum()\nprix_max = df[\"prix_unitaire\"].max()\n\nprint(nb_ventes, quantite_totale, prix_max)", "tests": "assert int(nb_ventes) == 18, \"Le fichier contient 18 ventes. Tu obtiens %r.\" % (nb_ventes,)\nassert int(quantite_totale) == 87, \"La quantité totale vaut 87. Tu obtiens %r.\" % (quantite_totale,)\nassert float(prix_max) == 49.0, \"Le prix unitaire le plus élevé vaut 49.0. Tu obtiens %r.\" % (prix_max,)", "hint": "<p><code>len(df)<\/code> ou <code>df.shape[0]<\/code> pour le nombre de lignes, <code>df[\"quantite\"].sum()<\/code>, <code>df[\"prix_unitaire\"].max()<\/code>.<\/p>", "stdin": "", "skel": ""}]}, {"id": "filtrer-trier-calculer", "title": "Filtrer, trier, créer des colonnes", "blocks": [{"t": "html", "h": "<h3>Créer une colonne<\/h3><p>Avec pandas, on calcule sur des colonnes entières, sans boucle. L'opération s'applique à toutes les lignes d'un coup.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\ndf[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\nprint(df[[\"produit\", \"quantite\", \"prix_unitaire\", \"montant\"]].head())\nprint(\"CA total :\", round(df[\"montant\"].sum(), 2))", "err": false}, {"t": "html", "h": "<h3>Filtrer les lignes<\/h3><p>Une comparaison sur une colonne produit une Series de <code>True<\/code> et de <code>False<\/code>, appelée <strong>masque<\/strong>. Passée entre crochets au DataFrame, elle ne garde que les lignes où elle est vraie.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\ndf[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\n\nmasque = df[\"montant\"] > 50\nprint(masque.head(4))\nprint(df[masque])", "err": false}, {"t": "html", "h": "<p>Pour combiner des conditions, on utilise <code>&amp;<\/code> (et), <code>|<\/code> (ou) et <code>~<\/code> (non), avec <strong>chaque condition entre parenthèses<\/strong>. Les mots <code>and<\/code> et <code>or<\/code> ne fonctionnent pas sur des colonnes.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\nmaison_en_gros = df[(df[\"categorie\"] == \"Maison\") & (df[\"quantite\"] >= 4)]\nprint(maison_en_gros)\nprint(df[df[\"produit\"].isin([\"Lampe\", \"Clavier\"])].shape)", "err": false}, {"t": "html", "h": "<h3>Trier<\/h3>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\ndf[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\nprint(df.sort_values(\"montant\", ascending=False).head(3))", "err": false}, {"t": "html", "h": "<div class=\"warn\"><span class=\"lab\">Attention<\/span><p>La plupart des méthodes pandas renvoient un <strong>nouveau<\/strong> tableau et ne modifient pas l'original, comme les méthodes de texte. Pour garder le résultat, range-le dans une variable : <code>df = df.sort_values(\"montant\")<\/code>.<\/p><\/div>"}, {"t": "exo", "id": "filtrer-trier-calculer-1", "title": "Les grosses ventes d'informatique", "h": "<p>Crée la colonne <code>montant<\/code> (quantité fois prix unitaire), puis construis le DataFrame <code>resultat<\/code> contenant uniquement les ventes de la catégorie <code>Informatique<\/code> dont le montant est supérieur ou égal à 50, triées du montant le plus élevé au plus faible.<\/p>", "starter": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\n# Crée la colonne montant, puis le DataFrame resultat\n\nprint(resultat)", "solution": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\ndf[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\nresultat = df[(df[\"categorie\"] == \"Informatique\") & (df[\"montant\"] >= 50)]\nresultat = resultat.sort_values(\"montant\", ascending=False)\n\nprint(resultat)", "tests": "import pandas as pd\nassert isinstance(resultat, pd.DataFrame), \"resultat doit être un DataFrame.\"\nassert \"montant\" in resultat.columns, \"Le DataFrame doit contenir la colonne montant.\"\nassert len(resultat) == 2, \"Deux ventes correspondent. Tu en obtiens %d. Vérifie les deux conditions et les parenthèses.\" % len(resultat)\nassert [round(float(m), 2) for m in resultat[\"montant\"]] == [98.0, 58.5], \"Montants attendus, dans l'ordre : 98.0 puis 58.5. Tu obtiens %r.\" % ([round(float(m), 2) for m in resultat[\"montant\"]],)", "hint": "<p><code>df[(condition 1) &amp; (condition 2)]<\/code>, puis <code>.sort_values(\"montant\", ascending=False)<\/code>.<\/p>", "stdin": "", "skel": ""}]}, {"id": "regrouper-avec-groupby", "title": "Regrouper avec groupby", "blocks": [{"t": "html", "h": "<p>Le geste « regrouper », que tu as écrit avec un dictionnaire et <code>get<\/code>, s'appelle <code>groupby<\/code> dans pandas. Il se lit en trois temps : <strong>regrouper<\/strong> par une colonne, <strong>choisir<\/strong> la colonne à résumer, <strong>agréger<\/strong> avec une fonction.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\ndf[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\n\nca = df.groupby(\"categorie\")[\"montant\"].sum()\nprint(ca)\nprint(ca[\"Maison\"])\nprint(ca.sort_values(ascending=False).head(1))", "err": false}, {"t": "html", "h": "<p>Le résultat est une Series dont l'<strong>index<\/strong> (les étiquettes de lignes) est la catégorie. Les agrégations courantes : <code>sum<\/code>, <code>mean<\/code>, <code>count<\/code>, <code>min<\/code>, <code>max<\/code>, <code>nunique<\/code> (nombre de valeurs distinctes).<\/p><h3>Plusieurs indicateurs à la fois<\/h3><p><code>agg<\/code> calcule plusieurs agrégats en un appel. Chaque argument a la forme <code>nom_du_resultat=(colonne, fonction)<\/code>.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\ndf[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\n\nbilan = df.groupby(\"produit\").agg(\n    ca=(\"montant\", \"sum\"),\n    quantite=(\"quantite\", \"sum\"),\n    nb_ventes=(\"montant\", \"count\"),\n)\nprint(bilan.sort_values(\"ca\", ascending=False))", "err": false}, {"t": "html", "h": "<h3>Regrouper par mois<\/h3><p>Pour travailler sur des dates, on convertit d'abord la colonne avec <code>pd.to_datetime<\/code>. L'accesseur <code>.dt<\/code> donne ensuite accès à l'année, au mois, au jour de la semaine.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\ndf[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\ndf[\"date\"] = pd.to_datetime(df[\"date\"])\ndf[\"mois\"] = df[\"date\"].dt.month\n\nprint(df.groupby(\"mois\")[\"montant\"].sum())", "err": false}, {"t": "exo", "id": "regrouper-avec-groupby-1", "title": "Le bilan par client", "h": "<p>Construis <code>ca_client<\/code> : le chiffre d'affaires par <code>client_id<\/code>, sous la forme d'une Series triée du plus gros client au plus petit.<\/p>", "starter": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\n# Construis ca_client\n\nprint(ca_client)", "solution": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\ndf[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\nca_client = df.groupby(\"client_id\")[\"montant\"].sum().sort_values(ascending=False)\n\nprint(ca_client)", "tests": "import pandas as pd\nassert isinstance(ca_client, pd.Series), \"ca_client doit être une Series : le résultat d'un groupby sur une colonne.\"\nobtenu = [(k, round(float(v), 2)) for k, v in ca_client.items()]\nassert obtenu == [(\"C05\", 185.0), (\"C03\", 148.4), (\"C04\", 140.8), (\"C02\", 103.0), (\"C01\", 77.4)], \"On attend C05 185.0, C03 148.4, C04 140.8, C02 103.0, C01 77.4. Tu obtiens %r.\" % (obtenu,)", "hint": "<p>Crée <code>montant<\/code>, puis <code>df.groupby(\"client_id\")[\"montant\"].sum().sort_values(ascending=False)<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "regrouper-avec-groupby-2", "title": "Le panier moyen par catégorie", "h": "<p>Construis <code>panier_moyen<\/code> : pour chaque catégorie, le montant moyen d'une vente, arrondi à 2 décimales (méthode <code>.round(2)<\/code>).<\/p>", "starter": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\n# Construis panier_moyen\n\nprint(panier_moyen)", "solution": "import pandas as pd\n\ndf = pd.read_csv(\"ventes.csv\")\ndf[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\npanier_moyen = df.groupby(\"categorie\")[\"montant\"].mean().round(2)\n\nprint(panier_moyen)", "tests": "obtenu = {k: float(v) for k, v in dict(panier_moyen).items()}\nassert obtenu == {\"Informatique\": 52.17, \"Maison\": 35.93, \"Papeterie\": 21.0}, \"On attend Informatique 52.17, Maison 35.93, Papeterie 21.0. Tu obtiens %r.\" % (obtenu,)", "hint": "<p>Même structure que l'exercice précédent, avec <code>.mean()<\/code> à la place de <code>.sum()<\/code>, puis <code>.round(2)<\/code>.<\/p>", "stdin": "", "skel": ""}]}, {"id": "nettoyer-des-donnees", "title": "Nettoyer des données", "blocks": [{"t": "html", "h": "<p>Les données réelles sont sales : valeurs manquantes, doublons, textes saisis de dix façons différentes. Le nettoyage occupe une grande partie du temps d'un analyste. Le fichier <code>brut.csv<\/code> concentre les problèmes classiques.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"brut.csv\")\nprint(df)\nprint(df.isna().sum())\nprint(\"Doublons :\", df.duplicated().sum())", "err": false}, {"t": "html", "h": "<p><code>NaN<\/code> (« Not a Number ») marque une valeur manquante. <code>isna().sum()<\/code> compte les manquants par colonne, <code>duplicated().sum()<\/code> compte les lignes en double. Regarde aussi la colonne <code>ville<\/code> : « nantes », « LYON » et « Nantes » précédé d'un espace seraient comptés comme trois villes différentes.<\/p><h3>Les outils du nettoyage<\/h3>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"brut.csv\")\n\ndf = df.drop_duplicates()                        # supprimer les lignes en double\ndf[\"ville\"] = df[\"ville\"].str.strip().str.title()  # harmoniser les textes\ndf[\"achats\"] = df[\"achats\"].fillna(0).astype(int)  # manquant -> 0, puis entier\ndf[\"age\"] = df[\"age\"].fillna(df[\"age\"].median())   # manquant -> âge médian\n\nprint(df)\nprint(df[\"ville\"].value_counts())", "err": false}, {"t": "html", "h": "<ul><li><code>.str<\/code> donne accès aux méthodes de texte, appliquées à toute la colonne.<\/li><li><code>fillna(valeur)<\/code> remplace les manquants. <code>dropna()<\/code> supprime au contraire les lignes incomplètes.<\/li><li><code>astype(int)<\/code> convertit le type de la colonne.<\/li><\/ul><div class=\"note\"><span class=\"lab\">À retenir<\/span><p>Remplacer une valeur manquante est une décision d'analyse, pas un détail technique. Un achat manquant vaut-il 0, ou est-il inconnu ? Note toujours tes choix, car ils changent les résultats.<\/p><\/div>"}, {"t": "exo", "id": "nettoyer-des-donnees-1", "title": "Le grand ménage", "h": "<p>Nettoie <code>brut.csv<\/code> et range le résultat dans <code>propre<\/code> : sans doublon ; avec la colonne <code>ville<\/code> sans espaces autour et écrite avec une majuscule initiale ; en supprimant les lignes dont l'<code>age<\/code> est manquant ; et en remplaçant les <code>achats<\/code> manquants par 0.<\/p>", "starter": "import pandas as pd\n\ndf = pd.read_csv(\"brut.csv\")\n# Construis le DataFrame propre\n\nprint(propre)", "solution": "import pandas as pd\n\ndf = pd.read_csv(\"brut.csv\")\npropre = df.drop_duplicates()\npropre = propre.dropna(subset=[\"age\"]).copy()\npropre[\"ville\"] = propre[\"ville\"].str.strip().str.title()\npropre[\"achats\"] = propre[\"achats\"].fillna(0)\n\nprint(propre)", "tests": "import pandas as pd\nassert isinstance(propre, pd.DataFrame), \"propre doit être un DataFrame.\"\nassert list(propre[\"nom\"]) == [\"Amina\", \"Chloé\", \"Diego\", \"Emma\"], \"Il doit rester Amina, Chloé, Diego et Emma : Bastien n'a pas d'âge et Diego apparaissait deux fois. Tu obtiens %r.\" % (list(propre[\"nom\"]),)\nassert list(propre[\"ville\"]) == [\"Lyon\", \"Lyon\", \"Lille\", \"Nantes\"], \"Villes attendues : Lyon, Lyon, Lille, Nantes. Tu obtiens %r.\" % (list(propre[\"ville\"]),)\nassert [float(a) for a in propre[\"achats\"]] == [3.0, 0.0, 2.0, 7.0], \"Achats attendus : 3, 0, 2, 7. Tu obtiens %r.\" % (list(propre[\"achats\"]),)", "hint": "<p>Dans l'ordre : <code>drop_duplicates()<\/code>, <code>dropna(subset=[\"age\"])<\/code> pour ne regarder que la colonne age (ajoute <code>.copy()<\/code> à la fin de cette étape pour travailler sur un tableau indépendant), <code>.str.strip().str.title()<\/code> sur la ville, <code>fillna(0)<\/code> sur les achats.<\/p>", "stdin": "", "skel": ""}]}, {"id": "croiser-avec-merge", "title": "Croiser des tableaux avec merge", "blocks": [{"t": "html", "h": "<p>Tu as croisé deux fichiers à la main avec un dictionnaire. Dans pandas, la jointure s'écrit <code>merge<\/code>. On indique les deux tableaux et la colonne qu'ils ont en commun.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\nventes = pd.read_csv(\"ventes.csv\")\nclients = pd.read_csv(\"clients.csv\")\n\ncomplet = ventes.merge(clients, on=\"client_id\", how=\"left\")\nprint(complet[[\"date\", \"produit\", \"client_id\", \"nom\", \"ville\"]].head())\nprint(complet.shape)", "err": false}, {"t": "html", "h": "<p>Chaque vente reçoit les colonnes <code>nom<\/code> et <code>ville<\/code> du client correspondant. Le paramètre <code>how<\/code> précise quoi faire des lignes sans correspondance :<\/p><div class=\"tw\"><table><thead><tr><th><code>how<\/code><\/th><th>Lignes conservées<\/th><\/tr><\/thead><tbody><tr><td><code>\"inner\"<\/code> (par défaut)<\/td><td>celles qui ont une correspondance dans les deux tableaux<\/td><\/tr><tr><td><code>\"left\"<\/code><\/td><td>toutes celles du tableau de gauche, avec des <code>NaN<\/code> si le client est inconnu<\/td><\/tr><tr><td><code>\"outer\"<\/code><\/td><td>toutes les lignes des deux tableaux<\/td><\/tr><\/tbody><\/table><\/div><p><code>how=\"left\"<\/code> est le choix le plus sûr quand on enrichit un tableau principal : aucune vente ne disparaît en silence. Vérifie toujours le nombre de lignes après une jointure.<\/p><p>Une fois les tableaux réunis, toutes les questions deviennent des <code>groupby<\/code>.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\nventes = pd.read_csv(\"ventes.csv\")\nclients = pd.read_csv(\"clients.csv\")\ncomplet = ventes.merge(clients, on=\"client_id\", how=\"left\")\ncomplet[\"montant\"] = complet[\"quantite\"] * complet[\"prix_unitaire\"]\n\nprint(complet.groupby(\"ville\")[\"montant\"].sum().sort_values(ascending=False))\nprint(complet.groupby([\"ville\", \"categorie\"])[\"montant\"].sum())", "err": false}, {"t": "html", "h": "<p>En passant une liste à <code>groupby<\/code>, on regroupe selon plusieurs colonnes à la fois.<\/p>"}, {"t": "exo", "id": "croiser-avec-merge-1", "title": "Qui achète quoi ?", "h": "<p>Construis <code>quantites<\/code> : la quantité totale achetée par chaque client, identifié par son <strong>nom<\/strong>, sous la forme d'une Series.<\/p>", "starter": "import pandas as pd\n\nventes = pd.read_csv(\"ventes.csv\")\nclients = pd.read_csv(\"clients.csv\")\n# Construis quantites\n\nprint(quantites)", "solution": "import pandas as pd\n\nventes = pd.read_csv(\"ventes.csv\")\nclients = pd.read_csv(\"clients.csv\")\ncomplet = ventes.merge(clients, on=\"client_id\", how=\"left\")\nquantites = complet.groupby(\"nom\")[\"quantite\"].sum()\n\nprint(quantites)", "tests": "obtenu = {k: int(v) for k, v in dict(quantites).items()}\nassert obtenu == {\"Amina\": 21, \"Bastien\": 17, \"Chloé\": 32, \"Diego\": 7, \"Emma\": 10}, \"On attend Amina 21, Bastien 17, Chloé 32, Diego 7, Emma 10. Tu obtiens %r.\" % (obtenu,)", "hint": "<p><code>ventes.merge(clients, on=\"client_id\", how=\"left\")<\/code>, puis <code>groupby(\"nom\")[\"quantite\"].sum()<\/code>.<\/p>", "stdin": "", "skel": ""}]}, {"id": "projet-pandas", "title": "Mini-projet : le tableau de bord", "blocks": [{"t": "html", "h": "<p>Dernière étape du module : rassembler toutes les techniques dans une seule fonction qui produit les chiffres clés d'un trimestre. C'est exactement le genre de travail que l'on confie à un data analyst débutant.<\/p><p>Avant de coder, applique la méthode du module « Penser comme un programmeur » : note les étapes en commentaires. Charger les deux fichiers, les croiser, calculer le montant, puis un indicateur à la fois. Teste chaque indicateur avec un <code>print<\/code> avant de passer au suivant.<\/p><p>Une précision utile : pour obtenir l'étiquette de la plus grande valeur d'une Series, on utilise <code>idxmax()<\/code>.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ns = pd.Series({\"Lyon\": 225.8, \"Nantes\": 288.0, \"Lille\": 140.8})\nprint(s.idxmax(), s.max())", "err": false}, {"t": "exo", "id": "projet-pandas-1", "title": "Les chiffres clés du trimestre", "h": "<p>Écris <code>chiffres_cles(fichier_ventes, fichier_clients)<\/code> qui renvoie un dictionnaire avec cinq clés :<\/p><ul><li><code>ca_total<\/code> : le chiffre d'affaires, arrondi à 2 décimales ;<\/li><li><code>panier_moyen<\/code> : le montant moyen d'une vente, arrondi à 2 décimales ;<\/li><li><code>meilleure_ville<\/code> : la ville au chiffre d'affaires le plus élevé ;<\/li><li><code>meilleur_client<\/code> : le nom du client qui a le plus dépensé ;<\/li><li><code>meilleur_mois<\/code> : le numéro du mois (1, 2 ou 3) au chiffre d'affaires le plus élevé.<\/li><\/ul>", "starter": "import pandas as pd\n\n\ndef chiffres_cles(fichier_ventes, fichier_clients):\n    pass\n\n\nprint(chiffres_cles(\"ventes.csv\", \"clients.csv\"))", "solution": "import pandas as pd\n\n\ndef chiffres_cles(fichier_ventes, fichier_clients):\n    ventes = pd.read_csv(fichier_ventes)\n    clients = pd.read_csv(fichier_clients)\n    df = ventes.merge(clients, on=\"client_id\", how=\"left\")\n    df[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\n    df[\"mois\"] = pd.to_datetime(df[\"date\"]).dt.month\n    return {\n        \"ca_total\": round(float(df[\"montant\"].sum()), 2),\n        \"panier_moyen\": round(float(df[\"montant\"].mean()), 2),\n        \"meilleure_ville\": df.groupby(\"ville\")[\"montant\"].sum().idxmax(),\n        \"meilleur_client\": df.groupby(\"nom\")[\"montant\"].sum().idxmax(),\n        \"meilleur_mois\": int(df.groupby(\"mois\")[\"montant\"].sum().idxmax()),\n    }\n\n\nprint(chiffres_cles(\"ventes.csv\", \"clients.csv\"))", "tests": "r = chiffres_cles(\"ventes.csv\", \"clients.csv\")\nassert isinstance(r, dict), \"La fonction doit renvoyer un dictionnaire.\"\nattendu = {\"ca_total\": 654.6, \"panier_moyen\": 36.37, \"meilleure_ville\": \"Nantes\", \"meilleur_client\": \"Emma\", \"meilleur_mois\": 3}\nfor cle, valeur in attendu.items():\n    assert cle in r, \"Il manque la clé %r dans ton dictionnaire.\" % cle\n    obtenu = r[cle]\n    if isinstance(valeur, float):\n        assert abs(float(obtenu) - valeur) < 0.006, \"Pour %r, on attend %r. Tu obtiens %r.\" % (cle, valeur, obtenu)\n    elif isinstance(valeur, int):\n        assert int(obtenu) == valeur, \"Pour %r, on attend %r. Tu obtiens %r.\" % (cle, valeur, obtenu)\n    else:\n        assert str(obtenu) == valeur, \"Pour %r, on attend %r. Tu obtiens %r.\" % (cle, valeur, obtenu)", "hint": "<p>Construis d'abord un DataFrame complet (merge, colonne <code>montant<\/code>, colonne <code>mois<\/code>). Chaque indicateur est ensuite une ligne : <code>df[\"montant\"].sum()<\/code>, <code>df[\"montant\"].mean()<\/code>, puis trois <code>groupby(...)[\"montant\"].sum().idxmax()<\/code>.<\/p>", "stdin": "", "skel": ""}]}]}, {"id": "visualisation", "title": "Visualiser des données", "desc": "Transformer des chiffres en graphiques lisibles, et choisir le bon graphique pour chaque question.", "lessons": [{"id": "premiers-graphiques", "title": "Premiers graphiques avec matplotlib", "blocks": [{"t": "html", "h": "<p>Un tableau de chiffres se lit ligne par ligne. Un graphique se comprend d'un coup d'œil. <strong>matplotlib<\/strong> est la bibliothèque de graphiques historique de Python ; pandas, seaborn et bien d'autres s'appuient sur elle.<\/p><div class=\"warn\"><span class=\"lab\">Attention<\/span><p>Comme pour pandas, la première exécution d'un code qui importe matplotlib prend 10 à 30 secondes sur cette page.<\/p><\/div>"}, {"t": "code", "c": "import matplotlib.pyplot as plt\n\ncategories = [\"Papeterie\", \"Maison\", \"Informatique\"]\nchiffre_affaires = [126.0, 215.6, 313.0]\n\nfig, ax = plt.subplots(figsize=(6, 3.5))\nax.bar(categories, chiffre_affaires)\nax.set_title(\"L'informatique pèse près de la moitié du chiffre d'affaires\")\nax.set_ylabel(\"Chiffre d'affaires (€)\")\nplt.show()", "err": false}, {"t": "html", "h": "<ul><li><code>plt.subplots()<\/code> crée une <strong>figure<\/strong> (la feuille) et un <strong>axe<\/strong> (le repère dans lequel on dessine). <code>figsize<\/code> donne la largeur et la hauteur en pouces.<\/li><li><code>ax.bar(x, hauteurs)<\/code> dessine des barres. Chaque type de graphique a sa méthode.<\/li><li><code>set_title<\/code>, <code>set_xlabel<\/code>, <code>set_ylabel<\/code> nomment le graphique et ses axes.<\/li><li><code>plt.show()<\/code> affiche le résultat. Sur ta machine, <code>fig.savefig(\"graphique.png\")<\/code> l'enregistre dans un fichier.<\/li><\/ul><h3>Une courbe pour une évolution<\/h3>"}, {"t": "code", "c": "import matplotlib.pyplot as plt\n\nmois = [\"Janvier\", \"Février\", \"Mars\"]\nca_2025 = [142.9, 222.9, 288.8]\nobjectif = [150, 200, 250]\n\nfig, ax = plt.subplots(figsize=(6, 3.5))\nax.plot(mois, ca_2025, marker=\"o\", label=\"Réalisé\")\nax.plot(mois, objectif, linestyle=\"--\", color=\"gray\", label=\"Objectif\")\nax.set_title(\"Le chiffre d'affaires dépasse l'objectif depuis février\")\nax.set_ylabel(\"€\")\nax.set_ylim(0, 320)\nax.legend()\nplt.show()", "err": false}, {"t": "html", "h": "<p><code>label<\/code> nomme chaque série et <code>ax.legend()<\/code> affiche la légende. <code>set_ylim<\/code> fixe les bornes de l'axe vertical.<\/p><h3>Directement depuis pandas<\/h3><p>Une Series ou un DataFrame possède une méthode <code>plot<\/code>, qui appelle matplotlib pour toi. C'est le chemin le plus court entre un <code>groupby<\/code> et un graphique.<\/p>"}, {"t": "code", "c": "import pandas as pd\nimport matplotlib.pyplot as plt\n\ndf = pd.read_csv(\"ventes.csv\")\ndf[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\nca = df.groupby(\"produit\")[\"montant\"].sum().sort_values()\n\nax = ca.plot(kind=\"barh\", figsize=(6, 3.5), title=\"Chiffre d'affaires par produit\")\nax.set_xlabel(\"€\")\nplt.show()", "err": false}, {"t": "exo", "id": "premiers-graphiques-1", "title": "Les ventes par catégorie", "h": "<p>Charge <code>ventes.csv<\/code>, calcule la <strong>quantité totale vendue par catégorie<\/strong>, puis trace un diagramme en barres verticales avec <code>ax.bar<\/code>. Le graphique doit avoir un titre et un nom pour l'axe vertical.<\/p>", "starter": "import pandas as pd\nimport matplotlib.pyplot as plt\n\ndf = pd.read_csv(\"ventes.csv\")\n# Calcule les quantités par catégorie, puis trace le graphique\n\nplt.show()", "solution": "import pandas as pd\nimport matplotlib.pyplot as plt\n\ndf = pd.read_csv(\"ventes.csv\")\nquantites = df.groupby(\"categorie\")[\"quantite\"].sum()\n\nfig, ax = plt.subplots(figsize=(6, 3.5))\nax.bar(quantites.index, quantites.values)\nax.set_title(\"La papeterie domine en volume\")\nax.set_ylabel(\"Quantité vendue\")\nplt.show()", "tests": "import matplotlib.pyplot as plt\nassert plt.get_fignums(), \"Aucun graphique n'a été créé. Utilise plt.subplots() puis ax.bar(...).\"\nax = plt.gcf().axes[0]\nhauteurs = sorted(round(float(p.get_height())) for p in ax.patches)\nassert hauteurs == [10, 16, 61], \"On attend trois barres de hauteurs 10, 16 et 61 (Informatique, Maison, Papeterie). Tu obtiens %r.\" % (hauteurs,)\nassert ax.get_title().strip(), \"Donne un titre au graphique avec ax.set_title(...).\"\nassert ax.get_ylabel().strip(), \"Nomme l'axe vertical avec ax.set_ylabel(...).\"", "hint": "<p><code>quantites = df.groupby(\"categorie\")[\"quantite\"].sum()<\/code>, puis <code>ax.bar(quantites.index, quantites.values)<\/code>.<\/p>", "stdin": "", "skel": ""}]}, {"id": "choisir-le-bon-graphique", "title": "Choisir le bon graphique", "blocks": [{"t": "html", "h": "<p>Un graphique répond à <strong>une<\/strong> question. Avant de tracer, formule-la : c'est elle qui décide de la forme.<\/p><div class=\"tw\"><table><thead><tr><th>La question<\/th><th>Le graphique<\/th><th>Méthode<\/th><\/tr><\/thead><tbody><tr><td>Comment ça évolue dans le temps ?<\/td><td>courbe<\/td><td><code>ax.plot<\/code><\/td><\/tr><tr><td>Qui est le plus grand ? Comment se classent les catégories ?<\/td><td>barres, triées<\/td><td><code>ax.bar<\/code>, <code>ax.barh<\/code><\/td><\/tr><tr><td>Comment les valeurs se répartissent-elles ?<\/td><td>histogramme<\/td><td><code>ax.hist<\/code><\/td><\/tr><tr><td>Deux mesures sont-elles liées ?<\/td><td>nuage de points<\/td><td><code>ax.scatter<\/code><\/td><\/tr><tr><td>Quelle part du total ?<\/td><td>barres encore, plutôt qu'un camembert<\/td><td><code>ax.barh<\/code><\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "code", "c": "import pandas as pd\nimport matplotlib.pyplot as plt\n\ndf = pd.read_csv(\"ventes.csv\")\ndf[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\n\nfig, (gauche, droite) = plt.subplots(1, 2, figsize=(9, 3.5))\ngauche.hist(df[\"montant\"], bins=6)\ngauche.set_title(\"La plupart des ventes font moins de 40 €\")\ngauche.set_xlabel(\"Montant de la vente (€)\")\ngauche.set_ylabel(\"Nombre de ventes\")\n\ndroite.scatter(df[\"prix_unitaire\"], df[\"quantite\"])\ndroite.set_title(\"Plus c'est cher, moins on en achète\")\ndroite.set_xlabel(\"Prix unitaire (€)\")\ndroite.set_ylabel(\"Quantité\")\nplt.tight_layout()\nplt.show()", "err": false}, {"t": "html", "h": "<p><code>plt.subplots(1, 2)<\/code> crée deux axes côte à côte. <code>tight_layout()<\/code> évite que les textes se chevauchent.<\/p><h3>Les règles d'un graphique honnête et lisible<\/h3><ul><li><strong>Le titre dit la conclusion<\/strong>, pas la description. « Le CA dépasse l'objectif depuis février » vaut mieux que « CA par mois ».<\/li><li><strong>Les axes sont nommés<\/strong>, avec leur unité.<\/li><li><strong>Les barres partent de zéro<\/strong>. Un axe tronqué exagère les écarts.<\/li><li><strong>Les barres sont triées<\/strong> par valeur, sauf si l'ordre a un sens (les mois, les tranches d'âge).<\/li><li><strong>Une couleur a un sens<\/strong> ou n'est pas là. Mets en avant une seule série, laisse les autres en gris.<\/li><li><strong>Pas plus de cinq ou six séries<\/strong>. Au-delà, regroupe ou fais plusieurs graphiques.<\/li><\/ul>"}, {"t": "exo", "id": "choisir-le-bon-graphique-1", "title": "L'évolution mensuelle", "h": "<p>Trace la <strong>courbe<\/strong> du chiffre d'affaires par mois (janvier, février, mars) à partir de <code>ventes.csv<\/code>, avec <code>ax.plot<\/code>. Le graphique doit avoir un titre, et l'axe vertical doit commencer à 0.<\/p>", "starter": "import pandas as pd\nimport matplotlib.pyplot as plt\n\ndf = pd.read_csv(\"ventes.csv\")\n# Calcule le CA par mois, puis trace la courbe\n\nplt.show()", "solution": "import pandas as pd\nimport matplotlib.pyplot as plt\n\ndf = pd.read_csv(\"ventes.csv\")\ndf[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\ndf[\"mois\"] = df[\"date\"].str[:7]\nca = df.groupby(\"mois\")[\"montant\"].sum()\n\nfig, ax = plt.subplots(figsize=(6, 3.5))\nax.plot(ca.index, ca.values, marker=\"o\")\nax.set_title(\"Le chiffre d'affaires a doublé en un trimestre\")\nax.set_ylabel(\"Chiffre d'affaires (€)\")\nax.set_ylim(0, 320)\nplt.show()", "tests": "import matplotlib.pyplot as plt\nassert plt.get_fignums(), \"Aucun graphique n'a été créé.\"\nax = plt.gcf().axes[0]\nassert ax.lines, \"Trace une courbe avec ax.plot(...).\"\ny = [round(float(v), 1) for v in ax.lines[0].get_ydata()]\nassert y == [142.9, 222.9, 288.8], \"La courbe doit passer par 142.9, 222.9 et 288.8 dans cet ordre. Tu obtiens %r.\" % (y,)\nassert ax.get_title().strip(), \"Donne un titre au graphique.\"\nassert abs(ax.get_ylim()[0]) < 1e-9, \"L'axe vertical doit commencer à 0 : ax.set_ylim(0, ...).\"", "hint": "<p>Pour le mois : <code>df[\"date\"].str[:7]<\/code>. Puis <code>groupby(\"mois\")[\"montant\"].sum()<\/code>, <code>ax.plot(ca.index, ca.values)<\/code> et <code>ax.set_ylim(0, 320)<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "choisir-le-bon-graphique-2", "title": "Le classement des produits", "h": "<p>Trace un diagramme en <strong>barres horizontales<\/strong> (<code>ax.barh<\/code>) du chiffre d'affaires par produit, trié pour que le produit qui rapporte le plus soit <strong>en haut<\/strong>. Dans un <code>barh<\/code>, la première valeur est tracée en bas.<\/p>", "starter": "import pandas as pd\nimport matplotlib.pyplot as plt\n\ndf = pd.read_csv(\"ventes.csv\")\n# Calcule le CA par produit, trie, puis trace\n\nplt.show()", "solution": "import pandas as pd\nimport matplotlib.pyplot as plt\n\ndf = pd.read_csv(\"ventes.csv\")\ndf[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\nca = df.groupby(\"produit\")[\"montant\"].sum().sort_values()\n\nfig, ax = plt.subplots(figsize=(6, 3.5))\nax.barh(ca.index, ca.values)\nax.set_title(\"Le clavier est le premier produit en chiffre d'affaires\")\nax.set_xlabel(\"Chiffre d'affaires (€)\")\nplt.show()", "tests": "import matplotlib.pyplot as plt\nassert plt.get_fignums(), \"Aucun graphique n'a été créé.\"\nax = plt.gcf().axes[0]\nbarres = sorted(ax.patches, key=lambda p: p.get_y())\nlargeurs = [round(float(p.get_width()), 1) for p in barres]\nassert len(largeurs) == 6, \"On attend 6 barres, une par produit. Tu en traces %d.\" % len(largeurs)\nassert largeurs == sorted(largeurs), \"De bas en haut, les barres doivent être de plus en plus longues. Trie avec sort_values() avant de tracer.\"\nassert largeurs[-1] == 196.0 and largeurs[0] == 54.0, \"La plus longue barre vaut 196.0 (Clavier) et la plus courte 54.0 (Stylo). Tu obtiens %r.\" % (largeurs,)\nassert ax.get_title().strip(), \"Donne un titre au graphique.\"", "hint": "<p><code>sort_values()<\/code> trie par ordre croissant : la plus grande valeur arrive en dernier, donc tout en haut du <code>barh<\/code>.<\/p>", "stdin": "", "skel": ""}]}]}, {"id": "numpy-polars", "title": "NumPy et Polars", "desc": "Le calcul vectorisé qui se cache sous pandas, et la bibliothèque de tableaux qui monte.", "lessons": [{"id": "numpy", "title": "NumPy : calculer sans boucle", "blocks": [{"t": "html", "h": "<p><strong>NumPy<\/strong> est la fondation du calcul scientifique en Python. pandas, scikit-learn et matplotlib reposent dessus. Son objet central est le <strong>tableau<\/strong> (<code>array<\/code>) : une suite de valeurs <strong>toutes du même type<\/strong>, rangées côte à côte en mémoire. Cette contrainte est ce qui le rend rapide.<\/p>"}, {"t": "code", "c": "import numpy as np\n\nprix = np.array([4.5, 1.2, 29.9, 8.0, 49.0, 19.5])\nprint(prix * 1.2)\nprint(prix.sum(), prix.mean(), prix.max(), prix.std())\nprint(prix[prix > 10])\nprint(prix.shape, prix.dtype)", "err": false}, {"t": "html", "h": "<p>Multiplier le tableau par 1.2 multiplie <strong>chaque élément<\/strong>, sans boucle. C'est la <strong>vectorisation<\/strong>. Le calcul est effectué par du code compilé, des dizaines de fois plus rapide qu'une boucle Python.<\/p>"}, {"t": "code", "c": "import time\nimport numpy as np\n\nn = 300_000\nliste = list(range(n))\ntableau = np.arange(n)\n\ndebut = time.perf_counter()\nresultat = [x * 2 + 1 for x in liste]\nt_liste = time.perf_counter() - debut\n\ndebut = time.perf_counter()\nresultat = tableau * 2 + 1\nt_numpy = time.perf_counter() - debut\nprint(f\"liste : {t_liste * 1000:.1f} ms | numpy : {t_numpy * 1000:.2f} ms\")", "err": false}, {"t": "html", "h": "<h3>Masques et conditions<\/h3><p>Une comparaison produit un tableau de booléens, utilisable comme filtre : c'est exactement le mécanisme des masques pandas. <code>np.where(condition, si_vrai, si_faux)<\/code> est un <code>if<\/code> / <code>else<\/code> appliqué à tout le tableau.<\/p>"}, {"t": "code", "c": "import numpy as np\n\nquantites = np.array([3, 10, 1, 2, 20])\nprix = np.array([4.5, 1.2, 29.9, 8.0, 1.2])\nmontants = quantites * prix\nprint(montants)\nprint(np.where(montants > 20, \"grosse\", \"petite\"))\nprint((montants > 20).sum(), \"ventes de plus de 20 €\")", "err": false}, {"t": "html", "h": "<h3>Deux dimensions<\/h3><p>Un tableau peut avoir des lignes et des colonnes. Le paramètre <code>axis<\/code> choisit le sens du calcul : <code>axis=0<\/code> descend le long des lignes et donne un résultat par colonne, <code>axis=1<\/code> donne un résultat par ligne.<\/p>"}, {"t": "code", "c": "import numpy as np\n\n# 3 magasins (lignes) x 4 trimestres (colonnes)\nventes = np.array([\n    [120, 135, 150, 170],\n    [80, 95, 90, 110],\n    [200, 210, 190, 230],\n])\nprint(ventes.shape)\nprint(ventes.sum(axis=1))    # total par magasin\nprint(ventes.mean(axis=0))   # moyenne par trimestre\nprint(ventes[2, 3], ventes[:, 0])", "err": false}, {"t": "html", "h": "<div class=\"note\"><span class=\"lab\">À retenir<\/span><p>Dans la pratique, tu manipuleras surtout NumPy à travers pandas : chaque colonne d'un DataFrame est un tableau NumPy. Comprendre la vectorisation t'évite d'écrire des boucles lentes sur des DataFrames.<\/p><\/div>"}, {"t": "exo", "id": "numpy-1", "title": "Centrer et réduire", "h": "<p>Écris <code>normaliser(valeurs)<\/code> qui reçoit une liste de nombres et renvoie un tableau NumPy où chaque valeur a été centrée et réduite : on lui soustrait la moyenne, puis on divise par l'écart-type (<code>.std()<\/code>). Aucune boucle.<\/p>", "starter": "import numpy as np\n\n\ndef normaliser(valeurs):\n    pass\n\n\nprint(normaliser([10, 20, 30]))", "solution": "import numpy as np\n\n\ndef normaliser(valeurs):\n    tableau = np.array(valeurs, dtype=float)\n    return (tableau - tableau.mean()) / tableau.std()\n\n\nprint(normaliser([10, 20, 30]))", "tests": "import numpy as np\nr = normaliser([10, 20, 30])\nassert isinstance(r, np.ndarray), \"normaliser doit renvoyer un tableau NumPy.\"\nassert np.allclose(r, [-1.22474487, 0.0, 1.22474487]), \"Pour [10, 20, 30], on attend environ [-1.2247, 0, 1.2247]. Tu obtiens %r.\" % (r.tolist(),)\nr2 = normaliser([2, 4, 4, 4, 5, 5, 7, 9])\nassert abs(float(r2.mean())) < 1e-9 and abs(float(r2.std()) - 1) < 1e-9, \"Après normalisation, la moyenne vaut 0 et l'écart-type vaut 1.\"\nassert \"for \" not in __code__, \"Pas de boucle : la soustraction et la division s'appliquent au tableau entier.\"", "hint": "<p><code>tableau = np.array(valeurs, dtype=float)<\/code> puis <code>(tableau - tableau.mean()) / tableau.std()<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "numpy-2", "title": "La remise conditionnelle", "h": "<p>Écris <code>prix_remises(prix, seuil, taux)<\/code> qui reçoit une liste de prix et renvoie un tableau NumPy : les prix supérieurs ou égaux à <code>seuil<\/code> sont diminués de <code>taux<\/code> pour cent, les autres sont inchangés. Utilise <code>np.where<\/code>.<\/p>", "starter": "import numpy as np\n\n\ndef prix_remises(prix, seuil, taux):\n    pass\n\n\nprint(prix_remises([20, 60, 35, 100], 50, 10))", "solution": "import numpy as np\n\n\ndef prix_remises(prix, seuil, taux):\n    tableau = np.array(prix, dtype=float)\n    return np.where(tableau >= seuil, tableau * (1 - taux / 100), tableau)\n\n\nprint(prix_remises([20, 60, 35, 100], 50, 10))", "tests": "import numpy as np\nr = prix_remises([20, 60, 35, 100], 50, 10)\nassert isinstance(r, np.ndarray), \"prix_remises doit renvoyer un tableau NumPy.\"\nassert np.allclose(r, [20, 54, 35, 90]), \"On attend [20, 54, 35, 90]. Tu obtiens %r.\" % (r.tolist(),)\nassert np.allclose(prix_remises([50], 50, 50), [25]), \"Un prix égal au seuil bénéficie de la remise.\"\nassert \"for \" not in __code__, \"Pas de boucle : utilise np.where.\"", "hint": "<p><code>np.where(tableau &gt;= seuil, tableau * (1 - taux / 100), tableau)<\/code><\/p>", "stdin": "", "skel": ""}]}, {"id": "polars", "title": "Polars, l'autre bibliothèque de tableaux", "blocks": [{"t": "html", "h": "<p><strong>Polars<\/strong> est une bibliothèque de DataFrames plus récente que pandas, écrite en Rust. Elle utilise tous les cœurs du processeur, consomme moins de mémoire et sait optimiser une suite d'opérations avant de l'exécuter. Elle gagne du terrain dans les pipelines de données.<\/p><div class=\"warn\"><span class=\"lab\">Attention<\/span><p>Polars n'est pas disponible dans le Python de cette page : les exemples ci-dessous ne sont pas exécutables ici. Lis-les à côté de leur équivalent pandas, puis essaie-les sur ta machine après <code>pip install polars<\/code>.<\/p><\/div><p>La logique est celle que tu connais : charger, filtrer, créer des colonnes, regrouper, trier. La syntaxe diffère sur un point central : Polars décrit les calculs avec des <strong>expressions<\/strong>, construites à partir de <code>pl.col(\"nom\")<\/code>.<\/p><pre class=\"static\"># pandas                                            # Polars\nimport pandas as pd                                 import polars as pl\n\ndf = pd.read_csv(\"ventes.csv\")                      df = pl.read_csv(\"ventes.csv\")\n\ndf[\"montant\"] = df[\"quantite\"] * df[\"prix_unitaire\"]\n                                                    df = df.with_columns(\n                                                        (pl.col(\"quantite\") * pl.col(\"prix_unitaire\")).alias(\"montant\")\n                                                    )\n\ndf[df[\"montant\"] &gt; 50]                              df.filter(pl.col(\"montant\") &gt; 50)\n\ndf.groupby(\"categorie\")[\"montant\"].sum()            df.group_by(\"categorie\").agg(pl.col(\"montant\").sum())\n\ndf.sort_values(\"montant\", ascending=False)          df.sort(\"montant\", descending=True)\n\nventes.merge(clients, on=\"client_id\", how=\"left\")   ventes.join(clients, on=\"client_id\", how=\"left\")<\/pre><p>Trois différences à retenir :<\/p><ul><li><strong>Pas d'index<\/strong>. Un DataFrame Polars n'a que des colonnes. Le résultat d'un <code>group_by<\/code> est un tableau ordinaire.<\/li><li><strong>Tout est immuable<\/strong>. On ne modifie jamais une colonne sur place : <code>with_columns<\/code> renvoie un nouveau DataFrame. Les enchaînements de méthodes sont la norme.<\/li><li><strong>Le mode paresseux<\/strong>. Avec <code>pl.scan_csv<\/code> à la place de <code>pl.read_csv<\/code>, rien n'est lu tout de suite. Polars attend l'appel à <code>.collect()<\/code>, analyse toute la chaîne, ne lit que les colonnes utiles et applique les filtres le plus tôt possible.<\/li><\/ul><pre class=\"static\">resultat = (\n    pl.scan_csv(\"ventes.csv\")\n    .filter(pl.col(\"categorie\") == \"Maison\")\n    .with_columns((pl.col(\"quantite\") * pl.col(\"prix_unitaire\")).alias(\"montant\"))\n    .group_by(\"produit\")\n    .agg(pl.col(\"montant\").sum().alias(\"ca\"))\n    .sort(\"ca\", descending=True)\n    .collect()\n)<\/pre><h3>Lequel choisir ?<\/h3><ul><li><strong>pandas<\/strong> pour explorer, pour les petits et moyens volumes, et parce que tout l'écosystème (graphiques, statistiques, tutoriels) le parle.<\/li><li><strong>Polars<\/strong> pour les pipelines, les gros fichiers, et quand la vitesse ou la mémoire deviennent un problème.<\/li><\/ul><p>Les deux se convertissent l'un dans l'autre (<code>pl.from_pandas(df)<\/code>, <code>df.to_pandas()<\/code>). Connaître pandas te donne les concepts ; passer à Polars est ensuite une affaire de syntaxe.<\/p>"}, {"t": "quiz", "id": "polars-1", "title": "De pandas à Polars", "h": "<p>Ce programme range dans un dictionnaire le nom Polars de quatre opérations pandas, puis les affiche. Lis-le et prédis l'affichage.<\/p>", "code": "equivalents = {\n    \"sort_values\": \"sort\",\n    \"merge\": \"join\",\n    \"groupby\": \"group_by\",\n}\nequivalents[\"df[masque]\"] = \"filter\"\nfor pandas_nom in sorted(equivalents):\n    print(pandas_nom, \"->\", equivalents[pandas_nom])", "expected": "df[masque] -> filter\ngroupby -> group_by\nmerge -> join\nsort_values -> sort"}]}]}, {"id": "pipelines", "title": "Pipelines de données", "desc": "Parler SQL depuis Python, puis construire une chaîne de traitement fiable : extraire, valider, charger, relancer sans dégât.", "lessons": [{"id": "sql-depuis-python", "title": "SQL depuis Python", "blocks": [{"t": "html", "h": "<p>Les données d'une entreprise vivent dans des <strong>bases de données<\/strong>, que l'on interroge en <strong>SQL<\/strong>. Python sert de chef d'orchestre : il envoie les requêtes et récupère les résultats. Le module <code>sqlite3<\/code>, livré avec Python, fournit une vraie base SQL dans un simple fichier, ou en mémoire. Ce que tu apprends ici se transpose à PostgreSQL, MySQL ou SQL Server : seul le module de connexion change.<\/p>"}, {"t": "code", "c": "import sqlite3\n\nconn = sqlite3.connect(\":memory:\")   # \":memory:\" = base temporaire ; un nom de fichier la rendrait durable\nconn.execute(\"CREATE TABLE produits (id INTEGER PRIMARY KEY, nom TEXT, prix REAL)\")\nconn.execute(\"INSERT INTO produits (nom, prix) VALUES ('Carnet', 4.5)\")\nconn.execute(\"INSERT INTO produits (nom, prix) VALUES ('Lampe', 29.9)\")\nconn.commit()\n\nfor ligne in conn.execute(\"SELECT id, nom, prix FROM produits ORDER BY prix DESC\"):\n    print(ligne)", "err": false}, {"t": "html", "h": "<ul><li><code>connect<\/code> ouvre la base, <code>execute<\/code> envoie une requête SQL.<\/li><li><code>commit<\/code> <strong>valide<\/strong> les modifications. Sans lui, elles sont perdues à la fermeture.<\/li><li>Un <code>SELECT<\/code> renvoie des lignes sous forme de <strong>tuples<\/strong>. <code>.fetchall()<\/code> les donne toutes dans une liste, <code>.fetchone()<\/code> une seule.<\/li><\/ul><h3>Les paramètres : jamais de valeur collée dans le SQL<\/h3><p>Pour insérer une valeur variable, on met un <code>?<\/code> dans la requête et on fournit les valeurs à part. Le module se charge de les insérer proprement.<\/p>"}, {"t": "code", "c": "import sqlite3\n\nconn = sqlite3.connect(\":memory:\")\nconn.execute(\"CREATE TABLE produits (nom TEXT, prix REAL)\")\nnouveaux = [(\"Carnet\", 4.5), (\"Stylo\", 1.2), (\"Lampe\", 29.9), (\"Clavier\", 49.0)]\nconn.executemany(\"INSERT INTO produits VALUES (?, ?)\", nouveaux)\nconn.commit()\n\nprix_max = 10\nlignes = conn.execute(\"SELECT nom FROM produits WHERE prix <= ? ORDER BY nom\", (prix_max,)).fetchall()\nprint(lignes)\nprint([nom for (nom,) in lignes])", "err": false}, {"t": "html", "h": "<p><code>executemany<\/code> répète la requête pour chaque tuple de la liste. Les paramètres se passent toujours dans un tuple, d'où <code>(prix_max,)<\/code> avec sa virgule.<\/p><div class=\"warn\"><span class=\"lab\">Attention<\/span><p>N'assemble <strong>jamais<\/strong> une requête avec une f-string ou un <code>+<\/code>. Si la valeur vient d'un utilisateur, il peut y glisser du SQL et lire ou détruire ta base : c'est l'<strong>injection SQL<\/strong>, l'une des failles les plus exploitées au monde. Les <code>?<\/code> l'empêchent.<\/p><\/div>"}, {"t": "code", "c": "import sqlite3\n\nconn = sqlite3.connect(\":memory:\")\nconn.execute(\"CREATE TABLE comptes (nom TEXT, solde REAL)\")\nconn.executemany(\"INSERT INTO comptes VALUES (?, ?)\", [(\"ada\", 100), (\"bob\", 5000)])\n\nsaisie = \"ada' OR '1'='1\"\ndangereuse = f\"SELECT nom, solde FROM comptes WHERE nom = '{saisie}'\"\nprint(\"f-string :\", conn.execute(dangereuse).fetchall())\nprint(\"paramètre :\", conn.execute(\"SELECT nom, solde FROM comptes WHERE nom = ?\", (saisie,)).fetchall())", "err": false}, {"t": "html", "h": "<p>La première requête renvoie tous les comptes. La seconde cherche, littéralement, un client dont le nom serait cette chaîne bizarre, et ne trouve rien.<\/p>"}, {"t": "exo", "id": "sql-depuis-python-1", "title": "Créer et remplir une table", "h": "<p>Écris <code>creer_catalogue(conn, produits)<\/code>. Elle crée une table <code>catalogue<\/code> avec trois colonnes (<code>nom<\/code> texte, <code>categorie<\/code> texte, <code>prix<\/code> réel), y insère la liste de tuples reçue, valide, et renvoie le nombre de lignes de la table.<\/p>", "starter": "import sqlite3\n\n\ndef creer_catalogue(conn, produits):\n    pass\n\n\nconn = sqlite3.connect(\":memory:\")\nprint(creer_catalogue(conn, [(\"Carnet\", \"Papeterie\", 4.5), (\"Lampe\", \"Maison\", 29.9)]))", "solution": "import sqlite3\n\n\ndef creer_catalogue(conn, produits):\n    conn.execute(\"CREATE TABLE catalogue (nom TEXT, categorie TEXT, prix REAL)\")\n    conn.executemany(\"INSERT INTO catalogue VALUES (?, ?, ?)\", produits)\n    conn.commit()\n    return conn.execute(\"SELECT COUNT(*) FROM catalogue\").fetchone()[0]\n\n\nconn = sqlite3.connect(\":memory:\")\nprint(creer_catalogue(conn, [(\"Carnet\", \"Papeterie\", 4.5), (\"Lampe\", \"Maison\", 29.9)]))", "tests": "import sqlite3\nc = sqlite3.connect(\":memory:\")\nn = creer_catalogue(c, [(\"A\", \"X\", 1.5), (\"B\", \"Y\", 2.0), (\"O'Neil\", \"Y\", 3.0)])\nassert n == 3, \"La fonction doit renvoyer 3 pour trois produits. Tu obtiens %r. Si elle plante sur \\\"O'Neil\\\", c'est que tu colles les valeurs dans le SQL au lieu d'utiliser des ?.\" % (n,)\nassert c.execute(\"SELECT nom, categorie, prix FROM catalogue ORDER BY prix\").fetchall() == [(\"A\", \"X\", 1.5), (\"B\", \"Y\", 2.0), (\"O'Neil\", \"Y\", 3.0)], \"Le contenu de la table catalogue n'est pas celui attendu.\"", "hint": "<p>Trois requêtes : <code>CREATE TABLE<\/code>, <code>executemany(\"INSERT INTO catalogue VALUES (?, ?, ?)\", produits)<\/code>, puis <code>SELECT COUNT(*)<\/code> suivi de <code>.fetchone()[0]<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "sql-depuis-python-2", "title": "Une recherche paramétrée", "h": "<p>La base de la boutique est fournie par <code>base_boutique.ouvrir()<\/code>. Sa table <code>ventes<\/code> a les colonnes <code>date<\/code>, <code>client_id<\/code>, <code>produit<\/code>, <code>categorie<\/code>, <code>quantite<\/code>, <code>prix_unitaire<\/code>. Écris <code>produits_achetes(conn, client_id)<\/code> qui renvoie la liste, triée par ordre alphabétique et sans doublon, des produits achetés par ce client.<\/p>", "starter": "from base_boutique import ouvrir\n\n\ndef produits_achetes(conn, client_id):\n    pass\n\n\nprint(produits_achetes(ouvrir(), \"C01\"))", "solution": "from base_boutique import ouvrir\n\n\ndef produits_achetes(conn, client_id):\n    lignes = conn.execute(\n        \"SELECT DISTINCT produit FROM ventes WHERE client_id = ? ORDER BY produit\", (client_id,)\n    ).fetchall()\n    return [produit for (produit,) in lignes]\n\n\nprint(produits_achetes(ouvrir(), \"C01\"))", "tests": "from base_boutique import ouvrir\nc = ouvrir()\nassert produits_achetes(c, \"C01\") == [\"Carnet\", \"Lampe\", \"Stylo\", \"Tasse\"], \"Pour C01, on attend ['Carnet', 'Lampe', 'Stylo', 'Tasse']. Tu obtiens %r.\" % (produits_achetes(c, \"C01\"),)\nassert produits_achetes(c, \"C99\") == [], \"Pour un client inconnu, on attend une liste vide.\"\nassert produits_achetes(c, \"C01' OR '1'='1\") == [], \"Ta requête est vulnérable à l'injection SQL : passe client_id en paramètre avec un ?.\"", "hint": "<p><code>SELECT DISTINCT produit FROM ventes WHERE client_id = ? ORDER BY produit<\/code>, avec <code>(client_id,)<\/code> en second argument. Chaque ligne est un tuple à un élément.<\/p>", "stdin": "", "skel": ""}, {"t": "quiz", "id": "sql-depuis-python-3", "title": "Lire une requête", "h": "", "code": "import sqlite3\n\nconn = sqlite3.connect(\":memory:\")\nconn.execute(\"CREATE TABLE t (nom TEXT, prix REAL)\")\nconn.executemany(\"INSERT INTO t VALUES (?, ?)\", [(\"a\", 5), (\"b\", 20), (\"c\", 12)])\nprint(conn.execute(\"SELECT COUNT(*) FROM t WHERE prix > ?\", (10,)).fetchone())\nprint(conn.execute(\"SELECT nom FROM t ORDER BY prix DESC\").fetchall())\nprint(conn.execute(\"SELECT nom FROM t WHERE prix > 100\").fetchone())", "expected": "(2,)\n[('b',), ('c',), ('a',)]\nNone"}]}, {"id": "sql-pour-analyser", "title": "SQL pour analyser", "blocks": [{"t": "html", "h": "<p>Tout ce que tu as fait avec des dictionnaires puis avec pandas existe en SQL. Et quand les données sont dans une base, c'est à elle de faire le travail : elle est optimisée pour cela, et seul le résultat voyage jusqu'à ton programme.<\/p><div class=\"tw\"><table><thead><tr><th>Besoin<\/th><th>Python pur<\/th><th>pandas<\/th><th>SQL<\/th><\/tr><\/thead><tbody><tr><td>filtrer<\/td><td><code>if<\/code> dans une boucle<\/td><td><code>df[masque]<\/code><\/td><td><code>WHERE<\/code><\/td><\/tr><tr><td>regrouper<\/td><td>dictionnaire et <code>get<\/code><\/td><td><code>groupby<\/code><\/td><td><code>GROUP BY<\/code><\/td><\/tr><tr><td>croiser<\/td><td>dictionnaire d'index<\/td><td><code>merge<\/code><\/td><td><code>JOIN<\/code><\/td><\/tr><tr><td>trier<\/td><td><code>sorted(key=...)<\/code><\/td><td><code>sort_values<\/code><\/td><td><code>ORDER BY<\/code><\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "code", "c": "from base_boutique import ouvrir\n\nconn = ouvrir()\nrequete = \"\"\"\n    SELECT categorie,\n           COUNT(*)                                 AS nb_ventes,\n           ROUND(SUM(quantite * prix_unitaire), 2)  AS ca\n    FROM ventes\n    GROUP BY categorie\n    ORDER BY ca DESC\n\"\"\"\nfor ligne in conn.execute(requete):\n    print(ligne)", "err": false}, {"t": "html", "h": "<p>Les triples guillemets permettent d'écrire la requête sur plusieurs lignes, lisible comme du SQL.<\/p><h3>Des lignes que l'on lit par nom de colonne<\/h3><p>Par défaut, une ligne est un tuple : <code>ligne[2]<\/code> ne dit pas ce qu'elle contient. Avec <code>row_factory = sqlite3.Row<\/code>, chaque ligne se lit comme un dictionnaire.<\/p>"}, {"t": "code", "c": "import sqlite3\nfrom base_boutique import ouvrir\n\nconn = ouvrir()\nconn.row_factory = sqlite3.Row\nrequete = \"\"\"\n    SELECT c.ville, ROUND(SUM(v.quantite * v.prix_unitaire), 2) AS ca\n    FROM ventes AS v\n    JOIN clients AS c ON c.client_id = v.client_id\n    GROUP BY c.ville\n    ORDER BY ca DESC\n\"\"\"\nfor ligne in conn.execute(requete):\n    print(ligne[\"ville\"], ligne[\"ca\"])\nprint(dict(conn.execute(\"SELECT * FROM clients\").fetchone()))", "err": false}, {"t": "html", "h": "<h3>pandas sait lire du SQL<\/h3><p><code>pd.read_sql<\/code> exécute une requête et renvoie directement un DataFrame. C'est le pont habituel entre la base et l'analyse.<\/p>"}, {"t": "code", "c": "import pandas as pd\nfrom base_boutique import ouvrir\n\ndf = pd.read_sql(\"SELECT produit, SUM(quantite) AS quantite FROM ventes GROUP BY produit\", ouvrir())\nprint(df.sort_values(\"quantite\", ascending=False))", "err": false}, {"t": "html", "h": "<div class=\"note\"><span class=\"lab\">À retenir<\/span><p>Règle pratique : filtre et agrège en SQL, au plus près des données. Garde Python pour ce que SQL fait mal : la logique complexe, les appels externes, les graphiques.<\/p><\/div>"}, {"t": "exo", "id": "sql-pour-analyser-1", "title": "Le chiffre d'affaires mensuel en SQL", "h": "<p>Écris <code>ca_mensuel(conn)<\/code> qui renvoie un dictionnaire mois (<code>AAAA-MM<\/code>) → chiffre d'affaires arrondi à 2 décimales. Le regroupement doit être fait <strong>par la base<\/strong>, avec <code>GROUP BY<\/code>. En SQLite, <code>substr(date, 1, 7)<\/code> extrait les sept premiers caractères.<\/p>", "starter": "from base_boutique import ouvrir\n\n\ndef ca_mensuel(conn):\n    pass\n\n\nprint(ca_mensuel(ouvrir()))", "solution": "from base_boutique import ouvrir\n\n\ndef ca_mensuel(conn):\n    requete = \"\"\"\n        SELECT substr(date, 1, 7) AS mois, ROUND(SUM(quantite * prix_unitaire), 2) AS ca\n        FROM ventes\n        GROUP BY mois\n        ORDER BY mois\n    \"\"\"\n    return {mois: ca for mois, ca in conn.execute(requete)}\n\n\nprint(ca_mensuel(ouvrir()))", "tests": "from base_boutique import ouvrir\nr = ca_mensuel(ouvrir())\nassert r == {\"2025-01\": 142.9, \"2025-02\": 222.9, \"2025-03\": 288.8}, \"On attend {'2025-01': 142.9, '2025-02': 222.9, '2025-03': 288.8}. Tu obtiens %r.\" % (r,)\nassert \"group by\" in __code__.lower(), \"Le regroupement doit être fait en SQL, avec GROUP BY.\"", "hint": "<p><code>SELECT substr(date, 1, 7) AS mois, ROUND(SUM(quantite * prix_unitaire), 2) FROM ventes GROUP BY mois<\/code>, puis une compréhension de dictionnaire sur les lignes renvoyées.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "sql-pour-analyser-2", "title": "Le meilleur client par ville", "h": "<p>Écris <code>meilleurs_clients(conn)<\/code> qui renvoie une liste de tuples <code>(ville, nom, ca)<\/code>, un par client, triée par chiffre d'affaires décroissant, avec le <code>ca<\/code> arrondi à 2 décimales. La jointure entre <code>ventes<\/code> et <code>clients<\/code> doit être faite en SQL.<\/p>", "starter": "from base_boutique import ouvrir\n\n\ndef meilleurs_clients(conn):\n    pass\n\n\nfor ligne in meilleurs_clients(ouvrir()):\n    print(ligne)", "solution": "from base_boutique import ouvrir\n\n\ndef meilleurs_clients(conn):\n    requete = \"\"\"\n        SELECT c.ville, c.nom, ROUND(SUM(v.quantite * v.prix_unitaire), 2) AS ca\n        FROM ventes AS v\n        JOIN clients AS c ON c.client_id = v.client_id\n        GROUP BY c.client_id\n        ORDER BY ca DESC\n    \"\"\"\n    return [tuple(ligne) for ligne in conn.execute(requete)]\n\n\nfor ligne in meilleurs_clients(ouvrir()):\n    print(ligne)", "tests": "from base_boutique import ouvrir\nr = [tuple(x) for x in meilleurs_clients(ouvrir())]\nassert r == [(\"Nantes\", \"Emma\", 185.0), (\"Lyon\", \"Chloé\", 148.4), (\"Lille\", \"Diego\", 140.8), (\"Nantes\", \"Bastien\", 103.0), (\"Lyon\", \"Amina\", 77.4)], \"Résultat obtenu : %r\" % (r,)\nassert \"join\" in __code__.lower(), \"Croise les deux tables en SQL, avec JOIN.\"", "hint": "<p><code>FROM ventes AS v JOIN clients AS c ON c.client_id = v.client_id<\/code>, puis <code>GROUP BY c.client_id<\/code> et <code>ORDER BY ca DESC<\/code>.<\/p>", "stdin": "", "skel": ""}]}, {"id": "extraire-transformer-charger", "title": "Extraire, transformer, charger", "blocks": [{"t": "html", "h": "<p>Un <strong>pipeline de données<\/strong> déplace des données d'une source vers une destination en les rendant utilisables au passage. Presque tous suivent trois étapes, d'où leur nom d'<strong>ETL<\/strong> : <strong>E<\/strong>xtract, <strong>T<\/strong>ransform, <strong>L<\/strong>oad.<\/p><ul><li><strong>Extraire<\/strong> : lire la source (fichier, API, base) telle qu'elle est.<\/li><li><strong>Transformer<\/strong> : nettoyer, convertir, calculer, filtrer.<\/li><li><strong>Charger<\/strong> : écrire le résultat dans la destination.<\/li><\/ul><p>La règle d'or : <strong>une fonction par étape<\/strong>, et une transformation <strong>pure<\/strong>, qui ne lit ni n'écrit rien. Elle reçoit des données et en renvoie. On peut alors la tester avec trois lignes inventées, sans fichier ni base.<\/p>"}, {"t": "code", "c": "import csv\nimport sqlite3\n\n\ndef extraire(nom_fichier):\n    with open(nom_fichier, encoding=\"utf-8\") as fichier:\n        return list(csv.DictReader(fichier))\n\n\ndef transformer(lignes):\n    resultat = []\n    for l in lignes:\n        quantite = int(l[\"quantite\"])\n        prix = float(l[\"prix_unitaire\"])\n        resultat.append((l[\"date\"], l[\"produit\"], quantite, round(quantite * prix, 2)))\n    return resultat\n\n\ndef charger(conn, lignes):\n    conn.execute(\"CREATE TABLE IF NOT EXISTS faits_ventes (date TEXT, produit TEXT, quantite INTEGER, montant REAL)\")\n    conn.executemany(\"INSERT INTO faits_ventes VALUES (?, ?, ?, ?)\", lignes)\n    conn.commit()\n\n\ndef pipeline(nom_fichier, conn):\n    brutes = extraire(nom_fichier)\n    propres = transformer(brutes)\n    charger(conn, propres)\n    return len(propres)\n\n\nconn = sqlite3.connect(\":memory:\")\nprint(pipeline(\"ventes.csv\", conn), \"lignes chargées\")\nprint(conn.execute(\"SELECT ROUND(SUM(montant), 2) FROM faits_ventes\").fetchone())", "err": false}, {"t": "html", "h": "<p>La fonction <code>pipeline<\/code> ne contient aucune logique : elle enchaîne. C'est elle qu'un ordonnanceur (cron, Airflow, une tâche planifiée dans le cloud) lancera chaque nuit.<\/p><p>Ce pipeline a un défaut : il suppose que le fichier est propre. Le fichier <code>ventes_brutes.csv<\/code>, que tu utiliseras dans la suite du module, ne l'est pas.<\/p>"}, {"t": "code", "c": "with open(\"ventes_brutes.csv\", encoding=\"utf-8\") as fichier:\n    print(fichier.read())", "err": false}, {"t": "html", "h": "<p>Repère les problèmes : espaces et majuscules incohérentes, quantité manquante, quantité négative, date dans un autre format, ligne en double, prix qui n'est pas un nombre.<\/p>"}, {"t": "exo", "id": "extraire-transformer-charger-1", "title": "Une transformation pure", "h": "<p>Écris <code>transformer(lignes)<\/code>. Elle reçoit des dictionnaires dont toutes les valeurs sont de
