is <code>inverser(d)<\/code> qui renvoie un nouveau dictionnaire où les clés et les valeurs ont échangé leur place. Utilise une compréhension de dictionnaire.<\/p>", "starter": "def inverser(d):\n    pass\n\n\nprint(inverser({\"FR\": \"France\", \"IT\": \"Italie\"}))", "solution": "def inverser(d):\n    return {valeur: cle for cle, valeur in d.items()}\n\n\nprint(inverser({\"FR\": \"France\", \"IT\": \"Italie\"}))", "tests": "assert inverser({\"FR\": \"France\", \"IT\": \"Italie\"}) == {\"France\": \"FR\", \"Italie\": \"IT\"}, \"Résultat obtenu : %r\" % (inverser({\"FR\": \"France\", \"IT\": \"Italie\"}),)\nassert inverser({}) == {}", "hint": "<p><code>{valeur: cle for cle, valeur in d.items()}<\/code><\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "ecritures-compactes-2", "title": "Le stock en un coup d'œil", "h": "<p>Écris <code>etat_du_stock(stock)<\/code> qui reçoit un dictionnaire produit → quantité et renvoie un dictionnaire produit → <code>\"rupture\"<\/code> si la quantité vaut 0, <code>\"faible\"<\/code> si elle est inférieure à 5, <code>\"ok\"<\/code> sinon.<\/p>", "starter": "def etat_du_stock(stock):\n    pass\n\n\nprint(etat_du_stock({\"carnet\": 12, \"stylo\": 0, \"lampe\": 3}))", "solution": "def etat_du_stock(stock):\n    return {\n        produit: \"rupture\" if q == 0 else \"faible\" if q < 5 else \"ok\"\n        for produit, q in stock.items()\n    }\n\n\nprint(etat_du_stock({\"carnet\": 12, \"stylo\": 0, \"lampe\": 3}))", "tests": "assert etat_du_stock({\"carnet\": 12, \"stylo\": 0, \"lampe\": 3}) == {\"carnet\": \"ok\", \"stylo\": \"rupture\", \"lampe\": \"faible\"}, \"Résultat obtenu : %r\" % (etat_du_stock({\"carnet\": 12, \"stylo\": 0, \"lampe\": 3}),)\nassert etat_du_stock({\"a\": 5, \"b\": 4}) == {\"a\": \"ok\", \"b\": \"faible\"}, \"Le seuil est à 5 : 5 est ok, 4 est faible.\"", "hint": "<p>Tu peux écrire une petite fonction <code>etat(q)<\/code> avec des <code>if<\/code>, puis <code>{produit: etat(q) for produit, q in stock.items()}<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "quiz", "id": "ecritures-compactes-3", "title": "Vrai, faux et compréhensions", "h": "", "code": "valeurs = [0, 1, \"\", \"a\", [], [0], None]\nprint(len([v for v in valeurs if v]))\nprint({n: n * n for n in range(3)})\nprint(\"oui\" if [] else \"non\", \"oui\" if [[]] else \"non\")", "expected": "3\n{0: 0, 1: 1, 2: 4}\nnon oui"}]}]}, {"id": "algorithmes", "title": "Algorithmes classiques", "desc": "Chercher, trier, empiler : les raisonnements que l'on retrouve partout, et en entretien.", "lessons": [{"id": "recherche-et-efficacite", "title": "Recherche et efficacité", "blocks": [{"t": "html", "h": "<p>Un <strong>algorithme<\/strong> est une méthode précise pour résoudre un problème. Deux algorithmes peuvent donner le même résultat avec des vitesses très différentes. Dès que les données grossissent, cette différence décide si ton programme répond en une seconde ou en une heure.<\/p><h3>La recherche linéaire<\/h3><p>Pour trouver une valeur dans une liste quelconque, pas le choix : on regarde les éléments un par un. Dans le pire des cas, on les examine tous. Pour un million d'éléments, un million de comparaisons.<\/p>"}, {"t": "code", "c": "def recherche_lineaire(liste, cible):\n    for position, valeur in enumerate(liste):\n        if valeur == cible:\n            return position\n    return -1\n\nprint(recherche_lineaire([8, 3, 15, 4], 15))\nprint(recherche_lineaire([8, 3, 15, 4], 99))", "err": false}, {"t": "html", "h": "<h3>La recherche dichotomique<\/h3><p>Si la liste est <strong>triée<\/strong>, on peut faire beaucoup mieux, comme quand on cherche un mot dans un dictionnaire papier : on ouvre au milieu, on regarde si le mot est avant ou après, et on élimine la moitié du livre. Puis on recommence sur la moitié restante.<\/p>"}, {"t": "code", "c": "def recherche_dichotomique(liste, cible):\n    debut = 0\n    fin = len(liste) - 1\n    etapes = 0\n    while debut <= fin:\n        etapes += 1\n        milieu = (debut + fin) // 2\n        if liste[milieu] == cible:\n            print(\"trouvé en\", etapes, \"étapes\")\n            return milieu\n        if liste[milieu] < cible:\n            debut = milieu + 1\n        else:\n            fin = milieu - 1\n    return -1\n\ngrande_liste = list(range(0, 2_000_000, 2))\nprint(recherche_dichotomique(grande_liste, 1_234_568))", "err": false}, {"t": "html", "h": "<p>Un million d'éléments, une vingtaine d'étapes : chaque étape divise le problème par deux.<\/p><h3>Parler d'efficacité<\/h3><p>On décrit la vitesse d'un algorithme par la façon dont le nombre d'opérations grandit avec la taille <code>n<\/code> des données.<\/p><div class=\"tw\"><table><thead><tr><th>Notation<\/th><th>Nom<\/th><th>Exemple<\/th><th>Pour n = 1 000 000<\/th><\/tr><\/thead><tbody><tr><td>O(1)<\/td><td>constant<\/td><td>lire <code>d[cle]<\/code> dans un dictionnaire, tester <code>x in ensemble<\/code><\/td><td>1 opération<\/td><\/tr><tr><td>O(log n)<\/td><td>logarithmique<\/td><td>recherche dichotomique<\/td><td>environ 20<\/td><\/tr><tr><td>O(n)<\/td><td>linéaire<\/td><td>parcourir une liste, tester <code>x in liste<\/code><\/td><td>1 000 000<\/td><\/tr><tr><td>O(n log n)<\/td><td>quasi linéaire<\/td><td><code>sorted<\/code><\/td><td>environ 20 000 000<\/td><\/tr><tr><td>O(n²)<\/td><td>quadratique<\/td><td>deux boucles imbriquées sur la liste<\/td><td>1 000 000 000 000<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\"><span class=\"lab\">À retenir<\/span><p>Conséquence pratique immédiate : tester <code>x in liste<\/code> dans une boucle est lent sur de gros volumes. Convertis la liste en <code>set<\/code> ou en dictionnaire avant la boucle, et le test devient instantané.<\/p><\/div>"}, {"t": "exo", "id": "recherche-et-efficacite-1", "title": "Écrire la dichotomie", "h": "<p>Écris <code>position(liste_triee, cible)<\/code> qui renvoie l'indice de <code>cible<\/code> dans une liste triée, ou <code>-1<\/code> si elle est absente, par dichotomie. Les méthodes <code>index<\/code> et l'opérateur <code>in<\/code> sont interdits.<\/p>", "starter": "def position(liste_triee, cible):\n    pass\n\n\nprint(position([2, 5, 8, 12, 16, 23], 16))", "solution": "def position(liste_triee, cible):\n    debut = 0\n    fin = len(liste_triee) - 1\n    while debut <= fin:\n        milieu = (debut + fin) // 2\n        if liste_triee[milieu] == cible:\n            return milieu\n        if liste_triee[milieu] < cible:\n            debut = milieu + 1\n        else:\n            fin = milieu - 1\n    return -1\n\n\nprint(position([2, 5, 8, 12, 16, 23], 16))", "tests": "assert \".index(\" not in __code__ and \" in liste_triee\" not in __code__, \"Écris la dichotomie toi-même, sans index ni in.\"\nl = [2, 5, 8, 12, 16, 23]\nassert [position(l, x) for x in l] == [0, 1, 2, 3, 4, 5], \"Chaque élément de [2, 5, 8, 12, 16, 23] doit être retrouvé à sa position.\"\nassert position(l, 1) == -1 and position(l, 30) == -1 and position(l, 9) == -1, \"Une valeur absente doit donner -1.\"\nassert position([], 3) == -1, \"Dans une liste vide, on renvoie -1.\"\nclass Espion(list):\n    lectures = 0\n    def __getitem__(self, i):\n        Espion.lectures += 1\n        return list.__getitem__(self, i)\ngrande = Espion(range(100000))\nassert position(grande, 77777) == 77777\nassert Espion.lectures < 100, \"Ta fonction a lu %d éléments pour trouver une valeur parmi 100000 : ce n'est pas une dichotomie.\" % Espion.lectures", "hint": "<p>Garde deux bornes, <code>debut<\/code> et <code>fin<\/code>. Tant que <code>debut &lt;= fin<\/code>, regarde l'élément du milieu : s'il est trop petit, la cible est à droite (<code>debut = milieu + 1<\/code>), sinon à gauche (<code>fin = milieu - 1<\/code>).<\/p>", "stdin": "", "skel": "def position(liste_triee, cible):\n    ...\n    while debut <= fin:\n        ...\n        if ...:\n            return ...\n        if ...:\n            ...\n        else:\n            ...\n    return ...\n\nprint(position([2, 5, 8, 12, 16, 23], 16))"}, {"t": "quiz", "id": "recherche-et-efficacite-2", "title": "Compter les étapes de la dichotomie", "h": "", "code": "def etapes(liste, cible):\n    debut, fin, n = 0, len(liste) - 1, 0\n    while debut <= fin:\n        n += 1\n        milieu = (debut + fin) // 2\n        if liste[milieu] == cible:\n            return n\n        if liste[milieu] < cible:\n            debut = milieu + 1\n        else:\n            fin = milieu - 1\n    return -n\n\n\nl = [1, 3, 5, 7, 9, 11, 13]\nprint(etapes(l, 7))\nprint(etapes(l, 1))\nprint(etapes(l, 4))", "expected": "1\n3\n-3"}]}, {"id": "trier-a-la-main", "title": "Trier à la main", "blocks": [{"t": "html", "h": "<p>En pratique, tu utiliseras toujours <code>sorted<\/code>. Écrire un tri soi-même reste un excellent exercice de raisonnement sur les boucles et les indices, et un classique d'entretien.<\/p><h3>Le tri par sélection<\/h3><p>L'idée, celle qu'on applique en rangeant des cartes : chercher le plus petit élément et le mettre en première position, puis chercher le plus petit du reste et le mettre en deuxième position, et ainsi de suite.<\/p>"}, {"t": "code", "c": "def tri_selection(liste):\n    resultat = liste.copy()\n    n = len(resultat)\n    for i in range(n):\n        position_min = i\n        for j in range(i + 1, n):\n            if resultat[j] < resultat[position_min]:\n                position_min = j\n        resultat[i], resultat[position_min] = resultat[position_min], resultat[i]\n        print(\"après le tour\", i, \":\", resultat)\n    return resultat\n\ntri_selection([5, 2, 9, 1])", "err": false}, {"t": "html", "h": "<p>Deux boucles imbriquées sur la liste : c'est un algorithme en O(n²). Pour 10 000 éléments, il fait environ 50 millions de comparaisons, là où <code>sorted<\/code> en fait environ 130 000.<\/p>"}, {"t": "exo", "id": "trier-a-la-main-1", "title": "Le tri à bulles", "h": "<p>Autre tri classique : on parcourt la liste en comparant chaque élément à son voisin de droite et on les échange s'ils sont dans le mauvais ordre. On recommence tant qu'un parcours a provoqué au moins un échange. Écris <code>tri_bulles(liste)<\/code>, qui renvoie une nouvelle liste triée sans modifier l'originale, et sans <code>sorted<\/code> ni <code>sort<\/code>.<\/p>", "starter": "def tri_bulles(liste):\n    pass\n\n\nprint(tri_bulles([5, 2, 9, 1, 5]))", "solution": "def tri_bulles(liste):\n    resultat = liste.copy()\n    echange = True\n    while echange:\n        echange = False\n        for i in range(len(resultat) - 1):\n            if resultat[i] > resultat[i + 1]:\n                resultat[i], resultat[i + 1] = resultat[i + 1], resultat[i]\n                echange = True\n    return resultat\n\n\nprint(tri_bulles([5, 2, 9, 1, 5]))", "tests": "assert \"sorted\" not in __code__ and \".sort(\" not in __code__, \"Écris le tri toi-même, sans sorted ni sort.\"\noriginal = [5, 2, 9, 1, 5]\nassert tri_bulles(original) == [1, 2, 5, 5, 9], \"On attend [1, 2, 5, 5, 9]. Tu obtiens %r.\" % (tri_bulles(original),)\nassert original == [5, 2, 9, 1, 5], \"La liste d'origine ne doit pas être modifiée : travaille sur une copie.\"\nassert tri_bulles([]) == [] and tri_bulles([1]) == [1] and tri_bulles([3, 2, 1]) == [1, 2, 3]", "hint": "<p>Travaille sur <code>liste.copy()<\/code>. Une boucle <code>while echange:<\/code> contient une boucle <code>for i in range(len(resultat) - 1)<\/code> qui compare <code>resultat[i]<\/code> et <code>resultat[i + 1]<\/code>.<\/p>", "stdin": "", "skel": "def tri_bulles(liste):\n    ...\n    while echange:\n        ...\n        for i in range(len(resultat) - 1):\n            if ...:\n                ...\n    return ...\n\nprint(tri_bulles([5, 2, 9, 1, 5]))"}]}, {"id": "piles-et-files", "title": "Piles et files", "blocks": [{"t": "html", "h": "<p>Deux façons d'organiser des éléments en attente reviennent sans cesse.<\/p><h3>La pile : dernier arrivé, premier sorti<\/h3><p>Comme une pile d'assiettes : on pose et on reprend par le dessus. Une liste Python suffit, avec <code>append<\/code> pour empiler et <code>pop<\/code> pour dépiler. C'est le mécanisme du bouton « Annuler » et de l'historique d'un navigateur.<\/p>"}, {"t": "code", "c": "historique = []\nhistorique.append(\"page 1\")\nhistorique.append(\"page 2\")\nhistorique.append(\"page 3\")\nprint(historique.pop())\nprint(historique.pop())\nprint(historique)", "err": false}, {"t": "html", "h": "<h3>La file : premier arrivé, premier sorti<\/h3><p>Comme une file d'attente à la caisse. On utilise <code>deque<\/code> (prononcer « dèque »), qui retire efficacement par la gauche.<\/p>"}, {"t": "code", "c": "from collections import deque\n\nfile_attente = deque()\nfile_attente.append(\"client A\")\nfile_attente.append(\"client B\")\nfile_attente.append(\"client C\")\nprint(file_attente.popleft())\nprint(file_attente.popleft())\nprint(len(file_attente))", "err": false}, {"t": "exo", "id": "piles-et-files-1", "title": "Les parenthèses équilibrées", "h": "<p>Écris <code>est_equilibre(texte)<\/code> qui renvoie <code>True<\/code> si chaque parenthèse, crochet ou accolade ouvrant est refermé par le bon symbole, dans le bon ordre. <code>\"(a[b]{c})\"<\/code> est équilibré ; <code>\"(]\"<\/code>, <code>\"(()\"<\/code> et <code>\")(\"<\/code> ne le sont pas. Les autres caractères sont ignorés.<\/p>", "starter": "def est_equilibre(texte):\n    pass\n\n\nprint(est_equilibre(\"(a[b]{c})\"), est_equilibre(\"(]\"))", "solution": "def est_equilibre(texte):\n    paires = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    pile = []\n    for c in texte:\n        if c in \"([{\":\n            pile.append(c)\n        elif c in paires:\n            if not pile or pile.pop() != paires[c]:\n                return False\n    return not pile\n\n\nprint(est_equilibre(\"(a[b]{c})\"), est_equilibre(\"(]\"))", "tests": "for t in [\"(a[b]{c})\", \"\", \"abc\", \"([]{})\", \"((()))\"]:\n    assert est_equilibre(t) is True, \"%r est équilibré : on attend True.\" % t\nfor t in [\"(]\", \"(()\", \")(\", \"([)]\", \"}\", \"(((\"]:\n    assert est_equilibre(t) is False, \"%r n'est pas équilibré : on attend False.\" % t", "hint": "<p>Utilise une pile. Un symbole ouvrant s'empile. Un symbole fermant doit correspondre au sommet de la pile, que l'on dépile ; sinon, c'est <code>False<\/code>. À la fin, la pile doit être vide.<\/p>", "stdin": "", "skel": "def est_equilibre(texte):\n    ...\n    for c in texte:\n        if ...:\n            ...\n        elif ...:\n            if ...:\n                return ...\n    return ...\n\nprint(est_equilibre(\"(a[b]{c})\"), est_equilibre(\"(]\"))"}, {"t": "quiz", "id": "piles-et-files-2", "title": "Pile ou file ?", "h": "", "code": "from collections import deque\n\npile = []\nfile = deque()\nfor x in \"abc\":\n    pile.append(x)\n    file.append(x)\nprint(pile.pop(), file.popleft())\npile.append(\"d\")\nfile.append(\"d\")\nprint(pile.pop(), file.popleft())\nprint(pile, list(file))", "expected": "c a\nd b\n['a', 'b'] ['c', 'd']"}]}, {"id": "problemes-d-entretien", "title": "Trois problèmes d'entretien", "blocks": [{"t": "html", "h": "<p>Ces trois problèmes sont posés en entretien technique. Ils ont un point commun : la première idée qui vient utilise deux boucles imbriquées (O(n²)), et la bonne solution utilise un dictionnaire ou un ensemble pour ne parcourir les données qu'une fois (O(n)).<\/p><p>Voici le raisonnement sur un exemple : trouver si une liste contient un doublon.<\/p>"}, {"t": "code", "c": "def a_un_doublon_lent(liste):\n    for i in range(len(liste)):\n        for j in range(i + 1, len(liste)):\n            if liste[i] == liste[j]:\n                return True\n    return False\n\ndef a_un_doublon_rapide(liste):\n    deja_vus = set()\n    for valeur in liste:\n        if valeur in deja_vus:\n            return True\n        deja_vus.add(valeur)\n    return False\n\nprint(a_un_doublon_lent([3, 1, 4, 1]), a_un_doublon_rapide([3, 1, 4, 1]))", "err": false}, {"t": "html", "h": "<p>La version rapide se souvient de ce qu'elle a déjà vu. Cette idée, « mémoriser dans un ensemble ou un dictionnaire pour éviter de re-parcourir », résout une grande famille de problèmes.<\/p>"}, {"t": "exo", "id": "problemes-d-entretien-1", "title": "Le premier doublon", "h": "<p>Écris <code>premier_doublon(liste)<\/code> qui renvoie la première valeur rencontrée pour la deuxième fois en parcourant la liste de gauche à droite, ou <code>None<\/code> s'il n'y a aucun doublon. Pour <code>[3, 1, 4, 1, 3]<\/code>, la réponse est 1.<\/p>", "starter": "def premier_doublon(liste):\n    pass\n\n\nprint(premier_doublon([3, 1, 4, 1, 3]))", "solution": "def premier_doublon(liste):\n    deja_vus = set()\n    for valeur in liste:\n        if valeur in deja_vus:\n            return valeur\n        deja_vus.add(valeur)\n    return None\n\n\nprint(premier_doublon([3, 1, 4, 1, 3]))", "tests": "assert premier_doublon([3, 1, 4, 1, 3]) == 1, \"Pour [3, 1, 4, 1, 3], on attend 1 : c'est le premier à apparaître une deuxième fois. Tu obtiens %r.\" % (premier_doublon([3, 1, 4, 1, 3]),)\nassert premier_doublon([1, 2, 3]) is None, \"Sans doublon, on attend None.\"\nassert premier_doublon([\"a\", \"b\", \"b\", \"a\"]) == \"b\"\nassert premier_doublon(list(range(60000)) + [5]) == 5, \"Ta fonction doit rester rapide sur une grande liste.\"", "hint": "<p>Un ensemble <code>deja_vus<\/code>. Pour chaque valeur : si elle y est déjà, renvoie-la ; sinon, ajoute-la.<\/p>", "stdin": "", "skel": "def premier_doublon(liste):\n    ...\n    for valeur in liste:\n        if ...:\n            return ...\n        ...\n    return ...\n\nprint(premier_doublon([3, 1, 4, 1, 3]))"}, {"t": "exo", "id": "problemes-d-entretien-2", "title": "La somme cible", "h": "<p>Écris <code>paire_pour_somme(nombres, cible)<\/code> qui renvoie les positions <code>(i, j)<\/code>, avec <code>i &lt; j<\/code>, de deux nombres dont la somme vaut <code>cible<\/code>, ou <code>None<\/code> si aucune paire ne convient. Pour <code>[2, 7, 11, 15]<\/code> et la cible 9, la réponse est <code>(0, 1)<\/code>.<\/p>", "starter": "def paire_pour_somme(nombres, cible):\n    pass\n\n\nprint(paire_pour_somme([2, 7, 11, 15], 9))", "solution": "def paire_pour_somme(nombres, cible):\n    positions = {}\n    for j, n in enumerate(nombres):\n        complement = cible - n\n        if complement in positions:\n            return (positions[complement], j)\n        positions[n] = j\n    return None\n\n\nprint(paire_pour_somme([2, 7, 11, 15], 9))", "tests": "assert tuple(paire_pour_somme([2, 7, 11, 15], 9)) == (0, 1), \"Pour [2, 7, 11, 15] et 9, on attend (0, 1).\"\nassert tuple(paire_pour_somme([3, 2, 4], 6)) == (1, 2), \"Pour [3, 2, 4] et 6, on attend (1, 2) : un même élément ne peut pas servir deux fois.\"\nassert paire_pour_somme([1, 2, 3], 100) is None, \"Sans solution, on attend None.\"\nassert tuple(paire_pour_somme([5, 5], 10)) == (0, 1)", "hint": "<p>Pour chaque nombre <code>n<\/code>, celui qu'il lui faut est <code>cible - n<\/code>. Garde un dictionnaire valeur → position des nombres déjà vus, et regarde si le complément s'y trouve avant d'y ajouter <code>n<\/code>.<\/p>", "stdin": "", "skel": "def paire_pour_somme(nombres, cible):\n    ...\n    for j, n in enumerate(nombres):\n        ...\n        if ...:\n            return ...\n        ...\n    return ...\n\nprint(paire_pour_somme([2, 7, 11, 15], 9))"}, {"t": "exo", "id": "problemes-d-entretien-3", "title": "Fusionner deux listes triées", "h": "<p>Écris <code>fusionner(a, b)<\/code> qui reçoit deux listes déjà triées et renvoie une seule liste triée contenant tous leurs éléments, <strong>sans<\/strong> utiliser <code>sorted<\/code> ni <code>sort<\/code>. Profite du fait qu'elles sont déjà triées : avance dans les deux listes en parallèle.<\/p>", "starter": "def fusionner(a, b):\n    pass\n\n\nprint(fusionner([1, 4, 9], [2, 3, 10, 12]))", "solution": "def fusionner(a, b):\n    resultat = []\n    i = 0\n    j = 0\n    while i < len(a) and j < len(b):\n        if a[i] <= b[j]:\n            resultat.append(a[i])\n            i += 1\n        else:\n            resultat.append(b[j])\n            j += 1\n    resultat.extend(a[i:])\n    resultat.extend(b[j:])\n    return resultat\n\n\nprint(fusionner([1, 4, 9], [2, 3, 10, 12]))", "tests": "assert \"sorted\" not in __code__ and \".sort(\" not in __code__, \"N'utilise ni sorted ni sort.\"\nassert fusionner([1, 4, 9], [2, 3, 10, 12]) == [1, 2, 3, 4, 9, 10, 12], \"Résultat obtenu : %r\" % (fusionner([1, 4, 9], [2, 3, 10, 12]),)\nassert fusionner([], [1, 2]) == [1, 2] and fusionner([1, 2], []) == [1, 2] and fusionner([], []) == []\nassert fusionner([1, 1], [1]) == [1, 1, 1]", "hint": "<p>Deux indices, <code>i<\/code> pour <code>a<\/code> et <code>j<\/code> pour <code>b<\/code>. Tant qu'il reste des éléments des deux côtés, ajoute le plus petit des deux éléments courants et avance l'indice correspondant. À la fin, ajoute ce qui reste de l'une ou l'autre liste.<\/p>", "stdin": "", "skel": "def fusionner(a, b):\n    ...\n    while i < len(a) and j < len(b):\n        if ...:\n            ...\n        else:\n            ...\n    ...\n    return ...\n\nprint(fusionner([1, 4, 9], [2, 3, 10, 12]))"}]}]}, {"id": "regex", "title": "Expressions régulières", "desc": "Décrire la forme d'un texte pour le chercher, le valider, l'extraire ou le remplacer.", "lessons": [{"id": "motifs-de-base", "title": "Les motifs de base", "blocks": [{"t": "html", "h": "<p>Les méthodes de texte cherchent un texte <strong>exact<\/strong> : <code>\"2025\" in phrase<\/code>. Mais comment trouver « n'importe quel nombre », « tout ce qui ressemble à une adresse e-mail » ou « un code postal » ? Il faut décrire une <strong>forme<\/strong>. C'est le rôle des <strong>expressions régulières<\/strong>, souvent abrégées en *regex*. Le module s'appelle <code>re<\/code>.<\/p>"}, {"t": "code", "c": "import re\n\ntexte = \"Commande 4521 expédiée le 14 mars, 3 colis, total 59 euros.\"\nprint(re.findall(r\"\\d+\", texte))\nprint(re.search(r\"\\d+\", texte))\nprint(re.search(r\"\\d+\", texte).group())\nprint(re.search(r\"xyz\", texte))", "err": false}, {"t": "html", "h": "<ul><li><code>r\"\\d+\"<\/code> est le <strong>motif<\/strong> : <code>\\d<\/code> signifie « un chiffre », <code>+<\/code> signifie « une ou plusieurs fois ».<\/li><li>Le <code>r<\/code> devant les guillemets crée une chaîne <strong>brute<\/strong>, où <code>\\<\/code> reste un simple caractère. Mets-le toujours devant un motif.<\/li><li><code>re.findall<\/code> renvoie la liste de <strong>toutes<\/strong> les correspondances.<\/li><li><code>re.search<\/code> renvoie la <strong>première<\/strong>, sous la forme d'un objet dont <code>.group()<\/code> donne le texte trouvé, ou <code>None<\/code> s'il n'y en a pas.<\/li><\/ul><h3>L'alphabet des motifs<\/h3><div class=\"tw\"><table><thead><tr><th>Élément<\/th><th>Signifie<\/th><th>Exemple<\/th><\/tr><\/thead><tbody><tr><td><code>\\d<\/code><\/td><td>un chiffre<\/td><td><code>\\d\\d<\/code> trouve <code>42<\/code><\/td><\/tr><tr><td><code>\\w<\/code><\/td><td>une lettre, un chiffre ou <code>_<\/code><\/td><td><code>\\w+<\/code> trouve un mot<\/td><\/tr><tr><td><code>\\s<\/code><\/td><td>un espace, une tabulation, un retour à la ligne<\/td><td><\/td><\/tr><tr><td><code>.<\/code><\/td><td>n'importe quel caractère<\/td><td><code>a.c<\/code> trouve <code>abc<\/code>, <code>a-c<\/code><\/td><\/tr><tr><td><code>[abc]<\/code><\/td><td>un caractère parmi ceux listés<\/td><td><code>[aeiou]<\/code> une voyelle<\/td><\/tr><tr><td><code>[a-z]<\/code>, <code>[0-9]<\/code><\/td><td>un caractère dans l'intervalle<\/td><td><\/td><\/tr><tr><td><code>[^abc]<\/code><\/td><td>un caractère qui n'est <strong>pas<\/strong> dans la liste<\/td><td><code>[^0-9]<\/code> un non-chiffre<\/td><\/tr><tr><td><code>\\.<\/code><\/td><td>un vrai point (le <code>\\<\/code> annule le sens spécial)<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>Répétition<\/th><th>Signifie<\/th><\/tr><\/thead><tbody><tr><td><code>+<\/code><\/td><td>une fois ou plus<\/td><\/tr><tr><td><code>*<\/code><\/td><td>zéro fois ou plus<\/td><\/tr><tr><td><code>?<\/code><\/td><td>zéro ou une fois (optionnel)<\/td><\/tr><tr><td><code>{3}<\/code><\/td><td>exactement 3 fois<\/td><\/tr><tr><td><code>{2,4}<\/code><\/td><td>entre 2 et 4 fois<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "code", "c": "import re\n\nprint(re.findall(r\"[A-Z]\\w+\", \"Ada et Grace travaillent à Lyon avec bob.\"))\nprint(re.findall(r\"\\d{2}/\\d{2}/\\d{4}\", \"Du 01/03/2025 au 15/03/2025, puis le 3/4/25.\"))\nprint(re.findall(r\"colou?r\", \"color, colour, colr\"))\nprint(re.findall(r\"\\d+[.,]\\d+\", \"Prix : 4,50 puis 12.90 et 7\"))", "err": false}, {"t": "html", "h": "<h3>Valider un texte entier<\/h3><p><code>search<\/code> cherche le motif <strong>quelque part<\/strong> dans le texte. Pour vérifier qu'un texte <strong>entier<\/strong> a la bonne forme, on utilise <code>re.fullmatch<\/code>.<\/p>"}, {"t": "code", "c": "import re\n\nfor essai in [\"75011\", \"7501\", \"75011 Paris\", \"7501A\"]:\n    print(essai, \"->\", bool(re.fullmatch(r\"\\d{5}\", essai)))", "err": false}, {"t": "html", "h": "<h3>Alternatives et majuscules<\/h3><p><code>|<\/code> signifie « ou ». Le paramètre <code>flags=re.IGNORECASE<\/code> ignore la différence entre majuscules et minuscules.<\/p>"}, {"t": "code", "c": "import re\n\njournal = \"ERROR disque plein. Warning mémoire. error réseau. INFO démarrage.\"\nprint(re.findall(r\"error|warning\", journal, flags=re.IGNORECASE))", "err": false}, {"t": "html", "h": "<div class=\"note\"><span class=\"lab\">À retenir<\/span><p>Construis tes motifs petit à petit, en les essayant sur de vrais exemples. Un site comme regex101.com montre en direct ce que chaque morceau capture.<\/p><\/div>"}, {"t": "exo", "id": "motifs-de-base-1", "title": "Extraire les nombres", "h": "<p>Écris <code>extraire_nombres(texte)<\/code> qui renvoie la liste des nombres entiers présents dans le texte, convertis en <code>int<\/code>, dans leur ordre d'apparition.<\/p>", "starter": "import re\n\n\ndef extraire_nombres(texte):\n    pass\n\n\nprint(extraire_nombres(\"3 colis, 12 articles, total 250 euros\"))", "solution": "import re\n\n\ndef extraire_nombres(texte):\n    return [int(n) for n in re.findall(r\"\\d+\", texte)]\n\n\nprint(extraire_nombres(\"3 colis, 12 articles, total 250 euros\"))", "tests": "assert extraire_nombres(\"3 colis, 12 articles, total 250 euros\") == [3, 12, 250], \"On attend [3, 12, 250]. Tu obtiens %r.\" % (extraire_nombres(\"3 colis, 12 articles, total 250 euros\"),)\nassert extraire_nombres(\"aucun nombre ici\") == [], \"Sans nombre, on attend une liste vide.\"\nassert extraire_nombres(\"réf A12B7\") == [12, 7]", "hint": "<p><code>re.findall(r\"\\d+\", texte)<\/code> renvoie des textes : convertis chacun avec <code>int<\/code> dans une compréhension.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "motifs-de-base-2", "title": "Valider un identifiant client", "h": "<p>Les identifiants clients de la boutique ont une forme précise : la lettre <code>C<\/code> majuscule, suivie d'exactement deux chiffres, comme <code>C01<\/code> ou <code>C42<\/code>. Écris <code>est_identifiant_valide(texte)<\/code> qui renvoie <code>True<\/code> ou <code>False<\/code>.<\/p>", "starter": "import re\n\n\ndef est_identifiant_valide(texte):\n    pass\n\n\nprint(est_identifiant_valide(\"C01\"), est_identifiant_valide(\"C1\"), est_identifiant_valide(\"XC011\"))", "solution": "import re\n\n\ndef est_identifiant_valide(texte):\n    return re.fullmatch(r\"C\\d{2}\", texte) is not None\n\n\nprint(est_identifiant_valide(\"C01\"), est_identifiant_valide(\"C1\"), est_identifiant_valide(\"XC011\"))", "tests": "for t in [\"C01\", \"C42\", \"C99\"]:\n    assert est_identifiant_valide(t) is True, \"%r est valide : on attend True.\" % t\nfor t in [\"C1\", \"C011\", \"c01\", \"XC01\", \"C0A\", \"\", \"C01 \"]:\n    assert est_identifiant_valide(t) is False, \"%r n'est pas valide : on attend False. Vérifie que tu contrôles le texte ENTIER.\" % t", "hint": "<p><code>re.fullmatch(r\"C\\d{2}\", texte)<\/code> renvoie un objet ou <code>None<\/code>. Compare à <code>None<\/code> pour obtenir un booléen.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "motifs-de-base-3", "title": "Trouver les adresses e-mail", "h": "<p>Écris <code>trouver_emails(texte)<\/code> qui renvoie la liste des adresses e-mail présentes dans un texte. Une adresse est faite de lettres, chiffres, points ou tirets, puis <code>@<\/code>, puis un nom de domaine en plusieurs parties séparées par des points. Le point final d'une phrase ne fait pas partie de l'adresse.<\/p>", "starter": "import re\n\n\ndef trouver_emails(texte):\n    pass\n\n\nprint(trouver_emails(\"Écris à ada.lovelace@exemple.fr ou à bob@mail.exemple.com.\"))", "solution": "import re\n\n\ndef trouver_emails(texte):\n    return re.findall(r\"[\\w.-]+@[\\w-]+(?:\\.[\\w-]+)+\", texte)\n\n\nprint(trouver_emails(\"Écris à ada.lovelace@exemple.fr ou à bob@mail.exemple.com.\"))", "tests": "r = trouver_emails(\"Écris à ada.lovelace@exemple.fr ou à bob@mail.exemple.com.\")\nassert r == [\"ada.lovelace@exemple.fr\", \"bob@mail.exemple.com\"], \"On attend ['ada.lovelace@exemple.fr', 'bob@mail.exemple.com']. Tu obtiens %r. Attention au point final de la phrase.\" % (r,)\nassert trouver_emails(\"Pas d'adresse ici, juste un @ isolé.\") == [], \"Un @ isolé n'est pas une adresse.\"\nassert trouver_emails(\"contact: jean-paul@site-web.org; suite\") == [\"jean-paul@site-web.org\"]", "hint": "<p>Avant le <code>@<\/code> : <code>[\\w.-]+<\/code>. Après : un premier morceau <code>[\\w-]+<\/code>, puis une ou plusieurs fois « un point suivi d'un morceau ». Pour répéter un groupe sans le capturer, écris <code>(?:\\.[\\w-]+)+<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "quiz", "id": "motifs-de-base-4", "title": "Lire un motif", "h": "", "code": "import re\n\ntexte = \"Vol AF1234 pour Lyon, porte B12, départ 14h05.\"\nprint(re.findall(r\"[A-Z]{2}\\d{4}\", texte))\nprint(re.findall(r\"\\d+\", texte))\nprint(re.search(r\"porte (\\w+)\", texte).group(1))\nprint(bool(re.fullmatch(r\"\\d{2}h\\d{2}\", \"14h05\")))", "expected": "['AF1234']\n['1234', '12', '14', '05']\nB12\nTrue"}]}, {"id": "groupes-et-remplacements", "title": "Groupes, remplacements et pièges", "blocks": [{"t": "html", "h": "<h3>Capturer des morceaux avec des groupes<\/h3><p>Des parenthèses dans un motif créent un <strong>groupe<\/strong> : elles isolent une partie de la correspondance. <code>.group(1)<\/code> donne le premier groupe, <code>.groups()<\/code> les donne tous.<\/p>"}, {"t": "code", "c": "import re\n\ntrouve = re.search(r\"(\\d{2})/(\\d{2})/(\\d{4})\", \"Livraison prévue le 14/03/2025 au matin.\")\nprint(trouve.group())\nprint(trouve.group(1), trouve.group(2), trouve.group(3))\nprint(trouve.groups())", "err": false}, {"t": "html", "h": "<p>On peut <strong>nommer<\/strong> les groupes avec <code>(?P&lt;nom&gt;...)<\/code>. Le motif devient lisible, et <code>.groupdict()<\/code> renvoie un dictionnaire.<\/p>"}, {"t": "code", "c": "import re\n\nmotif = r\"(?P<jour>\\d{2})/(?P<mois>\\d{2})/(?P<annee>\\d{4})\"\ntrouve = re.search(motif, \"Livraison prévue le 14/03/2025 au matin.\")\nprint(trouve.group(\"annee\"))\nprint(trouve.groupdict())", "err": false}, {"t": "html", "h": "<p>Avec <code>findall<\/code>, un motif qui contient des groupes renvoie la liste des groupes, sous forme de tuples.<\/p>"}, {"t": "code", "c": "import re\n\nprint(re.findall(r\"(\\w+)=(\\d+)\", \"largeur=120 hauteur=80 marge=5\"))", "err": false}, {"t": "html", "h": "<h3>Remplacer avec sub<\/h3><p><code>re.sub(motif, remplacement, texte)<\/code> remplace chaque correspondance. Dans le remplacement, <code>\\1<\/code> et <code>\\2<\/code> réinjectent les groupes capturés.<\/p>"}, {"t": "code", "c": "import re\n\nprint(re.sub(r\"\\s+\", \" \", \"trop    d'espaces   ici\"))\nprint(re.sub(r\"\\d\", \"#\", \"Carte 4970 1234 5678 9012\"))\nprint(re.sub(r\"(\\d{2})/(\\d{2})/(\\d{4})\", r\"\\3-\\2-\\1\", \"Du 01/03/2025 au 15/03/2025\"))", "err": false}, {"t": "html", "h": "<p>La dernière ligne convertit des dates françaises au format <code>AAAA-MM-JJ<\/code> en une seule instruction. <code>re.split<\/code> découpe un texte selon un motif : <code>re.split(r\"[;,]\\s*\", \"a, b;c\")<\/code> donne <code>['a', 'b', 'c']<\/code>.<\/p><h3>Le piège de la gourmandise<\/h3><p>Par défaut, <code>+<\/code> et <code>*<\/code> sont <strong>gourmands<\/strong> : ils prennent le plus de texte possible. Ajouter <code>?<\/code> derrière les rend <strong>paresseux<\/strong> : ils s'arrêtent au plus tôt.<\/p>"}, {"t": "code", "c": "import re\n\nhtml = \"<b>gras<\/b> et <i>italique<\/i>\"\nprint(re.findall(r\"<.+>\", html))\nprint(re.findall(r\"<.+?>\", html))", "err": false}, {"t": "html", "h": "<h3>Quand ne pas utiliser de regex<\/h3><ul><li>Pour un texte exact : <code>in<\/code>, <code>startswith<\/code>, <code>replace<\/code> sont plus clairs et plus rapides.<\/li><li>Pour un format structuré : <code>csv<\/code>, <code>json<\/code>, <code>datetime<\/code> font le travail correctement. Une regex ne sait pas qu'il n'y a pas de 30 février.<\/li><li>Quand le motif devient illisible. Découpe en plusieurs étapes, ou commente-le.<\/li><\/ul><p>Avec pandas, les mêmes motifs s'appliquent à toute une colonne : <code>df[\"ref\"].str.contains(r\"^C\\d{2}$\")<\/code> filtre, <code>df[\"texte\"].str.extract(r\"(\\d+)\")<\/code> extrait, <code>df[\"tel\"].str.replace(r\"\\D\", \"\", regex=True)<\/code> nettoie.<\/p>"}, {"t": "exo", "id": "groupes-et-remplacements-1", "title": "Lire une date française", "h": "<p>Écris <code>lire_date(texte)<\/code> qui cherche dans le texte une date au format <code>JJ/MM/AAAA<\/code> et renvoie le tuple d'entiers <code>(annee, mois, jour)<\/code>, ou <code>None<\/code> si le texte n'en contient pas.<\/p>", "starter": "import re\n\n\ndef lire_date(texte):\n    pass\n\n\nprint(lire_date(\"Livraison prévue le 14/03/2025 au matin.\"))", "solution": "import re\n\n\ndef lire_date(texte):\n    trouve = re.search(r\"(\\d{2})/(\\d{2})/(\\d{4})\", texte)\n    if trouve is None:\n        return None\n    jour, mois, annee = trouve.groups()\n    return (int(annee), int(mois), int(jour))\n\n\nprint(lire_date(\"Livraison prévue le 14/03/2025 au matin.\"))", "tests": "assert lire_date(\"Livraison prévue le 14/03/2025 au matin.\") == (2025, 3, 14), \"On attend (2025, 3, 14). Tu obtiens %r.\" % (lire_date(\"Livraison prévue le 14/03/2025 au matin.\"),)\ntry:\n    r = lire_date(\"Pas de date ici.\")\nexcept AttributeError:\n    raise AssertionError(\"Sans date dans le texte, re.search renvoie None : teste ce cas avant d'appeler .group().\")\nassert r is None, \"Sans date, on attend None.\"\nassert lire_date(\"31/12/1999\") == (1999, 12, 31)", "hint": "<p>Trois groupes : <code>(\\d{2})/(\\d{2})/(\\d{4})<\/code>. Teste d'abord si <code>re.search<\/code> a renvoyé <code>None<\/code>, puis convertis les groupes en entiers, dans l'ordre demandé.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "groupes-et-remplacements-2", "title": "Masquer les numéros de téléphone", "h": "<p>Écris <code>masquer_telephones(texte)<\/code> qui remplace chaque numéro de téléphone français à dix chiffres, écrit par paires séparées par des espaces ou des points (<code>06 12 34 56 78<\/code> ou <code>01.23.45.67.89<\/code>), par ses deux premiers et ses deux derniers chiffres, le reste étant masqué : <code>06 ** ** ** 78<\/code>.<\/p>", "starter": "import re\n\n\ndef masquer_telephones(texte):\n    pass\n\n\nprint(masquer_telephones(\"Appelle le 06 12 34 56 78 ou le 01.23.45.67.89.\"))", "solution": "import re\n\n\ndef masquer_telephones(texte):\n    motif = r\"\\b(0\\d)(?:[ .]\\d{2}){3}[ .](\\d{2})\\b\"\n    return re.sub(motif, r\"\\1 ** ** ** \\2\", texte)\n\n\nprint(masquer_telephones(\"Appelle le 06 12 34 56 78 ou le 01.23.45.67.89.\"))", "tests": "r = masquer_telephones(\"Appelle le 06 12 34 56 78 ou le 01.23.45.67.89.\")\nassert r == \"Appelle le 06 ** ** ** 78 ou le 01 ** ** ** 89.\", \"On attend 'Appelle le 06 ** ** ** 78 ou le 01 ** ** ** 89.'. Tu obtiens %r.\" % (r,)\nassert masquer_telephones(\"Commande 12 34 56 du 03 04\") == \"Commande 12 34 56 du 03 04\", \"Une suite de paires qui ne fait pas dix chiffres commençant par 0 ne doit pas être modifiée.\"\nassert masquer_telephones(\"Rien à masquer.\") == \"Rien à masquer.\"", "hint": "<p>Capture la première paire <code>(0\\d)<\/code> et la dernière <code>(\\d{2})<\/code>. Entre les deux, trois paires précédées d'un séparateur : <code>(?:[ .]\\d{2}){3}<\/code>, puis un dernier séparateur. Le remplacement : <code>r\"\\1 ** ** ** \\2\"<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "groupes-et-remplacements-3", "title": "Analyser une ligne de journal", "h": "<p>Les lignes d'un fichier journal ont la forme <code>2025-03-14 18:30:02 ERROR paiement: carte refusée<\/code>. Écris <code>analyser(ligne)<\/code> qui renvoie un dictionnaire avec les clés <code>date<\/code>, <code>heure<\/code>, <code>niveau<\/code>, <code>module<\/code> et <code>message<\/code>, ou <code>None<\/code> si la ligne n'a pas cette forme. Le niveau est un mot en majuscules, le module un mot suivi de deux-points.<\/p>", "starter": "import re\n\n\ndef analyser(ligne):\n    pass\n\n\nprint(analyser(\"2025-03-14 18:30:02 ERROR paiement: carte refusée\"))", "solution": "import re\n\nMOTIF = r\"(?P<date>\\d{4}-\\d{2}-\\d{2}) (?P<heure>\\d{2}:\\d{2}:\\d{2}) (?P<niveau>[A-Z]+) (?P<module>\\w+): (?P<message>.+)\"\n\n\ndef analyser(ligne):\n    trouve = re.fullmatch(MOTIF, ligne)\n    if trouve is None:\n        return None\n    return trouve.groupdict()\n\n\nprint(analyser(\"2025-03-14 18:30:02 ERROR paiement: carte refusée\"))", "tests": "r = analyser(\"2025-03-14 18:30:02 ERROR paiement: carte refusée\")\nassert r == {\"date\": \"2025-03-14\", \"heure\": \"18:30:02\", \"niveau\": \"ERROR\", \"module\": \"paiement\", \"message\": \"carte refusée\"}, \"Résultat obtenu : %r\" % (r,)\nr = analyser(\"2025-01-02 08:00:00 INFO import: 120 lignes chargées: ok\")\nassert r is not None and r[\"module\"] == \"import\" and r[\"message\"] == \"120 lignes chargées: ok\", \"Le message peut lui-même contenir des deux-points. Tu obtiens %r.\" % (r,)\nassert analyser(\"ligne sans format\") is None and analyser(\"\") is None, \"Une ligne qui n'a pas la forme attendue donne None.\"", "hint": "<p>Un groupe nommé par champ : <code>(?P&lt;date&gt;\\d{4}-\\d{2}-\\d{2})<\/code>, <code>(?P&lt;heure&gt;...)<\/code>, <code>(?P&lt;niveau&gt;[A-Z]+)<\/code>, <code>(?P&lt;module&gt;\\w+)<\/code> suivi de <code>: <\/code>, puis <code>(?P&lt;message&gt;.+)<\/code>. <code>fullmatch<\/code> puis <code>.groupdict()<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "quiz", "id": "groupes-et-remplacements-4", "title": "Gourmand ou paresseux ?", "h": "", "code": "import re\n\ntexte = 'nom=\"Ada\" ville=\"Lyon\"'\nprint(re.findall(r'\"(.+)\"', texte))\nprint(re.findall(r'\"(.+?)\"', texte))\nprint(re.sub(r\"(\\w+)=\", r\"\\1 : \", texte))", "expected": "['Ada\" ville=\"Lyon']\n['Ada', 'Lyon']\nnom : \"Ada\" ville : \"Lyon\""}]}]}, {"id": "ingenierie", "title": "Ingénierie logicielle", "desc": "Passer du script qui marche au programme que l'on peut relire, tester, faire évoluer et confier à quelqu'un d'autre.", "lessons": [{"id": "plusieurs-fichiers", "title": "Découper un programme en fichiers", "blocks": [{"t": "html", "h": "<p>Jusqu'ici, tout ton code tenait dans un seul fichier. Un vrai programme en compte des dizaines. Chaque fichier <code>.py<\/code> est un <strong>module<\/strong> : tu peux importer ses fonctions depuis un autre fichier, exactement comme tu importes <code>math<\/code>.<\/p><p>L'éditeur ci-dessous contient deux onglets. <code>main.py<\/code> est le programme que l'on exécute. <code>tarifs.py<\/code> est un module qu'il importe. Modifie le taux dans <code>tarifs.py<\/code>, puis exécute.<\/p>"}, {"t": "code", "c": "from tarifs import prix_ttc, TAUX_TVA\n\nprint(\"Taux appliqué :\", TAUX_TVA)\nprint(prix_ttc(100))", "err": false, "files": {"tarifs.py": "TAUX_TVA = 0.2\n\n\ndef prix_ttc(prix_ht):\n    return round(prix_ht * (1 + TAUX_TVA), 2)"}}, {"t": "html", "h": "<p><code>from tarifs import prix_ttc<\/code> signifie : « dans le fichier <code>tarifs.py<\/code> situé à côté, va chercher <code>prix_ttc<\/code> ». On peut aussi écrire <code>import tarifs<\/code>, puis <code>tarifs.prix_ttc(100)<\/code>.<\/p><h3>Comment découper<\/h3><ul><li>Un module regroupe ce qui parle du <strong>même sujet<\/strong> : <code>tarifs.py<\/code>, <code>lecture_fichiers.py<\/code>, <code>rapport.py<\/code>.<\/li><li>Le fichier principal ne contient presque rien : il <strong>orchestre<\/strong> en appelant les modules.<\/li><li>Les dépendances vont dans un seul sens. Si <code>a.py<\/code> importe <code>b.py<\/code> et que <code>b.py<\/code> importe <code>a.py<\/code>, Python s'emmêle : c'est un import circulaire, signe d'un mauvais découpage.<\/li><\/ul><h3>Le garde <code>if __name__ == \"__main__\":<\/code><\/h3><p>Quand Python importe un module, il <strong>exécute tout son contenu<\/strong>. Si le module contient des <code>print<\/code> ou des appels de test, ils se déclenchent à chaque import. Pour l'éviter, on place le code « à lancer » sous un garde.<\/p>"}, {"t": "code", "c": "import salutations\n\nprint(salutations.saluer(\"Ada\"))", "err": false, "files": {"salutations.py": "def saluer(prenom):\n    return f\"Bonjour {prenom} !\"\n\n\nif __name__ == \"__main__\":\n    # Exécuté seulement si on lance salutations.py directement,\n    # pas quand un autre fichier l'importe.\n    print(\"Test rapide :\", saluer(\"test\"))"}}, {"t": "html", "h": "<p>La variable <code>__name__<\/code> vaut <code>\"__main__\"<\/code> dans le fichier que l'on lance, et le nom du module dans un fichier importé. Tu verras ce garde à la fin de presque tous les scripts professionnels.<\/p>"}, {"t": "exo", "id": "plusieurs-fichiers-1", "title": "Sortir les fonctions du fichier principal", "h": "<p>Le fichier <code>main.py<\/code> contient tout. Déplace les fonctions <code>nettoyer<\/code> et <code>total<\/code> dans le module <code>calculs.py<\/code>, puis importe-les dans <code>main.py<\/code>. L'affichage ne doit pas changer.<\/p>", "starter": "def nettoyer(valeurs):\n    return [float(v) for v in valeurs if v.strip() != \"\"]\n\n\ndef total(valeurs):\n    return round(sum(nettoyer(valeurs)), 2)\n\n\nprint(total([\"10.5\", \"\", \"4.5\", \" \"]))", "solution": "from calculs import total\n\nprint(total([\"10.5\", \"\", \"4.5\", \" \"]))", "tests": "sortie_attendue(\"15.0\")\nassert \"def \" not in __code__, \"main.py ne doit plus contenir de définition de fonction : importe-les depuis calculs.\"\nimport calculs\nassert hasattr(calculs, \"total\") and hasattr(calculs, \"nettoyer\"), \"calculs.py doit définir nettoyer et total.\"\nassert calculs.total([\"1\", \"2\", \"\"]) == 3.0, \"calculs.total(['1', '2', '']) doit renvoyer 3.0.\"", "hint": "<p>Coupe les deux fonctions de <code>main.py<\/code>, colle-les dans l'onglet <code>calculs.py<\/code>, puis écris <code>from calculs import total<\/code> en haut de <code>main.py<\/code>.<\/p>", "stdin": "", "skel": "", "files": {"calculs.py": "# Déplace ici les fonctions nettoyer et total"}, "solfiles": {"calculs.py": "def nettoyer(valeurs):\n    return [float(v) for v in valeurs if v.strip() != \"\"]\n\n\ndef total(valeurs):\n    return round(sum(nettoyer(valeurs)), 2)"}}]}, {"id": "ecrire-des-tests", "title": "Écrire des tests", "blocks": [{"t": "html", "h": "<p>Tu utilises <code>assert<\/code> depuis le module « Penser comme un programmeur ». Les professionnels vont plus loin : ils rangent leurs vérifications dans des <strong>fonctions de test<\/strong>, relancées automatiquement à chaque modification. Un code sans tests est un code que personne n'ose modifier.<\/p><p>Un test suit trois temps : <strong>préparer<\/strong> les données, <strong>agir<\/strong> en appelant la fonction, <strong>vérifier<\/strong> le résultat.<\/p>"}, {"t": "code", "c": "def prix_final(prix, remise=0):\n    return round(prix * (1 - remise / 100), 2)\n\n\ndef test_sans_remise():\n    assert prix_final(100) == 100\n\n\ndef test_remise_de_dix_pour_cent():\n    assert prix_final(200, 10) == 180\n\n\ndef test_remise_totale():\n    assert prix_final(50, 100) == 0\n\n\n# Mini lanceur : exécute toutes les fonctions dont le nom commence par test_\nfor nom, fonction in list(globals().items()):\n    if nom.startswith(\"test_\"):\n        try:\n            fonction()\n            print(\"OK    \", nom)\n        except AssertionError:\n            print(\"ÉCHEC \", nom)", "err": false}, {"t": "html", "h": "<p>Sur ta machine, tu n'écriras pas ce lanceur. L'outil <strong>pytest<\/strong> le fait : il trouve tous les fichiers <code>test_*.py<\/code>, exécute chaque fonction <code>test_*<\/code> et affiche un rapport.<\/p><pre class=\"static\">$ pip install pytest\n$ pytest\ntest_prix.py ...                                    [100%]\n3 passed in 0.02s<\/pre><h3>Que tester ?<\/h3><ul><li>le <strong>cas normal<\/strong> ;<\/li><li>les <strong>cas limites<\/strong> : vide, zéro, une seule valeur, valeurs négatives ;<\/li><li>les <strong>erreurs attendues<\/strong> : la fonction lève-t-elle bien une exception quand il le faut ?<\/li><li>chaque <strong>bug corrigé<\/strong> : écris d'abord le test qui le reproduit, puis corrige. Il ne reviendra plus.<\/li><\/ul><h3>Les tests d'abord<\/h3><p>Écrire les tests <strong>avant<\/strong> le code oblige à préciser ce que l'on veut : c'est une spécification exécutable. Cette pratique s'appelle le TDD, pour « test-driven development ». L'exercice suivant fonctionne ainsi : les tests existent déjà, à toi d'écrire le code qui les fait passer.<\/p>"}, {"t": "exo", "id": "ecrire-des-tests-1", "title": "Faire passer les tests", "h": "<p><code>main.py<\/code> contient les tests d'une fonction <code>slugifier<\/code>, qui transforme un titre en identifiant d'URL. Lis-les pour comprendre ce qui est attendu, puis écris la fonction dans <code>texte.py<\/code> jusqu'à ce que tous les tests passent.<\/p>", "starter": "from texte import slugifier\n\n\ndef test_minuscules_et_tirets():\n    assert slugifier(\"Bonjour le Monde\") == \"bonjour-le-monde\"\n\n\ndef test_ponctuation_supprimee():\n    assert slugifier(\"Python : le guide !\") == \"python-le-guide\"\n\n\ndef test_espaces_multiples():\n    assert slugifier(\"  trop   d'espaces  \") == \"trop-d-espaces\"\n\n\ndef test_chiffres_conserves():\n    assert slugifier(\"Top 10 des erreurs\") == \"top-10-des-erreurs\"\n\n\ndef test_texte_vide():\n    assert slugifier(\"\") == \"\"\n\n\nfor nom, fonction in list(globals().items()):\n    if nom.startswith(\"test_\"):\n        try:\n            fonction()\n            print(\"OK    \", nom)\n        except AssertionError:\n            print(\"ÉCHEC \", nom)", "solution": "from texte import slugifier\n\n\ndef test_minuscules_et_tirets():\n    assert slugifier(\"Bonjour le Monde\") == \"bonjour-le-monde\"\n\n\ndef test_ponctuation_supprimee():\n    assert slugifier(\"Python : le guide !\") == \"python-le-guide\"\n\n\ndef test_espaces_multiples():\n    assert slugifier(\"  trop   d'espaces  \") == \"trop-d-espaces\"\n\n\ndef test_chiffres_conserves():\n    assert slugifier(\"Top 10 des erreurs\") == \"top-10-des-erreurs\"\n\n\ndef test_texte_vide():\n    assert slugifier(\"\") == \"\"\n\n\nfor nom, fonction in list(globals().items()):\n    if nom.startswith(\"test_\"):\n        try:\n            fonction()\n            print(\"OK    \", nom)\n        except AssertionError:\n            print(\"ÉCHEC \", nom)", "tests": "import texte\ncas = {\"Bonjour le Monde\": \"bonjour-le-monde\", \"Python : le guide !\": \"python-le-guide\", \"  trop   d'espaces  \": \"trop-d-espaces\", \"Top 10 des erreurs\": \"top-10-des-erreurs\", \"\": \"\", \"A--B\": \"a-b\"}\nfor entree, attendu in cas.items():\n    assert texte.slugifier(entree) == attendu, \"slugifier(%r) doit renvoyer %r. Tu obtiens %r.\" % (entree, attendu, texte.slugifier(entree))", "hint": "<p>Mets en minuscules, remplace chaque caractère qui n'est ni une lettre ni un chiffre (<code>isalnum()<\/code>) par un espace, puis <code>\"-\".join(texte.split())<\/code> : <code>split()<\/code> sans argument avale les espaces multiples.<\/p>", "stdin": "", "skel": "", "files": {"texte.py": "def slugifier(titre):\n    return titre"}, "solfiles": {"texte.py": "def slugifier(titre):\n    propre = \"\"\n    for caractere in titre.lower():\n        propre += caractere if caractere.isalnum() else \" \"\n    return \"-\".join(propre.split())"}}, {"t": "exo", "id": "ecrire-des-tests-2", "title": "Des tests qui attrapent les bugs", "h": "<p>À toi d'écrire les tests. La fonction <code>mediane(valeurs)<\/code> doit renvoyer la valeur du milieu d'une liste <strong>une fois triée<\/strong> ; si la liste a un nombre pair d'éléments, la moyenne des deux valeurs centrales ; et lever une <code>ValueError<\/code> si la liste est vide.<\/p><p>Écris <code>verifier(mediane)<\/code> : elle reçoit une implémentation et renvoie <code>True<\/code> si celle-ci est correcte, <code>False<\/code> sinon. La correction lui soumettra une version juste et quatre versions buguées : tes tests doivent accepter la première et rejeter les quatre autres.<\/p>", "starter": "def verifier(mediane):\n    # Compare les résultats de mediane(...) aux valeurs attendues.\n    # Renvoie False dès qu'un résultat est faux.\n    return True\n\n\ndef mediane_correcte(valeurs):\n    if not valeurs:\n        raise ValueError(\"liste vide\")\n    tri = sorted(valeurs)\n    milieu = len(tri) // 2\n    if len(tri) % 2 == 1:\n        return tri[milieu]\n    return (tri[milieu - 1] + tri[milieu]) / 2\n\n\nprint(verifier(mediane_correcte))", "solution": "def verifier(mediane):\n    try:\n        if mediane([3, 1, 2]) != 2:\n            return False\n        if mediane([4, 1, 3, 2]) != 2.5:\n            return False\n        if mediane([7]) != 7:\n            return False\n        if mediane([1, 2, 9]) != 2:\n            return False\n    except Exception:\n        return False\n    try:\n        mediane([])\n    except ValueError:\n        pass\n    except Exception:\n        return False\n    else:\n        return False\n    return True\n\n\ndef mediane_correcte(valeurs):\n    if not valeurs:\n        raise ValueError(\"liste vide\")\n    tri = sorted(valeurs)\n    milieu = len(tri) // 2\n    if len(tri) % 2 == 1:\n        return tri[milieu]\n    return (tri[milieu - 1] + tri[milieu]) / 2\n\n\nprint(verifier(mediane_correcte))", "tests": "def bonne(v):\n    if not v:\n        raise ValueError(\"vide\")\n    t = sorted(v); m = len(t) // 2\n    return t[m] if len(t) % 2 else (t[m - 1] + t[m]) / 2\ndef sans_tri(v):\n    if not v:\n        raise ValueError(\"vide\")\n    m = len(v) // 2\n    return v[m] if len(v) % 2 else (v[m - 1] + v[m]) / 2\ndef pair_faux(v):\n    if not v:\n        raise ValueError(\"vide\")\n    return sorted(v)[len(v) // 2]\ndef vide_silencieux(v):\n    if not v:\n        return 0\n    return bonne(v)\ndef moyenne(v):\n    if not v:\n        raise ValueError(\"vide\")\n    return sum(v) / len(v)\nassert verifier(bonne) is True, \"Tes tests rejettent une implémentation correcte. Vérifie tes valeurs attendues.\"\nassert verifier(sans_tri) is False, \"Tes tests laissent passer une version qui oublie de trier. Teste une liste non triée.\"\nassert verifier(pair_faux) is False, \"Tes tests laissent passer une version fausse pour un nombre pair d'éléments.\"\nassert verifier(vide_silencieux) is False, \"Tes tests laissent passer une version qui renvoie 0 pour une liste vide au lieu de lever ValueError.\"\nassert verifier(moyenne) is False, \"Tes tests laissent passer une version qui calcule la moyenne. Choisis une liste dont la médiane diffère de la moyenne.\"", "hint": "<p>Il te faut au moins : une liste impaire non triée, une liste paire dont la médiane n'est pas un élément de la liste, et un <code>try<\/code> / <code>except ValueError<\/code> autour de <code>mediane([])<\/code> qui renvoie <code>False<\/code> si aucune erreur n'est levée. Attention à <code>[3, 1, 2]<\/code> : sa moyenne vaut aussi 2, ajoute donc un cas comme <code>[1, 2, 9]<\/code>.<\/p>", "stdin": "", "skel": "def verifier(mediane):\n    try:\n        if ...:\n            return ...\n        if ...:\n            return ...\n        if ...:\n            return ...\n        if ...:\n            return ...\n    except Exception:\n        return ...\n    try:\n        ...\n    except ValueError:\n        ...\n    except Exception:\n        return ...\n    else:\n        return ...\n    return True\n\ndef mediane_correcte(valeurs):\n    if not valeurs:\n        raise ValueError(\"liste vide\")\n    tri = sorted(valeurs)\n    milieu = len(tri) // 2\n    if len(tri) % 2 == 1:\n        return tri[milieu]\n    return (tri[milieu - 1] + tri[milieu]) / 2\n\nprint(verifier(mediane_correcte))"}]}, {"id": "exceptions-et-journal", "title": "Exceptions sur mesure et journalisation", "blocks": [{"t": "html", "h": "<h3>Créer ses propres exceptions<\/h3><p><code>ValueError<\/code> dit qu'une valeur ne convient pas, sans dire pourquoi. Dans une application, on crée des exceptions qui portent le vocabulaire du métier. Il suffit d'hériter de <code>Exception<\/code>.<\/p>"}, {"t": "code", "c": "class ErreurStock(Exception):\n    \"\"\"Classe mère de toutes les erreurs de stock.\"\"\"\n\n\nclass ProduitInconnu(ErreurStock):\n    pass\n\n\nclass StockInsuffisant(ErreurStock):\n    def __init__(self, produit, demande, disponible):\n        super().__init__(f\"{produit} : {demande} demandés, {disponible} disponibles\")\n        self.manque = demande - disponible\n\n\ndef retirer(stock, produit, quantite):\n    if produit not in stock:\n        raise ProduitInconnu(produit)\n    if quantite > stock[produit]:\n        raise StockInsuffisant(produit, quantite, stock[produit])\n    stock[produit] -= quantite\n\n\nstock = {\"lampe\": 2}\nfor produit, quantite in [(\"lampe\", 1), (\"lampe\", 5), (\"gomme\", 1)]:\n    try:\n        retirer(stock, produit, quantite)\n        print(\"OK\", produit)\n    except StockInsuffisant as erreur:\n        print(\"Rupture :\", erreur, \"| manque\", erreur.manque)\n    except ErreurStock as erreur:\n        print(\"Autre erreur de stock :\", type(erreur).__name__, erreur)", "err": false}, {"t": "html", "h": "<p>La classe mère commune permet à l'appelant de choisir sa précision : attraper un cas précis, ou toutes les erreurs de stock d'un coup.<\/p><h3>Journaliser avec logging<\/h3><p>Un programme qui tourne seul, la nuit, sur un serveur, n'a personne pour lire ses <code>print<\/code>. On utilise le module <code>logging<\/code>, qui horodate chaque message, lui donne un <strong>niveau de gravité<\/strong>, et peut l'écrire dans un fichier.<\/p>"}, {"t": "code", "c": "import logging\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s %(levelname)-8s %(message)s\", datefmt=\"%H:%M:%S\")\njournal = logging.getLogger(\"import_ventes\")\n\njournal.debug(\"Détail utile seulement pour déboguer\")\njournal.info(\"Début de l'import\")\njournal.warning(\"Ligne 12 ignorée : quantité manquante\")\njournal.error(\"Fichier clients introuvable\")\njournal.info(\"Import terminé : %d lignes\", 17)", "err": false}, {"t": "html", "h": "<div class=\"tw\"><table><thead><tr><th>Niveau<\/th><th>Quand l'utiliser<\/th><\/tr><\/thead><tbody><tr><td><code>DEBUG<\/code><\/td><td>détails pour comprendre un problème, masqués en temps normal<\/td><\/tr><tr><td><code>INFO<\/code><\/td><td>les grandes étapes : début, fin, volumes traités<\/td><\/tr><tr><td><code>WARNING<\/code><\/td><td>une anomalie que le programme a su contourner<\/td><\/tr><tr><td><code>ERROR<\/code><\/td><td>une opération a échoué<\/td><\/tr><tr><td><code>CRITICAL<\/code><\/td><td>le programme ne peut pas continuer<\/td><\/tr><\/tbody><\/table><\/div><p>Le paramètre <code>level<\/code> fixe le seuil : avec <code>INFO<\/code>, les messages <code>DEBUG<\/code> sont ignorés. Pour un diagnostic, on passe à <code>DEBUG<\/code> sans toucher au reste du code.<\/p><div class=\"note\"><span class=\"lab\">À retenir<\/span><p><code>print<\/code> pour dialoguer avec l'utilisateur d'un script. <code>logging<\/code> pour raconter ce que fait un programme à celui qui devra comprendre, plus tard, ce qui s'est passé.<\/p><\/div>"}, {"t": "exo", "id": "exceptions-et-journal-1", "title": "Des erreurs qui parlent", "h": "<p>Définis une exception <code>ErreurCommande<\/code> (qui hérite de <code>Exception<\/code>) et deux exceptions filles : <code>QuantiteInvalide<\/code> et <code>ProduitInconnu<\/code>. Écris ensuite <code>montant_commande(catalogue, produit, quantite)<\/code>, qui renvoie le prix du produit multiplié par la quantité, lève <code>ProduitInconnu<\/code> si le produit n'est pas dans le catalogue, et <code>QuantiteInvalide<\/code> si la quantité n'est pas un entier strictement positif.<\/p>", "starter": "# Définis les trois exceptions, puis la fonction montant_commande\n\n\ncatalogue = {\"carnet\": 4.5, \"lampe\": 29.9}\nprint(montant_commande(catalogue, \"carnet\", 3))", "solution": "class ErreurCommande(Exception):\n    pass\n\n\nclass QuantiteInvalide(ErreurCommande):\n    pass\n\n\nclass ProduitInconnu(ErreurCommande):\n    pass\n\n\ndef montant_commande(catalogue, produit, quantite):\n    if produit not in catalogue:\n        raise ProduitInconnu(produit)\n    if not isinstance(quantite, int) or quantite <= 0:\n        raise QuantiteInvalide(quantite)\n    return catalogue[produit] * quantite\n\n\ncatalogue = {\"carnet\": 4.5, \"lampe\": 29.9}\nprint(montant_commande(catalogue, \"carnet\", 3))", "tests": "assert issubclass(ErreurCommande, Exception), \"ErreurCommande doit hériter de Exception.\"\nassert issubclass(QuantiteInvalide, ErreurCommande) and issubclass(ProduitInconnu, ErreurCommande), \"QuantiteInvalide et ProduitInconnu doivent hériter de ErreurCommande.\"\nc = {\"carnet\": 4.5}\nassert montant_commande(c, \"carnet\", 3) == 13.5, \"montant_commande(c, 'carnet', 3) doit renvoyer 13.5.\"\ndef leve(exc, *a):\n    try:\n        montant_commande(*a)\n    except exc:\n        return True\n    except Exception:\n        return False\n    return False\nassert leve(ProduitInconnu, c, \"gomme\", 1), \"Un produit absent du catalogue doit lever ProduitInconnu.\"\nassert leve(QuantiteInvalide, c, \"carnet\", 0) and leve(QuantiteInvalide, c, \"carnet\", -2), \"Une quantité nulle ou négative doit lever QuantiteInvalide.\"\nassert leve(QuantiteInvalide, c, \"carnet\", 1.5), \"Une quantité qui n'est pas un entier doit lever QuantiteInvalide.\"", "hint": "<p><code>class QuantiteInvalide(ErreurCommande): pass<\/code> suffit. Pour tester le type : <code>isinstance(quantite, int)<\/code>.<\/p>", "stdin": "", "skel": "class ErreurCommande(Exception):\n    ...\n\nclass QuantiteInvalide(ErreurCommande):\n    ...\n\nclass ProduitInconnu(ErreurCommande):\n    ...\n\ndef montant_commande(catalogue, produit, quantite):\n    if ...:\n        ...\n    if ...:\n        ...\n    return ...\n\ncatalogue = {\"carnet\": 4.5, \"lampe\": 29.9}\nprint(montant_commande(catalogue, \"carnet\", 3))"}, {"t": "exo", "id": "exceptions-et-journal-2", "title": "Un import qui laisse des traces", "h": "<p>Écris <code>importer(lignes)<\/code> qui reçoit une liste de textes censés représenter des entiers, et renvoie la liste des entiers valides. Pour chaque texte invalide, la fonction écrit un message de niveau <code>WARNING<\/code> dans le journal. À la fin, elle écrit un message de niveau <code>INFO<\/code> indiquant le nombre de valeurs importées.<\/p>", "starter": "import logging\n\nlogging.basicConfig(level=logging.INFO, format=\"%(levelname)s %(message)s\")\n\n\ndef importer(lignes):\n    pass\n\n\nprint(importer([\"12\", \"abc\", \"7\", \"\", \"3\"]))", "solution": "import logging\n\nlogging.basicConfig(level=logging.INFO, format=\"%(levelname)s %(message)s\")\n\n\ndef importer(lignes):\n    valeurs = []\n    for numero, texte in enumerate(lignes, start=1):\n        try:\n            valeurs.append(int(texte))\n        except ValueError:\n            logging.warning(\"Ligne %d ignorée : %r\", numero, texte)\n    logging.info(\"%d valeurs importées\", len(valeurs))\n    return valeurs\n\n\nprint(importer([\"12\", \"abc\", \"7\", \"\", \"3\"]))", "tests": "import logging\nclass Capture(logging.Handler):\n    def __init__(self):\n        super().__init__(level=logging.DEBUG)\n        self.niveaux = []\n    def emit(self, record):\n        self.niveaux.append(record.levelname)\nh = Capture()\nracine = logging.getLogger()\nracine.addHandler(h)\nracine.setLevel(logging.DEBUG)\nr = importer([\"12\", \"abc\", \"7\", \"\", \"3\"])\nracine.removeHandler(h)\nassert r == [12, 7, 3], \"importer doit renvoyer [12, 7, 3]. Tu obtiens %r.\" % (r,)\nassert h.niveaux.count(\"WARNING\") == 2, \"On attend exactement 2 messages WARNING (pour 'abc' et ''). Tu en émets %d.\" % h.niveaux.count(\"WARNING\")\nassert h.niveaux.count(\"INFO\") >= 1, \"On attend un message INFO à la fin de l'import.\"", "hint": "<p>Dans le <code>except ValueError:<\/code>, appelle <code>logging.warning(...)<\/code>. Après la boucle, <code>logging.info(...)<\/code>.<\/p>", "stdin": "", "skel": "import logging\n\nlogging.basicConfig(level=logging.INFO, format=\"%(levelname)s %(message)s\")\n\ndef importer(lignes):\n    ...\n    for numero, texte in enumerate(lignes, start=1):\n        try:\n            ...\n        except ValueError:\n            ...\n    ...\n    return ...\n\nprint(importer([\"12\", \"abc\", \"7\", \"\", \"3\"]))"}]}, {"id": "relire-et-refactorer", "title": "Relire et refactorer", "blocks": [{"t": "html", "h": "<p><strong>Refactorer<\/strong>, c'est améliorer la structure d'un code <strong>sans changer ce qu'il fait<\/strong>. On ne refactore jamais sans tests : ce sont eux qui garantissent que le comportement n'a pas bougé.<\/p><h3>Les signaux d'alerte<\/h3><ul><li>une fonction de plus de trente lignes, ou qui fait plusieurs choses ;<\/li><li>le même bloc copié-collé avec une valeur qui change ;<\/li><li>une cascade de <code>if<\/code> / <code>elif<\/code> qui compare la même variable à dix valeurs ;<\/li><li>des noms comme <code>x<\/code>, <code>tmp<\/code>, <code>data2<\/code>, <code>traiter<\/code> ;<\/li><li>des nombres sans explication au milieu des calculs ;<\/li><li>plus de trois niveaux d'indentation.<\/li><\/ul><h3>Remplacer une cascade par une table<\/h3><p>Quand une série de <code>elif<\/code> ne fait qu'associer une valeur à une autre, les données doivent sortir du code et entrer dans un dictionnaire.<\/p>"}, {"t": "code", "c": "def tarif_v1(pays):\n    if pays == \"FR\":\n        return 5\n    elif pays == \"BE\":\n        return 7\n    elif pays == \"DE\":\n        return 7\n    elif pays == \"ES\":\n        return 9\n    else:\n        return 15\n\n\nTARIFS = {\"FR\": 5, \"BE\": 7, \"DE\": 7, \"ES\": 9}\nTARIF_PAR_DEFAUT = 15\n\n\ndef tarif_v2(pays):\n    return TARIFS.get(pays, TARIF_PAR_DEFAUT)\n\n\nprint(all(tarif_v1(p) == tarif_v2(p) for p in [\"FR\", \"BE\", \"DE\", \"ES\", \"US\"]))", "err": false}, {"t": "html", "h": "<p>Ajouter un pays devient une ligne de données, sans toucher à la logique.<\/p><h3>Trois pièges de Python à repérer en relecture<\/h3>"}, {"t": "code", "c": "# 1. Une valeur par défaut modifiable est partagée entre tous les appels\ndef ajouter_piege(element, liste=[]):\n    liste.append(element)\n    return liste\n\nprint(ajouter_piege(1), ajouter_piege(2))\n\n\ndef ajouter(element, liste=None):\n    if liste is None:\n        liste = []\n    liste.append(element)\n    return liste\n\nprint(ajouter(1), ajouter(2))\n\n# 2. Modifier une liste pendant qu'on la parcourt saute des éléments\nnombres = [1, 2, 2, 3]\nfor n in nombres:\n    if n == 2:\n        nombres.remove(n)\nprint(nombres)\nprint([n for n in [1, 2, 2, 3] if n != 2])\n\n# 3. Un except nu avale tout, y compris tes fautes de frappe\ntry:\n    resultat = int(\"12\") + valeur_inexistante\nexcept:\n    resultat = 0\nprint(resultat)", "err": false}, {"t": "html", "h": "<p>Le premier piège surprend même des développeurs confirmés : la liste par défaut est créée <strong>une seule fois<\/strong>, à la définition de la fonction. La parade est toujours la même : <code>None<\/code> par défaut, puis création dans la fonction.<\/p>"}, {"t": "exo", "id": "relire-et-refactorer-1", "title": "Les frais de livraison", "h": "<p>Cette fonction marche, mais elle est pénible à lire et à modifier. Refactore-la sans changer ses résultats : les tarifs doivent vivre dans une structure de données, et ton code ne doit pas contenir plus de 4 <code>if<\/code> ou <code>elif<\/code> au total.<\/p>", "starter": "def frais(pays, poids):\n    if pays == \"FR\":\n        if poids <= 1:\n            return 5\n        elif poids <= 5:\n            return 8\n        else:\n            return 12\n    elif pays == \"BE\":\n        if poids <= 1:\n            return 7\n        elif poids <= 5:\n            return 11\n        else:\n            return 16\n    elif pays == \"ES\":\n        if poids <= 1:\n            return 9\n        elif poids <= 5:\n            return 14\n        else:\n            return 20\n    else:\n        if poids <= 1:\n            return 15\n        elif poids <= 5:\n            return 25\n        else:\n            return 40\n\n\nprint(frais(\"FR\", 0.5), frais(\"BE\", 3), frais(\"US\", 10))", "solution": "TARIFS = {\n    \"FR\": (5, 8, 12),\n    \"BE\": (7, 11, 16),\n    \"ES\": (9, 14, 20),\n}\nTARIFS_AUTRES_PAYS = (15, 25, 40)\n\n\ndef tranche(poids):\n    if poids <= 1:\n        return 0\n    if poids <= 5:\n        return 1\n    return 2\n\n\ndef frais(pays, poids):\n    return TARIFS.get(pays, TARIFS_AUTRES_PAYS)[tranche(poids)]\n\n\nprint(frais(\"FR\", 0.5), frais(\"BE\", 3), frais(\"US\", 10))", "tests": "import re\nattendus = {(\"FR\", 0.5): 5, (\"FR\", 1): 5, (\"FR\", 5): 8, (\"FR\", 6): 12, (\"BE\", 1): 7, (\"BE\", 3): 11, (\"BE\", 9): 16, (\"ES\", 0.2): 9, (\"ES\", 5): 14, (\"ES\", 5.1): 20, (\"US\", 1): 15, (\"US\", 2): 25, (\"JP\", 10): 40}\nfor (pays, poids), prix in attendus.items():\n    assert frais(pays, poids) == prix, \"frais(%r, %r) doit toujours renvoyer %r. Tu obtiens %r.\" % (pays, poids, prix, frais(pays, poids))\nn = len(re.findall(r\"\\b(?:if|elif)\\b\", __code__))\nassert n <= 4, \"Ton code contient %d if/elif. Sors les tarifs dans un dictionnaire pour descendre à 4 ou moins.\" % n", "hint": "<p>Un dictionnaire pays → trois tarifs (léger, moyen, lourd). Une petite fonction calcule le numéro de tranche à partir du poids. <code>frais<\/code> se réduit alors à une ligne avec <code>.get(pays, tarifs_par_defaut)<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "relire-et-refactorer-2", "title": "Trois pièges à désamorcer", "h": "<p>Ce code a été relu trop vite. Il contient les trois pièges de la leçon. Corrige les deux fonctions.<\/p><ul><li><code>enregistrer(nom, registre)<\/code> ajoute le nom au registre et le renvoie. Sans registre fourni, elle doit partir d'une liste <strong>neuve<\/strong> à chaque appel.<\/li><li><code>retirer_negatifs(nombres)<\/code> doit renvoyer une nouvelle liste sans les nombres négatifs, sans modifier la liste reçue. Si on lui passe autre chose qu'une liste de nombres, l'erreur doit remonter au lieu d'être cachée.<\/li><\/ul>", "starter": "def enregistrer(nom, registre=[]):\n    registre.append(nom)\n    return registre\n\n\ndef retirer_negatifs(nombres):\n    try:\n        for n in nombres:\n            if n < 0:\n                nombres.remove(n)\n        return nombres\n    except:\n        return []\n\n\nprint(enregistrer(\"Ada\"), enregistrer(\"Bob\"))\nprint(retirer_negatifs([1, -2, -3, 4]))", "solution": "def enregistrer(nom, registre=None):\n    if registre is None:\n        registre = []\n    registre.append(nom)\n    return registre\n\n\ndef retirer_negatifs(nombres):\n    return [n for n in nombres if n >= 0]\n\n\nprint(enregistrer(\"Ada\"), enregistrer(\"Bob\"))\nprint(retirer_negatifs([1, -2, -3, 4]))", "tests": "assert enregistrer(\"A\") == [\"A\"] and enregistrer(\"B\") == [\"B\"], \"Deux appels sans registre doivent donner ['A'] puis ['B'] : la liste par défaut ne doit pas être partagée.\"\nr = [\"X\"]\nassert enregistrer(\"Y\", r) == [\"X\", \"Y\"] and r == [\"X\", \"Y\"], \"Avec un registre fourni, le nom doit y être ajouté.\"\nsource = [1, -2, -3, 4]\nassert retirer_negatifs(source) == [1, 4], \"retirer_negatifs([1, -2, -3, 4]) doit renvoyer [1, 4].\"\nassert source == [1, -2, -3, 4], \"La liste reçue ne doit pas être modifiée.\"\ntry:\n    retirer_negatifs([1, \"a\"])\nexcept TypeError:\n    pass\nelse:\n    raise AssertionError(\"Avec [1, 'a'], la TypeError doit remonter au lieu d'être avalée par un except nu.\")", "hint": "<p><code>registre=None<\/code> puis création dans la fonction. Pour <code>retirer_negatifs<\/code>, une compréhension de liste règle deux problèmes d'un coup, et le <code>try<\/code> / <code>except<\/code> n'a plus de raison d'être.<\/p>", "stdin": "", "skel": "def enregistrer(nom, registre=None):\n    if ...:\n        ...\n    registre.append(nom)\n    return registre\n\ndef retirer_negatifs(nombres):\n    return ...\n\nprint(enregistrer(\"Ada\"), enregistrer(\"Bob\"))\nprint(retirer_negatifs([1, -2, -3, 4]))"}, {"t": "quiz", "id": "relire-et-refactorer-3", "title": "Repérer le piège", "h": "", "code": "def ajouter(valeur, historique=[]):\n    historique.append(valeur)\n    return len(historique)\n\n\nprint(ajouter(\"a\"))\nprint(ajouter(\"b\"))\nprint(ajouter(\"c\", []))\nprint(ajouter(\"d\"))", "expected": "1\n2\n1\n3"}]}, {"id": "structurer-un-projet", "title": "Structurer un projet", "blocks": [{"t": "html", "h": "<p>Un projet professionnel suit une organisation que tu retrouveras partout. La connaître te permet de te repérer dans n'importe quel dépôt.<\/p><pre class=\"static\">mon_projet/\n├── README.md            à quoi sert le projet, comment l'installer, comment le lancer\n├── pyproject.toml       nom, version, dépendances, réglages des outils\n├── .gitignore           ce que Git doit ignorer : .venv/, __pycache__/, .env, données\n├── .env                 les secrets de TA machine, jamais partagés\n├── src/\n│   └── mon_projet/\n│       ├── __init__.py  fait du dossier un paquet importable\n│       ├── config.py    lecture de la configuration\n│       ├── extraction.py\n│       ├── transformation.py\n│       └── main.py      point d'entrée\n└── tests/\n    ├── test_extraction.py\n    └── test_transformation.py<\/pre><h3>Séparer la configuration du code<\/h3><p>Une adresse de base de données, une clé d'API ou un dossier de sortie changent d'une machine à l'autre. Ils ne s'écrivent <strong>jamais<\/strong> dans le code. On les lit dans des <strong>variables d'environnement<\/strong>, que le système fournit au programme.<\/p>"}, {"t": "code", "c": "import os\n\nos.environ[\"DOSSIER_SORTIE\"] = \"/tmp/rapports\"   # ici on simule ; en vrai, c'est le système qui la définit\n\ndossier = os.environ.get(\"DOSSIER_SORTIE\", \"sorties\")\nniveau = os.environ.get(\"NIVEAU_JOURNAL\", \"INFO\")\nprint(dossier, niveau)", "err": false}, {"t": "html", "h": "<div class=\"warn\"><span class=\"lab\">Attention<\/span><p>Un mot de passe ou une clé d'API écrits dans le code finissent dans l'historique Git, puis sur Internet. C'est l'une des fuites de sécurité les plus fréquentes. Les secrets vivent dans l'environnement ou dans un fichier <code>.env<\/code> listé dans <code>.gitignore<\/code>.<\/p><\/div><h3>Git en cinq commandes<\/h3><pre class=\"static\">git status                       voir ce qui a changé\ngit add fichier.py               préparer un fichier pour l'enregistrement\ngit commit -m \"Ajoute le calcul de la TVA\"   enregistrer une étape, avec un message qui dit pourquoi\ngit switch -c nouvelle-idee      créer une branche pour travailler sans risque\ngit push                         envoyer sur le dépôt distant<\/pre><p>Un commit par idée, avec un message clair. Une branche par fonctionnalité. Ce sont ces habitudes, plus que la syntaxe, qui distinguent un professionnel.<\/p>"}, {"t": "exo", "id": "structurer-un-projet-1", "title": "Lire la configuration", "h": "<p>Écris <code>lire_config(env)<\/code> qui reçoit un dictionnaire de variables d'environnement (des textes) et renvoie un dictionnaire de configuration typé :<\/p><ul><li><code>base<\/code> : la valeur de <code>DATABASE_URL<\/code>, obligatoire. Si elle manque ou est vide, lève une <code>ValueError<\/code>.<\/li><li><code>port<\/code> : <code>PORT<\/code> converti en entier, <code>8000<\/code> par défaut. Si la valeur n'est pas un entier, lève une <code>ValueError<\/code>.<\/li><li><code>debug<\/code> : <code>True<\/code> si <code>DEBUG<\/code> vaut <code>1<\/code>, <code>true<\/code> ou <code>oui<\/code> (sans tenir compte des majuscules), <code>False<\/code> sinon ou si elle est absente.<\/li><\/ul>", "starter": "def lire_config(env):\n    pass\n\n\nprint(lire_config({\"DATABASE_URL\": \"sqlite:///ventes.db\", \"DEBUG\": \"True\"}))", "solution": "def lire_config(env):\n    base = env.get(\"DATABASE_URL\", \"\")\n    if not base:\n        raise ValueError(\"DATABASE_URL est obligatoire\")\n    try:\n        port = int(env.get(\"PORT\", \"8000\"))\n    except ValueError:\n        raise ValueError(\"PORT doit être un entier\")\n    debug = env.get(\"DEBUG\", \"\").lower() in (\"1\", \"true\", \"oui\")\n    return {\"base\": base, \"port\": port, \"debug\": debug}\n\n\nprint(lire_config({\"DATABASE_URL\": \"sqlite:///ventes.db\", \"DEBUG\": \"True\"}))", "tests": "assert lire_config({\"DATABASE_URL\": \"x\"}) == {\"base\": \"x\", \"port\": 8000, \"debug\": False}, \"Avec seulement DATABASE_URL, on attend le port 8000 et debug à False. Tu obtiens %r.\" % (lire_config({\"DATABASE_URL\": \"x\"}),)\nassert lire_config({\"DATABASE_URL\": \"x\", \"PORT\": \"5432\", \"DEBUG\": \"OUI\"}) == {\"base\": \"x\", \"port\": 5432, \"debug\": True}, \"PORT doit devenir l'entier 5432 et DEBUG='OUI' doit donner True.\"\nassert lire_config({\"DATABASE_URL\": \"x\", \"DEBUG\": \"0\"})[\"debug\"] is False, \"DEBUG='0' doit donner False.\"\nfor mauvais in [{}, {\"DATABASE_URL\": \"\"}, {\"DATABASE_URL\": \"x\", \"PORT\": \"abc\"}]:\n    try:\n        lire_config(mauvais)\n    except ValueError:\n        pass\n    else:\n        raise AssertionError(\"lire_config(%r) doit lever une ValueError.\" % (mauvais,))", "hint": "<p><code>env.get(\"PORT\", \"8000\")<\/code> donne un texte : convertis-le dans un <code>try<\/code>. Pour <code>debug<\/code>, compare <code>env.get(\"DEBUG\", \"\").lower()<\/code> à un tuple de valeurs acceptées.<\/p>", "stdin": "", "skel": "def lire_config(env):\n    ...\n    if ...:\n        ...\n    try:\n        ...\n    except ValueError:\n        ...\n    ...\n    return ...\n\nprint(lire_config({\"DATABASE_URL\": \"sqlite:///ventes.db\", \"DEBUG\": \"True\"}))"}]}]}, {"id": "performance", "title": "Performance", "desc": "Mesurer avant d'optimiser, choisir la bonne structure, traiter de gros volumes sans saturer la mémoire.", "lessons": [{"id": "mesurer", "title": "Mesurer avant d'optimiser", "blocks": [{"t": "html", "h": "<p>La première règle de la performance : <strong>ne devine pas, mesure<\/strong>. L'intuition se trompe presque toujours sur l'endroit où un programme perd son temps. La deuxième règle : un code lent mais juste vaut mieux qu'un code rapide et faux. On optimise seulement ce qui pose problème.<\/p><p><code>time.perf_counter()<\/code> renvoie un instant précis. La différence entre deux appels donne une durée.<\/p>"}, {"t": "code", "c": "import time\n\nnombres = list(range(20000))\ncibles = list(range(0, 40000, 20))\n\ndebut = time.perf_counter()\ntrouves = [c for c in cibles if c in nombres]\nduree_liste = time.perf_counter() - debut\n\nensemble = set(nombres)\ndebut = time.perf_counter()\ntrouves = [c for c in cibles if c in ensemble]\nduree_ensemble = time.perf_counter() - debut\n\nprint(f\"avec une liste   : {duree_liste * 1000:.1f} ms\")\nprint(f\"avec un ensemble : {duree_ensemble * 1000:.3f} ms\")", "err": false}, {"t": "html", "h": "<p>Le même test <code>in<\/code>, des centaines de fois plus rapide. Chercher dans une liste oblige à la parcourir ; un ensemble ou un dictionnaire trouve directement. Dans la grande majorité des programmes lents, le remède est là : <strong>changer de structure de données<\/strong>, pas réécrire les calculs.<\/p><p>Pour comparer deux petites écritures, le module <code>timeit<\/code> répète la mesure et lisse les variations.<\/p>"}, {"t": "code", "c": "import timeit\n\nprint(timeit.timeit(\"'-'.join(str(n) for n in range(100))\", number=2000))\nprint(timeit.timeit(\"s = ''\\nfor n in range(100): s += str(n) + '-'\", number=2000))", "err": false}, {"t": "exo", "id": "mesurer-1", "title": "Les clients communs, vite", "h": "<p><code>communs(a, b)<\/code> doit renvoyer le nombre de valeurs présentes dans les deux listes. La version fournie est juste, mais elle devient très lente sur deux listes de plus de 10 000 éléments. Rends-la rapide.<\/p>", "starter": "def communs(a, b):\n    compteur = 0\n    for valeur in set(a):\n        if valeur in b:\n            compteur += 1\n    return compteur\n\n\nprint(communs([1, 2, 3, 4], [3, 4, 5]))", "solution": "def communs(a, b):\n    return len(set(a) & set(b))\n\n\nprint(communs([1, 2, 3, 4], [3, 4, 5]))", "tests": "import time\nassert communs([1, 2, 3, 4], [3, 4, 5]) == 2 and communs([], [1]) == 0 and communs([1, 1, 1], [1]) == 1, \"Le résultat doit rester juste : communs([1, 2, 3, 4], [3, 4, 5]) vaut 2, et une valeur répétée ne compte qu'une fois.\"\na = list(range(0, 20000, 2)); b = list(range(0, 45000, 3))\nt = time.perf_counter()\nr = communs(a, b)\nd = time.perf_counter() - t\nassert r == 3334, \"Sur les grandes listes, on attend 3334 valeurs communes. Tu obtiens %r.\" % (r,)\nassert d < 0.2, \"Ta fonction met %.2f s sur 10 000 éléments : elle cherche encore dans une liste. Convertis b en ensemble.\" % d", "hint": "<p><code>valeur in b<\/code> parcourt toute la liste <code>b<\/code> à chaque tour. Convertis <code>b<\/code> en <code>set<\/code> avant la boucle, ou utilise directement l'intersection <code>set(a) &amp; set(b)<\/code>.<\/p>", "stdin": "", "skel": ""}]}, {"id": "memoire-et-cache", "title": "Mémoire, flux et cache", "blocks": [{"t": "html", "h": "<h3>Traiter en flux<\/h3><p>Une liste de dix millions de lignes occupe des gigaoctets. Un générateur traite les éléments un par un et n'en garde aucun. C'est la différence entre remplir une baignoire et laisser couler un robinet.<\/p>"}, {"t": "code", "c": "import sys\n\nliste = [n * n for n in range(100000)]\ngenerateur = (n * n for n in range(100000))\nprint(sys.getsizeof(liste), \"octets pour la liste\")\nprint(sys.getsizeof(generateur), \"octets pour le générateur\")\nprint(sum(generateur))", "err": false}, {"t": "html", "h": "<p>Le module <code>itertools<\/code> fournit des outils pour manipuler ces flux, dont <code>islice<\/code>, qui prend les premiers éléments d'un flux, même infini.<\/p>"}, {"t": "code", "c": "from itertools import islice\n\n\ndef entiers_pairs():\n    n = 0\n    while True:\n        yield n\n        n += 2\n\n\nprint(list(islice(entiers_pairs(), 5)))", "err": false}, {"t": "html", "h": "<h3>Ne pas recalculer : le cache<\/h3><p>Quand une fonction est appelée souvent avec les mêmes arguments, on mémorise ses résultats. Le décorateur <code>lru_cache<\/code> le fait en une ligne.<\/p>"}, {"t": "code", "c": "import time\nfrom functools import lru_cache\n\n\ndef fibo_lent(n):\n    return n if n < 2 else fibo_lent(n - 1) + fibo_lent(n - 2)\n\n\n@lru_cache(maxsize=None)\ndef fibo_rapide(n):\n    return n if n < 2 else fibo_rapide(n - 1) + fibo_rapide(n - 2)\n\n\ndebut = time.perf_counter()\nfibo_lent(24)\nprint(f\"sans cache : {(time.perf_counter() - debut
