cending=False)\n\nprint(grosses)", "tests": "import pandas as pd\nassert isinstance(grosses, pd.Series), \"grosses doit être une Series : le résultat d'un groupby sur une colonne.\"\nobtenu = [(k, round(float(v), 2)) for k, v in grosses.items()]\nassert len(obtenu) != 3, \"Tu obtiens trois régions : as-tu bien filtré les commandes livrées AVANT de regrouper ? Sans ce filtre, le Nord dépasse le seuil.\"\nassert obtenu == [(\"Ouest\", 1758.8), (\"Sud\", 1091.4)], \"On attend Ouest 1758.8 puis Sud 1091.4. Tu obtiens %r.\" % (obtenu,)", "hint": "<p>Filtre d'abord les lignes (<code>df[df[\"statut\"] == \"livree\"]<\/code>), regroupe et additionne, puis filtre le résultat : <code>ca[ca &gt; 1070]<\/code>. Termine par <code>sort_values(ascending=False)<\/code>.<\/p>", "stdin": "", "skel": ""}]}, {"id": "pb-ref-avance", "title": "Référentiel SQL → pandas, niveau avancé", "blocks": [{"t": "html", "h": "<p>Niveau avancé, fiches 15 à 18 : les CTE et les fonctions de fenêtrage (<em>window functions<\/em>). En SQL, ce sont elles qui font la différence en entretien. En pandas, elles reposent sur quatre méthodes : <code>rank<\/code>, <code>cumsum<\/code>, <code>rolling<\/code> et <code>shift<\/code>, à combiner avec <code>groupby<\/code> pour obtenir le <code>PARTITION BY<\/code>.<\/p><div class=\"tw\"><table><thead><tr><th>SQL<\/th><th>pandas<\/th><\/tr><\/thead><tbody><tr><td><code>WITH cte AS (…)<\/code><\/td><td>une variable intermédiaire bien nommée<\/td><\/tr><tr><td><code>ROW_NUMBER<\/code>, <code>RANK<\/code>, <code>DENSE_RANK<\/code><\/td><td><code>rank(method=…)<\/code><\/td><\/tr><tr><td><code>PARTITION BY<\/code><\/td><td><code>groupby(…)<\/code> avant la méthode<\/td><\/tr><tr><td><code>SUM(…) OVER (ORDER BY …)<\/code><\/td><td><code>cumsum()<\/code><\/td><\/tr><tr><td><code>ROWS BETWEEN 2 PRECEDING AND CURRENT ROW<\/code><\/td><td><code>rolling(3, min_periods=1)<\/code><\/td><\/tr><tr><td><code>SUM(…) OVER ()<\/code><\/td><td><code>.sum()<\/code> de la colonne, ou <code>transform(\"sum\")<\/code><\/td><\/tr><tr><td><code>LAG<\/code> / <code>LEAD<\/code><\/td><td><code>shift(1)<\/code> / <code>shift(-1)<\/code><\/td><\/tr><\/tbody><\/table><\/div><h3>15 · CTE (Common Table Expressions)<\/h3><pre class=\"static sql\">-- Un CTE = table temporaire nommée, valable le temps de la requête\nWITH cte_totaux AS (\n  SELECT produit, SUM(montant) AS total\n  FROM commandes\n  GROUP BY produit\n)\nSELECT * FROM cte_totaux\nWHERE total &gt; 400\nORDER BY total DESC;\n-- Chaîner plusieurs CTE\nWITH\ncte_ca AS (\n  SELECT region, SUM(montant) AS total\n  FROM commandes GROUP BY region\n),\ncte_panier AS (\n  SELECT region, AVG(montant) AS panier_moyen\n  FROM commandes GROUP BY region\n)\nSELECT c.region, c.total, p.panier_moyen\nFROM cte_ca c\nJOIN cte_panier p ON c.region = p.region;<\/pre><p>Un CTE sert à nommer une étape pour rendre la requête lisible. En Python, tu fais cela depuis la première leçon : c'est une <strong>variable<\/strong>. Chaque CTE devient un tableau intermédiaire, et le <code>SELECT<\/code> final les combine.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\n# WITH cte_totaux AS (...)\ncte_totaux = df.groupby(\"produit\", as_index=False)[\"montant\"].sum().rename(columns={\"montant\": \"total\"})\n# SELECT * FROM cte_totaux WHERE ... ORDER BY ...\nprint(cte_totaux[cte_totaux[\"total\"] > 400].sort_values(\"total\", ascending=False))\n\n# Chaîner plusieurs CTE : deux tableaux intermédiaires, puis une jointure\ncte_ca = df.groupby(\"region\", as_index=False).agg(total=(\"montant\", \"sum\"))\ncte_panier = df.groupby(\"region\", as_index=False).agg(panier_moyen=(\"montant\", \"mean\"))\nprint(cte_ca.merge(cte_panier, on=\"region\").round(2))", "err": false}, {"t": "html", "h": "<p><code>as_index=False<\/code> garde la colonne de regroupement comme une colonne ordinaire, au lieu d'en faire l'index. Le résultat ressemble alors exactement à une table SQL, prête pour un <code>merge<\/code>.<\/p><h3>16 · Window functions : rang et numérotation<\/h3><pre class=\"static sql\">-- ROW_NUMBER : numéro unique par ligne\nSELECT produit, montant,\n  ROW_NUMBER() OVER (ORDER BY montant DESC) AS num_ligne\nFROM commandes;\n-- RANK       : les ex æquo sautent des numéros (1, 2, 2, 4)\n-- DENSE_RANK : les ex æquo ne sautent pas   (1, 2, 2, 3)\nSELECT produit, montant,\n  RANK()       OVER (ORDER BY montant DESC) AS rang,\n  DENSE_RANK() OVER (ORDER BY montant DESC) AS dense_rang\nFROM commandes;\n-- PARTITION BY : top 2 par catégorie\nSELECT * FROM (\n  SELECT categorie, produit, montant,\n    RANK() OVER (PARTITION BY categorie ORDER BY montant DESC) AS rang\n  FROM commandes\n) classement\nWHERE rang &lt;= 2;<\/pre><p>Une seule méthode, <code>rank<\/code>, et un paramètre <code>method<\/code> qui choisit le traitement des ex æquo : <code>\"first\"<\/code> pour <code>ROW_NUMBER<\/code>, <code>\"min\"<\/code> pour <code>RANK<\/code>, <code>\"dense\"<\/code> pour <code>DENSE_RANK<\/code>. <code>ascending=False<\/code> correspond à <code>ORDER BY … DESC<\/code>.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nt = df[[\"categorie\", \"produit\", \"montant\"]].copy()\n\nt[\"num_ligne\"] = t[\"montant\"].rank(method=\"first\", ascending=False).astype(int)   # ROW_NUMBER\nt[\"rang\"] = t[\"montant\"].rank(method=\"min\", ascending=False).astype(int)          # RANK\nt[\"dense_rang\"] = t[\"montant\"].rank(method=\"dense\", ascending=False).astype(int)  # DENSE_RANK\nprint(t.sort_values(\"num_ligne\").head(6))\n\n# PARTITION BY categorie : on regroupe avant de classer\nt[\"rang_cat\"] = t.groupby(\"categorie\")[\"montant\"].rank(method=\"min\", ascending=False).astype(int)\nprint(t[t[\"rang_cat\"] <= 2].sort_values([\"categorie\", \"rang_cat\"])[[\"categorie\", \"produit\", \"montant\", \"rang_cat\"]])", "err": false}, {"t": "html", "h": "<p>Regarde le premier tableau : deux commandes à 378 €, puis quatre à 189 €. <code>num_ligne<\/code> les numérote de 1 à 6, sans tenir compte des égalités. <code>rang<\/code> donne 1 aux deux premières, puis saute directement à 3. <code>dense_rang<\/code> donne 1, puis continue à 2 sans laisser de trou.<\/p><div class=\"note\"><span class=\"lab\">Le piège<\/span><p>Sans <code>method<\/code>, <code>rank<\/code> attribue aux ex æquo la <strong>moyenne<\/strong> de leurs rangs (ici 1,5 pour les deux commandes à 378 €). Ce comportement par défaut n'existe pas en SQL : précise toujours <code>method<\/code>.<\/p><\/div><h3>17 · Window functions : calculs glissants<\/h3><pre class=\"static sql\">-- Cumul progressif (running total)\nSELECT mois, total,\n  SUM(total) OVER (ORDER BY mois) AS cumul\nFROM ca_mensuel;\n-- Moyenne glissante sur 3 périodes\nSELECT mois, total,\n  AVG(total) OVER (\n    ORDER BY mois\n    ROWS BETWEEN 2 PRECEDING AND CURRENT ROW\n  ) AS moy_glissante_3\nFROM ca_mensuel;\n-- % du total général par ligne\nSELECT mois, total,\n  ROUND(total * 100.0 / SUM(total) OVER (), 2) AS pct_total\nFROM ca_mensuel;<\/pre><p>Ces calculs dépendent de l'ordre des lignes : en pandas, <strong>trie d'abord<\/strong>. Ici, le <code>groupby<\/code> sur le mois renvoie déjà un résultat trié. <code>min_periods=1<\/code> autorise la moyenne glissante à démarrer dès la première ligne, comme le fait SQL.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nca = df.groupby(df[\"date\"].dt.strftime(\"%Y-%m\"))[\"montant\"].sum().rename_axis(\"mois\").reset_index(name=\"total\")\n\nca[\"cumul\"] = ca[\"total\"].cumsum()                                         # cumul progressif\nca[\"moy_glissante_3\"] = ca[\"total\"].rolling(3, min_periods=1).mean().round(1)  # moyenne glissante\nca[\"pct_total\"] = (ca[\"total\"] * 100 / ca[\"total\"].sum()).round(2)         # % du total général\nprint(ca)", "err": false}, {"t": "html", "h": "<h3>18 · Window functions : LAG / LEAD<\/h3><pre class=\"static sql\">-- LAG : valeur de la ligne PRÉCÉDENTE (N vs N-1)\nSELECT mois,\n  total                                   AS valeur_actuelle,\n  LAG(total) OVER (ORDER BY mois)         AS valeur_precedente,\n  total - LAG(total) OVER (ORDER BY mois) AS variation\nFROM ca_mensuel;\n-- LEAD : valeur de la ligne SUIVANTE\nSELECT mois, total,\n  LEAD(total) OVER (ORDER BY mois) AS valeur_suivante\nFROM ca_mensuel;<\/pre><p><code>shift(1)<\/code> décale la colonne d'une ligne vers le bas : chaque ligne voit la valeur de la ligne précédente. <code>shift(-1)<\/code> décale vers le haut. La première (ou la dernière) ligne n'a pas de voisine : elle reçoit <code>NaN<\/code>, comme <code>NULL<\/code> en SQL.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nca = df.groupby(df[\"date\"].dt.strftime(\"%Y-%m\"))[\"montant\"].sum().rename_axis(\"mois\").reset_index(name=\"total\")\n\nca[\"precedent\"] = ca[\"total\"].shift(1)        # LAG\nca[\"variation\"] = ca[\"total\"] - ca[\"precedent\"]\nca[\"suivant\"] = ca[\"total\"].shift(-1)         # LEAD\nprint(ca.round(1))", "err": false}, {"t": "html", "h": "<p>Pour un <code>LAG<\/code> avec <code>PARTITION BY<\/code>, on regroupe avant de décaler : <code>df.groupby(\"categorie\")[\"total\"].shift(1)<\/code>. Tu le verras à l'œuvre dans la fiche 21.<\/p>"}, {"t": "quiz", "id": "pb-ref-avance-1", "title": "Rangs, décalage et cumul", "h": "", "code": "import pandas as pd\n\ns = pd.Series([50, 80, 80, 20])\nprint(s.rank(method=\"min\", ascending=False).astype(int).tolist())\nprint(s.rank(method=\"dense\", ascending=False).astype(int).tolist())\nprint(s.cumsum().tolist())\nprint(s.shift(1).tolist()[1:])", "expected": "[3, 1, 1, 4]\n[2, 1, 1, 3]\n[50, 130, 210, 230]\n[50.0, 80.0, 80.0]"}, {"t": "exo", "id": "pb-ref-avance-2", "title": "Le podium par catégorie", "h": "<p>Construis <code>podium<\/code> : pour chaque <code>categorie<\/code>, les 2 produits qui réalisent le plus gros chiffre d'affaires. Le tableau doit contenir les colonnes <code>categorie<\/code>, <code>produit<\/code>, <code>ca<\/code> (la somme des montants) et <code>rang<\/code> (1 ou 2, en nombre entier).<\/p>", "starter": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n# Construis podium\n\nprint(podium)", "solution": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\nca = df.groupby([\"categorie\", \"produit\"], as_index=False)[\"montant\"].sum().rename(columns={\"montant\": \"ca\"})\nca[\"rang\"] = ca.groupby(\"categorie\")[\"ca\"].rank(method=\"dense\", ascending=False).astype(int)\npodium = ca[ca[\"rang\"] <= 2].sort_values([\"categorie\", \"rang\"])\n\nprint(podium)", "tests": "import pandas as pd\nassert isinstance(podium, pd.DataFrame), \"podium doit être un DataFrame.\"\nfor c in [\"categorie\", \"produit\", \"ca\", \"rang\"]:\n    assert c in podium.columns, \"Il manque la colonne %s. Si categorie ou produit sont dans l'index, utilise as_index=False ou reset_index().\" % c\nassert len(podium) == 6, \"On attend 6 lignes : 2 produits pour chacune des 3 catégories. Tu en obtiens %d.\" % len(podium)\nobtenu = sorted((r.categorie, int(r.rang), r.produit, round(float(r.ca), 1)) for r in podium.itertuples())\nattendu = [(\"Informatique\", 1, \"Écran\", 1890.0), (\"Informatique\", 2, \"Clavier\", 1470.0), (\"Maison\", 1, \"Plaid\", 350.0), (\"Maison\", 2, \"Lampe\", 299.0), (\"Papeterie\", 1, \"Agenda\", 444.0), (\"Papeterie\", 2, \"Carnet\", 198.0)]\nassert obtenu == attendu, \"Le podium attendu : Écran et Clavier, Plaid et Lampe, Agenda et Carnet. Tu obtiens %r.\" % (obtenu,)", "hint": "<p>Deux temps, comme un CTE suivi d'une window function. D'abord le chiffre d'affaires par catégorie et produit (<code>groupby([\"categorie\", \"produit\"], as_index=False)<\/code>). Ensuite le rang à l'intérieur de chaque catégorie : <code>ca.groupby(\"categorie\")[\"ca\"].rank(method=\"dense\", ascending=False)<\/code>. Enfin, garde les rangs 1 et 2.<\/p>", "stdin": "", "skel": ""}]}, {"id": "pb-ref-expert", "title": "Référentiel SQL → pandas, niveau expert", "blocks": [{"t": "html", "h": "<p>Niveau expert, fiches 19 à 21 : les hiérarchies, le pivot, et une requête analytique complète qui combine tout ce qui précède.<\/p><h3>19 · CTE récursifs (hiérarchies)<\/h3><pre class=\"static sql\">-- Utile pour les structures parent/enfant : organigramme, catégories…\n-- Syntaxe PostgreSQL / MySQL / SQLite ; sur SQL Server, écrire WITH sans RECURSIVE\nWITH RECURSIVE hierarchie AS (\n  -- Ancre : les racines, sans parent\n  SELECT id, nom, parent_id, 0 AS niveau\n  FROM rayons WHERE parent_id IS NULL\n  UNION ALL\n  -- Récursion : les enfants de chaque nœud déjà trouvé\n  SELECT r.id, r.nom, r.parent_id, h.niveau + 1\n  FROM rayons r\n  JOIN hierarchie h ON r.parent_id = h.id\n)\nSELECT * FROM hierarchie ORDER BY niveau;<\/pre><p>pandas n'a pas de jointure récursive. On écrit la récursion à la main, avec une boucle <code>while<\/code> qui suit exactement les deux parties du CTE : on part des racines (l'ancre), puis on cherche les enfants du dernier niveau trouvé, jusqu'à ce qu'il n'y en ait plus.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\nrayons = pd.DataFrame({\n    \"id\": [1, 2, 3, 4, 5, 6],\n    \"nom\": [\"Boutique\", \"Bureau\", \"Maison\", \"Papeterie\", \"Informatique\", \"Claviers\"],\n    \"parent_id\": [None, 1, 1, 2, 2, 5],\n})\n\n# Ancre : les racines, sans parent\nniveau = rayons[rayons[\"parent_id\"].isna()].assign(niveau=0)\nmorceaux = []\n\n# Récursion : tant qu'on trouve des lignes, on les garde et on cherche leurs enfants\nwhile len(niveau) > 0:\n    morceaux.append(niveau)\n    niveau = rayons[rayons[\"parent_id\"].isin(niveau[\"id\"])].assign(niveau=niveau[\"niveau\"].max() + 1)\n\nhierarchie = pd.concat(morceaux, ignore_index=True)\nprint(hierarchie[[\"id\", \"nom\", \"niveau\"]])", "err": false}, {"t": "html", "h": "<p><code>assign(niveau=…)<\/code> ajoute une colonne et renvoie un nouveau tableau. La colonne <code>parent_id<\/code> contient une valeur manquante (la racine n'a pas de parent) : pandas la stocke donc en nombres à virgule, ce qui n'empêche pas la comparaison avec <code>isin<\/code>.<\/p><h3>20 · PIVOT : lignes en colonnes<\/h3><pre class=\"static sql\">-- Transformer (categorie, mois, montant) =&gt; une colonne par mois (SQL Server)\nSELECT categorie, [2025-01], [2025-02], [2025-03]\nFROM (\n  SELECT categorie, FORMAT(date, 'yyyy-MM') AS mois, montant\n  FROM commandes\n) src\nPIVOT (\n  SUM(montant) FOR mois IN ([2025-01], [2025-02], [2025-03])\n) piv;<\/pre><p>En SQL, il faut lister à la main les colonnes à créer. <code>pivot_table<\/code> les découvre seule : <code>index<\/code> pour les lignes, <code>columns<\/code> pour les colonnes, <code>values<\/code> et <code>aggfunc<\/code> pour le calcul. C'est le tableau croisé dynamique d'Excel.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\ndf[\"mois\"] = df[\"date\"].dt.strftime(\"%Y-%m\")\n\npivot = df.pivot_table(index=\"categorie\", columns=\"mois\", values=\"montant\", aggfunc=\"sum\", fill_value=0)\nprint(pivot.round(1))\n\n# L'opération inverse (UNPIVOT) : melt remet les colonnes en lignes\nlong = pivot.reset_index().melt(id_vars=\"categorie\", var_name=\"mois\", value_name=\"total\")\nprint(long.head(4))", "err": false}, {"t": "html", "h": "<h3>21 · Requête analytique complète (CTE + window + agrégation)<\/h3><pre class=\"static sql\">-- Classement mensuel avec variation N vs N-1 et part du total\nWITH\nagregats AS (\n  SELECT categorie,\n         FORMAT(date, 'yyyy-MM') AS mois,\n         SUM(montant)            AS total\n  FROM commandes\n  WHERE statut = 'livree'\n  GROUP BY categorie, FORMAT(date, 'yyyy-MM')\n),\navec_calculs AS (\n  SELECT categorie, mois, total,\n    LAG(total) OVER (PARTITION BY categorie ORDER BY mois) AS total_precedent,\n    SUM(total) OVER (PARTITION BY mois)                    AS total_global\n  FROM agregats\n)\nSELECT categorie, mois, total,\n  ROUND((total - total_precedent) * 100.0 / NULLIF(total_precedent, 0), 1) AS var_pct,\n  ROUND(total * 100.0 / total_global, 1)                                  AS part_pct,\n  RANK() OVER (PARTITION BY mois ORDER BY total DESC)                     AS rang_mois\nFROM avec_calculs\nORDER BY mois, rang_mois;<\/pre><p>La traduction suit la requête étape par étape : un filtre (<code>WHERE<\/code>), un premier tableau (<code>agregats<\/code>), des colonnes ajoutées par fenêtre (<code>avec_calculs<\/code>), puis les calculs finaux. <code>transform(\"sum\")<\/code> est la pièce nouvelle : il calcule un agrégat par groupe et le <strong>recopie sur chaque ligne<\/strong> du groupe, exactement comme <code>SUM(…) OVER (PARTITION BY …)<\/code>.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\n# WHERE + CTE agregats\nlivrees = df[df[\"statut\"] == \"livree\"].copy()\nlivrees[\"mois\"] = livrees[\"date\"].dt.strftime(\"%Y-%m\")\nagregats = livrees.groupby([\"categorie\", \"mois\"], as_index=False).agg(total=(\"montant\", \"sum\"))\n\n# CTE avec_calculs : LAG par catégorie, total par mois\nagregats = agregats.sort_values([\"categorie\", \"mois\"])\nagregats[\"total_precedent\"] = agregats.groupby(\"categorie\")[\"total\"].shift(1)\nagregats[\"total_global\"] = agregats.groupby(\"mois\")[\"total\"].transform(\"sum\")\n\n# SELECT final : variation, part du total, rang dans le mois\nagregats[\"var_pct\"] = ((agregats[\"total\"] - agregats[\"total_precedent\"]) * 100 / agregats[\"total_precedent\"]).round(1)\nagregats[\"part_pct\"] = (agregats[\"total\"] * 100 / agregats[\"total_global\"]).round(1)\nagregats[\"rang_mois\"] = agregats.groupby(\"mois\")[\"total\"].rank(method=\"min\", ascending=False).astype(int)\n\nresultat = agregats.sort_values([\"mois\", \"rang_mois\"])\nprint(resultat[[\"categorie\", \"mois\", \"total\", \"var_pct\", \"part_pct\", \"rang_mois\"]].head(9))", "err": false}, {"t": "html", "h": "<div class=\"warn\"><span class=\"lab\">Attention<\/span><p>Le <code>LAG<\/code> prend la ligne précédente <strong>présente dans le tableau<\/strong>, pas forcément le mois précédent du calendrier. Si une catégorie n'a aucune vente livrée un mois donné, la variation du mois suivant est calculée par rapport à un mois plus ancien. C'est le cas dans le résultat ci-dessus : la catégorie Maison n'a aucune vente livrée en février, donc sa variation de mars (+381,1 %) est en réalité calculée par rapport à janvier. Le piège est identique en SQL. Pour l'éviter, on commence par créer toutes les combinaisons catégorie × mois, par exemple avec <code>pivot_table(…, fill_value=0)<\/code> suivi de <code>melt<\/code> (fiche 20).<\/p><\/div><div class=\"note\"><span class=\"lab\">Conseils<\/span><p>Les niveaux débutant et intermédiaire couvrent 80 % des besoins quotidiens d'un analyste junior. Nommer ses étapes intermédiaires (les CTE) est le prochain objectif. Les fonctions de fenêtrage, en SQL comme en pandas, te feront sortir du lot en entretien.<\/p><\/div>"}, {"t": "exo", "id": "pb-ref-expert-1", "title": "La région leader de chaque mois", "h": "<p>Construis <code>leader<\/code> : une Series dont l'index est le mois au format <code>2025-01<\/code> et dont la valeur est la <code>region<\/code> qui a réalisé le plus gros chiffre d'affaires ce mois-là (toutes commandes confondues).<\/p>", "starter": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n# Construis leader\n\nprint(leader)", "solution": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\ndf[\"mois\"] = df[\"date\"].dt.strftime(\"%Y-%m\")\nca = df.groupby([\"mois\", \"region\"], as_index=False)[\"montant\"].sum()\nca[\"rang\"] = ca.groupby(\"mois\")[\"montant\"].rank(method=\"min\", ascending=False)\nleader = ca[ca[\"rang\"] == 1].set_index(\"mois\")[\"region\"]\n\nprint(leader)", "tests": "import pandas as pd\nassert isinstance(leader, pd.Series), \"leader doit être une Series (index : le mois, valeur : la région).\"\nobtenu = {str(k): v for k, v in leader.items()}\nattendu = {\"2025-01\": \"Sud\", \"2025-02\": \"Ouest\", \"2025-03\": \"Ouest\", \"2025-04\": \"Sud\", \"2025-05\": \"Ouest\", \"2025-06\": \"Nord\"}\nassert sorted(obtenu) == sorted(attendu), \"L'index doit contenir les 6 mois au format 2025-01. Tu obtiens %r.\" % (sorted(obtenu),)\nassert obtenu == attendu, \"On attend Sud, Ouest, Ouest, Sud, Ouest, Nord de janvier à juin. Tu obtiens %r.\" % (obtenu,)", "hint": "<p>Calcule le chiffre d'affaires par mois et par région, classe les régions à l'intérieur de chaque mois (<code>groupby(\"mois\")[\"montant\"].rank(ascending=False)<\/code>), garde le rang 1, puis <code>set_index(\"mois\")[\"region\"]<\/code>. Autre chemin : un <code>pivot_table<\/code> mois × région, puis <code>idxmax(axis=1)<\/code>, qui donne pour chaque ligne le nom de la colonne la plus grande.<\/p>", "stdin": "", "skel": ""}]}, {"id": "pb-kpis", "title": "KPIs et métriques", "blocks": [{"t": "html", "h": "<p>Un <strong>KPI<\/strong> (<em>Key Performance Indicator<\/em>, indicateur clé de performance) est un chiffre que l'on suit dans le temps pour piloter une activité. Tous les chiffres ne sont pas des KPIs. Un bon KPI remplit trois conditions.<\/p><div class=\"tw\"><table><thead><tr><th>Critère<\/th><th>Ce que cela veut dire<\/th><\/tr><\/thead><tbody><tr><td><strong>Actionnable<\/strong><\/td><td>Si le KPI change, on doit pouvoir agir dessus.<\/td><\/tr><tr><td><strong>Mesurable précisément<\/strong><\/td><td>La définition du calcul est claire et reproductible : deux analystes obtiennent le même chiffre.<\/td><\/tr><tr><td><strong>Comparé à une référence<\/strong><\/td><td>Un chiffre seul ne dit rien. Il faut toujours une <em>baseline<\/em> : période précédente, objectif, moyenne du secteur.<\/td><\/tr><\/tbody><\/table><\/div><h3>Les formules à connaître<\/h3><div class=\"tw\"><table><thead><tr><th>KPI<\/th><th>Formule<\/th><\/tr><\/thead><tbody><tr><td>Chiffre d'affaires (CA)<\/td><td>quantité vendue × prix unitaire<\/td><\/tr><tr><td>Panier moyen<\/td><td>CA ÷ nombre de commandes<\/td><\/tr><tr><td>Taux de conversion<\/td><td>(ventes ÷ prospects) × 100<\/td><\/tr><tr><td>Taux d'annulation<\/td><td>(commandes annulées ÷ total des commandes) × 100<\/td><\/tr><tr><td>Croissance MoM / YoY<\/td><td>((valeur N − valeur N−1) ÷ valeur N−1) × 100<\/td><\/tr><\/tbody><\/table><\/div><p>MoM signifie <em>month over month<\/em> (d'un mois sur l'autre), YoY <em>year over year<\/em> (d'une année sur l'autre).<\/p><div class=\"note\"><span class=\"lab\">La règle d'or<\/span><p>« CA = 120 K€ (+8 % par rapport au mois précédent) » est utile. « CA = 120 K€ » l'est beaucoup moins.<\/p><\/div><h3>Chiffre d'affaires et panier moyen<\/h3><p>Premier réflexe : <strong>définir<\/strong> le KPI avant de le calculer. Une commande annulée compte-t-elle dans le chiffre d'affaires ? Une commande retournée ? Ici, la règle retenue est : seules les commandes <code>livree<\/code> comptent. Ce choix se discute avec le métier, et il s'écrit noir sur blanc dans le code.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\n# Définition : le chiffre d'affaires ne compte que les commandes livrées\nlivrees = df[df[\"statut\"] == \"livree\"]\n\nca_total = livrees[\"montant\"].sum()\nnb_commandes = livrees[\"id\"].nunique()\npanier_moyen = ca_total / nb_commandes\n\nprint(f\"CA total     : {ca_total:.2f} €\")\nprint(f\"Commandes    : {nb_commandes}\")\nprint(f\"Panier moyen : {panier_moyen:.2f} €\")\nprint(f\"CA toutes commandes confondues : {df['montant'].sum():.2f} €\")", "err": false}, {"t": "html", "h": "<p>La dernière ligne montre l'enjeu : selon la définition, le « chiffre d'affaires » vaut 3 908 € ou 5 149 €. L'écart dépasse 30 %. Deux tableaux de bord qui n'utilisent pas la même définition se contrediront, et plus personne ne fera confiance aux chiffres.<\/p><h3>CA par catégorie, avec la part du total<\/h3><p>Diviser chaque ligne par la somme de la colonne donne la part du total : c'est le <code>SUM(…) OVER ()<\/code> de SQL.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\nlivrees = df[df[\"statut\"] == \"livree\"]\n\npar_categorie = livrees.groupby(\"categorie\").agg(ca=(\"montant\", \"sum\")).sort_values(\"ca\", ascending=False)\npar_categorie[\"pct_total\"] = (par_categorie[\"ca\"] * 100 / par_categorie[\"ca\"].sum()).round(1)\nprint(par_categorie)", "err": false}, {"t": "html", "h": "<h3>Croissance MoM : la variation d'un mois sur l'autre<\/h3><p><code>pct_change()<\/code> calcule <code>(valeur − valeur précédente) ÷ valeur précédente<\/code> en un appel. C'est le raccourci du <code>LAG<\/code> de la fiche 18. Le premier mois n'a pas de précédent : il reçoit <code>NaN<\/code>.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\nlivrees = df[df[\"statut\"] == \"livree\"].copy()\nlivrees[\"mois\"] = livrees[\"date\"].dt.strftime(\"%Y-%m\")\n\nmensuel = livrees.groupby(\"mois\").agg(total=(\"montant\", \"sum\"))\nmensuel[\"total_precedent\"] = mensuel[\"total\"].shift(1)\nmensuel[\"var_mom_pct\"] = (mensuel[\"total\"].pct_change() * 100).round(1)\nprint(mensuel.round(1))", "err": false}, {"t": "html", "h": "<p>Voilà ce qu'un total isolé cachait : +143 % en juin, après −40 % en mai. Chacune de ces variations appelle une question (« pourquoi ? »), donc une analyse de diagnostic.<\/p><div class=\"warn\"><span class=\"lab\">Attention<\/span><p>Si la valeur précédente vaut 0, la division est impossible : pandas renvoie <code>inf<\/code> (l'infini), là où SQL demande un <code>NULLIF(…, 0)<\/code>. Pour l'éviter, remplace d'abord les zéros : <code>mensuel[\"total_precedent\"].replace(0, float(\"nan\"))<\/code>.<\/p><\/div><h3>Les taux : annulation, conversion, retour<\/h3><p>Le motif est universel : un taux est la <strong>moyenne d'un masque<\/strong>. Le masque vaut <code>True<\/code> (compté 1) ou <code>False<\/code> (compté 0) ; sa moyenne est donc la proportion de <code>True<\/code>. Il remplace le <code>SUM(CASE WHEN … THEN 1 ELSE 0 END) / COUNT(*)<\/code> de SQL.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\ntotal = len(df)\nnb_annulees = (df[\"statut\"] == \"annulee\").sum()\ntaux_annulation = (df[\"statut\"] == \"annulee\").mean() * 100\ntaux_retour = (df[\"statut\"] == \"retournee\").sum() / (df[\"statut\"] != \"annulee\").sum() * 100\n\nprint(f\"{nb_annulees} annulées sur {total} → taux d'annulation : {taux_annulation:.1f} %\")\nprint(f\"Taux de retour (retournées / expédiées) : {taux_retour:.1f} %\")\n\n# Le même taux, segmenté par canal\ndf[\"annulee\"] = df[\"statut\"] == \"annulee\"\nprint((df.groupby(\"canal\")[\"annulee\"].mean() * 100).round(1))", "err": false}, {"t": "html", "h": "<div class=\"note\"><span class=\"lab\">À retenir<\/span><p>Regarde le dénominateur du taux de retour : on ne peut retourner qu'une commande qui a été expédiée, donc on divise par les commandes non annulées, pas par le total. Dans un taux, l'erreur vient presque toujours du dénominateur.<\/p><\/div><h3>KPIs par domaine métier<\/h3><p>Chaque secteur a ses indicateurs. Tous se calculent avec les gestes ci-dessus : une somme, un comptage, un rapport, une segmentation.<\/p><h3>Ventes · e-commerce<\/h3><div class=\"tw\"><table><thead><tr><th>KPI<\/th><th>Formule<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>CA total<\/td><td>somme (quantité × prix)<\/td><td>toujours comparer à N−1<\/td><\/tr><tr><td>Panier moyen (AOV)<\/td><td>CA ÷ nombre de commandes distinctes<\/td><td>segmenter par canal<\/td><\/tr><tr><td>Taux d'annulation<\/td><td>annulées ÷ total × 100<\/td><td>surveiller les pics saisonniers<\/td><\/tr><tr><td>Taux de retour<\/td><td>retournées ÷ livrées × 100<\/td><td>impact direct sur le CA net<\/td><\/tr><tr><td>Top clients (Pareto)<\/td><td>rang sur le CA par client<\/td><td>20 % des clients = 80 % du CA<\/td><\/tr><\/tbody><\/table><\/div><h3>Abonnements · SaaS<\/h3><div class=\"tw\"><table><thead><tr><th>KPI<\/th><th>Formule<\/th><th>Seuil à surveiller<\/th><\/tr><\/thead><tbody><tr><td>Abonnés actifs<\/td><td>nombre de statuts « actif »<\/td><td>photographie à une date donnée<\/td><\/tr><tr><td>Churn mensuel<\/td><td>désabonnés ÷ actifs en début de mois × 100<\/td><td>moins de 5 % : acceptable<\/td><\/tr><tr><td>Taux de rétention<\/td><td>100 − churn<\/td><td>plus de 90 % : sain<\/td><\/tr><tr><td>MRR<\/td><td>somme des abonnements actifs du mois<\/td><td>revenus récurrents mensuels<\/td><\/tr><tr><td>ARPU<\/td><td>MRR ÷ nombre d'abonnés<\/td><td>revenu moyen par utilisateur<\/td><\/tr><\/tbody><\/table><\/div><h3>Ressources humaines<\/h3><div class=\"tw\"><table><thead><tr><th>KPI<\/th><th>Formule<\/th><th>Seuil à surveiller<\/th><\/tr><\/thead><tbody><tr><td>Taux de turnover<\/td><td>départs ÷ effectif moyen × 100<\/td><td>moins de 10 % : sain<\/td><\/tr><tr><td>Taux d'absentéisme<\/td><td>jours d'absence ÷ jours théoriques × 100<\/td><td>cible : moins de 3 %<\/td><\/tr><tr><td>Ancienneté moyenne<\/td><td>moyenne (date de sortie − date d'entrée)<\/td><td>indicateur de stabilité<\/td><\/tr><tr><td>Coût moyen de recrutement<\/td><td>budget recrutement ÷ nombre d'embauches<\/td><td>retour sur investissement RH<\/td><\/tr><\/tbody><\/table><\/div><h3>Hôtellerie et hébergement<\/h3><div class=\"tw\"><table><thead><tr><th>KPI<\/th><th>Formule<\/th><th>Seuil à surveiller<\/th><\/tr><\/thead><tbody><tr><td>Taux d'occupation<\/td><td>nuits vendues ÷ nuits disponibles × 100<\/td><td>moins de 60 % hors saison basse<\/td><\/tr><tr><td>RevPAR<\/td><td>CA hébergement ÷ chambres disponibles<\/td><td>baisse MoM de plus de 10 %<\/td><\/tr><tr><td>ADR (prix moyen journalier)<\/td><td>CA hébergement ÷ nuits vendues<\/td><td>inférieur au tarif affiché<\/td><\/tr><tr><td>ALOS (durée moyenne de séjour)<\/td><td>total des nuits ÷ nombre de séjours<\/td><td>moins de 1,5 : forte rotation<\/td><\/tr><tr><td>Taux d'annulation<\/td><td>annulations ÷ réservations × 100<\/td><td>plus de 20 % : revoir la politique<\/td><\/tr><\/tbody><\/table><\/div><h3>Supply chain et logistique<\/h3><div class=\"tw\"><table><thead><tr><th>KPI<\/th><th>Formule<\/th><th>Seuil à surveiller<\/th><\/tr><\/thead><tbody><tr><td>Taux de service (<em>fill rate<\/em>)<\/td><td>commandes livrées à temps ÷ total × 100<\/td><td>moins de 95 %<\/td><\/tr><tr><td>Rotation des stocks<\/td><td>CA ÷ valeur du stock moyen<\/td><td>moins de 4 : surstockage probable<\/td><\/tr><tr><td><em>Lead time<\/em> moyen<\/td><td>moyenne (date de livraison − date de commande)<\/td><td>hausse de plus de 20 % sur la période<\/td><\/tr><tr><td>Taux de rupture<\/td><td>jours en rupture ÷ jours de la période × 100<\/td><td>plus de 5 %<\/td><\/tr><tr><td>Coût de stockage unitaire<\/td><td>coût de l'entrepôt ÷ unités stockées<\/td><td>hausse sans hausse de volume<\/td><\/tr><\/tbody><\/table><\/div><h3>Transport et mobilité<\/h3><div class=\"tw\"><table><thead><tr><th>KPI<\/th><th>Formule<\/th><th>Seuil à surveiller<\/th><\/tr><\/thead><tbody><tr><td>Taux de remplissage<\/td><td>passagers réels ÷ capacité × 100<\/td><td>moins de 40 % : sous-utilisation<\/td><\/tr><tr><td>Ponctualité<\/td><td>arrivées à l'heure ÷ total × 100<\/td><td>moins de 90 %<\/td><\/tr><tr><td>Coût par km<\/td><td>coûts opérationnels ÷ km parcourus<\/td><td>hausse MoM de plus de 10 %<\/td><\/tr><tr><td>Fréquence des incidents<\/td><td>incidents ÷ trajets × 1 000<\/td><td>hausse concentrée sur une ligne<\/td><\/tr><tr><td>Durée moyenne de trajet<\/td><td>moyenne (heure d'arrivée − heure de départ)<\/td><td>dépasse l'horaire théorique<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "exo", "id": "pb-kpis-1", "title": "Le taux d'annulation par région", "h": "<p>Construis <code>taux<\/code> : une Series qui donne, pour chaque <code>region<\/code>, le pourcentage de commandes dont le statut est <code>annulee<\/code>, arrondi à 1 décimale.<\/p>", "starter": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n# Construis taux\n\nprint(taux)", "solution": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\ndf[\"annulee\"] = df[\"statut\"] == \"annulee\"\ntaux = (df.groupby(\"region\")[\"annulee\"].mean() * 100).round(1)\n\nprint(taux)", "tests": "import pandas as pd\nassert isinstance(taux, pd.Series), \"taux doit être une Series (index : la région, valeur : le pourcentage).\"\nobtenu = {str(k): round(float(v), 1) for k, v in taux.items()}\nassert sorted(obtenu) == [\"Nord\", \"Ouest\", \"Sud\"], \"L'index doit contenir les trois régions. Tu obtiens %r.\" % (sorted(obtenu),)\nassert max(obtenu.values()) > 1, \"Tu obtiens des proportions entre 0 et 1 : multiplie par 100 pour avoir des pourcentages.\"\nassert obtenu == {\"Nord\": 25.0, \"Ouest\": 5.7, \"Sud\": 14.3}, \"On attend Nord 25.0, Ouest 5.7, Sud 14.3. Tu obtiens %r.\" % (obtenu,)", "hint": "<p>Crée une colonne de <code>True<\/code>/<code>False<\/code> : <code>df[\"annulee\"] = df[\"statut\"] == \"annulee\"<\/code>. Sa moyenne par région est le taux : <code>df.groupby(\"region\")[\"annulee\"].mean()<\/code>. Multiplie par 100 et arrondis.<\/p>", "stdin": "", "skel": ""}]}, {"id": "pb-stats", "title": "Statistiques clés", "blocks": [{"t": "html", "h": "<p>Six notions suffisent pour décrire une colonne de chiffres sans se tromper. Aucune ne demande de formule compliquée : pandas les calcule, ton travail est de choisir la bonne et de l'interpréter.<\/p><h3>1 · Tendance centrale<\/h3><div class=\"tw\"><table><thead><tr><th>Mesure<\/th><th>Définition<\/th><th>Quand l'utiliser<\/th><th>pandas<\/th><\/tr><\/thead><tbody><tr><td>Moyenne<\/td><td>somme ÷ nombre de valeurs<\/td><td>données sans valeurs extrêmes<\/td><td><code>mean()<\/code><\/td><\/tr><tr><td>Médiane<\/td><td>la valeur du milieu, une fois les valeurs triées<\/td><td>présence de valeurs extrêmes<\/td><td><code>median()<\/code><\/td><\/tr><tr><td>Mode<\/td><td>la valeur la plus fréquente<\/td><td>données catégorielles<\/td><td><code>mode()<\/code><\/td><\/tr><\/tbody><\/table><\/div><p>Exemple : cinq revenus de 100 €, 100 €, 110 €, 120 € et 5 000 €.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\nrevenus = pd.Series([100, 100, 110, 120, 5000])\nprint(\"moyenne :\", revenus.mean())\nprint(\"médiane :\", revenus.median())\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\nprint(\"montant moyen  :\", round(df[\"montant\"].mean(), 2))\nprint(\"montant médian :\", df[\"montant\"].median())\n\n# Mode : la valeur la plus fréquente d'une colonne catégorielle\nprint(\"catégorie la plus fréquente :\", df[\"categorie\"].mode()[0])", "err": false}, {"t": "html", "h": "<p>La moyenne des revenus (1 086 €) ne décrit personne : quatre personnes sur cinq gagnent dix fois moins. La médiane (110 €) est représentative. Pour des revenus, des prix, des montants de commande, <strong>préfère la médiane<\/strong>, ou donne les deux.<\/p><p><code>mode()<\/code> renvoie une Series, car plusieurs valeurs peuvent être à égalité ; <code>[0]<\/code> prend la première.<\/p><h3>2 · Dispersion : mesurer la variabilité<\/h3><div class=\"tw\"><table><thead><tr><th>Mesure<\/th><th>Définition<\/th><th>pandas<\/th><th>Résiste aux valeurs extrêmes ?<\/th><\/tr><\/thead><tbody><tr><td>Écart-type<\/td><td>dispersion autour de la moyenne<\/td><td><code>std()<\/code><\/td><td>non<\/td><\/tr><tr><td>Variance<\/td><td>écart-type au carré<\/td><td><code>var()<\/code><\/td><td>non<\/td><\/tr><tr><td>Étendue (<em>range<\/em>)<\/td><td>maximum − minimum<\/td><td><code>max() - min()<\/code><\/td><td>non<\/td><\/tr><tr><td>IQR (écart interquartile)<\/td><td>Q3 − Q1 : l'étendue des 50 % centraux<\/td><td><code>quantile(0.75) - quantile(0.25)<\/code><\/td><td>oui<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nm = df[\"montant\"]\n\nprint(\"écart-type :\", round(m.std(), 2))\nprint(\"variance   :\", round(m.var(), 2))\nprint(\"étendue    :\", m.max() - m.min())\nprint(\"IQR        :\", m.quantile(0.75) - m.quantile(0.25))", "err": false}, {"t": "html", "h": "<div class=\"note\"><span class=\"lab\">À retenir<\/span><p>Quand les données contiennent des valeurs extrêmes, préfère l'IQR à l'écart-type : une seule valeur énorme suffit à gonfler l'écart-type, alors que l'IQR ne bouge pas.<\/p><\/div><p>Comme <code>STDEV<\/code> en SQL, <code>std()<\/code> calcule l'écart-type d'un <strong>échantillon<\/strong> (division par n − 1). Pour l'écart-type d'une population entière (<code>STDEVP<\/code>), écris <code>std(ddof=0)<\/code>.<\/p><h3>3 · Percentiles et quartiles<\/h3><p>Les quartiles coupent les données triées en 4 parts égales. Ils décrivent la répartition des valeurs et permettent de segmenter sans inventer de seuils.<\/p><div class=\"tw\"><table><thead><tr><th>Quartile<\/th><th>Percentile<\/th><th>Signification<\/th><\/tr><\/thead><tbody><tr><td>Q1<\/td><td>25<sup>e<\/sup><\/td><td>25 % des valeurs sont en dessous<\/td><\/tr><tr><td>Q2 (médiane)<\/td><td>50<sup>e<\/sup><\/td><td>50 % des valeurs sont en dessous<\/td><\/tr><tr><td>Q3<\/td><td>75<sup>e<\/sup><\/td><td>75 % des valeurs sont en dessous<\/td><\/tr><tr><td>IQR<\/td><td>Q3 − Q1<\/td><td>l'étendue des 50 % centraux<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\n# Q1, médiane, Q3 en un appel\nprint(df[\"montant\"].quantile([0.25, 0.50, 0.75]))\n\n# Classer chaque ligne dans son quartile (1 = bas, 4 = haut) : le NTILE(4) de SQL\nrang = df[\"montant\"].rank(method=\"first\")\ndf[\"quartile\"] = pd.qcut(rang, 4, labels=[1, 2, 3, 4])\n\n# Résumé statistique par quartile\nresume = df.groupby(\"quartile\", observed=True).agg(\n    nb=(\"montant\", \"count\"),\n    minimum=(\"montant\", \"min\"),\n    maximum=(\"montant\", \"max\"),\n    moyenne=(\"montant\", \"mean\"),\n)\nprint(resume.round(2))", "err": false}, {"t": "html", "h": "<p><code>pd.qcut<\/code> découpe une colonne en groupes de même effectif. On l'applique ici au <strong>rang<\/strong> des montants plutôt qu'aux montants eux-mêmes : comme plusieurs commandes ont exactement le même montant, c'est le moyen d'obtenir quatre groupes de taille strictement égale (18 commandes chacun), comme <code>NTILE(4)<\/code>. <code>observed=True<\/code> précise à <code>groupby<\/code> de n'afficher que les groupes réellement présents.<\/p><div class=\"note\"><span class=\"lab\">À retenir<\/span><p>Usage concret : classer tes clients en 4 groupes selon leur chiffre d'affaires, sans avoir à définir des seuils arbitraires.<\/p><\/div><h3>4 · Forme de la distribution<\/h3><div class=\"tw\"><table><thead><tr><th>Forme<\/th><th>Signe<\/th><th>Ce que cela veut dire<\/th><\/tr><\/thead><tbody><tr><td>Symétrique<\/td><td>moyenne ≈ médiane<\/td><td>Données bien réparties. La moyenne est un bon indicateur.<\/td><\/tr><tr><td>Asymétrie à droite<\/td><td>moyenne &gt; médiane<\/td><td>Une queue vers les valeurs élevées. Exemples : salaires, prix. Préférer la médiane.<\/td><\/tr><tr><td>Asymétrie à gauche<\/td><td>moyenne &lt; médiane<\/td><td>Une queue vers les valeurs basses. Exemples : notes, scores de satisfaction.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nmoyenne = df[\"montant\"].mean()\nmediane = df[\"montant\"].median()\n\nif moyenne > mediane * 1.05:\n    forme = \"Asymétrie à droite (valeurs extrêmes hautes)\"\nelif moyenne < mediane * 0.95:\n    forme = \"Asymétrie à gauche (valeurs extrêmes basses)\"\nelse:\n    forme = \"Distribution symétrique\"\n\nprint(round(moyenne, 2), mediane, \"→\", forme)\nprint(\"coefficient d'asymétrie :\", round(df[\"montant\"].skew(), 2))", "err": false}, {"t": "html", "h": "<p>La règle des 5 % d'écart entre moyenne et médiane est un repère pratique. <code>skew()<\/code> donne la mesure statistique : proche de 0 pour une distribution symétrique, positive pour une asymétrie à droite, négative pour une asymétrie à gauche.<\/p><h3>5 · Corrélation<\/h3><p>Le coefficient <strong>r<\/strong> (de Pearson) mesure la force et le sens d'une relation <strong>linéaire<\/strong> entre deux colonnes numériques. Il varie de −1 à +1.<\/p><div class=\"tw\"><table><thead><tr><th>Valeur de r<\/th><th>Interprétation<\/th><\/tr><\/thead><tbody><tr><td>0,7 à 1<\/td><td>forte et positive : quand X monte, Y monte nettement<\/td><\/tr><tr><td>0,3 à 0,7<\/td><td>modérée et positive<\/td><\/tr><tr><td>−0,3 à 0,3<\/td><td>pas de corrélation notable<\/td><\/tr><tr><td>−0,7 à −0,3<\/td><td>modérée et négative<\/td><\/tr><tr><td>−1 à −0,7<\/td><td>forte et négative : quand X monte, Y descend nettement<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\n# Corrélation entre deux colonnes\nprint(round(df[\"prix_unitaire\"].corr(df[\"montant\"]), 3))\n\n# Toutes les paires d'un coup : la matrice de corrélation\nprint(df[[\"quantite\", \"prix_unitaire\", \"montant\"]].corr().round(3))", "err": false}, {"t": "html", "h": "<p>Le montant d'une commande est fortement lié au prix unitaire (r = 0,84) et pas du tout à la quantité (r = −0,11). Autrement dit : ce qui fait une grosse commande dans cette boutique, c'est un produit cher, pas un gros volume. Et les produits chers se vendent en petites quantités (r = −0,37).<\/p><div class=\"warn\"><span class=\"lab\">Attention<\/span><p><strong>Corrélation n'est pas causalité.<\/strong> Les ventes de glaces et les noyades sont corrélées, car les deux augmentent en été. Ce n'est pas la glace qui cause les noyades, c'est la chaleur. La corrélation dit « ces deux variables bougent ensemble », jamais pourquoi.<\/p><\/div><h3>6 · Loi de Pareto (80/20)<\/h3><p>Dans la plupart des jeux de données métier, environ 20 % des entités (clients, produits, régions…) génèrent 80 % de la valeur. Les identifier est souvent l'insight le plus actionnable d'une analyse. La méthode : trier du plus gros au plus petit, cumuler, convertir en pourcentage du total.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\npar_client = df.groupby(\"client_id\").agg(ca=(\"montant\", \"sum\")).sort_values(\"ca\", ascending=False)\npar_client[\"cumul_pct\"] = (par_client[\"ca\"].cumsum() * 100 / par_client[\"ca\"].sum()).round(1)\nprint(par_client)\n\n# Les clients qui forment les 80 premiers % du chiffre d'affaires\nprint(list(par_client[par_client[\"cumul_pct\"] <= 80].index))", "err": false}, {"t": "html", "h": "<p>Un seul client, C05, réalise 41,7 % du chiffre d'affaires. C'est à la fois une information commerciale (un client à soigner) et un risque (que se passe-t-il s'il part ?).<\/p><div class=\"note\"><span class=\"lab\">Variante<\/span><p>Remplace <code>client_id<\/code> par <code>produit<\/code>, <code>region<\/code> ou <code>canal<\/code> pour trouver les quelques catégories qui font l'essentiel du résultat.<\/p><\/div>"}, {"t": "quiz", "id": "pb-stats-1", "title": "Moyenne, médiane, mode, étendue", "h": "", "code": "import pandas as pd\n\nnotes = pd.Series([8, 12, 12, 13, 15])\nprint(notes.mean())\nprint(notes.median())\nprint(notes.mode()[0])\nprint(notes.max() - notes.min())", "expected": "12.0\n12.0\n12\n7"}, {"t": "exo", "id": "pb-stats-2", "title": "Les produits vitaux", "h": "<p>Applique la méthode de Pareto aux produits. Construis <code>vitaux<\/code> : la <strong>liste<\/strong> des produits dont le chiffre d'affaires cumulé (du plus gros produit au plus petit) ne dépasse pas 80 % du total, dans l'ordre du plus gros au plus petit.<\/p>", "starter": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n# Construis la liste vitaux\n\nprint(vitaux)", "solution": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\nca = df.groupby(\"produit\")[\"montant\"].sum().sort_values(ascending=False)\ncumul_pct = ca.cumsum() * 100 / ca.sum()\nvitaux = list(cumul_pct[cumul_pct <= 80].index)\n\nprint(vitaux)", "tests": "assert isinstance(vitaux, list), \"vitaux doit être une liste : entoure ton résultat avec list(...).\"\nassert vitaux != [\"Écran\", \"Clavier\", \"Agenda\", \"Plaid\"], \"Plaid fait passer le cumul à 80.7 %% : il dépasse le seuil de 80 %%.\"\nassert sorted(vitaux) == sorted([\"Écran\", \"Clavier\", \"Agenda\"]), \"On attend trois produits : Écran, Clavier et Agenda (73.9 %% du total à eux trois). Tu obtiens %r.\" % (vitaux,)\nassert vitaux == [\"Écran\", \"Clavier\", \"Agenda\"], \"Les bons produits, mais pas dans l'ordre : du plus gros chiffre d'affaires au plus petit.\"", "hint": "<p>Le chiffre d'affaires par produit, trié en décroissant, puis <code>cumsum()<\/code> divisé par le total et multiplié par 100. Garde les lignes dont le cumul est inférieur ou égal à 80 : leur <code>.index<\/code> contient les noms des produits.<\/p>", "stdin": "", "skel": ""}]}, {"id": "pb-insights", "title": "Trouver des insights", "blocks": [{"t": "html", "h": "<p>Un <strong>insight<\/strong> est une conclusion qui implique une action. « Le chiffre d'affaires baisse » n'est pas un insight : c'est une observation. « Le chiffre d'affaires baisse uniquement sur les réservations de dernière minute, ce qui suggère un problème de tarif » en est un.<\/p><p>Passer du chiffre à la conclusion utile n'est pas un don. C'est une série de réflexes.<\/p><h3>Les 7 réflexes<\/h3><div class=\"tw\"><table><thead><tr><th>Réflexe<\/th><th>Pourquoi<\/th><th>Geste pandas<\/th><\/tr><\/thead><tbody><tr><td><strong>1 · Comparer dans le temps<\/strong><\/td><td>Un chiffre isolé ne dit rien. Compare à N−1 ou à la période précédente pour détecter les ruptures.<\/td><td><code>groupby(\"mois\")<\/code>, <code>pct_change<\/code><\/td><\/tr><tr><td><strong>2 · Segmenter et décomposer<\/strong><\/td><td>Une moyenne cache toujours des extrêmes. Décompose par région, canal, produit, jusqu'à trouver où est la vraie différence.<\/td><td><code>groupby<\/code> sur chaque dimension<\/td><\/tr><tr><td><strong>3 · Chercher les anomalies<\/strong><\/td><td>Ce qui sort de l'ordinaire est souvent le plus intéressant. Une anomalie est une hypothèse déguisée.<\/td><td><code>describe<\/code>, <code>nlargest<\/code>, <code>quantile<\/code><\/td><\/tr><tr><td><strong>4 · Appliquer la règle du « Et alors ? »<\/strong><\/td><td>Pose la question trois fois après chaque observation. Chaque réponse te rapproche de la cause, donc d'une action.<\/td><td>un nouveau <code>groupby<\/code> à chaque question<\/td><\/tr><tr><td><strong>5 · Ancrer à une référence<\/strong><\/td><td>30 %, est-ce bon ou mauvais ? Sans <em>baseline<\/em> (objectif, N−1, secteur), impossible de conclure.<\/td><td>valeur + comparaison + écart<\/td><\/tr><tr><td><strong>6 · Croiser deux variables<\/strong><\/td><td>Les croisements révèlent ce qui est invisible séparément : un signal fort peut disparaître dans une moyenne globale.<\/td><td><code>pivot_table<\/code>, <code>crosstab<\/code><\/td><\/tr><tr><td><strong>7 · Formuler et tester une hypothèse<\/strong><\/td><td>Propose une explication, puis cherche à la confirmer ou à l'infirmer. Un insight non vérifié est une opinion.<\/td><td>un filtre, puis la même mesure<\/td><\/tr><\/tbody><\/table><\/div><h3>Le réflexe 2 en action : une moyenne cache toujours quelque chose<\/h3>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\nprint(\"Panier moyen global :\", round(df[\"montant\"].mean(), 2), \"€\")\nprint((df.groupby(\"canal\")[\"montant\"].agg([\"count\", \"mean\", \"median\"])).round(2))", "err": false}, {"t": "html", "h": "<p>Le panier moyen « de la boutique » (71,52 €) ne correspond à aucune réalité : il vaut 91,59 € en ligne et 36,01 € en magasin. Ce sont deux activités différentes, à analyser séparément.<\/p><h3>Le test des 3 « Et alors ? »<\/h3><p>Pars d'une observation brute et demande « Et alors ? » trois fois de suite. Chaque réponse est un nouveau calcul, qui creuse un niveau de plus. Voici la méthode appliquée aux commandes de la boutique, en comparant le 1<sup>er<\/sup> trimestre (T1) et le 2<sup>e<\/sup> (T2).<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\ndf[\"trimestre\"] = \"T\" + df[\"date\"].dt.quarter.astype(str)\n\n# Observation : le chiffre d'affaires du magasin au 2e trimestre\nca = df.pivot_table(index=\"canal\", columns=\"trimestre\", values=\"montant\", aggfunc=\"sum\")\nprint(ca)\n\n# Et alors ? (1) Comparer : quelle évolution, et par rapport à l'autre canal ?\nca[\"evolution_pct\"] = ((ca[\"T2\"] - ca[\"T1\"]) * 100 / ca[\"T1\"]).round(1)\nprint(ca)\n\n# Et alors ? (2) Décomposer : moins de commandes, ou des commandes plus petites ?\ndetail = df.pivot_table(index=\"canal\", columns=\"trimestre\", values=\"montant\", aggfunc=[\"count\", \"mean\"]).round(1)\nprint(detail)", "err": false}, {"t": "html", "h": "<div class=\"tw\"><table><thead><tr><th>Étape<\/th><th>Ce que disent les données<\/th><\/tr><\/thead><tbody><tr><td>Observation<\/td><td>« Le chiffre d'affaires du magasin au 2<sup>e<\/sup> trimestre est de 341,70 €. »<\/td><\/tr><tr><td>Et alors ? (1)<\/td><td>« C'est −42,5 % par rapport au 1<sup>er<\/sup> trimestre, alors que la vente en ligne a plus que doublé (+110,4 %). »<\/td><\/tr><tr><td>Et alors ? (2)<\/td><td>« Le magasin n'a enregistré que 8 commandes, contre 18 au trimestre précédent. »<\/td><\/tr><tr><td>Et alors ? (3)<\/td><td>« Le panier moyen en magasin, lui, a augmenté (de 33,0 € à 42,7 €). Les clients qui viennent achètent autant qu'avant, voire plus : ce sont les visites qui manquent. »<\/td><\/tr><tr><td><strong>Insight actionnable<\/strong><\/td><td>« Le magasin a un problème de <strong>fréquentation<\/strong>, pas de prix ni d'offre. Recommandation : vérifier ce qui a changé en avril (horaires, travaux, communication locale), et tester une opération de retrait en magasin des commandes en ligne pour y ramener du passage. »<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\"><span class=\"lab\">À retenir<\/span><p>La troisième réponse a écarté une fausse piste : si le panier moyen avait baissé, la recommandation aurait porté sur les prix ou l'assortiment. C'est le réflexe 7 : tester l'hypothèse inverse avant de conclure.<\/p><\/div><h3>Modèles de phrases par type d'insight<\/h3><p>Quand tu ne sais pas comment formuler, remplis les crochets.<\/p><div class=\"tw\"><table><thead><tr><th>Type<\/th><th>Modèle<\/th><\/tr><\/thead><tbody><tr><td><strong>Tendance<\/strong><\/td><td>« Le [KPI] a [augmenté / chuté] de [X %] entre [période A] et [période B]. Contrairement à [tendance habituelle], cela coïncide avec [événement]. Recommandation : [action]. »<\/td><\/tr><tr><td><strong>Anomalie<\/strong><\/td><td>« [KPI] sur [segment] est [X fois] [supérieur / inférieur] à la moyenne ([valeur] contre [moyenne]). Ce comportement est isolé à [conditions]. Cause probable : [hypothèse]. À investiguer : [piste]. »<\/td><\/tr><tr><td><strong>Comparaison<\/strong><\/td><td>« [Segment A] performe [X %] [mieux / moins bien] que [segment B] sur [KPI]. La différence principale réside dans [variable clé]. Recommandation : [reproduire A / corriger B]. »<\/td><\/tr><tr><td><strong>Corrélation<\/strong><\/td><td>« [Variable X] et [variable Y] évoluent ensemble (r ≈ [valeur]). Quand [X augmente], [Y suit]. Cela suggère [relation]. À valider : [test à mener]. »<\/td><\/tr><\/tbody><\/table><\/div><h3>Avant, après : de l'observation à l'insight<\/h3><div class=\"tw\"><table><thead><tr><th>Observation brute<\/th><th>Insight actionnable<\/th><\/tr><\/thead><tbody><tr><td>« Les ventes ont augmenté en décembre. »<\/td><td>« Le CA de décembre (+28 % par rapport à N−1) est tiré par 3 produits cadeaux, qui représentent 71 % du CA mensuel. Hors de ces références, les ventes stagnent. Recommandation : anticiper les stocks de ces 3 produits dès octobre. »<\/td><\/tr><tr><td>« Le turnover est élevé ce trimestre. »<\/td><td>« Le turnover du 3<sup>e<\/sup> trimestre (18 %) est concentré à 80 % sur les collaborateurs de moins de 6 mois, période où 3 managers ont été remplacés. Recommandation : auditer le parcours d'intégration. »<\/td><\/tr><tr><td>« Le taux d'occupation baisse. »<\/td><td>« Le taux d'occupation de juillet (−12 points par rapport à N−1) chute uniquement sur les réservations de dernière minute (J−3), qui représentaient 35 % du volume. Les réservations anticipées restent stables. Recommandation : revoir la tarification à J−3. »<\/td><\/tr><\/tbody><\/table><\/div><h3>Ce qui n'est pas un insight<\/h3><div class=\"tw\"><table><thead><tr><th>Pas un insight<\/th><th>Pourquoi cela ne suffit pas<\/th><th>Ce qu'il manque<\/th><\/tr><\/thead><tbody><tr><td>« Le CA a augmenté. »<\/td><td>ni comparé, ni segmenté, ni actionnable<\/td><td>De combien ? Par rapport à quoi ? Sur quel segment ?<\/td><\/tr><tr><td>« Il y a 15 % de valeurs manquantes sur la région. »<\/td><td>observation technique sans impact métier<\/td><td>Quel effet sur l'analyse ? Que faire ?<\/td><\/tr><tr><td>« La catégorie A représente 40 % du CA. »<\/td><td>une photographie sans tendance ni contexte<\/td><td>Est-ce en hausse ? Normal ? Par rapport à l'objectif ?<\/td><\/tr><tr><td>« Les ventes varient selon les mois. »<\/td><td>trop vague, aucune direction<\/td><td>Quels mois ? Pourquoi ? Que changer ?<\/td><\/tr><tr><td>« Les clients satisfaits achètent plus. »<\/td><td>corrélation évidente, aucun levier<\/td><td>Quel segment ? Quel levier ? Combien ?<\/td><\/tr><\/tbody><\/table><\/div><h3>Avant de présenter : 6 vérifications<\/h3><ul><li>Le chiffre est comparé à une référence (N−1, objectif, secteur).<\/li><li>L'observation est segmentée : ce n'est pas une moyenne globale.<\/li><li>La cause probable est identifiée, pas seulement le symptôme.<\/li><li>Une action concrète est proposée, pas seulement une conclusion.<\/li><li>L'hypothèse inverse a été testée : existe-t-il une autre explication plausible ?<\/li><li>Le destinataire est clair : qui doit agir (direction, opérations, marketing…) ?<\/li><\/ul>"}]}, {"id": "pb-communiquer", "title": "Communiquer ses résultats", "blocks": [{"t": "html", "h": "<p>Tes données valent ce que vaut ta capacité à les expliquer. Un insight que personne ne comprend ne déclenche aucune action. <strong>La communication fait partie de l'analyse<\/strong>, elle n'arrive pas après.<\/p><h3>1 · Le principe BLUF : la conclusion d'abord<\/h3><p>BLUF signifie <em>Bottom Line Up Front<\/em> : la conclusion en premier.<\/p><div class=\"tw\"><table><thead><tr><th>Approche<\/th><th>Ordre<\/th><th>Effet sur l'auditoire<\/th><\/tr><\/thead><tbody><tr><td>Classique (à éviter)<\/td><td>contexte → données → analyse → conclusion<\/td><td>On attend dix minutes avant de savoir pourquoi on est là. On décroche avant la fin.<\/td><\/tr><tr><td><strong>BLUF<\/strong> (efficace)<\/td><td>conclusion → preuves → contexte → recommandation<\/td><td>On sait dès la première phrase où tu veux en venir. Le reste vient le confirmer.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\"><span class=\"lab\">En pratique<\/span><p>La première phrase de ta présentation contient la conclusion. « Notre taux de churn a doublé en 3 mois sur les clients de moins de 6 mois, ce qui coûte 40 K€ par mois. Voici pourquoi, et comment y remédier. »<\/p><\/div><p>Python apporte ici quelque chose qu'un tableur n'a pas : la phrase de conclusion peut être <strong>générée à partir des chiffres<\/strong>. Si les données changent, la phrase se met à jour, et elle ne peut pas contredire le calcul.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\ndf[\"trimestre\"] = \"T\" + df[\"date\"].dt.quarter.astype(str)\n\nmagasin = df[df[\"canal\"] == \"Magasin\"].groupby(\"trimestre\").agg(ca=(\"montant\", \"sum\"), nb=(\"id\", \"count\"))\nevolution = (magasin.loc[\"T2\", \"ca\"] - magasin.loc[\"T1\", \"ca\"]) * 100 / magasin.loc[\"T1\", \"ca\"]\n\nprint(\n    f\"Le chiffre d'affaires du magasin a reculé de {abs(evolution):.0f} % au 2e trimestre \"\n    f\"({magasin.loc['T2', 'ca']:.0f} € contre {magasin.loc['T1', 'ca']:.0f} €), \"\n    f\"parce que le nombre de commandes est passé de {magasin.loc['T1', 'nb']} à {magasin.loc['T2', 'nb']}. \"\n    \"Recommandation : relancer la fréquentation du point de vente.\"\n)", "err": false}, {"t": "html", "h": "<p><code>loc[ligne, colonne]<\/code> lit une case précise du tableau par ses étiquettes. Dans la f-string, <code>:.0f<\/code> arrondit à l'unité : devant une direction, « 43 % » se retient mieux que « 42,52 % ».<\/p><h3>2 · Le cadre SCR : Situation, Complication, Résolution<\/h3><p>Une structure de récit issue du conseil en stratégie, applicable à tout rapport et à toute présentation.<\/p><div class=\"tw\"><table><thead><tr><th>Temps<\/th><th>Rôle<\/th><th>Exemple<\/th><\/tr><\/thead><tbody><tr><td><strong>S<\/strong>ituation<\/td><td>Le contexte partagé : ce que tout le monde sait et accepte. Court, factuel, incontestable.<\/td><td>« Notre CA mensuel est stable depuis 6 mois, autour de 500 K€. »<\/td><\/tr><tr><td><strong>C<\/strong>omplication<\/td><td>Ce qui change ou pose problème : l'événement qui rompt l'équilibre et crée le besoin d'agir.<\/td><td>« Mais depuis mars, les clients existants commandent 30 % moins souvent, soit 26 K€ de manque à gagner par mois. »<\/td><\/tr><tr><td><strong>R<\/strong>ésolution<\/td><td>Ce que tu recommandes : une action précise, un responsable, un impact estimé.<\/td><td>« Lancer une campagne de réactivation sur les 1 200 clients inactifs depuis 45 jours. »<\/td><\/tr><\/tbody><\/table><\/div><h3>3 · La règle : 1 diapositive = 1 message<\/h3><p>Chaque diapositive répond à une seule question. S'il te faut deux titres, il te faut deux diapositives. Et le titre est l'<strong>insight<\/strong>, pas la description du graphique.<\/p><div class=\"tw\"><table><thead><tr><th>Titre passif (description)<\/th><th>Titre insight (message)<\/th><\/tr><\/thead><tbody><tr><td>Ventes par région, 2024<\/td><td>La région Sud sous-performe de 20 % malgré un budget marketing supérieur<\/td><\/tr><tr><td>Taux de churn mensuel<\/td><td>Le churn a doublé en 3 mois, concentré sur les clients de moins de 6 mois<\/td><\/tr><tr><td>Évolution du CA<\/td><td>La croissance ralentit depuis février : +2 % par mois, contre +12 % en moyenne l'an dernier<\/td><\/tr><tr><td>Répartition des catégories<\/td><td>3 catégories génèrent 78 % du CA, les 12 autres sont marginales<\/td><\/tr><tr><td>Taux d'occupation, juillet<\/td><td>Le taux d'occupation chute uniquement sur les réservations de dernière minute<\/td><\/tr><\/tbody><\/table><\/div><p>La même règle vaut pour le titre d'un graphique matplotlib : <code>ax.set_title(…)<\/code> porte le message. Tu l'appliqueras dans la leçon <a href=\"#pb-visualiser\">Visualiser et construire un tableau de bord<\/a>.<\/p><h3>4 · Structure type d'un rapport<\/h3><div class=\"tw\"><table><thead><tr><th>Partie<\/th><th>Contenu<\/th><\/tr><\/thead><tbody><tr><td>01 · Synthèse (1 page au plus)<\/td><td>Le BLUF complet : le contexte en une phrase, 2 ou 3 résultats clés chiffrés, 1 ou 2 recommandations. Un dirigeant qui ne lit que cette page doit pouvoir décider.<\/td><\/tr><tr><td>02 · Contexte et périmètre<\/td><td>Objectif de l'analyse, période couverte, données utilisées, limites éventuelles. C'est ce qui donne confiance dans la méthode.<\/td><\/tr><tr><td>03 · Résultats clés<\/td><td>2 à 4 insights majeurs, un par diapositive ou par section. Chacun : observation + chiffre + comparaison + cause probable.<\/td><\/tr><tr><td>04 · Recommandations<\/td><td>Des actions concrètes, classées par priorité, avec un responsable et un impact estimé. Format : « Faire [quoi] pour [qui] afin de [impact] d'ici [quand]. »<\/td><\/tr><tr><td>05 · Annexes (facultatif)<\/td><td>Détail de la méthode, tableaux de données, graphiques supplémentaires. Disponibles si on les demande, jamais imposées.<\/td><\/tr><\/tbody><\/table><\/div><h3>5 · Adapter le message à l'auditoire<\/h3><div class=\"tw\"><table><thead><tr><th>Auditoire<\/th><th>Ce qu'il veut<\/th><th>Format idéal<\/th><th>Ce qu'il ne veut pas<\/th><\/tr><\/thead><tbody><tr><td>Direction<\/td><td>une décision à prendre, l'impact financier, le risque<\/td><td>3 à 5 diapositives, de grands chiffres, une recommandation claire<\/td><td>la méthode, le détail technique, trop de graphiques<\/td><\/tr><tr><td>Responsable opérationnel<\/td><td>les causes, les segments, des actions concrètes<\/td><td>10 à 15 diapositives, des décompositions, des priorités<\/td><td>le jargon statistique, les graphiques sans contexte<\/td><\/tr><tr><td>Équipe technique<\/td><td>la méthode, la qualité des données, la reproductibilité<\/td><td>un rapport écrit, le code source, des notes<\/td><td>les simplifications excessives, les conclusions sans preuve<\/td><\/tr><tr><td>Client ou externe<\/td><td>la valeur créée, un récit, un visuel soigné<\/td><td>5 à 10 diapositives très visuelles, peu de chiffres<\/td><td>les données internes sensibles, le jargon interne<\/td><\/tr><\/tbody><\/table><\/div><h3>6 · Les erreurs classiques<\/h3><div class=\"tw\"><table><thead><tr><th>Erreur<\/th><th>Pourquoi c'est un problème<\/th><th>À faire à la place<\/th><\/tr><\/thead><tbody><tr><td>Le déballage de données<\/td><td>tout montrer, sans fil directeur<\/td><td>choisir 2 à 4 résultats qui répondent à la question de départ<\/td><\/tr><tr><td>Trop de diapositives<\/td><td>l'auditoire se noie, le message se perd<\/td><td>au-delà de 15, réduire ou déplacer en annexe<\/td><\/tr><tr><td>Des titres descriptifs<\/td><td>« CA par mois » oblige l'auditoire à interpréter seul<\/td><td>titre = message : « Le CA stagne depuis février malgré la hausse des prospects »<\/td><\/tr><tr><td>Pas de recommandation<\/td><td>l'analyse reste théorique, personne ne sait quoi faire<\/td><td>toujours finir par « Je recommande de… » et une action concrète<\/td><\/tr><tr><td>Des graphiques illisibles<\/td><td>axes sans unité, 8 couleurs, légende incompréhensible<\/td><td>1 graphique = 1 comparaison, annotée directement sur le tracé<\/td><\/tr><tr><td>Commencer par la méthode<\/td><td>l'auditoire décroche avant les résultats<\/td><td>les résultats d'abord, la méthode en annexe<\/td><\/tr><\/tbody><\/table><\/div>"}]}, {"id": "pb-excel", "title": "D'Excel à pandas", "blocks": [{"t": "html", "h": "<p>Si tu viens d'Excel, tu connais déjà les idées : pandas ne fait que les écrire autrement. Cette fiche traduit les formules indispensables à l'analyse. Elle sert aussi dans l'autre sens, le jour où l'on te demande de refaire en Python « ce que fait le fichier Excel ».<\/p><h3>Agrégation conditionnelle<\/h3><p>Toutes ces formules suivent le même schéma en pandas : <strong>un masque<\/strong> (la condition), puis <strong>une agrégation<\/strong>.<\/p><div class=\"tw\"><table><thead><tr><th>Excel<\/th><th>Usage<\/th><th>pandas<\/th><\/tr><\/thead><tbody><tr><td><code>SOMME.SI<\/code><\/td><td>additionner selon 1 critère<\/td><td><code>df.loc[condition, \"montant\"].sum()<\/code><\/td><\/tr><tr><td><code>SOMME.SI.ENS<\/code><\/td><td>additionner selon plusieurs critères<\/td><td>conditions reliées par <code>&amp;<\/code><\/td><\/tr><tr><td><code>NB.SI<\/code><\/td><td>compter selon 1 critère<\/td><td><code>condition.sum()<\/code><\/td><\/tr><tr><td><code>MOYENNE.SI<\/code><\/td><td>moyenne conditionnelle<\/td><td><code>df.loc[condition, \"montant\"].mean()<\/code><\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\n# =SOMME.SI(region; \"Sud\"; montant)\nprint(round(df.loc[df[\"region\"] == \"Sud\", \"montant\"].sum(), 2))\n\n# =SOMME.SI.ENS(montant; region; \"Sud\"; statut; \"livree\")\ncondition = (df[\"region\"] == \"Sud\") & (df[\"statut\"] == \"livree\")\nprint(round(df.loc[condition, \"montant\"].sum(), 2))\n\n# =NB.SI(statut; \"annulee\")\nprint((df[\"statut\"] == \"annulee\").sum())\n\n# =MOYENNE.SI(categorie; \"Maison\"; montant)\nprint(round(df.loc[df[\"categorie\"] == \"Maison\", \"montant\"].mean(), 2))", "err": false}, {"t": "html", "h": "<p><code>df.loc[condition, \"montant\"]<\/code> se lit : « dans <code>df<\/code>, les lignes où la condition est vraie, colonne <code>montant<\/code> ». Et quand tu veux le résultat pour <strong>toutes<\/strong> les valeurs du critère à la fois, plus besoin d'une formule par ligne : c'est un <code>groupby<\/code>.<\/p><h3>Recherche<\/h3><div class=\"tw\"><table><thead><tr><th>Excel<\/th><th>Usage<\/th><th>pandas<\/th><\/tr><\/thead><tbody><tr><td><code>RECHERCHEX<\/code> (ou <code>RECHERCHEV<\/code>)<\/td><td>aller chercher une information dans un autre tableau<\/td><td><code>merge<\/code>, ou <code>map<\/code> pour une seule colonne<\/td><\/tr><tr><td><code>INDEX<\/code> + <code>EQUIV<\/code><\/td><td>lire une valeur par sa ligne et sa colonne<\/td><td><code>set_index(…)<\/code> puis <code>loc[ligne, colonne]<\/code><\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\nclients = pd.read_csv(\"clients.csv\")\n\n# RECHERCHEX sur tout le tableau : merge ramène les colonnes de l'autre table\nenrichi = df.merge(clients, on=\"client_id\", how=\"left\")\nprint(enrichi[[\"id\", \"client_id\", \"nom\", \"ville\"]].head(3))\n\n# RECHERCHEX pour une seule colonne : map utilise une table de correspondance\nvilles = clients.set_index(\"client_id\")[\"ville\"]\ndf[\"ville\"] = df[\"client_id\"].map(villes)\nprint(df[\"ville\"].value_counts(dropna=False))\n\n# INDEX + EQUIV : une valeur par sa ligne et sa colonne\nprint(clients.set_index(\"client_id\").loc[\"C03\", \"ville\"])", "err": false}, {"t": "html", "h": "<p>Les 6 <code>NaN<\/code> sont les commandes du client C06, absent de <code>clients.csv<\/code> : l'équivalent du <code>#N/A<\/code> d'Excel. Avec <code>how=\"left\"<\/code>, aucune commande n'est perdue.<\/p><h3>Tableaux croisés dynamiques<\/h3><p>Dans Excel : une dimension dans « Lignes », une autre dans « Colonnes », une métrique dans « Valeurs ». <code>pivot_table<\/code> prend exactement ces trois réglages. <code>margins=True<\/code> ajoute les totaux.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\ntcd = df.pivot_table(\n    index=\"categorie\",       # Lignes\n    columns=\"canal\",         # Colonnes\n    values=\"montant\",        # Valeurs\n    aggfunc=\"sum\",           # Synthétiser par : Somme\n    margins=True,            # Totaux généraux\n    margins_name=\"Total\",\n)\nprint(tcd.round(1))", "err": false}, {"t": "html", "h": "<h3>Statistiques<\/h3><div class=\"tw\"><table><thead><tr><th>Excel<\/th><th>pandas<\/th><\/tr><\/thead><tbody><tr><td><code>MOYENNE(plage)<\/code><\/td><td><code>df[\"montant\"].mean()<\/code><\/td><\/tr><tr><td><code>MEDIANE(plage)<\/code><\/td><td><code>df[\"montant\"].median()<\/code><\/td><\/tr><tr><td><code>ECARTYPE(plage)<\/code><\/td><td><code>df[\"montant\"].std()<\/code><\/td><\/tr><tr><td><code>CENTILE(plage; 0,75)<\/code><\/td><td><code>df[\"montant\"].quantile(0.75)<\/code><\/td><\/tr><tr><td><code>GRANDE.VALEUR(plage; 2)<\/code><\/td><td><code>df[\"montant\"].nlargest(2).iloc[-1]<\/code><\/td><\/tr><tr><td><code>COEFFICIENT.CORRELATION(plage1; plage2)<\/code><\/td><td><code>df[\"prix_unitaire\"].corr(df[\"montant\"])<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\"><span class=\"lab\">Le changement d'habitude<\/span><p>Dans Excel, une formule vit dans une cellule et se recopie vers le bas. Dans pandas, une opération s'applique à la colonne entière : <code>df[\"ttc\"] = df[\"montant\"] * 1.2<\/code> remplace mille formules recopiées, et ne peut pas « oublier » une ligne.<\/p><\/div>"}, {"t": "exo", "id": "pb-excel-1", "title": "Un SOMME.SI.ENS", "h": "<p>Calcule dans <code>total<\/code> la somme des montants des commandes <strong>livrées<\/strong>, passées <strong>en ligne<\/strong>, dans la région contenue dans la variable <code>region_cible<\/code>. Arrondis à 2 décimales.<\/p>", "starter": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\nregion_cible = \"Ouest\"\n# Calcule total\n\nprint(total)", "solution": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\nregion_cible = \"Ouest\"\ncondition = (df[\"region\"] == region_cible) & (df[\"canal\"] == \"En ligne\") & (df[\"statut\"] == \"livree\")\ntotal = round(df.loc[condition, \"montant\"].sum(), 2)\n\nprint(total)", "tests": "assert abs(float(total) - 1354.8) < 0.005, \"Pour la région Ouest, on attend 1354.8. Tu obtiens %r. Il faut trois conditions : la région, le canal En ligne et le statut livree.\" % (total,)\nns = rejoue('region_cible = \"Ouest\"', 'region_cible = \"Sud\"')\nassert abs(float(ns[\"total\"]) - 852.9) < 0.005, \"Ton calcul doit utiliser la variable region_cible : pour la région Sud, on attend 852.9.\"", "hint": "<p>Trois conditions, chacune entre parenthèses, reliées par <code>&amp;<\/code>. Puis <code>df.loc[condition, \"montant\"].sum()<\/code>.<\/p>", "stdin": "", "skel": ""}]}, {"id": "pb-visualiser", "title": "Visualiser et construire un tableau de bord", "blocks": [{"t": "html", "h": "<p>Un graphique ne montre pas des données : il <strong>répond à une question<\/strong>. Avant de créer un visuel, demande-toi quelle comparaison tu veux que l'auditoire voie. La syntaxe de matplotlib est expliquée dans <a href=\"#premiers-graphiques\">Premiers graphiques<\/a> ; cette leçon porte sur les choix.<\/p><h3>Le circuit professionnel : préparer, puis visualiser<\/h3><p>En entreprise, on ne branche pas l'outil de visualisation sur une table brute. On prépare et on nettoie les données d'abord (en SQL, on enregistre le résultat dans une <code>VIEW<\/code>), et l'outil n'a plus qu'à lire une table propre. En Python, le principe est le même : une <strong>fonction<\/strong> produit la table prête à l'emploi, et les graphiques ne lisent qu'elle.<\/p>"}, {"t": "code", "c": "import pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\n\n\ndef vue_ventes_propres(df):\n    \"\"\"La table prête pour les graphiques : le CA livré par mois et par catégorie.\"\"\"\n    livrees = df[df[\"statut\"] == \"livree\"].copy()\n    livrees[\"mois\"] = livrees[\"date\"].dt.strftime(\"%Y-%m\")\n    return livrees.groupby([\"mois\", \"categorie\"], as_index=False).agg(ca=(\"montant\", \"sum\"))\n\n\nvue = vue_ventes_propres(df)\nprint(vue.head())\n\n# Pour Power BI, Tableau ou Looker : on exporte la table propre\nvue.to_csv(\"vue_ventes_propres.csv\", index=False)", "err": false}, {"t": "html", "h": "<p>C'est plus simple, reproductible, et tout le monde lit les mêmes chiffres. <code>index=False<\/code> évite d'écrire dans le fichier la colonne de numéros de lignes.<\/p><h3>1 · Choisir le bon graphique<\/h3><div class=\"tw\"><table><thead><tr><th>Objectif<\/th><th>Graphique recommandé<\/th><th>matplotlib<\/th><th>À éviter<\/th><\/tr><\/thead><tbody><tr><td>Évolution dans le temps<\/td><td>courbe<\/td><td><code>ax.plot<\/code><\/td><td>les barres au-delà de 12 périodes<\/td><\/tr><tr><td>Comparer des catégories<\/td><td>barres horizontales<\/td><td><code>ax.barh<\/code><\/td><td>le camembert, la 3D<\/td><\/tr><tr><td>Évolution + comparaison<\/td><td>barres groupées ou empilées<\/td><td><code>ax.bar<\/code> (avec <code>bottom<\/code>)<\/td><td>plus de 4 séries<\/td><\/tr><tr><td>Répartition proportionnelle<\/td><td>anneau, 5 segments au plus<\/td><td><code>ax.pie<\/code><\/td><td>le camembert à plus de 5 segments<\/td><\/tr><tr><td>Distribution d'une variable<\/td><td>histogramme<\/td><td><code>ax.hist<\/code><\/td><td>la courbe<\/td><\/tr><tr><td>Corrélation entre 2 variables<\/td><td>nuage de points<\/td><td><code>ax.scatter<\/code><\/td><td>les barres, qui masquent la relation<\/td><\/tr><tr><td>Un KPI unique<\/td><td>un grand chiffre et sa variation en %<\/td><td><code>ax.text<\/code><\/td><td>un graphique, trop complexe<\/td><\/tr><\/tbody><\/table><\/div><p>Pour une composition hiérarchique (<em>treemap<\/em>) ou des données géographiques (carte), matplotlib seul ne suffit pas : on passe par des bibliothèques spécialisées comme plotly ou geopandas, ou par un outil de BI.<\/p><h3>2 · Les règles d'un graphique efficace<\/h3><div class=\"tw\"><table><thead><tr><th>Règle<\/th><th>En clair<\/th><\/tr><\/thead><tbody><tr><td><strong>Titre = le message<\/strong><\/td><td>Le titre est l'insight, pas la description. « CA par région » devient « La région Sud sous-performe de 20 % ».<\/td><\/tr><tr><td><strong>1 graphique = 1 question<\/strong><\/td><td>S'il te faut deux titres pour décrire un graphique, il te faut deux graphiques.<\/td><\/tr><tr><td><strong>Couleur = sens<\/strong><\/td><td>Réserve la couleur à ce que tu veux faire voir. Du gris pour le reste, une seule couleur d'accent.<\/td><\/tr><tr><td><strong>Annoter directement<\/strong><\/td><td>Écris les valeurs clés sur la courbe ou sur la barre. Une légende séparée oblige le lecteur à faire le lien seul.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\"><span class=\"lab\">L'axe des valeurs<\/span><p>Sur un graphique en barres, l'axe des valeurs commence toujours à zéro : sinon, tu exagères visuellement les écarts. Sur une courbe, adapter l'échelle est acceptable si c'est clairement indiqué.<\/p><\/div><p>Voici les quatre règles appliquées à un seul graphique. Modifie le seuil de 1 000 € et relance.<\/p><div class=\"warn\"><span class=\"lab\">Attention<\/span><p>La première exécution d'un code qui importe matplotlib prend 10 à 30 secondes sur cette page.<\/p><\/div>"}, {"t": "code", "c": "import matplotlib.pyplot as plt\nimport pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\nca = df.groupby(\"produit\")[\"montant\"].sum().sort_values()\npart = ca[ca >= 1000].sum() * 100 / ca.sum()\n\n# Couleur = sens : l'accent sur ce qui compte, du gris pour le reste\ncouleurs = [\"#2747d9\" if valeur >= 1000 else \"#b8bfd3\" for valeur in ca]\n\nfig, ax = plt.subplots(figsize=(7, 4))\nbarres = ax.barh(ca.index, ca.values, color=couleurs)\n\n# Annoter directement : la valeur au bout de chaque barre\nax.bar_label(barres, fmt=\"%.0f €\", padding=4)\n\n# Titre = le message, calculé à partir des données\nax.set_title(f\"Deux produits réalisent {part:.0f} % du chiffre d'affaires\", loc=\"left\", fontweight=\"bold\")\nax.set_xlabel(\"Chiffre d'affaires (€)\")\nax.set_xlim(0, ca.max() * 1.15)\nax.spines[\"top\"].set_visible(False)\nax.spines[\"right\"].set_visible(False)\nplt.show()", "err": false}, {"t": "html", "h": "<p><code>sort_values()<\/code> avant <code>barh<\/code> : les barres sont triées, la plus grande en haut. Un graphique de catégories non trié oblige le lecteur à faire le classement de tête.<\/p><h3>3 · Anatomie d'un bon tableau de bord<\/h3><div class=\"tw\"><table><thead><tr><th>Zone<\/th><th>Contenu<\/th><\/tr><\/thead><tbody><tr><td><strong>1 · En-tête : les KPIs clés<\/strong><\/td><td>3 à 5 métriques en grand, avec leur variation par rapport à la période précédente. Compréhension en 5 secondes : c'est la zone que tout le monde regarde en premier.<\/td><\/tr><tr><td><strong>2 · Évolution temporelle<\/strong><\/td><td>Une courbe ou des barres pour voir les tendances et la saisonnalité. Ajoute une ligne de référence (objectif, moyenne ou N−1).<\/td><\/tr><tr><td><strong>3 · Décomposition par dimension<\/strong><\/td><td>Des barres horizontales pour la répartition par catégorie (région, produit, canal…), toujours triées par valeur décroissante.<\/td><\/tr><tr><td><strong>4 · Filtres interactifs<\/strong><\/td><td>Période, segment, région. Ils permettent d'explorer sans changer le tableau de bord. Regroupe-les en haut ou à gauche.<\/td><\/tr><tr><td><strong>5 · Tableau de détail (facultatif)<\/strong><\/td><td>En bas, pour ceux qui veulent le détail. Jamais au premier plan.<\/td><\/tr><\/tbody><\/table><\/div><p>Les zones 1 à 3 se construisent avec matplotlib : plusieurs axes dans une même figure. Les filtres interactifs demandent un outil de BI, ou une application comme Streamlit.<\/p>"}, {"t": "code", "c": "import matplotlib.pyplot as plt\nimport pandas as pd\n\ndf = pd.read_csv(\"commandes.csv\", parse_dates=[\"date\"])\nlivrees = df[df[\"statut\"] == \"livree\"].copy()\nlivrees[\"mois\"] = livrees[\"date\"].dt.strftime(\"%Y-%m\")\n\nmensuel = livrees.groupby(\"mois\")[\"montant\"].sum()\npar_categorie = livrees.groupby(\"categorie\")[\"montant\"].sum().sort_values()\nvariation = (mensuel.iloc[-1] - mensuel.iloc[-2]) * 100 / mensuel.iloc[-2]\ntaux_annulation = (df[\"statut\"] == \"annulee\").mean() * 100\n\nfig, (zone_kpi, zone_temps, zone_cat) = plt.subplots(\n    3, 1, figsize=(7, 8), gridspec_kw={\"height_ratios\": [1, 3, 2.2]}\n)\n\n# Zone 1 : les KPIs clés, en grand\nzone_kpi.axis(\"off\")\nkpis = [\n    (\"CA livré\", f\"{mensuel.sum():,.0f} €\".replace(\",\", \" \")),\n    (\"Dernier mois\", f\"{variation:+.0f} %\"),\n    (\"Panier moyen\", f\"{livrees['montant'].mean():.0f} €\"),\n    (\"Annulations\", f\"{taux_annulation:.1f} %\".replace(\".\", \",\")),\n]\nfor i, (nom, valeur) in enumerate(kpis):\n    zone_kpi.text(0.125 + i * 0.25, 0.60, valeur, ha=\"center\", fontsize=17, fontweight=\"bold\")\n    zone_kpi.text(0.125 + i * 0.25, 0.15, nom, ha=\"center\", fontsize=10, color=\"#566080\")\n\n# Zone 2 : l'évolution, avec une ligne de référence\nzone_temps.plot(mensuel.index, mensuel.values, marker=\"o\", color=\"#2747d9\")\nzone_temps.axhline(mensuel.mean(), color=\"#b8bfd3\", linestyle=\"--\")\nzone_temps.text(0, mensuel.mean() + 15, \"moyenne des 6 mois\", color=\"#566080\", fontsize=9)\nzone_temps.set_title(\"Juin efface le creux de mai : meilleur mois du semestre\", loc=\"left\", fontweight=\"bold\")\nzone_temps.set_ylim(0, mensuel.max() * 1.15)\nzone_temps.set_ylabel(\"CA livré (€)\")\n\n# Zone 3 : la décomposition, triée\nbarres = zone_cat.barh(par_categorie.index, par_categorie.values, color=\"#b8bfd3\")\nbarres[-1].set_color(\"#2747d9\")\nzone_cat.bar_label(barres, fmt=\"%.0f €\", padding=4)\nzone_cat.set_xlim(0, par_categorie.max() * 1.18)\nzone_cat.set_title(\"L'informatique pèse plus que les deux autres réunies\", loc=\"left\", fontweight=\"bold\")\n\nfor zone in (zone_temps, zone_cat):\n    zone.spines[\"top\"].set_visible(False)\n    zone.spines[\"right\"].set_visible(False)\nfig.tight_layout()\nplt.show()", "err": false}, {"t": "html", "h": "<p>Trois détails de formatage : <code>:,.0f<\/code> sépare les milliers par une virgule, que <code>replace<\/code> transforme en espace à la française (de même, le point décimal devient une virgule) ; <code>:+.0f<\/code> affiche toujours le signe ; <code>iloc[-1]<\/code> lit la dernière ligne par sa position.<\/p><h3>4 · Erreurs visuelles à éviter<\/h3><div class=\"tw\"><table><thead><tr><th>Erreur<\/th><th>Pourquoi c'est trompeur<\/th><th>Correction<\/th><\/tr><\/thead><tbody><tr><td>L'axe des barres ne commence pas à 0<\/td><td>exagère les écarts : une hausse de 2 % semble énorme<\/td><td>toujours partir de 0 sur des barres ; signaler toute échelle tronquée<\/td><\/tr><tr><td>Graphique en 3D<\/td><td>déforme les proportions : le segment à l'avant paraît plus grand<\/td><td>toujours en 2D ; la 3D n'apporte aucune information<\/td><\/tr><tr><td>Trop de couleurs<\/td><td>l'auditoire ne sait pas où regarder<\/td><td>du gris pour le fond, une couleur d'accent pour ce qui compte<\/td><\/tr><tr><td>Double axe v
