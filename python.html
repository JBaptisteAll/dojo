<style>
/* Idée de mise en page : un carnet de cours clair à gauche (sommaire numéroté comme des invites >>>),
   une colonne de lecture étroite, et des consoles sombres où l'on écrit du vrai Python. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --ink:#131a30; --muted:#566080; --line:#d7dbe8;
  --accent:#2747d9; --accent-ink:#ffffff; --mark:#ffd43b; --ok:#147a4b; --ok-bg:#e3f5ec; --bad:#b9302a; --bad-bg:#fbe9e7;
  --code-bg:#0e1325; --code-ink:#e8ebf5; --code-line:#262f4d; --code-muted:#8a94b8;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
  --bar:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e1c; --surface:#131a30; --ink:#e8ebf5; --muted:#9aa4c4; --line:#27304f;
    --accent:#8ea2ff; --accent-ink:#0a0e1c; --ok:#5fd39a; --ok-bg:#10301f; --bad:#ff8f86; --bad-bg:#3a1614;
    --code-bg:#070a15; --code-line:#1d2540; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e1c; --surface:#131a30; --ink:#e8ebf5; --muted:#9aa4c4; --line:#27304f;
  --accent:#8ea2ff; --accent-ink:#0a0e1c; --ok:#5fd39a; --ok-bg:#10301f; --bad:#ff8f86; --bad-bg:#3a1614;
  --code-bg:#070a15; --code-line:#1d2540; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--bar) + 12px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
code,pre,.mono{font-family:var(--mono)}

/* barre du haut */
.top{position:sticky;top:0;z-index:30;height:var(--bar);display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:18px;white-space:nowrap}
.brand .pr{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:15px}
.burger{display:none;border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;font-size:14px}
.gauge{flex:1;display:flex;align-items:center;gap:10px;min-width:0;justify-content:flex-end}
.gauge .track{flex:0 1 220px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.gauge .fill{height:100%;background:var(--mark);width:0;transition:width .3s}
.gauge .num{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.status{font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mark)}
.status[data-s="ready"]::before{background:var(--ok)}
.status[data-s="fail"]::before{background:var(--bad)}
.status[data-s="load"]::before,.status[data-s="run"]::before,.status[data-s="pkg"]::before{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.status::before{animation:none!important}.gauge .fill{transition:none}}

/* structure */
.shell{display:grid;grid-template-columns:310px minmax(0,1fr)}
.side{position:sticky;top:var(--bar);align-self:start;height:calc(100vh - var(--bar));height:calc(100dvh - var(--bar));overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:14px 10px 30px}
.side .links{display:flex;gap:6px;margin:0 6px 12px}
.side .links a{flex:1;text-align:center;text-decoration:none;font-size:14px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.side .links a.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.side details{border-top:1px solid var(--line)}
.side summary{list-style:none;display:flex;gap:10px;align-items:baseline;padding:10px 6px;cursor:pointer;font-weight:700;font-size:15px;line-height:1.3}
.side summary::-webkit-details-marker{display:none}
.side summary .n{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600;flex:none}
.side summary .c{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;flex:none;font-variant-numeric:tabular-nums}
.side summary .c.full{color:var(--ok)}
.side ol{list-style:none;margin:0 0 10px;padding:0}
.side ol a{display:flex;gap:8px;align-items:baseline;padding:5px 8px 5px 34px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:14.5px;line-height:1.35;position:relative}
.side ol a:hover{background:var(--bg)}
.side ol a.on{background:var(--bg);font-weight:700;box-shadow:inset 3px 0 0 var(--mark)}
.side ol a::before{content:"";position:absolute;left:14px;top:.72em;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.side ol a.done::before{background:var(--ok);border-color:var(--ok)}
.side ol a.part::before{background:linear-gradient(90deg,var(--mark) 50%,transparent 50%);border-color:var(--muted)}
.side .reset{margin:18px 6px 0;font-size:13px;background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px}
main{min-width:0;padding:34px 24px 90px}
.col{max-width:760px;margin:0 auto}

/* typographie de leçon */
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.12;margin:0}
h1{font-size:clamp(30px,5vw,44px);font-weight:800;letter-spacing:-.02em}
h2{font-size:26px;font-weight:700;margin-top:44px}
h3{font-size:20px;font-weight:700;margin:34px 0 8px}
.crumb{font-family:var(--mono);font-size:13px;color:var(--accent);margin:0 0 10px}
.prose p{margin:14px 0}
.prose ul,.prose ol{padding-left:24px;margin:12px 0}
.prose li{margin:5px 0}
.prose code,.exo code,.note code,.warn code{background:color-mix(in srgb,var(--mark) 28%,transparent);padding:1px 5px;border-radius:4px;font-size:.88em;white-space:nowrap}
pre.static{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);padding:12px 14px;border-radius:6px;overflow-x:auto;font-size:14px;line-height:1.5;margin:14px 0}
.note,.warn{margin:18px 0;padding:12px 16px;border-radius:8px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent)}
.warn{border-left-color:var(--bad)}
.note .lab,.warn .lab{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.warn .lab{color:var(--bad)}
.note p,.warn p{margin:4px 0 0}
.tw{overflow-x:auto;margin:16px 0}
table{border-collapse:collapse;font-size:15px;min-width:60%}
th,td{border-bottom:1px solid var(--line);padding:7px 12px;text-align:left;vertical-align:top}
th{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

/* consoles */
.runner,.exo{margin:20px 0}
.console{border-radius:10px;overflow:hidden;background:var(--code-bg);border:1px solid var(--code-line)}
.console .bar{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 14px;border-bottom:1px solid var(--code-line);color:var(--code-muted);font-family:var(--mono);font-size:12px}
.console .bar .sp{flex:1}
.console .CodeMirror{height:auto;background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:14.5px;line-height:1.55}
.console .CodeMirror-scroll{min-height:44px;max-height:520px}
.console .CodeMirror-gutters{background:var(--code-bg);border-right:1px solid var(--code-line)}
.console .CodeMirror-linenumber{color:#55608a}
.console .CodeMirror-cursor{border-left:2px solid #fff}
.console .CodeMirror-selected{background:#2a3970}
.console .CodeMirror-focused .CodeMirror-selected{background:#32448a}
.console .cm-keyword{color:#ff9e6e}.console .cm-string{color:#b9e27f}.console .cm-number{color:#ffd43b}
.console .cm-comment{color:#8490b8;font-style:italic}.console .cm-builtin{color:#7fd4ff}.console .cm-def{color:#ffd43b}
.console .cm-operator{color:#c9d0ee}.console .cm-variable,.console .cm-variable-2,.console .cm-property{color:var(--code-ink)}.console .cm-meta{color:#d7a6ff}
.console textarea.plain{display:block;width:100%;min-height:120px;background:var(--code-bg);color:var(--code-ink);border:0;padding:12px;font-family:var(--mono);font-size:14.5px;line-height:1.55;resize:vertical}
.console .ro .CodeMirror-cursor{display:none}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 12px;font-size:14px;font-weight:700}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.console .btn{background:transparent;border-color:#3a456e;color:var(--code-ink);font-family:var(--body);font-size:13px;padding:5px 11px}
.console .btn:hover{border-color:#8a94b8}
.console .btn.go{background:var(--mark);border-color:var(--mark);color:#131a30}
.console .btn.check{background:#8ea2ff;border-color:#8ea2ff;color:#0a0e1c}
.stdin{border-top:1px solid var(--code-line);padding:8px 14px;display:flex;flex-direction:column;gap:4px}
.stdin label{font-family:var(--mono);font-size:12px;color:var(--code-muted)}
.stdin textarea{background:#161d36;color:var(--code-ink);border:1px solid var(--code-line);border-radius:6px;font-family:var(--mono);font-size:14px;padding:6px 8px;resize:vertical;min-height:38px}
.result{border-top:1px solid var(--code-line);padding:10px 14px;font-family:var(--mono);font-size:14px;color:var(--code-ink)}
.result:empty{display:none}
.result .lab{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--code-muted);margin-bottom:4px}
.result pre{margin:0;white-space:pre-wrap;word-break:break-word;line-height:1.5;max-height:340px;overflow:auto}
.result .quiet{color:var(--code-muted);margin:0;font-family:var(--body);font-size:14px}
.result .err{margin-top:8px;border-left:3px solid #ff8f86;padding:2px 0 2px 12px}
.result .err .t{color:#ff8f86;font-weight:600}
.result .err .src{color:#ffd43b;margin:4px 0;white-space:pre-wrap}
.result .err .help{font-family:var(--body);color:#c9d0ee;margin:6px 0 0;font-size:14.5px}
.verdict{margin:10px 0 0;padding:10px 14px;border-radius:8px;font-family:var(--body);font-size:15.5px;white-space:pre-wrap}
.verdict.ok{background:var(--ok-bg);color:var(--ok);font-weight:700}
.verdict.ko{background:var(--bad-bg);color:var(--bad)}
.verdict pre{font-size:13.5px;margin:6px 0 0;white-space:pre-wrap}

/* exercices */
.exo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;margin:28px 0}
.exo .eh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.exo .tag{font-family:var(--mono);font-size:12px;font-weight:600;background:var(--mark);color:#131a30;padding:2px 8px;border-radius:4px;white-space:nowrap}
.exo .tag.q{background:var(--accent);color:var(--accent-ink)}
.exo h4{font-family:var(--display);font-size:19px;margin:0;flex:1;min-width:10ch}
.exo .ok{font-family:var(--mono);font-size:12px;color:var(--ok);display:none}
.exo.done .ok{display:inline}
.exo.done{border-color:var(--ok)}
.exo .st p{margin:10px 0}
.exo .st ul,.exo .st ol{padding-left:22px}
.exo .more{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.exo .hint,.exo .sol{margin-top:12px}
.exo .hint{border-left:4px solid var(--mark);padding:2px 0 2px 12px}
.exo .hint p{margin:4px 0}
.exo .ans{width:100%;min-height:70px;font-family:var(--mono);font-size:14.5px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:10px;resize:vertical}
.exo .lbl{font-size:14px;color:var(--muted);margin:12px 0 0;display:block}

/* accueil */
.hero{display:grid;gap:22px;margin-bottom:10px}
.hero h1{font-size:clamp(40px,8vw,76px);letter-spacing:-.035em;line-height:.98}
.hero h1 .pr{font-family:var(--mono);font-weight:600;font-size:.42em;color:var(--accent);display:block;letter-spacing:0;margin-bottom:10px}
.hero h1 mark{background:linear-gradient(transparent 62%,var(--mark) 62%);color:inherit}
.hero .lead{font-size:20px;max-width:58ch;margin:0;color:var(--ink)}
.cta{display:inline-block;background:var(--ink);color:var(--surface);text-decoration:none;font-weight:700;padding:12px 20px;border-radius:9px;font-size:17px}
.cta:hover{background:var(--accent);color:var(--accent-ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--mono);font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none}
.facts b{color:var(--ink)}
.path{list-style:none;margin:16px 0 0;padding:0;border-top:2px solid var(--ink)}
.path li{border-bottom:1px solid var(--line)}
.path a{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:6px 14px;align-items:baseline;padding:14px 4px;text-decoration:none;color:var(--ink)}
.path a:hover{background:var(--surface)}
.path .n{font-family:var(--mono);color:var(--accent);font-size:14px;font-weight:600}
.path .t{font-family:var(--display);font-weight:700;font-size:20px}
.path .d{grid-column:2;color:var(--muted);font-size:15px;margin:0}
.path .p{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.path .p.full{color:var(--ok)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:16px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.how b{font-family:var(--mono);font-size:13px;color:var(--accent);display:block;margin-bottom:4px}
.how p{margin:0;font-size:15.5px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:50px;border-top:2px solid var(--ink);padding-top:18px;flex-wrap:wrap}
.pager a{text-decoration:none;color:var(--ink);max-width:48%}
.pager a small{display:block;font-family:var(--mono);font-size:12px;color:var(--muted)}
.pager a span{font-family:var(--display);font-weight:700;font-size:18px}
.pager a:hover span{color:var(--accent)}
.pager .nx{text-align:right;margin-left:auto}
.console .tabs{display:flex;gap:2px;flex-wrap:wrap}
.console .tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--code-muted);font-family:var(--mono);font-size:12.5px;padding:6px 10px;border-radius:0}
.console .tab[aria-selected="true"]{color:var(--code-ink);border-bottom-color:var(--mark)}
.result img{display:block;max-width:100%;height:auto;background:#fff;border-radius:6px;margin:8px 0}
.side .links{flex-wrap:wrap}
.side .links a{flex:1 1 40%}
.side .links a b{font-family:var(--mono);font-size:12px;background:var(--mark);color:#131a30;border-radius:99px;padding:0 6px;margin-left:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:18px 0}
.panel p{margin:6px 0}
.timer{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.timer.late{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.from{font-size:14px;color:var(--muted);margin:6px 0 0}
.search{display:block;width:calc(100% - 12px);margin:0 6px 12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14.5px}
.sres a{display:block;padding:7px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:14.5px;line-height:1.35}
.sres a:hover{background:var(--bg)}
.sres a small{display:block;color:var(--muted);font-size:12.5px}
.sres p{margin:8px;color:var(--muted);font-size:14px}
.side details.later summary,.side details.later ol{opacity:.5}
.side ol a.bil{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
.side ol a.bil::before{border-radius:2px}
.path li.later{opacity:.55}
.badge{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:8px;color:var(--muted);white-space:nowrap;vertical-align:middle}
.badge.p{background:var(--mark);border-color:var(--mark);color:#131a30}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.choice .btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.qcm{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 18px;margin:16px 0}
.qcm legend{font-weight:700;padding:0 6px}
.qcm label{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:6px;cursor:pointer}
.qcm label:hover{background:var(--bg)}
.qcm label.good{background:var(--ok-bg);color:var(--ok);font-weight:700}
.qcm label.bad{background:var(--bad-bg);color:var(--bad)}
.qcm pre{margin:8px 0}
.gloss dt{font-family:var(--display);font-weight:700;font-size:18px;margin-top:18px}
.gloss dd{margin:2px 0 0}
.gloss dd a{font-size:14px}
.save textarea{width:100%;min-height:64px;font-family:var(--mono);font-size:12px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin:6px 0;resize:vertical}
.scrim{display:none}
/* compte et synchronisation */
.acct{font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);text-decoration:none;white-space:nowrap}
.acct:hover{border-color:var(--ink);color:var(--ink)}
.acct[data-s="on"]{color:var(--ok);border-color:var(--ok)}
.acct[data-s="err"]{color:var(--bad);border-color:var(--bad)}
.account form{display:grid;gap:4px;max-width:400px}
.account label{font-size:14px;color:var(--muted);margin-top:10px}
.account input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.account .row{margin-top:16px}
.account .msg{min-height:1.6em;margin:12px 0 0}
.account .msg.ko{color:var(--bad)}
.account .msg.ok{color:var(--ok)}
/* playbook : rappels SQL et checklist */
pre.sql{border-left-color:var(--accent)}
pre.sql::before{content:"Rappel SQL";display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.checks .cbar{position:sticky;top:calc(var(--bar) + 8px);z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.checks .track{flex:1 1 140px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.checks .fill{height:100%;width:0;background:var(--ok);transition:width .3s}
.checks .num{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.phase{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px 10px 10px;margin:16px 0;min-width:0}
.phase legend{font-family:var(--display);font-weight:700;font-size:18px;padding:0 8px}
.phase label{display:flex;gap:12px;align-items:flex-start;padding:8px;border-radius:8px;cursor:pointer}
.phase label:hover{background:var(--bg)}
.phase input{flex:none;width:18px;height:18px;margin:4px 0 0;accent-color:var(--ok)}
.phase small{display:block;color:var(--muted);font-size:14.5px}
.phase small code{background:color-mix(in srgb,var(--mark) 28%,transparent);padding:1px 5px;border-radius:4px;font-size:.88em}
.phase input:checked+span strong{color:var(--ok)}
@media (prefers-reduced-motion:reduce){.checks .fill{transition:none}}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .burger{display:block}
  .side{position:fixed;left:0;top:var(--bar);width:min(320px,88vw);z-index:25;transform:translateX(-102%);transition:transform .2s}
  body.nav .side{transform:none}
  body.nav .scrim{display:block;position:fixed;inset:var(--bar) 0 0 0;background:rgba(0,0,0,.4);z-index:20}
  main{padding:24px 16px 80px}
  .gauge .track{display:none}
  .brand .long{display:none}
}
@media (max-width:480px){.status .txt{display:none}.status{padding:6px}}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>

</header>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script>
const COURSE=[{"id": "premiers-pas", "title": "Premiers pas", "desc": "Afficher, calculer, ranger des valeurs dans des variables et lire un message d'erreur.", "lessons": [{"id": "premier-programme", "title": "Ton premier programme", "blocks": [{"t": "html", "h": "<p>Un <strong>programme<\/strong> est une liste d'instructions que l'ordinateur exécute une par une, de haut en bas, sans jamais en sauter. <strong>Python<\/strong> est un langage qui permet d'écrire ces instructions avec des mots proches de l'anglais. Il est utilisé pour l'analyse de données, les sites web, l'automatisation, l'intelligence artificielle.<\/p><p>Dans ce cours, tu n'as rien à installer. Chaque cadre sombre est un vrai éditeur Python. Clique sur <strong>Exécuter<\/strong> et le résultat apparaît en dessous.<\/p>"}, {"t": "code", "c": "print(\"Bonjour !\")\nprint(\"Je suis ton premier programme.\")", "err": false}, {"t": "html", "h": "<p>Décortiquons la première ligne :<\/p><ul><li><code>print<\/code> est une <strong>fonction<\/strong> : une commande prête à l'emploi. Celle-ci affiche quelque chose à l'écran.<\/li><li>Les <strong>parenthèses<\/strong> contiennent ce que l'on donne à la fonction. Elles sont obligatoires.<\/li><li>Les <strong>guillemets<\/strong> entourent du texte. En programmation, un texte s'appelle une <strong>chaîne de caractères<\/strong>.<\/li><\/ul><p>Sans guillemets, Python ne voit plus un texte mais un calcul à faire. Compare les deux lignes ci-dessous, puis modifie les nombres.<\/p>"}, {"t": "code", "c": "print(\"3 + 4\")\nprint(3 + 4)", "err": false}, {"t": "html", "h": "<p><code>print<\/code> accepte plusieurs valeurs séparées par des virgules. Il les affiche sur la même ligne, séparées par un espace.<\/p>"}, {"t": "code", "c": "print(\"Il y a\", 7, \"jours dans une semaine\")", "err": false}, {"t": "html", "h": "<h3>Les commentaires<\/h3><p>Tout ce qui suit un <code>#<\/code> sur une ligne est ignoré par Python. C'est un <strong>commentaire<\/strong> : une note pour les humains qui liront le code, toi y compris dans trois mois.<\/p>"}, {"t": "code", "c": "# Cette ligne ne fait rien\nprint(\"Cette ligne s'affiche\")  # un commentaire peut suivre une instruction", "err": false}, {"t": "html", "h": "<div class=\"note\"><span class=\"lab\">À retenir<\/span><p>Modifie tous les exemples. Change un mot, enlève une parenthèse, regarde ce qui se passe. On apprend à programmer en tapant du code, pas en le lisant.<\/p><\/div>"}, {"t": "exo", "id": "premier-programme-1", "title": "Trois lignes", "h": "<p>Écris un programme qui affiche exactement ces trois lignes :<\/p><pre class=\"static\">Bonjour\nJe m'appelle Python\nJe suis né en 1991<\/pre>", "starter": "# Écris tes trois instructions print ici", "solution": "print(\"Bonjour\")\nprint(\"Je m'appelle Python\")\nprint(\"Je suis né en 1991\")", "tests": "sortie_attendue(\"Bonjour\\nJe m'appelle Python\\nJe suis né en 1991\")\n", "hint": "<p>Une instruction <code>print(\"...\")<\/code> par ligne. Utilise des guillemets doubles <code>\"<\/code> : l'apostrophe de <code>m'appelle<\/code> ne posera alors aucun problème.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "premier-programme-2", "title": "Dans le bon ordre", "h": "<p>Les instructions s'exécutent de haut en bas. Remets ce programme dans l'ordre pour qu'il affiche les étapes 1, 2, 3.<\/p>", "starter": "print(\"3. Je pars\")\nprint(\"1. Je me lève\")\nprint(\"2. Je m'habille\")", "solution": "print(\"1. Je me lève\")\nprint(\"2. Je m'habille\")\nprint(\"3. Je pars\")", "tests": "sortie_attendue(\"1. Je me lève\\n2. Je m'habille\\n3. Je pars\")\n", "hint": "<p>Python exécute les lignes de haut en bas : déplace les trois <code>print<\/code> pour que la ligne qui commence par 1 soit la première.<\/p>", "stdin": "", "skel": ""}, {"t": "quiz", "id": "premier-programme-3", "title": "Texte ou calcul ?", "h": "", "code": "print(\"2 + 2\")\nprint(2 + 2)\nprint(\"2\", \"+\", \"2\")", "expected": "2 + 2\n4\n2 + 2"}]}, {"id": "lire-une-erreur", "title": "Lire un message d'erreur", "blocks": [{"t": "html", "h": "<p>Tu vas faire des erreurs, beaucoup, et c'est normal : tous les programmeurs en font chaque jour. La différence entre un débutant et un expert, c'est que l'expert <strong>lit le message d'erreur<\/strong>. Python te dit presque toujours où est le problème et de quel type il est.<\/p><p>Exécute ce programme, qui contient une faute :<\/p>"}, {"t": "code", "c": "print(\"Tout va bien\")\nprnt(\"Oups\")", "err": true}, {"t": "html", "h": "<p>Le message contient trois informations :<\/p><ul><li><strong>la ligne<\/strong> où Python s'est arrêté (ici la ligne 2) ;<\/li><li><strong>le type<\/strong> d'erreur (<code>NameError<\/code> : un nom inconnu) ;<\/li><li><strong>une explication<\/strong> en anglais (<code>name 'prnt' is not defined<\/code> : le nom prnt n'est pas défini).<\/li><\/ul><p>Remarque que la ligne 1 s'est bien exécutée. Python avance ligne par ligne et s'arrête à la première erreur.<\/p><h3>Les deux erreurs les plus fréquentes au début<\/h3><p><code>SyntaxError<\/code> : Python n'arrive pas à lire ta ligne, comme une phrase sans verbe. Il manque souvent une parenthèse ou un guillemet. Dans ce cas, rien ne s'exécute du tout.<\/p>"}, {"t": "code", "c": "print(\"Bonjour\"", "err": true}, {"t": "html", "h": "<p><code>NameError<\/code> : tu utilises un nom que Python ne connaît pas. C'est souvent une faute de frappe, ou des guillemets oubliés autour d'un texte.<\/p>"}, {"t": "code", "c": "print(Bonjour)", "err": true}, {"t": "html", "h": "<div class=\"warn\"><span class=\"lab\">Attention<\/span><p>Python distingue les majuscules des minuscules : <code>Print<\/code> et <code>print<\/code> sont deux noms différents. Seul le second existe.<\/p><\/div><p>Il existe un troisième type de problème, plus sournois : le programme s'exécute sans message, mais le résultat est faux. On appelle cela une <strong>erreur de logique<\/strong>. Tu apprendras à les traquer plus tard dans le cours.<\/p>"}, {"t": "exo", "id": "lire-une-erreur-1", "title": "Répare le programme", "h": "<p>Ce programme contient <strong>trois<\/strong> erreurs. Exécute-le, lis le message, corrige, puis recommence jusqu'à obtenir :<\/p><pre class=\"static\">Étape 1 : allumer l'ordinateur\nÉtape 2 : ouvrir l'éditeur\nÉtape 3 : écrire du code<\/pre>", "starter": "print(\"Étape 1 : allumer l'ordinateur\"\nprnt(\"Étape 2 : ouvrir l'éditeur\")\nprint(Étape 3 : écrire du code)", "solution": "print(\"Étape 1 : allumer l'ordinateur\")\nprint(\"Étape 2 : ouvrir l'éditeur\")\nprint(\"Étape 3 : écrire du code\")", "tests": "sortie_attendue(\"Étape 1 : allumer l'ordinateur\\nÉtape 2 : ouvrir l'éditeur\\nÉtape 3 : écrire du code\")\n", "hint": "<p>Une parenthèse fermante manque à la ligne 1, le nom de la fonction est mal écrit à la ligne 2, et les guillemets manquent à la ligne 3.<\/p>", "stdin": "", "skel": ""}]}, {"id": "variables", "title": "Les variables", "blocks": [{"t": "html", "h": "<p>Un programme a besoin de retenir des informations : un prénom, un prix, un score. Pour cela, on utilise des <strong>variables<\/strong>. Une variable est une étiquette collée sur une valeur.<\/p>"}, {"t": "code", "c": "prenom = \"Lina\"\nage = 30\nprint(prenom)\nprint(age)", "err": false}, {"t": "html", "h": "<p>Le signe <code>=<\/code> ne veut pas dire « est égal à » comme en maths. Il veut dire : <strong>calcule ce qui est à droite, puis range le résultat sous le nom de gauche<\/strong>. On parle d'<strong>affectation<\/strong>.<\/p><p>Remarque la différence : <code>print(prenom)<\/code> affiche la valeur rangée dans la variable, alors que <code>print(\"prenom\")<\/code> afficherait le mot prenom.<\/p><h3>Une variable peut changer<\/h3><p>On peut ranger une nouvelle valeur sous le même nom. L'ancienne est oubliée.<\/p>"}, {"t": "code", "c": "score = 10\nprint(score)\nscore = 25\nprint(score)\nscore = score + 5\nprint(score)", "err": false}, {"t": "html", "h": "<p>La ligne <code>score = score + 5<\/code> choque en maths, mais elle est logique ici : Python calcule d'abord la droite (25 + 5), puis range 30 dans <code>score<\/code>. Cette opération est si courante qu'il existe un raccourci : <code>score += 5<\/code>.<\/p><h3>Bien nommer ses variables<\/h3><ul><li>lettres, chiffres et tiret bas <code>_<\/code> seulement, sans espace ;<\/li><li>le nom ne commence pas par un chiffre ;<\/li><li>par convention, tout en minuscules avec des <code>_<\/code> entre les mots : <code>prix_total<\/code>, <code>nombre_de_clients<\/code> ;<\/li><li>un nom qui dit ce que contient la variable : <code>age<\/code> plutôt que <code>a<\/code>.<\/li><\/ul><div class=\"note\"><span class=\"lab\">À retenir<\/span><p>Un bon nom de variable rend le commentaire inutile. <code>prix_ttc = prix_ht * 1.2<\/code> se lit tout seul.<\/p><\/div>"}, {"t": "exo", "id": "variables-1", "title": "Deux variables", "h": "<p>Crée une variable <code>ville<\/code> qui contient le texte <code>Annecy<\/code> et une variable <code>habitants<\/code> qui contient le nombre <code>131000<\/code>. Affiche ensuite la ville, puis le nombre d'habitants, sur deux lignes.<\/p>", "starter": "# Crée tes deux variables, puis affiche-les", "solution": "ville = \"Annecy\"\nhabitants = 131000\nprint(ville)\nprint(habitants)", "tests": "assert ville == \"Annecy\", \"La variable ville doit contenir le texte Annecy (avec des guillemets).\"\nassert habitants == 131000, \"La variable habitants doit contenir le nombre 131000, sans guillemets.\"\nsortie_attendue(\"Annecy\\n131000\")", "hint": "<p>Un texte s'écrit entre guillemets, un nombre sans guillemets : <code>ville = \"Annecy\"<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "variables-2", "title": "L'échange", "h": "<p>Les variables <code>a<\/code> et <code>b<\/code> contiennent 5 et 9. Ajoute du code à l'endroit indiqué pour <strong>échanger<\/strong> leurs valeurs, sans réécrire les nombres 5 et 9. À la fin, <code>a<\/code> doit valoir 9 et <code>b<\/code> doit valoir 5.<\/p>", "starter": "a = 5\nb = 9\n# Échange les valeurs de a et b ici\n\nprint(a)\nprint(b)", "solution": "a = 5\nb = 9\ntemporaire = a\na = b\nb = temporaire\n\nprint(a)\nprint(b)", "tests": "import re\nassert a == 9 and b == 5, \"À la fin, a doit valoir 9 et b doit valoir 5. Pour l'instant a = %r et b = %r.\" % (a, b)\nassert len(re.findall(r'\\b[59]\\b', __code__)) <= 2, \"N'écris pas les nombres 5 et 9 une seconde fois : sers-toi des variables.\"\nns = rejoue(\"a = 5\", \"a = 100\")\nassert ns[\"a\"] == 9 and ns[\"b\"] == 100, \"Ton échange doit fonctionner quelles que soient les valeurs de départ.\"", "hint": "<p>Si tu écris <code>a = b<\/code> tout de suite, l'ancienne valeur de <code>a<\/code> est perdue. Mets-la d'abord de côté dans une troisième variable.<\/p>", "stdin": "", "skel": ""}, {"t": "quiz", "id": "variables-3", "title": "Qui vaut quoi ?", "h": "", "code": "x = 10\ny = x\nx = x + 5\nprint(x)\nprint(y)", "expected": "15\n10"}]}, {"id": "nombres-et-textes", "title": "Nombres et textes", "blocks": [{"t": "html", "h": "<p>Chaque valeur a un <strong>type<\/strong>, qui détermine ce qu'on peut faire avec. Les trois premiers à connaître :<\/p><div class=\"tw\"><table><thead><tr><th>Type<\/th><th>Nom en Python<\/th><th>Exemples<\/th><\/tr><\/thead><tbody><tr><td>nombre entier<\/td><td><code>int<\/code><\/td><td><code>7<\/code>, <code>-3<\/code>, <code>2025<\/code><\/td><\/tr><tr><td>nombre à virgule<\/td><td><code>float<\/code><\/td><td><code>3.14<\/code>, <code>-0.5<\/code>, <code>2.0<\/code><\/td><\/tr><tr><td>texte (chaîne)<\/td><td><code>str<\/code><\/td><td><code>\"Bonjour\"<\/code>, <code>\"42\"<\/code><\/td><\/tr><\/tbody><\/table><\/div><p>La virgule s'écrit avec un <strong>point<\/strong>, à l'anglaise. La fonction <code>type()<\/code> donne le type d'une valeur.<\/p>"}, {"t": "code", "c": "print(type(7))\nprint(type(3.14))\nprint(type(\"Bonjour\"))\nprint(type(\"42\"))", "err": false}, {"t": "html", "h": "<p>Regarde bien la dernière ligne : <code>\"42\"<\/code> entre guillemets est un texte, pas un nombre.<\/p><h3>Calculer<\/h3><div class=\"tw\"><table><thead><tr><th>Opérateur<\/th><th>Rôle<\/th><th>Exemple<\/th><th>Résultat<\/th><\/tr><\/thead><tbody><tr><td><code>+<\/code> <code>-<\/code> <code>*<\/code><\/td><td>addition, soustraction, multiplication<\/td><td><code>3 * 4<\/code><\/td><td><code>12<\/code><\/td><\/tr><tr><td><code>/<\/code><\/td><td>division<\/td><td><code>7 / 2<\/code><\/td><td><code>3.5<\/code><\/td><\/tr><tr><td><code>//<\/code><\/td><td>division entière (quotient)<\/td><td><code>7 // 2<\/code><\/td><td><code>3<\/code><\/td><\/tr><tr><td><code>%<\/code><\/td><td>reste de la division (modulo)<\/td><td><code>7 % 2<\/code><\/td><td><code>1<\/code><\/td><\/tr><tr><td><code>**<\/code><\/td><td>puissance<\/td><td><code>2 ** 3<\/code><\/td><td><code>8<\/code><\/td><\/tr><\/tbody><\/table><\/div><p>Les priorités sont celles des maths : puissances, puis multiplications et divisions, puis additions. Les parenthèses forcent l'ordre.<\/p>"}, {"t": "code", "c": "print(2 + 3 * 4)\nprint((2 + 3) * 4)\nprint(10 / 2)\nprint(17 // 5, 17 % 5)", "err": false}, {"t": "html", "h": "<p>Deux remarques. <code>10 / 2<\/code> donne <code>5.0<\/code> : la division <code>/<\/code> produit toujours un <code>float<\/code>. Et le duo <code>//<\/code> et <code>%<\/code> sert sans arrêt : 17 objets rangés par boîtes de 5, cela fait <code>17 // 5<\/code> = 3 boîtes pleines et <code>17 % 5<\/code> = 2 objets restants. Le modulo permet aussi de savoir si un nombre est pair : <code>n % 2<\/code> vaut 0 pour un nombre pair.<\/p><h3>Opérations sur les textes<\/h3><p>Avec des textes, <code>+<\/code> colle bout à bout (on dit <strong>concaténer<\/strong>) et <code>*<\/code> répète.<\/p>"}, {"t": "code", "c": "prenom = \"Ada\"\nprint(\"Bonjour \" + prenom)\nprint(\"ha\" * 3)\nprint(len(prenom))", "err": false}, {"t": "html", "h": "<p><code>len()<\/code> donne la longueur d'un texte. En revanche, on ne peut pas additionner un texte et un nombre : Python refuse de deviner ce que tu veux.<\/p>"}, {"t": "code", "c": "age = 30\nprint(\"J'ai \" + age + \" ans\")", "err": true}, {"t": "html", "h": "<p>Tu verras dans la leçon suivante comment résoudre ce <code>TypeError<\/code>.<\/p>"}, {"t": "exo", "id": "nombres-et-textes-1", "title": "Heures et minutes", "h": "<p>Un film dure 200 minutes. Calcule le nombre d'heures entières dans la variable <code>heures<\/code> et les minutes restantes dans la variable <code>minutes_restantes<\/code>, en utilisant <code>//<\/code> et <code>%<\/code>.<\/p>", "starter": "duree = 200\n# Calcule heures et minutes_restantes à partir de duree\n\nprint(heures, minutes_restantes)", "solution": "duree = 200\nheures = duree // 60\nminutes_restantes = duree % 60\n\nprint(heures, minutes_restantes)", "tests": "assert heures == 3 and minutes_restantes == 20, \"200 minutes font 3 heures et 20 minutes. Tu obtiens %r et %r.\" % (heures, minutes_restantes)\nns = rejoue(\"duree = 200\", \"duree = 135\")\nassert ns[\"heures\"] == 2 and ns[\"minutes_restantes\"] == 15, \"Ton calcul doit partir de la variable duree : avec duree = 135, on attend 2 et 15.\"", "hint": "<p>Une heure contient 60 minutes. <code>duree // 60<\/code> donne le nombre d'heures entières, <code>duree % 60<\/code> donne ce qui reste.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "nombres-et-textes-2", "title": "Prix TTC", "h": "<p>Un article coûte 80 € hors taxes. La TVA est de 20 %. Calcule le prix toutes taxes comprises dans une variable <code>prix_ttc<\/code>.<\/p>", "starter": "prix_ht = 80\ntaux_tva = 20\n# Calcule prix_ttc\n\nprint(prix_ttc)", "solution": "prix_ht = 80\ntaux_tva = 20\nprix_ttc = prix_ht + prix_ht * taux_tva / 100\n\nprint(prix_ttc)", "tests": "assert abs(prix_ttc - 96) < 1e-6, \"80 € + 20 %% de 80 € = 96 €. Tu obtiens %r.\" % prix_ttc\nns = rejoue(\"prix_ht = 80\", \"prix_ht = 50\")\nassert abs(ns[\"prix_ttc\"] - 60) < 1e-6, \"Ton calcul doit utiliser la variable prix_ht : avec 50 €, on attend 60 €.\"", "hint": "<p>Le montant de la TVA vaut <code>prix_ht * taux_tva / 100<\/code>. Ajoute-le au prix hors taxes.<\/p>", "stdin": "", "skel": ""}, {"t": "quiz", "id": "nombres-et-textes-3", "title": "Cinq opérateurs", "h": "", "code": "print(7 // 2)\nprint(7 % 2)\nprint(7 / 2)\nprint(2 ** 3)\nprint(\"ab\" * 2 + \"c\")", "expected": "3\n1\n3.5\n8\nababc"}]}, {"id": "convertir-et-demander", "title": "Convertir et poser une question", "blocks": [{"t": "html", "h": "<h3>Changer de type<\/h3><p>Trois fonctions transforment une valeur d'un type vers un autre : <code>int()<\/code>, <code>float()<\/code> et <code>str()<\/code>.<\/p>"}, {"t": "code", "c": "print(int(\"42\") + 1)\nprint(float(\"3.5\") * 2)\nprint(\"J'ai \" + str(30) + \" ans\")\nprint(int(7.9))", "err": false}, {"t": "html", "h": "<p>La dernière ligne montre que <code>int()<\/code> appliqué à un <code>float<\/code> <strong>coupe<\/strong> la partie décimale, sans arrondir. Et une conversion impossible provoque une <code>ValueError<\/code> :<\/p>"}, {"t": "code", "c": "print(int(\"douze\"))", "err": true}, {"t": "html", "h": "<h3>Demander une valeur avec input<\/h3><p>La fonction <code>input()<\/code> met le programme en pause, attend que la personne tape quelque chose, puis renvoie ce texte.<\/p><p>Sur cette page, il n'y a pas de clavier « en direct » : tu écris à l'avance les réponses dans la zone <strong>Saisies<\/strong>, une ligne par appel à <code>input()<\/code>. Change le prénom dans la zone, puis exécute.<\/p>"}, {"t": "code", "c": "prenom = input(\"Quel est ton prénom ? \")\nprint(\"Bonjour\", prenom)", "err": false, "stdin": "Lina"}, {"t": "html", "h": "<div class=\"warn\"><span class=\"lab\">Attention<\/span><p><code>input()<\/code> renvoie <strong>toujours un texte<\/strong>, même si la personne tape des chiffres. Pour calculer, il faut convertir avec <code>int()<\/code> ou <code>float()<\/code>.<\/p><\/div>"}, {"t": "code", "c": "annee = int(input(\"Année de naissance ? \"))\nprint(\"Âge en 2030 :\", 2030 - annee)", "err": false, "stdin": "1990"}, {"t": "html", "h": "<p>Lis <code>int(input(...))<\/code> de l'intérieur vers l'extérieur : <code>input<\/code> récupère le texte <code>\"1990\"<\/code>, puis <code>int<\/code> le transforme en nombre <code>1990<\/code>.<\/p>"}, {"t": "exo", "id": "convertir-et-demander-1", "title": "Le double", "h": "<p>Écris un programme qui demande un nombre entier avec <code>input()<\/code> et affiche son double. Le double doit être seul sur la dernière ligne affichée.<\/p>", "starter": "# Demande un nombre, puis affiche son double", "solution": "nombre = int(input(\"Un nombre ? \"))\nprint(nombre * 2)", "tests": "assert lignes(__run__(\"21\"))[-1] == \"42\", \"Avec la saisie 21, la dernière ligne doit être 42.\"\nassert lignes(__run__(\"5\"))[-1] == \"10\", \"Avec la saisie 5, la dernière ligne doit être 10. Si tu obtiens 55, tu as oublié de convertir le texte en nombre.\"", "hint": "<p><code>input()<\/code> renvoie un texte. <code>\"5\" * 2<\/code> donne <code>\"55\"<\/code>. Convertis avec <code>int(...)<\/code> avant de multiplier.<\/p>", "stdin": "21", "skel": ""}, {"t": "exo", "id": "convertir-et-demander-2", "title": "Le ticket de caisse", "h": "<p>Demande d'abord un prix (nombre à virgule), puis une quantité (nombre entier). Affiche le total, seul sur la dernière ligne. Exemple : avec <code>2.5<\/code> puis <code>4<\/code>, le programme affiche <code>10.0<\/code>.<\/p>", "starter": "# Deux input : le prix, puis la quantité", "solution": "prix = float(input(\"Prix ? \"))\nquantite = int(input(\"Quantité ? \"))\nprint(prix * quantite)", "tests": "assert lignes(__run__(\"2.5\\n4\"))[-1] == \"10.0\", \"Avec 2.5 puis 4, la dernière ligne doit être 10.0.\"\nassert lignes(__run__(\"1.5\\n3\"))[-1] == \"4.5\", \"Avec 1.5 puis 3, la dernière ligne doit être 4.5.\"", "hint": "<p><code>float(input(...))<\/code> pour le prix, <code>int(input(...))<\/code> pour la quantité.<\/p>", "stdin": "2.5\n4", "skel": ""}]}, {"id": "f-strings", "title": "Afficher proprement avec les f-strings", "blocks": [{"t": "html", "h": "<p>Coller des morceaux de texte avec <code>+<\/code> et <code>str()<\/code> devient vite illisible. Python propose mieux : la <strong>f-string<\/strong>. On met un <code>f<\/code> juste avant les guillemets, et tout ce qui est entre accolades <code>{}<\/code> est remplacé par sa valeur.<\/p>"}, {"t": "code", "c": "prenom = \"Ada\"\nage = 36\nprint(f\"{prenom} a {age} ans.\")\nprint(f\"Dans 10 ans, {prenom} aura {age + 10} ans.\")", "err": false}, {"t": "html", "h": "<p>Entre les accolades, tu peux mettre une variable ou n'importe quel calcul.<\/p><h3>Choisir le nombre de décimales<\/h3><p>Après la valeur, <code>:.2f<\/code> demande un affichage avec 2 chiffres après la virgule. Très utile pour les prix.<\/p>"}, {"t": "code", "c": "prix = 19.9\nprint(f\"Prix : {prix} €\")\nprint(f\"Prix : {prix:.2f} €\")\nprint(f\"Tiers : {1 / 3:.3f}\")", "err": false}, {"t": "html", "h": "<p>La fonction <code>round(valeur, n)<\/code> arrondit réellement le nombre à <code>n<\/code> décimales, alors que <code>:.2f<\/code> ne change que l'affichage.<\/p>"}, {"t": "code", "c": "print(round(3.14159, 2))\nprint(round(2.7))", "err": false}, {"t": "html", "h": "<h3>Deux options de print<\/h3><p>Par défaut, <code>print<\/code> sépare les valeurs par un espace et termine par un retour à la ligne. Les options <code>sep<\/code> et <code>end<\/code> changent cela.<\/p>"}, {"t": "code", "c": "print(\"2025\", \"01\", \"15\", sep=\"-\")\nprint(\"Chargement\", end=\"...\")\nprint(\"terminé\")", "err": false}, {"t": "exo", "id": "f-strings-1", "title": "La phrase complète", "h": "<p>Avec une f-string, affiche exactement : <code>Noé a 8 ans et aura 9 ans l'an prochain.<\/code> Les nombres doivent venir de la variable <code>age<\/code>, pas être tapés à la main.<\/p>", "starter": "prenom = \"Noé\"\nage = 8\n# Affiche la phrase avec une f-string", "solution": "prenom = \"Noé\"\nage = 8\nprint(f\"{prenom} a {age} ans et aura {age + 1} ans l'an prochain.\")", "tests": "sortie_attendue(\"Noé a 8 ans et aura 9 ans l'an prochain.\")\nns = rejoue(\"age = 8\", \"age = 40\")\nsortie_attendue(\"Noé a 40 ans et aura 41 ans l'an prochain.\", ns[\"__out__\"])", "hint": "<p><code>{age + 1}<\/code> : on peut écrire un calcul entre les accolades.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "f-strings-2", "title": "Le total en euros", "h": "<p>Affiche le total de la commande sous la forme <code>Total : 59.70 €<\/code>, avec toujours deux décimales.<\/p>", "starter": "prix = 19.9\nquantite = 3\n# Calcule le total et affiche-le", "solution": "prix = 19.9\nquantite = 3\ntotal = prix * quantite\nprint(f\"Total : {total:.2f} €\")", "tests": "sortie_attendue(\"Total : 59.70 €\")\nns = rejoue(\"quantite = 3\", \"quantite = 10\")\nsortie_attendue(\"Total : 199.00 €\", ns[\"__out__\"])", "hint": "<p>Dans la f-string, écris <code>{total:.2f}<\/code> pour forcer deux décimales.<\/p>", "stdin": "", "skel": ""}]}]}, {"id": "decider", "title": "Décider", "desc": "Comparer des valeurs et exécuter du code seulement dans certains cas.", "lessons": [{"id": "vrai-ou-faux", "title": "Vrai ou faux", "blocks": [{"t": "html", "h": "<p>Jusqu'ici, tes programmes faisaient toujours la même chose. Pour qu'un programme prenne des décisions, il doit d'abord savoir répondre à une question par oui ou par non. Python a un type pour cela : le <strong>booléen<\/strong> (<code>bool<\/code>), qui n'a que deux valeurs, <code>True<\/code> (vrai) et <code>False<\/code> (faux), avec une majuscule.<\/p><p>Une <strong>comparaison<\/strong> produit un booléen.<\/p><div class=\"tw\"><table><thead><tr><th>Opérateur<\/th><th>Signification<\/th><\/tr><\/thead><tbody><tr><td><code>==<\/code><\/td><td>est égal à<\/td><\/tr><tr><td><code>!=<\/code><\/td><td>est différent de<\/td><\/tr><tr><td><code>&lt;<\/code> <code>&gt;<\/code><\/td><td>plus petit, plus grand<\/td><\/tr><tr><td><code>&lt;=<\/code> <code>&gt;=<\/code><\/td><td>plus petit ou égal, plus grand ou égal<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "code", "c": "age = 20\nprint(age >= 18)\nprint(age == 21)\nprint(age != 21)\nprint(\"chat\" == \"Chat\")", "err": false}, {"t": "html", "h": "<div class=\"warn\"><span class=\"lab\">Attention<\/span><p><code>=<\/code> range une valeur dans une variable. <code>==<\/code> pose la question « est-ce égal ? ». Les confondre est l'erreur la plus classique du débutant.<\/p><\/div><h3>Combiner : and, or, not<\/h3><ul><li><code>a and b<\/code> est vrai si <strong>les deux<\/strong> sont vrais ;<\/li><li><code>a or b<\/code> est vrai si <strong>au moins un<\/strong> est vrai ;<\/li><li><code>not a<\/code> inverse : vrai devient faux.<\/li><\/ul>"}, {"t": "code", "c": "age = 20\na_un_billet = False\nprint(age >= 18 and a_un_billet)\nprint(age >= 18 or a_un_billet)\nprint(not a_un_billet)", "err": false}, {"t": "html", "h": "<p>Python permet aussi d'enchaîner les comparaisons comme en maths : <code>0 &lt;= note &lt;= 20<\/code> est vrai si la note est entre 0 et 20 inclus.<\/p>"}, {"t": "exo", "id": "vrai-ou-faux-1", "title": "Beau temps", "h": "<p>Crée une variable <code>beau_temps<\/code> qui vaut <code>True<\/code> s'il ne pleut pas <strong>et<\/strong> que la température est comprise entre 18 et 30 degrés inclus, et <code>False<\/code> sinon. N'écris pas <code>True<\/code> ou <code>False<\/code> toi-même : c'est la comparaison qui doit produire la valeur.<\/p>", "starter": "temperature = 22\npluie = False\n# Crée la variable beau_temps\n\nprint(beau_temps)", "solution": "temperature = 22\npluie = False\nbeau_temps = not pluie and 18 <= temperature <= 30\n\nprint(beau_temps)", "tests": "assert beau_temps is True, \"Avec 22 degrés et pas de pluie, beau_temps doit valoir True.\"\nfor t, attendu in [(35, False), (18, True), (30, True), (17, False)]:\n    ns = rejoue(\"temperature = 22\", \"temperature = %d\" % t)\n    assert ns[\"beau_temps\"] is attendu, \"Avec %d degrés sans pluie, on attend %s.\" % (t, attendu)\nns = rejoue(\"pluie = False\", \"pluie = True\")\nassert ns[\"beau_temps\"] is False, \"S'il pleut, beau_temps doit valoir False.\"", "hint": "<p>Trois conditions à réunir avec <code>and<\/code> : <code>not pluie<\/code>, <code>temperature &gt;= 18<\/code>, <code>temperature &lt;= 30<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "quiz", "id": "vrai-ou-faux-2", "title": "Six comparaisons", "h": "", "code": "n = 7\nprint(n > 5 and n < 10)\nprint(n == 7 or n == 8)\nprint(not n == 7)\nprint(n % 2 == 0)\nprint(3 <= n <= 7)\nprint(\"a\" != \"A\")", "expected": "True\nTrue\nFalse\nFalse\nTrue\nTrue"}]}, {"id": "if-elif-else", "title": "if, elif, else", "blocks": [{"t": "html", "h": "<p>L'instruction <code>if<\/code> (« si ») exécute un bloc de code <strong>seulement si<\/strong> une condition est vraie.<\/p>"}, {"t": "code", "c": "age = 20\nif age >= 18:\n    print(\"Tu es majeur.\")\n    print(\"Tu peux voter.\")\nprint(\"Fin du programme.\")", "err": false}, {"t": "html", "h": "<p>Change <code>age<\/code> à 15 et relance : les deux lignes décalées ne s'affichent plus, la dernière s'affiche toujours.<\/p><p>Deux règles de syntaxe, valables partout en Python :<\/p><ul><li>la ligne du <code>if<\/code> se termine par <strong>deux-points<\/strong> <code>:<\/code> ;<\/li><li>les lignes qui dépendent du <code>if<\/code> sont <strong>décalées de 4 espaces<\/strong> vers la droite. Ce décalage s'appelle l'<strong>indentation<\/strong>. C'est lui, et lui seul, qui dit à Python où le bloc commence et où il finit.<\/li><\/ul><h3>Sinon : else<\/h3><p><code>else<\/code> (« sinon ») donne le bloc à exécuter quand la condition est fausse.<\/p>"}, {"t": "code", "c": "solde = 40\nprix = 55\nif solde >= prix:\n    print(\"Achat validé\")\nelse:\n    print(\"Solde insuffisant\")", "err": false}, {"t": "html", "h": "<h3>Plusieurs cas : elif<\/h3><p><code>elif<\/code> (contraction de « else if ») ajoute des cas intermédiaires. Python teste les conditions <strong>dans l'ordre<\/strong> et exécute <strong>uniquement le premier bloc<\/strong> dont la condition est vraie.<\/p>"}, {"t": "code", "c": "heure = 14\nif heure < 12:\n    print(\"Bonjour\")\nelif heure < 18:\n    print(\"Bon après-midi\")\nelse:\n    print(\"Bonsoir\")", "err": false}, {"t": "html", "h": "<div class=\"note\"><span class=\"lab\">À retenir<\/span><p>Comme Python s'arrête à la première condition vraie, l'ordre des tests compte. Commence par le cas le plus restrictif.<\/p><\/div>"}, {"t": "exo", "id": "if-elif-else-1", "title": "Admis ou recalé", "h": "<p>Affiche <code>Admis<\/code> si la note est supérieure ou égale à 10, et <code>Recalé<\/code> sinon.<\/p>", "starter": "note = 14\n# Affiche Admis ou Recalé", "solution": "note = 14\nif note >= 10:\n    print(\"Admis\")\nelse:\n    print(\"Recalé\")", "tests": "sortie_attendue(\"Admis\")\nfor n, attendu in [(9, \"Recalé\"), (10, \"Admis\"), (0, \"Recalé\")]:\n    sortie_attendue(attendu, rejoue(\"note = 14\", \"note = %d\" % n)[\"__out__\"])", "hint": "<p>N'oublie ni les deux-points après la condition et après <code>else<\/code>, ni les 4 espaces devant chaque <code>print<\/code>.<\/p>", "stdin": "", "skel": "note = 14\nif ...:\n    ...\nelse:\n    ..."}, {"t": "exo", "id": "if-elif-else-2", "title": "La mention", "h": "<p>Affiche la mention qui correspond à la note : <code>Insuffisant<\/code> en dessous de 10, <code>Passable<\/code> de 10 à moins de 12, <code>Assez bien<\/code> de 12 à moins de 14, <code>Bien<\/code> de 14 à moins de 16, <code>Très bien<\/code> à partir de 16.<\/p>", "starter": "note = 13\n# Affiche la mention", "solution": "note = 13\nif note < 10:\n    print(\"Insuffisant\")\nelif note < 12:\n    print(\"Passable\")\nelif note < 14:\n    print(\"Assez bien\")\nelif note < 16:\n    print(\"Bien\")\nelse:\n    print(\"Très bien\")", "tests": "sortie_attendue(\"Assez bien\")\nfor n, attendu in [(4, \"Insuffisant\"), (10, \"Passable\"), (11.5, \"Passable\"), (12, \"Assez bien\"), (14, \"Bien\"), (15.9, \"Bien\"), (16, \"Très bien\"), (20, \"Très bien\")]:\n    sortie_attendue(attendu, rejoue(\"note = 13\", \"note = %s\" % n)[\"__out__\"])", "hint": "<p>Avec <code>elif<\/code>, chaque test sait déjà que les précédents ont échoué. Après <code>if note &lt; 10<\/code>, il suffit d'écrire <code>elif note &lt; 12<\/code>.<\/p>", "stdin": "", "skel": "note = 13\nif ...:\n    ...\nelif ...:\n    ...\nelif ...:\n    ...\nelif ...:\n    ...\nelse:\n    ..."}, {"t": "quiz", "id": "if-elif-else-3", "title": "Le piège de l'ordre", "h": "", "code": "n = 15\nif n > 5:\n    print(\"A\")\nelif n > 10:\n    print(\"B\")\nelse:\n    print(\"C\")\nprint(\"fin\")", "expected": "A\nfin"}]}, {"id": "conditions-combinees", "title": "Combiner et imbriquer les conditions", "blocks": [{"t": "html", "h": "<h3>Un if dans un if<\/h3><p>Un bloc <code>if<\/code> peut contenir un autre <code>if<\/code>. On dit qu'ils sont <strong>imbriqués<\/strong>. Chaque niveau ajoute 4 espaces d'indentation.<\/p>"}, {"t": "code", "c": "age = 25\na_le_permis = True\nif age >= 18:\n    if a_le_permis:\n        print(\"Tu peux louer une voiture.\")\n    else:\n        print(\"Passe d'abord le permis.\")\nelse:\n    print(\"Tu es trop jeune.\")", "err": false}, {"t": "html", "h": "<p>Quand deux conditions doivent être vraies en même temps, <code>and<\/code> est souvent plus lisible qu'une imbrication : <code>if age &gt;= 18 and a_le_permis:<\/code>.<\/p><h3>L'opérateur in<\/h3><p><code>in<\/code> teste si un texte en contient un autre. Il renvoie un booléen.<\/p>"}, {"t": "code", "c": "email = \"ada@exemple.fr\"\nif \"@\" in email:\n    print(\"Adresse plausible\")\nif \"gmail\" not in email:\n    print(\"Ce n'est pas une adresse Gmail\")", "err": false}, {"t": "html", "h": "<h3>Ranger une décision dans une variable<\/h3><p>Une condition peut servir à calculer une valeur plutôt qu'à afficher un message. C'est le cas le plus fréquent dans un vrai programme.<\/p>"}, {"t": "code", "c": "total = 120\nif total >= 100:\n    remise = 10\nelse:\n    remise = 0\nprint(f\"À payer : {total - remise} €\")", "err": false}, {"t": "exo", "id": "conditions-combinees-1", "title": "Année bissextile", "h": "<p>Une année est bissextile si elle est divisible par 4, sauf les années divisibles par 100, qui ne le sont que si elles sont aussi divisibles par 400. Ainsi 2024 et 2000 sont bissextiles, 1900 et 2023 ne le sont pas. Affiche <code>bissextile<\/code> ou <code>non bissextile<\/code>.<\/p>", "starter": "annee = 2024\n# Affiche bissextile ou non bissextile", "solution": "annee = 2024\nif annee % 400 == 0:\n    print(\"bissextile\")\nelif annee % 100 == 0:\n    print(\"non bissextile\")\nelif annee % 4 == 0:\n    print(\"bissextile\")\nelse:\n    print(\"non bissextile\")", "tests": "sortie_attendue(\"bissextile\")\nfor a, attendu in [(2000, \"bissextile\"), (1900, \"non bissextile\"), (2023, \"non bissextile\"), (2028, \"bissextile\"), (2100, \"non bissextile\")]:\n    sortie_attendue(attendu, rejoue(\"annee = 2024\", \"annee = %d\" % a)[\"__out__\"])", "hint": "<p>« Divisible par 4 » s'écrit <code>annee % 4 == 0<\/code>. Teste d'abord le cas le plus précis (divisible par 400), puis par 100, puis par 4.<\/p>", "stdin": "", "skel": "annee = 2024\nif ...:\n    ...\nelif ...:\n    ...\nelif ...:\n    ...\nelse:\n    ..."}, {"t": "exo", "id": "conditions-combinees-2", "title": "Le tarif du cinéma", "h": "<p>Calcule le prix de la place dans une variable <code>prix<\/code>, selon ces règles lues dans l'ordre : moins de 12 ans, 5 € ; étudiant ou moins de 26 ans, 8 € ; 65 ans et plus, 7 € ; tous les autres, 11 €.<\/p>", "starter": "age = 30\netudiant = False\n# Calcule la variable prix\n\nprint(prix)", "solution": "age = 30\netudiant = False\nif age < 12:\n    prix = 5\nelif etudiant or age < 26:\n    prix = 8\nelif age >= 65:\n    prix = 7\nelse:\n    prix = 11\n\nprint(prix)", "tests": "assert prix == 11, \"À 30 ans sans être étudiant, la place coûte 11 €.\"\nfor a, attendu in [(8, 5), (12, 8), (25, 8), (26, 11), (64, 11), (65, 7), (80, 7)]:\n    assert rejoue(\"age = 30\", \"age = %d\" % a)[\"prix\"] == attendu, \"À %d ans (non étudiant), on attend %d €.\" % (a, attendu)\nassert rejoue(\"etudiant = False\", \"etudiant = True\")[\"prix\"] == 8, \"Un étudiant de 30 ans paie 8 €.\"", "hint": "<p>Une chaîne <code>if / elif / elif / else<\/code>. La deuxième condition combine deux cas avec <code>or<\/code>.<\/p>", "stdin": "", "skel": "age = 30\netudiant = False\nif ...:\n    ...\nelif ...:\n    ...\nelif ...:\n    ...\nelse:\n    ...\n\nprint(prix)"}]}]}, {"id": "repeter", "title": "Répéter", "desc": "Les boucles while et for, et les trois gestes de base : compter, additionner, chercher.", "lessons": [{"id": "boucle-while", "title": "La boucle while", "blocks": [{"t": "html", "h": "<p>Un ordinateur excelle à répéter. La boucle <code>while<\/code> (« tant que ») répète un bloc <strong>tant qu'une condition reste vraie<\/strong>.<\/p>"}, {"t": "code", "c": "compteur = 1\nwhile compteur <= 5:\n    print(\"Tour numéro\", compteur)\n    compteur += 1\nprint(\"Terminé\")", "err": false}, {"t": "html", "h": "<p>Voici ce que fait Python, pas à pas :<\/p><ol><li>il teste la condition <code>compteur &lt;= 5<\/code> ;<\/li><li>si elle est vraie, il exécute le bloc indenté, puis <strong>revient à l'étape 1<\/strong> ;<\/li><li>si elle est fausse, il saute le bloc et continue après.<\/li><\/ol><p>La ligne <code>compteur += 1<\/code> est vitale. Sans elle, <code>compteur<\/code> vaudrait toujours 1, la condition serait toujours vraie et la boucle ne s'arrêterait jamais : c'est une <strong>boucle infinie<\/strong>.<\/p><div class=\"warn\"><span class=\"lab\">Attention<\/span><p>Si tu crées une boucle infinie ici, pas de panique : la page arrête ton programme au bout de quelques secondes, et le bouton Exécuter se transforme en bouton Arrêter.<\/p><\/div><p><code>while<\/code> est la bonne boucle quand on ne sait pas à l'avance combien de tours il faudra.<\/p>"}, {"t": "code", "c": "# Combien de fois faut-il plier une feuille de 0,1 mm pour dépasser 1 mètre ?\nepaisseur = 0.1\npliages = 0\nwhile epaisseur < 1000:\n    epaisseur = epaisseur * 2\n    pliages += 1\nprint(pliages, \"pliages\")", "err": false}, {"t": "exo", "id": "boucle-while-1", "title": "Compte à rebours", "h": "<p>Avec une boucle <code>while<\/code>, affiche les nombres de 5 à 1, un par ligne, puis <code>Décollage !<\/code>.<\/p>", "starter": "# Ta boucle while ici", "solution": "n = 5\nwhile n >= 1:\n    print(n)\n    n -= 1\nprint(\"Décollage !\")", "tests": "assert \"while\" in __code__, \"Utilise une boucle while.\"\nassert __code__.count(\"print\") <= 3, \"Laisse la boucle répéter le print à ta place.\"\nsortie_attendue(\"5\\n4\\n3\\n2\\n1\\nDécollage !\")", "hint": "<p>Pars de <code>n = 5<\/code>, continue tant que <code>n &gt;= 1<\/code>, et enlève 1 à chaque tour avec <code>n -= 1<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "boucle-while-2", "title": "Doubler son épargne", "h": "<p>Tu places 1000 € à 5 % d'intérêts par an : chaque année, le capital est multiplié par 1.05. Combien d'années faut-il pour que le capital dépasse 2000 € ? Range la réponse dans la variable <code>annees<\/code>.<\/p>", "starter": "capital = 1000\nannees = 0\n# Fais grossir le capital année après année\n\nprint(annees)", "solution": "capital = 1000\nannees = 0\nwhile capital <= 2000:\n    capital = capital * 1.05\n    annees += 1\n\nprint(annees)", "tests": "assert \"while\" in __code__, \"Utilise une boucle while.\"\nassert annees == 15, \"Il faut 15 ans. Tu obtiens %r.\" % annees\nassert rejoue(\"capital = 1000\", \"capital = 1900\")[\"annees\"] == 2, \"En partant de 1900 €, il faut 2 ans.\"", "hint": "<p>Tant que <code>capital &lt;= 2000<\/code> : multiplie le capital par 1.05 et ajoute 1 à <code>annees<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "quiz", "id": "boucle-while-3", "title": "Trois tours", "h": "", "code": "n = 1\nwhile n < 20:\n    n = n * 3\nprint(n)", "expected": "27"}]}, {"id": "boucle-for", "title": "La boucle for et range", "blocks": [{"t": "html", "h": "<p>Quand on sait combien de fois répéter, ou que l'on veut passer en revue une série d'éléments, on utilise la boucle <code>for<\/code> (« pour chaque »).<\/p>"}, {"t": "code", "c": "for i in range(5):\n    print(\"Tour\", i)", "err": false}, {"t": "html", "h": "<p><code>range(5)<\/code> produit les nombres 0, 1, 2, 3, 4. À chaque tour, la variable <code>i<\/code> prend le nombre suivant. Deux surprises à retenir : on <strong>commence à 0<\/strong>, et le nombre entre parenthèses est <strong>exclu<\/strong>.<\/p><p><code>range<\/code> accepte jusqu'à trois valeurs : <code>range(début, fin, pas)<\/code>.<\/p>"}, {"t": "code", "c": "for i in range(1, 6):\n    print(i, end=\" \")\nprint()\nfor i in range(0, 20, 5):\n    print(i, end=\" \")\nprint()\nfor i in range(10, 0, -2):\n    print(i, end=\" \")", "err": false}, {"t": "html", "h": "<h3>Parcourir un texte<\/h3><p><code>for<\/code> sait aussi parcourir un texte, caractère par caractère.<\/p>"}, {"t": "code", "c": "for lettre in \"Python\":\n    print(lettre)", "err": false}, {"t": "html", "h": "<p>Le nom de la variable de boucle est libre : <code>i<\/code>, <code>lettre<\/code>, <code>numero<\/code>. Choisis un nom qui dit ce qu'elle contient.<\/p><div class=\"note\"><span class=\"lab\">À retenir<\/span><p><code>for<\/code> quand tu connais la série à parcourir, <code>while<\/code> quand tu attends qu'une condition change.<\/p><\/div>"}, {"t": "exo", "id": "boucle-for-1", "title": "Table de 7", "h": "<p>Affiche la table de multiplication de 7, de <code>7 x 1 = 7<\/code> jusqu'à <code>7 x 10 = 70<\/code>, une ligne par calcul.<\/p>", "starter": "# Une boucle for et une f-string suffisent", "solution": "for i in range(1, 11):\n    print(f\"7 x {i} = {7 * i}\")", "tests": "assert \"for\" in __code__, \"Utilise une boucle for.\"\nsortie_attendue(\"\\n\".join(\"7 x %d = %d\" % (i, 7 * i) for i in range(1, 11)))", "hint": "<p><code>range(1, 11)<\/code> produit les nombres de 1 à 10. Dans la boucle : <code>print(f\"7 x {i} = {7 * i}\")<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "boucle-for-2", "title": "Les nombres pairs", "h": "<p>Affiche tous les nombres pairs de 2 à 20 inclus, un par ligne.<\/p>", "starter": "# Ta boucle ici", "solution": "for n in range(2, 21, 2):\n    print(n)", "tests": "assert __code__.count(\"print\") <= 2, \"Utilise une boucle plutôt que dix print.\"\nsortie_attendue(\"\\n\".join(str(n) for n in range(2, 21, 2)))", "hint": "<p>Le troisième nombre de <code>range<\/code> est le pas : <code>range(2, 21, 2)<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "quiz", "id": "boucle-for-3", "title": "Début, fin, pas", "h": "", "code": "for i in range(1, 10, 3):\n    print(i)\nprint(\"dernier :\", i)", "expected": "1\n4\n7\ndernier : 7"}]}, {"id": "compter-additionner-chercher", "title": "Compter, additionner, chercher", "blocks": [{"t": "html", "h": "<p>Presque tous les programmes qui traitent des données reposent sur trois gestes. Ils ont la même structure en trois temps : <strong>préparer<\/strong> une variable avant la boucle, la <strong>mettre à jour<\/strong> dans la boucle, l'<strong>utiliser<\/strong> après la boucle.<\/p><h3>1. Compter<\/h3>"}, {"t": "code", "c": "phrase = \"les sanglots longs des violons\"\nnombre_de_s = 0\nfor lettre in phrase:\n    if lettre == \"s\":\n        nombre_de_s += 1\nprint(nombre_de_s)", "err": false}, {"t": "html", "h": "<h3>2. Additionner<\/h3>"}, {"t": "code", "c": "total = 0\nfor n in range(1, 11):\n    total += n\nprint(total)", "err": false}, {"t": "html", "h": "<h3>3. Chercher le plus grand<\/h3><p>On part du principe que le premier candidat est le meilleur, puis on le remplace chaque fois qu'on trouve mieux.<\/p>"}, {"t": "code", "c": "texte = \"programmation\"\nplus_grande = \"a\"\nfor lettre in texte:\n    if lettre > plus_grande:\n        plus_grande = lettre\nprint(plus_grande)", "err": false}, {"t": "html", "h": "<p>On peut comparer des lettres : l'ordre est l'ordre alphabétique.<\/p><div class=\"warn\"><span class=\"lab\">Attention<\/span><p>L'erreur classique consiste à préparer la variable <strong>dans<\/strong> la boucle : elle est alors remise à zéro à chaque tour. La préparation se fait toujours avant.<\/p><\/div>"}, {"t": "exo", "id": "compter-additionner-chercher-1", "title": "La somme de 1 à 100", "h": "<p>Calcule dans la variable <code>total<\/code> la somme de tous les entiers de 1 à 100 inclus, avec une boucle.<\/p>", "starter": "total = 0\n# Additionne les nombres de 1 à 100\n\nprint(total)", "solution": "total = 0\nfor n in range(1, 101):\n    total += n\n\nprint(total)", "tests": "assert \"for\" in __code__ or \"while\" in __code__, \"Utilise une boucle.\"\nassert total == 5050, \"La somme attendue est 5050. Tu obtiens %r. Vérifie les bornes de range.\" % total", "hint": "<p><code>range(1, 101)<\/code> va de 1 à 100 : la borne de fin est exclue.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "compter-additionner-chercher-2", "title": "Compter les voyelles", "h": "<p>Compte le nombre de voyelles (a, e, i, o, u, y) de la phrase dans la variable <code>nb_voyelles<\/code>.<\/p>", "starter": "phrase = \"la programmation est un jeu\"\nnb_voyelles = 0\n# Parcours la phrase et compte\n\nprint(nb_voyelles)", "solution": "phrase = \"la programmation est un jeu\"\nnb_voyelles = 0\nfor lettre in phrase:\n    if lettre in \"aeiouy\":\n        nb_voyelles += 1\n\nprint(nb_voyelles)", "tests": "assert nb_voyelles == 10, \"Cette phrase contient 10 voyelles. Tu en comptes %r.\" % nb_voyelles\nassert rejoue('phrase = \"la programmation est un jeu\"', 'phrase = \"python\"')[\"nb_voyelles\"] == 2, \"Ton code doit fonctionner pour n'importe quelle phrase : « python » contient 2 voyelles (y et o).\"", "hint": "<p><code>if lettre in \"aeiouy\":<\/code> teste si la lettre fait partie des voyelles.<\/p>", "stdin": "", "skel": "phrase = \"la programmation est un jeu\"\nnb_voyelles = 0\nfor lettre in phrase:\n    if ...:\n        ...\n\nprint(nb_voyelles)"}, {"t": "exo", "id": "compter-additionner-chercher-3", "title": "La factorielle", "h": "<p>La factorielle de 6 vaut 1 × 2 × 3 × 4 × 5 × 6 = 720. Calcule la factorielle de <code>n<\/code> dans la variable <code>resultat<\/code>.<\/p>", "starter": "n = 6\n# Calcule resultat\n\nprint(resultat)", "solution": "n = 6\nresultat = 1\nfor i in range(1, n + 1):\n    resultat *= i\n\nprint(resultat)", "tests": "assert resultat == 720, \"La factorielle de 6 vaut 720. Tu obtiens %r.\" % resultat\nassert rejoue(\"n = 6\", \"n = 10\")[\"resultat\"] == 3628800, \"Avec n = 10, on attend 3628800.\"\nassert rejoue(\"n = 6\", \"n = 1\")[\"resultat\"] == 1, \"Avec n = 1, on attend 1.\"", "hint": "<p>C'est le geste « additionner », avec une multiplication. Attention au point de départ : pour multiplier, on prépare la variable à 1, pas à 0.<\/p>", "stdin": "", "skel": ""}]}, {"id": "break-continue-imbrication", "title": "break, continue et boucles imbriquées", "blocks": [{"t": "html", "h": "<h3>Sortir plus tôt : break<\/h3><p><code>break<\/code> arrête immédiatement la boucle, même s'il restait des tours.<\/p>"}, {"t": "code", "c": "for n in range(1, 100):\n    if n * n > 200:\n        print(\"Premier nombre dont le carré dépasse 200 :\", n)\n        break", "err": false}, {"t": "html", "h": "<h3>Passer au tour suivant : continue<\/h3><p><code>continue<\/code> abandonne le tour en cours et passe directement au suivant.<\/p>"}, {"t": "code", "c": "for n in range(1, 8):\n    if n % 3 == 0:\n        continue\n    print(n, end=\" \")", "err": false}, {"t": "html", "h": "<h3>Une boucle dans une boucle<\/h3><p>Pour chaque tour de la boucle extérieure, la boucle intérieure fait <strong>tous<\/strong> ses tours. Pense à une horloge : pour chaque heure, les minutes font un tour complet.<\/p>"}, {"t": "code", "c": "for ligne in range(1, 4):\n    for colonne in range(1, 4):\n        print(ligne * colonne, end=\"\\t\")\n    print()", "err": false}, {"t": "html", "h": "<p>Le <code>print()<\/code> vide, aligné avec le <code>for<\/code> intérieur, sert à revenir à la ligne après chaque rangée. <code>\"\\t\"<\/code> est une tabulation.<\/p>"}, {"t": "exo", "id": "break-continue-imbrication-1", "title": "Le premier multiple", "h": "<p>Trouve le premier multiple de 7 strictement supérieur à 100 et range-le dans la variable <code>trouve<\/code>. Utilise une boucle et <code>break<\/code>.<\/p>", "starter": "trouve = None\n# Cherche à partir de 101\n\nprint(trouve)", "solution": "trouve = None\nfor n in range(101, 200):\n    if n % 7 == 0:\n        trouve = n\n        break\n\nprint(trouve)", "tests": "assert trouve == 105, \"Le premier multiple de 7 après 100 est 105. Tu obtiens %r.\" % trouve\nassert \"for\" in __code__ or \"while\" in __code__, \"Utilise une boucle.\"", "hint": "<p>Parcours <code>range(101, 200)<\/code>. Dès que <code>n % 7 == 0<\/code>, range <code>n<\/code> dans <code>trouve<\/code> puis <code>break<\/code>.<\/p>", "stdin": "", "skel": "trouve = None\nfor n in range(101, 200):\n    if ...:\n        ...\n\nprint(trouve)"}, {"t": "exo", "id": "break-continue-imbrication-2", "title": "Le triangle", "h": "<p>Affiche un triangle d'étoiles de <code>hauteur<\/code> lignes : une étoile sur la première ligne, deux sur la deuxième, et ainsi de suite.<\/p><pre class=\"static\">*\n**\n***\n****\n*****<\/pre>", "starter": "hauteur = 5\n# Affiche le triangle", "solution": "hauteur = 5\nfor i in range(1, hauteur + 1):\n    print(\"*\" * i)", "tests": "sortie_attendue(\"\\n\".join(\"*\" * i for i in range(1, 6)))\nsortie_attendue(\"*\\n**\\n***\", rejoue(\"hauteur = 5\", \"hauteur = 3\")[\"__out__\"])", "hint": "<p>Souviens-toi que <code>\"*\" * 3<\/code> donne <code>***<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "break-continue-imbrication-3", "title": "FizzBuzz", "h": "<p>Un classique des entretiens d'embauche. Pour les nombres de 1 à 20 : affiche <code>Fizz<\/code> si le nombre est divisible par 3, <code>Buzz<\/code> s'il est divisible par 5, <code>FizzBuzz<\/code> s'il est divisible par les deux, et le nombre lui-même sinon.<\/p>", "starter": "# Les nombres de 1 à 20, un résultat par ligne", "solution": "for n in range(1, 21):\n    if n % 15 == 0:\n        print(\"FizzBuzz\")\n    elif n % 3 == 0:\n        print(\"Fizz\")\n    elif n % 5 == 0:\n        print(\"Buzz\")\n    else:\n        print(n)", "tests": "sortie_attendue(\"\\n\".join(\"FizzBuzz\" if n % 15 == 0 else \"Fizz\" if n % 3 == 0 else \"Buzz\" if n % 5 == 0 else str(n) for n in range(1, 21)))", "hint": "<p>L'ordre des tests compte : commence par le cas « divisible par 3 et par 5 », sinon il ne sera jamais atteint.<\/p>", "stdin": "", "skel": "for n in range(1, 21):\n    if ...:\n        ...\n    elif ...:\n        ...\n    elif ...:\n        ...\n    else:\n        ..."}, {"t": "quiz", "id": "break-continue-imbrication-4", "title": "Boucles imbriquées", "h": "", "code": "for i in range(1, 4):\n    for j in range(i):\n        print(i, end=\" \")\n    print()", "expected": "1\n2 2\n3 3 3"}]}]}, {"id": "textes", "title": "Les textes en détail", "desc": "Découper, nettoyer et transformer des chaînes de caractères.", "lessons": [{"id": "positions-et-tranches", "title": "Positions et tranches", "blocks": [{"t": "html", "h": "<p>Un texte est une suite de caractères rangés dans l'ordre. Chaque caractère a une <strong>position<\/strong>, appelée <strong>indice<\/strong>. Le premier indice est <strong>0<\/strong>, pas 1.<\/p><pre class=\"static\"> P   y   t   h   o   n\n 0   1   2   3   4   5\n-6  -5  -4  -3  -2  -1<\/pre><p>On accède à un caractère avec des crochets. Les indices négatifs comptent depuis la fin : <code>-1<\/code> est le dernier caractère.<\/p>"}, {"t": "code", "c": "mot = \"Python\"\nprint(mot[0])\nprint(mot[5])\nprint(mot[-1])\nprint(len(mot))", "err": false}, {"t": "html", "h": "<p>Le dernier indice vaut toujours <code>len(mot) - 1<\/code>. Demander une position qui n'existe pas provoque une <code>IndexError<\/code>.<\/p>"}, {"t": "code", "c": "mot = \"Python\"\nprint(mot[6])", "err": true}, {"t": "html", "h": "<h3>Les tranches<\/h3><p>Pour extraire un morceau, on écrit <code>texte[début:fin]<\/code>. Comme pour <code>range<\/code>, le début est inclus et la fin est <strong>exclue<\/strong>.<\/p>"}, {"t": "code", "c": "mot = \"Python\"\nprint(mot[0:2])\nprint(mot[2:])\nprint(mot[:3])\nprint(mot[-3:])\nprint(mot[::-1])", "err": false}, {"t": "html", "h": "<p>Si on omet le début, la tranche part du premier caractère. Si on omet la fin, elle va jusqu'au bout. <code>[::-1]<\/code> est une astuce à connaître : elle renvoie le texte à l'envers.<\/p><h3>Un texte ne se modifie pas<\/h3><p>On ne peut pas changer un caractère à l'intérieur d'un texte. On dit qu'une chaîne est <strong>immuable<\/strong>. Pour « modifier » un texte, on en construit un nouveau.<\/p>"}, {"t": "code", "c": "mot = \"Python\"\nnouveau = \"J\" + mot[1:]\nprint(nouveau)", "err": false}, {"t": "exo", "id": "positions-et-tranches-1", "title": "Les initiales", "h": "<p>À partir des variables <code>prenom<\/code> et <code>nom<\/code>, construis la variable <code>initiales<\/code> au format <code>M.C.<\/code> (première lettre du prénom, un point, première lettre du nom, un point).<\/p>", "starter": "prenom = \"Marie\"\nnom = \"Curie\"\n# Construis la variable initiales\n\nprint(initiales)", "solution": "prenom = \"Marie\"\nnom = \"Curie\"\ninitiales = prenom[0] + \".\" + nom[0] + \".\"\n\nprint(initiales)", "tests": "assert initiales == \"M.C.\", \"On attend M.C. et tu obtiens %r.\" % initiales\nassert rejoue('prenom = \"Marie\"', 'prenom = \"Pierre\"')[\"initiales\"] == \"P.C.\", \"Ton code doit partir des variables : avec Pierre Curie, on attend P.C.\"", "hint": "<p><code>prenom[0]<\/code> donne la première lettre. Colle les morceaux avec <code>+<\/code> ou utilise une f-string.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "positions-et-tranches-2", "title": "Découper une date", "h": "<p>La variable <code>date<\/code> contient une date au format <code>AAAA-MM-JJ<\/code>. Avec des tranches, extrais l'année, le mois et le jour dans trois variables <code>annee<\/code>, <code>mois<\/code> et <code>jour<\/code>, converties en <strong>nombres entiers<\/strong>.<\/p>", "starter": "date = \"2025-03-14\"\n# Crée annee, mois et jour\n\nprint(jour, mois, annee)", "solution": "date = \"2025-03-14\"\nannee = int(date[0:4])\nmois = int(date[5:7])\njour = int(date[8:10])\n\nprint(jour, mois, annee)", "tests": "assert (annee, mois, jour) == (2025, 3, 14), \"On attend les entiers 2025, 3 et 14. Tu obtiens %r, %r, %r.\" % (annee, mois, jour)\nassert type(mois) is int, \"mois doit être un entier : pense à int().\"\nns = rejoue('date = \"2025-03-14\"', 'date = \"1999-12-31\"')\nassert (ns[\"annee\"], ns[\"mois\"], ns[\"jour\"]) == (1999, 12, 31), \"Ton code doit fonctionner pour une autre date.\"", "hint": "<p>L'année occupe les positions 0 à 3 : <code>date[0:4]<\/code>. Le mois : <code>date[5:7]<\/code>. Le jour : <code>date[8:10]<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "quiz", "id": "positions-et-tranches-3", "title": "Tranches", "h": "", "code": "s = \"analyse\"\nprint(s[0], s[-1])\nprint(s[1:4])\nprint(s[:2] + s[-2:])\nprint(s[::-1])", "expected": "a e\nnal\nanse\nesylana"}]}, {"id": "methodes-de-texte", "title": "Les méthodes de texte", "blocks": [{"t": "html", "h": "<p>Une <strong>méthode<\/strong> est une fonction attachée à une valeur. On l'appelle avec un point : <code>valeur.methode()<\/code>. Les textes en possèdent des dizaines. Voici celles qui servent tous les jours.<\/p>"}, {"t": "code", "c": "texte = \"  Bonjour le Monde  \"\nprint(texte.upper())\nprint(texte.lower())\nprint(texte.strip())\nprint(texte.replace(\"Monde\", \"Python\"))\nprint(texte.strip().title())", "err": false}, {"t": "html", "h": "<div class=\"tw\"><table><thead><tr><th>Méthode<\/th><th>Rôle<\/th><\/tr><\/thead><tbody><tr><td><code>upper()<\/code>, <code>lower()<\/code>, <code>title()<\/code><\/td><td>majuscules, minuscules, majuscule à chaque mot<\/td><\/tr><tr><td><code>strip()<\/code><\/td><td>enlève les espaces au début et à la fin<\/td><\/tr><tr><td><code>replace(a, b)<\/code><\/td><td>remplace chaque <code>a<\/code> par <code>b<\/code><\/td><\/tr><tr><td><code>count(a)<\/code><\/td><td>compte les apparitions de <code>a<\/code><\/td><\/tr><tr><td><code>find(a)<\/code><\/td><td>position de la première apparition, ou <code>-1<\/code><\/td><\/tr><tr><td><code>startswith(a)<\/code>, <code>endswith(a)<\/code><\/td><td>vrai si le texte commence ou finit par <code>a<\/code><\/td><\/tr><tr><td><code>isdigit()<\/code><\/td><td>vrai si le texte ne contient que des chiffres<\/td><\/tr><\/tbody><\/table><\/div><div class=\"warn\"><span class=\"lab\">Attention<\/span><p>Une méthode de texte ne modifie jamais le texte d'origine : elle en <strong>renvoie un nouveau<\/strong>. Si tu ne ranges pas le résultat dans une variable, il est perdu.<\/p><\/div>"}, {"t": "code", "c": "prenom = \"ada\"\nprenom.upper()\nprint(prenom)\nprenom = prenom.upper()\nprint(prenom)", "err": false}, {"t": "html", "h": "<h3>Découper et recoller : split et join<\/h3><p><code>split<\/code> découpe un texte en une liste de morceaux. <code>join<\/code> fait l'inverse. Tu étudieras les listes dans le module suivant ; retiens déjà ces deux gestes.<\/p>"}, {"t": "code", "c": "phrase = \"le chat dort\"\nmots = phrase.split()\nprint(mots)\nprint(len(mots))\nprint(\"-\".join(mots))\nprint(\"2025-03-14\".split(\"-\"))", "err": false}, {"t": "html", "h": "<p>Sans argument, <code>split()<\/code> coupe aux espaces. Avec un argument, il coupe à chaque apparition de ce séparateur.<\/p>"}, {"t": "exo", "id": "methodes-de-texte-1", "title": "Nettoyer un nom", "h": "<p>Des noms saisis dans un formulaire arrivent mal formatés. Construis la variable <code>propre<\/code> : sans espaces autour, avec une majuscule au début de chaque mot.<\/p>", "starter": "brut = \"  jEAN dupont  \"\n# Construis la variable propre\n\nprint(propre)", "solution": "brut = \"  jEAN dupont  \"\npropre = brut.strip().title()\n\nprint(propre)", "tests": "assert propre == \"Jean Dupont\", \"On attend 'Jean Dupont' et tu obtiens %r.\" % propre\nassert rejoue('brut = \"  jEAN dupont  \"', 'brut = \" ADA lovelace\"')[\"propre\"] == \"Ada Lovelace\", \"Ton code doit fonctionner pour un autre nom.\"", "hint": "<p>Les méthodes s'enchaînent : <code>brut.strip().title()<\/code>.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "methodes-de-texte-2", "title": "Compter les mots", "h": "<p>Compte le nombre de mots de la phrase dans la variable <code>nb_mots<\/code>.<\/p>", "starter": "phrase = \"apprendre à programmer demande de la pratique\"\n# Calcule nb_mots\n\nprint(nb_mots)", "solution": "phrase = \"apprendre à programmer demande de la pratique\"\nnb_mots = len(phrase.split())\n\nprint(nb_mots)", "tests": "assert nb_mots == 7, \"Cette phrase contient 7 mots. Tu obtiens %r.\" % nb_mots\nassert rejoue('phrase = \"apprendre à programmer demande de la pratique\"', 'phrase = \"un deux trois\"')[\"nb_mots\"] == 3, \"Ton code doit fonctionner pour une autre phrase.\"", "hint": "<p><code>phrase.split()<\/code> donne la liste des mots, et <code>len()<\/code> compte les éléments d'une liste.<\/p>", "stdin": "", "skel": ""}, {"t": "exo", "id": "methodes-de-texte-3", "title": "Palindrome", "h": "<p>Un palindrome se lit de la même façon dans les deux sens, si l'on ignore les espaces et les majuscules. Crée une variable <code>est_palindrome<\/code> qui vaut <code>True<\/code> ou <code>False<\/code>.<\/p>", "starter": "texte = \"Engage le jeu que je le gagne\"\n# Crée la variable est_palindrome\n\nprint(est_palindrome)", "solution": "texte = \"Engage le jeu que je le gagne\"\nlettres = texte.lower().replace(\" \", \"\")\nest_palindrome = lettres == lettres[::-1]\n\nprint(est_palindrome)", "tests": "assert est_palindrome is True, \"Cett
